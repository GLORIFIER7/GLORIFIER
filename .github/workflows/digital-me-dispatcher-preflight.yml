name: GLORIFIER Digital Me — dispatcher credential preflight
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: glorifier-digital-me-dispatcher-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'GLORIFIER7/GLORIFIER' && github.ref == 'refs/heads/main' && github.actor_id == '32674233' && github.triggering_actor == 'GLORIFIER7' && github.run_attempt == 1
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read-only scoped dispatcher verification
        env:
          DIGITAL_ME_DISPATCHER_DATABASE_URL: ${{ secrets.DIGITAL_ME_DISPATCHER_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const host = 'ep-wild-tree-b5yekavc.c-7.us-east-2.aws.neon.tech';
          const role = 'digital_me_dispatcher_login';
          const deny = () => { throw Error('PREFLIGHT_DENIED'); };
          function config(value) {
            const u = new URL(value);
            if (!['postgres:', 'postgresql:'].includes(u.protocol) ||
                u.hostname !== host || (u.port && u.port !== '5432') ||
                u.username !== role || !u.password || u.pathname !== '/glorifier' || u.hash ||
                [...u.searchParams.keys()].some(k => !['sslmode','channel_binding'].includes(k)) ||
                u.searchParams.getAll('sslmode').length > 1 ||
                u.searchParams.getAll('channel_binding').length > 1 ||
                ![null,'require','verify-full'].includes(u.searchParams.get('sslmode')) ||
                ![null,'require','prefer'].includes(u.searchParams.get('channel_binding'))) deny();
            return {host, port:5432, database:'glorifier', user:role,
              password:decodeURIComponent(u.password), ssl:{rejectUnauthorized:true,servername:host},
              enableChannelBinding:true, connectionTimeoutMillis:10000, query_timeout:8000,
              statement_timeout:8000, application_name:'digital-me-dispatcher-preflight'};
          }
          let client, started=false;
          try {
            if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA || '') ||
                process.env.NODE_TLS_REJECT_UNAUTHORIZED === '0') deny();
            client = new pg.Client(config(process.env.DIGITAL_ME_DISPATCHER_DATABASE_URL));
            delete process.env.DIGITAL_ME_DISPATCHER_DATABASE_URL;
            await client.connect();
            const stream = client.connection.stream;
            if (stream.encrypted !== true || stream.authorized !== true || !['TLSv1.2','TLSv1.3'].includes(stream.getProtocol())) deny();
            await client.query('BEGIN READ ONLY'); started=true;
            const {rows:[r]} = await client.query(`SELECT current_user AS role,session_user AS session_role,
              current_database() AS db,current_setting('transaction_read_only') AS read_only,
              pg_has_role(current_user,'digital_me_dispatcher','USAGE') AS scoped_member,
              row_security_active('public.glorifier_autopilot_missions') AS rls,
              has_table_privilege(current_user,'public.glorifier_autopilot_missions','SELECT') AS can_select,
              (SELECT bool_and(has_column_privilege(current_user,'public.glorifier_autopilot_missions',col,'UPDATE')) FROM unnest(ARRAY['status','version','payload','next_run_at','lease_owner','lease_expires_at','updated_at']) fields(col)) AS can_update,
              has_function_privilege(current_user,'public.read_digital_me_dispatcher_grant(text,text)','EXECUTE') AS can_read_grant,
              has_any_column_privilege(current_user,'public.glorifier_autopilot_missions','INSERT') AS can_insert,
              has_table_privilege(current_user,'public.glorifier_autopilot_missions','DELETE,TRUNCATE') AS can_destroy,
              has_table_privilege(current_user,'public.digital_me_dispatcher_grants','SELECT,INSERT,UPDATE,DELETE,TRUNCATE') AS can_access_grants,
              (SELECT with_check LIKE '%executing%' FROM pg_policies WHERE schemaname='public' AND tablename='glorifier_autopilot_missions' AND policyname='digital_me_dispatcher_scope') AS policy_active`);
            if (!r || r.role!==role || r.session_role!==role || r.db!=='glorifier' || r.read_only!=='on' ||
                !['scoped_member','rls','can_select','can_update','can_read_grant','policy_active'].every(k=>r[k]===true) ||
                !['can_insert','can_destroy','can_access_grants'].every(k=>r[k]===false)) deny();
            const {rows:[m]}=await client.query(`SELECT count(*)::int AS visible,
              count(*) FILTER (WHERE requester<>'github:32674233' OR payload->>'title' IS DISTINCT FROM 'GitHub fix #471')::int AS outside_scope,
              count(*) FILTER (WHERE status='blocked' AND (payload->>'objective')::jsonb->>'sourceSnapshotSha'=$1)::int AS matching_main,
              count(*) FILTER (WHERE status='blocked' AND (payload->>'objective')::jsonb->>'sourceSnapshotSha'=$1 AND public.read_digital_me_dispatcher_grant(id,$1) IS NOT NULL)::int AS grants_for_main
              FROM public.glorifier_autopilot_missions`,[process.env.GITHUB_SHA]);
            if (!m || m.outside_scope!==0) deny();
            await client.query('ROLLBACK'); started=false;
            console.log(JSON.stringify({status:'DISPATCHER_CREDENTIAL_VERIFIED_READ_ONLY',sourceSha:process.env.GITHUB_SHA,tls:stream.getProtocol(),certificateVerified:true,roleVerified:true,rls:true,policyActive:true,visibleMissions:m.visible,currentBaseMissions:m.matching_main,currentBaseGrantRows:m.grants_for_main,executionAuthorized:false,publicationAuthorized:false,fullyVerified:false}));
          } catch {
            console.error('DISPATCHER_PREFLIGHT_DENIED: verify secret, TLS, scoped privileges, and database policy. No execution attempted.');
            process.exitCode=1;
          } finally {
            if (client) { if (started) await client.query('ROLLBACK').catch(()=>{}); await client.end().catch(()=>{}); }
          }
          NODE
