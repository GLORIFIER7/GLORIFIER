name: GLORIFIER Digital Me — owner-reviewed GCEF repair publisher
on:
  schedule:
    - cron: "17 * * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact signed main commit
        required: true
        type: string
      comment_id:
        description: Immutable candidate comment ID on issue 1034
        required: true
        type: string
      payload_sha256:
        description: Reviewed exact comment body SHA-256
        required: true
        type: string
      allowed_paths:
        description: Exact reviewed GCEF Python paths (comma-separated)
        required: true
        type: string
      confirm_reviewed:
        description: I reviewed the exact comment, digest, base and paths
        type: boolean
        required: true
        default: false
      publish:
        description: Create an App-signed draft PR (false is read-only)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: glorifier-digital-me-reviewed-publication
  cancel-in-progress: false
jobs:
  reviewed-gcef:
    if: github.repository == 'GLORIFIER7/GLORIFIER' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && github.actor_id == '32674233' && github.triggering_actor == 'GLORIFIER7' && inputs.confirm_reviewed == true) || (github.event_name == 'schedule' && vars.DIGITAL_ME_AUTO_DISPATCH == 'true') || (github.event_name == 'issue_comment' && vars.DIGITAL_ME_AUTO_DISPATCH == 'true' && github.actor_id == '32674233' && github.triggering_actor == 'GLORIFIER7' && github.event.comment.user.id == 32674233 && github.event.issue.number == 1034 && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/glorifier publish-gcef ')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: digital-me-publish
    env:
      AUTO_ENABLED: ${{ vars.DIGITAL_ME_AUTO_DISPATCH }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_ISSUE: ${{ github.event.issue.number }}
      EVENT_IS_PR: ${{ github.event.issue.pull_request != null }}
      EVENT_APPROVAL_ID: ${{ github.event.comment.id }}
      EVENT_AUTHOR_ID: ${{ github.event.comment.user.id }}
      EXPECTED_MAIN: ${{ inputs.expected_main }}
      COMMENT_ID: ${{ inputs.comment_id }}
      PAYLOAD_SHA256: ${{ inputs.payload_sha256 }}
      ALLOWED_PATHS: ${{ inputs.allowed_paths }}
      CONFIRM: ${{ inputs.confirm_reviewed }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install trusted publisher and run credential-free tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/gcef-reviewed-publisher"
          cd "$RUNNER_TEMP/gcef-reviewed-publisher"
          cat > publisher.mjs <<'PUBLISHER_JS'
          import {createHash,createSign} from 'node:crypto';
          import {pathToFileURL} from 'node:url';
          import {appendFileSync} from 'node:fs';
          const REPO='GLORIFIER7/GLORIFIER', ROOT='/repos/'+REPO, APP_ID=5876036, BOT='glorifier-digital-me[bot]', QUEUE=1034;
          const PERMISSIONS={contents:'write',pull_requests:'write'};
          const MAX_COMMENT=60_000, MAX_FILES=8, MAX_FILE=32_000;
          const PREFIX='GCEF_REPAIR_V1\n';
          // Existing regular GCEF files only. Never workflows, secrets, config or new files.
          const ALLOWED=new Set(['active_view.py','browser_session.py','browser_view.py','execution.py','gcef.py','local_smoke.py','profile_vault.py','worker_transport.py','test_active_view.py','test_browser_session.py','test_browser_view.py','test_execution.py','test_gcef.py','test_profile_vault.py','test_worker_transport.py'].map(p=>'agents/gcef/'+p));
          const hex=(s,n)=>typeof s==='string'&&s.length===n&&/^[a-f0-9]+$/.test(s);
          const sha256=s=>createHash('sha256').update(s).digest('hex');
          const gitBlob=b=>createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${b.length}\0`),b])).digest('hex');
          const ensure=(ok,code)=>{if(!ok)throw Error(code);};
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const exactKeys=(x,keys)=>x!==null&&typeof x==='object'&&!Array.isArray(x)&&same(Object.keys(x).sort(),[...keys].sort());
          const AUTO_MAX_AGE=48*60*60*1000;
          const AUTO_PATHS=new Set([...ALLOWED].filter(p=>p.startsWith('agents/gcef/test_')));
          function autoContext(e){
           ensure(e.GITHUB_REPOSITORY===REPO&&e.GITHUB_REF==='refs/heads/main'&&['schedule','issue_comment'].includes(e.GITHUB_EVENT_NAME)&&e.GITHUB_RUN_ATTEMPT==='1'&&e.AUTO_ENABLED==='true'&&hex(e.GITHUB_SHA,40),'AUTO_DISPATCH_DISABLED_OR_INVALID');
           if(e.GITHUB_EVENT_NAME==='issue_comment')ensure(e.GITHUB_ACTOR_ID==='32674233'&&e.GITHUB_TRIGGERING_ACTOR==='GLORIFIER7'&&e.EVENT_AUTHOR_ID==='32674233'&&e.EVENT_ACTION==='created'&&e.EVENT_ISSUE==='1034'&&e.EVENT_IS_PR==='false'&&/^[1-9][0-9]{0,15}$/.test(e.EVENT_APPROVAL_ID??'')&&Number.isSafeInteger(Number(e.EVENT_APPROVAL_ID)),'OWNER_APPROVAL_EVENT_REQUIRED');
          }
          export function config(e){
           const scheduled=['schedule','issue_comment'].includes(e.GITHUB_EVENT_NAME);
           if(scheduled)autoContext(e);
           else{
            const trusted={GITHUB_REPOSITORY:REPO,GITHUB_REF:'refs/heads/main',GITHUB_EVENT_NAME:'workflow_dispatch',GITHUB_ACTOR_ID:'32674233',GITHUB_TRIGGERING_ACTOR:'GLORIFIER7',GITHUB_RUN_ATTEMPT:'1',CONFIRM:'true'};
            ensure(Object.entries(trusted).every(([k,v])=>e[k]===v)&&!e.APPROVAL_ID,'OWNER_DISPATCH_REQUIRED');
           }
           const base=e.EXPECTED_MAIN,digest=e.PAYLOAD_SHA256,commentId=Number(e.COMMENT_ID),approvalId=Number(e.APPROVAL_ID);
           ensure(hex(base,40)&&base===e.GITHUB_SHA&&hex(digest,64)&&/^[1-9][0-9]{0,15}$/.test(e.COMMENT_ID??'')&&Number.isSafeInteger(commentId),'INVALID_IMMUTABLE_INPUT');
           if(scheduled)ensure(/^[1-9][0-9]{0,15}$/.test(e.APPROVAL_ID??'')&&Number.isSafeInteger(approvalId)&&approvalId!==commentId,'OWNER_APPROVAL_REQUIRED');
           if(e.GITHUB_EVENT_NAME==='issue_comment')ensure(e.APPROVAL_ID===e.EVENT_APPROVAL_ID,'APPROVAL_EVENT_ID_MISMATCH');
           const paths=(e.ALLOWED_PATHS??'').split(',').map(p=>p.trim()).sort();
           ensure(paths.length>=1&&paths.length<=MAX_FILES&&new Set(paths).size===paths.length&&paths.every(p=>(scheduled?AUTO_PATHS:ALLOWED).has(p)),'PATH_NOT_ALLOWED');
           return {base,digest,commentId,paths,branch:'digital-me/gcef-'+sha256(JSON.stringify([base,digest,paths])),...(scheduled?{approvalId}:{})};
          }
          function parseApproval(c,e,now){
           if(!c||!Number.isSafeInteger(c.id)||c.id<1||c.issue_url!=='https://api.github.com'+ROOT+'/issues/'+QUEUE||c.user?.id!==32674233||c.user.login!=='GLORIFIER7'||c.user.type!=='User'||c.author_association!=='OWNER'||typeof c.created_at!=='string'||c.created_at!==c.updated_at||typeof c.body!=='string')return null;
           const stamp=Date.parse(c.created_at);if(!Number.isFinite(stamp)||stamp>now||now-stamp>AUTO_MAX_AGE)return null;
           const m=/^\/glorifier publish-gcef ([a-f0-9]{40}) ([1-9][0-9]{0,15}) ([a-f0-9]{64}) ([A-Za-z0-9_./,-]+)$/.exec(c.body);
           if(!m||m[0]!==c.body||m[1]!==e.GITHUB_SHA)return null;
           const inputs={EXPECTED_MAIN:m[1],COMMENT_ID:m[2],PAYLOAD_SHA256:m[3],ALLOWED_PATHS:m[4],APPROVAL_ID:String(c.id)};
           try{const cfg=config({...e,...inputs});return {cfg,inputs};}catch{return null;}
          }
          async function queueOpen(api,token){const q=await api(ROOT+'/issues/'+QUEUE,token);ensure(q?.number===QUEUE&&q.state==='open'&&!q.pull_request,'QUEUE_UNAVAILABLE');}
          async function noOpenPr(api,token){const open=await api(ROOT+'/pulls?state=open&per_page=100',token);ensure(Array.isArray(open)&&open.length<100,'OPEN_PR_INVENTORY_INCOMPLETE');return open.length===0;}
          export async function assertAuthorized(cfg,api,token,now=Date.now()){
           if(!cfg.approvalId)return;
           await queueOpen(api,token);
           const c=await api(ROOT+'/issues/comments/'+cfg.approvalId,token);
           const e={GITHUB_REPOSITORY:REPO,GITHUB_REF:'refs/heads/main',GITHUB_EVENT_NAME:'schedule',GITHUB_RUN_ATTEMPT:'1',AUTO_ENABLED:'true',GITHUB_SHA:cfg.base};
           const result=parseApproval(c,e,now);
           ensure(result&&same(result.cfg,cfg),'OWNER_APPROVAL_CHANGED_OR_EXPIRED');
           ensure(await noOpenPr(api,token),'OPEN_PR_REQUIRES_REVIEW');
          }
          export async function selectMission(e,api,token,now=Date.now()){
           autoContext(e);await checkMain({base:e.GITHUB_SHA},api,token);await queueOpen(api,token);
           if(!await noOpenPr(api,token))return null;
           const list=await api(ROOT+'/issues/'+QUEUE+'/comments?per_page=100&since='+encodeURIComponent(new Date(now-AUTO_MAX_AGE).toISOString()),token);
           ensure(Array.isArray(list)&&list.length<100,'MISSION_INVENTORY_INCOMPLETE');
           const available=[];
           for(const c of list){const item=parseApproval(c,{...e,GITHUB_EVENT_NAME:'schedule'},now);if(!item)continue;
            const history=await api(ROOT+'/pulls?state=all&head='+encodeURIComponent('GLORIFIER7:'+item.cfg.branch)+'&base=main&per_page=100',token);
            ensure(Array.isArray(history)&&history.length<100,'DRAFT_INVENTORY_RECONCILE');if(history.length===0)available.push(item);
           }
           ensure(available.length<=1,'MULTIPLE_APPROVED_MISSIONS');if(!available.length)return null;
           if(e.GITHUB_EVENT_NAME==='issue_comment'&&String(available[0].cfg.approvalId)!==e.EVENT_APPROVAL_ID)return null;
           await assertAuthorized(available[0].cfg,api,token,now);return available[0].inputs;
          }
          async function checkMain(cfg,api,token){
           const m=await api(ROOT+'/commits/main',token);
           ensure(m?.sha===cfg.base&&m.commit?.verification?.verified===true&&m.commit.verification.reason==='valid','MAIN_STALE_OR_UNSIGNED');
          }
          async function regularBlob(api,token,commit,path){
           const c=await api(ROOT+'/git/commits/'+commit,token);let tree=c?.tree?.sha;
           ensure(c?.sha===commit&&hex(tree,40),'INVALID_COMMIT_TREE');
           const parts=path.split('/');
           for(let i=0;i<parts.length;i++){
            const t=await api(ROOT+'/git/trees/'+tree,token);
            ensure(t?.sha===tree&&t.truncated===false&&Array.isArray(t.tree),'INVALID_TREE');
            const matches=t.tree.filter(x=>x.path===parts[i]);ensure(matches.length===1,'PATH_NOT_REGULAR');const e=matches[0];
            ensure(hex(e.sha,40),'INVALID_TREE_ENTRY');
            if(i===parts.length-1){ensure(e.mode==='100644'&&e.type==='blob','PATH_NOT_REGULAR');return e.sha;}
            ensure(e.mode==='040000'&&e.type==='tree','PATH_NOT_DIRECTORY');tree=e.sha;
           }
           throw Error('INVALID_PATH');
          }
          async function readComment(cfg,api,token){
           const queue=await api(ROOT+'/issues/'+QUEUE,token);
           ensure(queue?.number===QUEUE&&queue.state==='open'&&!queue.pull_request,'QUEUE_UNAVAILABLE');
           const c=await api(ROOT+'/issues/comments/'+cfg.commentId,token);
           ensure(c?.id===cfg.commentId&&c.issue_url==='https://api.github.com'+ROOT+'/issues/'+QUEUE&&typeof c.created_at==='string'&&c.created_at===c.updated_at&&typeof c.body==='string'&&Buffer.byteLength(c.body)<=MAX_COMMENT&&c.body.startsWith(PREFIX)&&sha256(c.body)===cfg.digest,'COMMENT_CHANGED_OR_OUTSIDE_QUEUE');
           let data;try{data=JSON.parse(c.body.slice(PREFIX.length));}catch{throw Error('INVALID_PAYLOAD');}
           ensure(exactKeys(data,['base','files'])&&data.base===cfg.base&&Array.isArray(data.files)&&data.files.length===cfg.paths.length,'INVALID_PAYLOAD');
           ensure(data.files.every(f=>exactKeys(f,['path','before','content'])&&typeof f.path==='string'&&hex(f.before,40)&&typeof f.content==='string'&&Buffer.byteLength(f.content)<=MAX_FILE&&!f.content.includes('\0')&&Buffer.from(f.content).toString('utf8')===f.content),'INVALID_FILE_PAYLOAD');
           const files=[...data.files].sort((a,b)=>a.path<b.path?-1:a.path>b.path?1:0);
           ensure(same(files.map(f=>f.path),cfg.paths),'PAYLOAD_PATH_MISMATCH');return files;
          }
          export async function prepare(cfg,api,token){
           await assertAuthorized(cfg,api,token);await checkMain(cfg,api,token);const candidates=await readComment(cfg,api,token);const files=[];
           for(const f of candidates){
            const before=await regularBlob(api,token,cfg.base,f.path);ensure(before===f.before,'BASE_BLOB_CHANGED');
            const b=Buffer.from(f.content,'utf8'),after=gitBlob(b);ensure(after!==before,'UNCHANGED_FILE');
            files.push({path:f.path,before,after,contents:b.toString('base64')});
           }
           await checkMain(cfg,api,token);return {cfg,files};
          }
          function draftMatches(p,cfg,head){return p?.state==='open'&&p.draft===true&&p.user?.login===BOT&&p.head?.sha===head&&p.head?.ref===cfg.branch&&p.head?.repo?.full_name===REPO&&p.base?.ref==='main'&&p.base?.repo?.full_name===REPO;}
          // Read exact deterministic resources. Never replay a write whose outcome is unknown.
          async function branchHead(cfg,api,token){
           const ref='refs/heads/'+cfg.branch;
           const refs=await api(ROOT+'/git/matching-refs/heads/'+cfg.branch,token);
           ensure(Array.isArray(refs)&&refs.length<100,'BRANCH_INVENTORY_RECONCILE');
           const exact=refs.filter(r=>r.ref===ref);
           ensure(exact.length<=1&&exact.every(r=>hex(r.object?.sha,40)),'BRANCH_IDENTITY_RECONCILE');
           return exact[0]?.object.sha??null;
          }
          async function verifyHead(cfg,m,head,api,token){
           ensure(hex(head,40)&&head!==cfg.base,'SIGNED_COMMIT_UNAVAILABLE');
           const c=await api(ROOT+'/commits/'+head,token);
           ensure(c?.sha===head&&c.author?.login===BOT&&c.commit?.verification?.verified===true&&c.commit.verification.reason==='valid'&&c.parents?.length===1&&c.parents[0].sha===cfg.base&&Array.isArray(c.files)&&c.files.length===m.files.length&&m.files.every(f=>c.files.some(x=>x.filename===f.path&&x.status==='modified'&&x.sha===f.after)),'SIGNED_COMMIT_READBACK_FAILED');
           for(const f of m.files)ensure(await regularBlob(api,token,head,f.path)===f.after,'PUBLISHED_MODE_OR_BLOB_CHANGED');
          }
          // A single bounded retry of a read is safe; no mutation is retried here.
          async function readDraft(api,token,number){
           const path=ROOT+'/pulls/'+number;
           try{return await api(path,token);}catch{return await api(path,token);}
          }
          async function findDraft(cfg,head,api,token){
           const query=ROOT+'/pulls?state=all&head='+encodeURIComponent('GLORIFIER7:'+cfg.branch)+'&base=main&per_page=100';
           const list=await api(query,token);
           ensure(Array.isArray(list)&&list.length<100,'DRAFT_INVENTORY_RECONCILE');
           // Any prior closed/merged or unrelated result requires owner reconciliation.
           if(!list.length)return null;
           ensure(list.length===1&&Number.isSafeInteger(list[0]?.number)&&draftMatches(list[0],cfg,head),'DRAFT_HISTORY_RECONCILE');
           const p=await readDraft(api,token,list[0].number);
           ensure(p?.number===list[0].number&&draftMatches(p,cfg,head),'DRAFT_IDENTITY_RECONCILE');
           return p;
          }
          async function confirmDraft(cfg,head,p,api,token){
           // Only a positively observed different base SHA justifies closure.
           // An unavailable API, malformed response or unsigned matching base is not proof of staleness.
           const main=await api(ROOT+'/commits/main',token);
           ensure(hex(main?.sha,40)&&hex(p.base?.sha,40),'MAIN_READBACK_RECONCILE');
           if(main.sha!==cfg.base||p.base.sha!==cfg.base){
            const current=await api(ROOT+'/pulls/'+p.number,token);
            ensure(current?.number===p.number&&draftMatches(current,cfg,head),'STALE_DRAFT_RECONCILE');
            // Recheck staleness after verifying the current draft identity.
            const now=await api(ROOT+'/commits/main',token);
            ensure(hex(now?.sha,40)&&hex(current.base?.sha,40)&&(now.sha!==cfg.base||current.base.sha!==cfg.base),'STALE_DRAFT_RECONCILE');
            try{await api(ROOT+'/pulls/'+p.number,token,'PATCH',{state:'closed'});}catch{/* readback below; no blind replay */}
            const closed=await api(ROOT+'/pulls/'+p.number,token);
            ensure(closed?.number===p.number&&closed.state==='closed'&&draftMatches({...closed,state:'open'},cfg,head)&&!closed.merged,'STALE_DRAFT_RECONCILE');
            throw Error('STALE_DRAFT_CLOSED');
           }
           ensure(main.commit?.verification?.verified===true&&main.commit.verification.reason==='valid','MAIN_STALE_OR_UNSIGNED');
           ensure(await branchHead(cfg,api,token)===head,'BRANCH_HEAD_CHANGED_RECONCILE');
           return {status:'SIGNED_DRAFT_CREATED',number:p.number,head,merged:false,deployed:false};
          }
          export async function publish(cfg,api,readToken,jwt){
           // Candidate text is inert data, not code run with the signing key.
           const m=await prepare(cfg,api,readToken);
           const i=await api(ROOT+'/installation',jwt);
           ensure(i?.app_id===APP_ID&&i.account?.login==='GLORIFIER7'&&i.repository_selection==='selected'&&Number.isSafeInteger(i.id)&&Object.entries(PERMISSIONS).every(([k,v])=>i.permissions?.[k]===v),'INVALID_APP_INSTALLATION');
           const t=await api('/app/installations/'+i.id+'/access_tokens',jwt,'POST',{repositories:['GLORIFIER'],permissions:PERMISSIONS});
           ensure(typeof t?.token==='string'&&t.token.length>0,'INSTALLATION_TOKEN_UNAVAILABLE');const token=t.token;
           try{
            await checkMain(cfg,api,token);
            const latest=await prepare(cfg,api,readToken);ensure(same(latest,m),'PREPARATION_CHANGED');
            const ref='refs/heads/'+cfg.branch;
            let head=await branchHead(cfg,api,token);
            if(head===null){
             await checkMain(cfg,api,token);
             await assertAuthorized(cfg,api,readToken);
               try{await api(ROOT+'/git/refs',token,'POST',{ref,sha:cfg.base});}catch{/* inspect actual ref; no blind retry */}
             head=await branchHead(cfg,api,token);
             ensure(head!==null,'BRANCH_CREATION_RECONCILE');
            }
            if(head===cfg.base){
             // No commit may be issued if prior PR history exists, even a closed PR.
             const history=await api(ROOT+'/pulls?state=all&head='+encodeURIComponent('GLORIFIER7:'+cfg.branch)+'&base=main&per_page=100',token);
             ensure(Array.isArray(history)&&history.length===0,'DRAFT_HISTORY_RECONCILE');
             await checkMain(cfg,api,token);
             await assertAuthorized(cfg,api,readToken);
               try{await api('/graphql',token,'POST',{query:'mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}',variables:{input:{branch:{repositoryNameWithOwner:REPO,branchName:cfg.branch},expectedHeadOid:cfg.base,message:{headline:'fix(gcef): owner-reviewed source repair'},fileChanges:{additions:m.files.map(({path,contents})=>({path,contents}))}}}});}catch{/* inspect actual ref; no blind retry */}
             head=await branchHead(cfg,api,token);
             ensure(head!==null&&head!==cfg.base,'SIGNED_COMMIT_RECONCILE');
            }
            await verifyHead(cfg,m,head,api,token);
            let p=await findDraft(cfg,head,api,token);
            if(!p){
             await checkMain(cfg,api,token);
             ensure(await branchHead(cfg,api,token)===head,'BRANCH_HEAD_CHANGED_RECONCILE');
             const body='Owner-reviewed queue comment #'+cfg.commentId+'\nPinned base: '+cfg.base+'\nPayload SHA-256: '+cfg.digest+'\nIndependent review and required CI remain mandatory. No merge or deployment authorized.';
             await assertAuthorized(cfg,api,readToken);
               try{await api(ROOT+'/pulls',token,'POST',{head:cfg.branch,base:'main',draft:true,title:'fix(gcef): owner-reviewed source repair',body});}catch{/* verify exact draft through inventory; no blind replay */}
             p=await findDraft(cfg,head,api,token);
             ensure(p,'DRAFT_CREATION_RECONCILE');
            }
            return await confirmDraft(cfg,head,p,api,token);
           }finally{try{await api('/installation/token',token,'DELETE');}catch{console.error('SHORT_LIVED_TOKEN_REVOCATION_UNCONFIRMED');}}
          }
          async function github(path,token,method='GET',body){
           ensure(typeof path==='string'&&path.startsWith('/')&&!path.startsWith('//')&&typeof token==='string'&&token.length>0,'API_REQUEST_DENIED');
           const r=await fetch('https://api.github.com'+path,{method,redirect:'error',signal:AbortSignal.timeout(15000),headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},...(body===undefined?{}:{body:JSON.stringify(body)})});
           ensure(r.ok,'GITHUB_HTTP_'+r.status);if(r.status===204)return null;const data=await r.json();ensure(!data?.errors?.length,'GITHUB_GRAPHQL_DENIED');return data;
          }
          function appJwt(pem){const encode=x=>Buffer.from(JSON.stringify(x)).toString('base64url'),now=Math.floor(Date.now()/1000);const message=encode({alg:'RS256',typ:'JWT'})+'.'+encode({iss:String(APP_ID),iat:now-30,exp:now+540});return message+'.'+createSign('RSA-SHA256').update(message).sign(pem).toString('base64url');}
          async function main(){
           const token=process.env.GITHUB_TOKEN;ensure(token,'READ_TOKEN_REQUIRED');
           if(process.argv[2]==='select'){
            const inputs=await selectMission(process.env,github,token);
            if(!inputs){console.log('NO_APPROVED_MISSION');return;}
            ensure(process.env.GITHUB_ENV,'RUNNER_ENV_REQUIRED');
            // Values are validated hex, numeric IDs or exact allowlisted paths; never raw comment text.
            appendFileSync(process.env.GITHUB_ENV,Object.entries({...inputs,CONFIRM:'true',PUBLISH:'true',MISSION_SELECTED:'true'}).map(([k,v])=>k+'='+v+'\n').join(''));
            console.log('APPROVED_TEST_MISSION_SELECTED');return;
           }
           const cfg=config(process.env);
           if(process.argv[2]==='prepare'){
            const m=await prepare(cfg,github,token);console.log(JSON.stringify({status:'PREPARED_READ_ONLY',base:cfg.base,digest:cfg.digest,files:m.files.map(({path,before,after})=>({path,before,after}))}));
           }else if(process.argv[2]==='publish'){
            const pem=process.env.DIGITAL_ME_APP_PRIVATE_KEY;delete process.env.DIGITAL_ME_APP_PRIVATE_KEY;ensure(pem&&process.env.PUBLISH==='true','EXPLICIT_PUBLISH_REQUIRED');
            console.log(JSON.stringify(await publish(cfg,github,token,appJwt(pem))));
           }else throw Error('INVALID_MODE');
          }
          // Never log request payloads, token-bearing errors or stack traces.
