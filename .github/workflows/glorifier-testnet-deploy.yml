name: GLORIFIER Testnet Deploy

on:
  workflow_dispatch:
    inputs:
      initial_holder:
        description: "GLR initial holder address"
        required: false
        default: ""
        type: string

concurrency:
  group: glorifier-testnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testnet
    permissions:
      contents: read
    env:
      ETHERSCAN_API_KEY: ${{ secrets.GLORIFIER_ETHERSCAN_API_KEY }}
      ALCHEMY_RPC_URL: ${{ secrets.GLORIFIER_ALCHEMY_SEPOLIA_RPC_URL }}
      INFURA_RPC_URL: ${{ secrets.GLORIFIER_TESTNET_RPC_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        working-directory: contracts
        run: |
          set -euo pipefail
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Test
        working-directory: contracts
        run: forge test -vv

      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          if [[ -z "$ETHERSCAN_API_KEY" ]]; then
            echo "ERROR: GLORIFIER_ETHERSCAN_API_KEY is required."
            echo "Testnet deployment is evidence-gated: deployment without explorer source verification is not accepted."
            exit 1
          fi
          if [[ -z "$ALCHEMY_RPC_URL" && -z "$INFURA_RPC_URL" ]]; then
            echo "ERROR: Configure GLORIFIER_ALCHEMY_SEPOLIA_RPC_URL and/or GLORIFIER_TESTNET_RPC_URL."
            exit 1
          fi

      - name: Select and validate Sepolia RPC provider
        working-directory: contracts
        env:
          PRIVATE_KEY: ${{ secrets.GLORIFIER_DEPLOYER_PRIVATE_KEY }}
          ALCHEMY_RPC_URL: ${{ secrets.GLORIFIER_ALCHEMY_SEPOLIA_RPC_URL }}
          INFURA_RPC_URL: ${{ secrets.GLORIFIER_TESTNET_RPC_URL }}
          INITIAL_HOLDER_INPUT: ${{ inputs.initial_holder }}
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_KEY" ]]; then
            echo "ERROR: GLORIFIER_DEPLOYER_PRIVATE_KEY is missing from the GitHub testnet environment."
            echo "Add a dedicated Sepolia-only deployment key to the testnet environment; never paste it into chat or commit it."
            exit 1
          fi

          # Normalize common secret formatting mistakes without ever printing the key.
          PRIVATE_KEY="$(printf '%s' "$PRIVATE_KEY" | tr -d '[:space:]')"
          PRIVATE_KEY="${PRIVATE_KEY#\"}"
          PRIVATE_KEY="${PRIVATE_KEY%\"}"
          PRIVATE_KEY="${PRIVATE_KEY#\'}"
          PRIVATE_KEY="${PRIVATE_KEY%\'}"
          PRIVATE_KEY="${PRIVATE_KEY#0x}"
          if [[ ! "$PRIVATE_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: GLORIFIER_DEPLOYER_PRIVATE_KEY is not a valid 64-hex-character private key."
            echo "Update the GitHub testnet environment secret with a fresh Sepolia-only deployer private key."
            exit 1
          fi
          # Persist only the normalized value for later steps. The raw secret is never printed.
          echo "::add-mask::$PRIVATE_KEY"
          echo "GLORIFIER_DEPLOYER_PRIVATE_KEY_NORMALIZED=$PRIVATE_KEY" >> "$GITHUB_ENV"

          # Accept either a raw address or the common pasted form "initial_holder0x...".
          INITIAL_HOLDER="$(printf '%s' "$INITIAL_HOLDER_INPUT" | tr -d '[:space:]')"
          INITIAL_HOLDER="${INITIAL_HOLDER#initial_holder}"
          INITIAL_HOLDER="${INITIAL_HOLDER#INITIAL_HOLDER}"

          if [[ -z "$INITIAL_HOLDER" ]]; then
            INITIAL_HOLDER="$(cast wallet address --private-key "$PRIVATE_KEY")"
            echo "No initial_holder supplied; using the deployer address as initial holder."
          fi

          if [[ ! "$INITIAL_HOLDER" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: initial_holder must be a 40-hex Ethereum address beginning with 0x."
            exit 1
          fi

          HOLDER_LOWER="$(printf '%s' "$INITIAL_HOLDER" | tr '[:upper:]' '[:lower:]')"
          test "$HOLDER_LOWER" != "0x0000000000000000000000000000000000000000"
          echo "GLORIFIER_INITIAL_HOLDER=$INITIAL_HOLDER" >> "$GITHUB_ENV"

          validate_sepolia_rpc() {
            local provider="$1"
            local url="$2"
            local chain_id=""
            if [[ -z "$url" ]]; then
              echo "$provider: NOT CONFIGURED"
              return 1
            fi
            case "$url" in
              https://gas.api.infura.io/*|https://gas.api.infura.io)
                echo "$provider: INVALID ENDPOINT TYPE (Infura Gas API is not Ethereum JSON-RPC)."
                return 1
                ;;
              https://eth-sepolia.g.alchemy.com/v2/*)
                ;;
              https://sepolia.infura.io/v3/*)
                ;;
              https://*)
                echo "$provider: INVALID HOST/PATH. Use the provider's Ethereum Sepolia JSON-RPC URL."
                return 1
                ;;
              *)
                echo "$provider: INVALID URL SCHEME. Endpoint must start with https://."
                return 1
                ;;
            esac
            if ! chain_id="$(cast chain-id --rpc-url "$url" 2>/dev/null)"; then
              echo "$provider: UNREACHABLE OR AUTHENTICATION FAILED (URL/key redacted)."
              return 1
            fi
            if [[ "$chain_id" != "11155111" ]]; then
              echo "$provider: WRONG NETWORK (chain ID $chain_id; expected 11155111)."
              return 1
            fi
            echo "$provider: HEALTHY (Sepolia chain ID 11155111)."
            return 0
          }

          RPC_URL=""
          RPC_PROVIDER=""
          echo "Validating configured Sepolia RPC providers (credentials are never printed)..."
          if validate_sepolia_rpc "Alchemy" "$ALCHEMY_RPC_URL"; then
            RPC_URL="$ALCHEMY_RPC_URL"
            RPC_PROVIDER="Alchemy"
          elif validate_sepolia_rpc "Infura" "$INFURA_RPC_URL"; then
            RPC_URL="$INFURA_RPC_URL"
            RPC_PROVIDER="Infura"
          else
            echo "ERROR: no healthy Ethereum Sepolia RPC provider is configured."
            echo "Expected Alchemy: https://eth-sepolia.g.alchemy.com/v2/<API_KEY>"
            echo "Expected Infura:  https://sepolia.infura.io/v3/<PROJECT_ID>"
            echo "The Infura Gas API endpoint https://gas.api.infura.io/... is invalid here."
            echo "Configure GLORIFIER_ALCHEMY_SEPOLIA_RPC_URL and/or GLORIFIER_TESTNET_RPC_URL."
            exit 1
          fi

          echo "Selected RPC provider: $RPC_PROVIDER"
          echo "RPC_URL=$RPC_URL" >> "$GITHUB_ENV"
          echo "RPC_PROVIDER=$RPC_PROVIDER" >> "$GITHUB_ENV"

          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          echo "Deployer: $DEPLOYER"
          BALANCE_WEI="$(cast balance "$DEPLOYER" --rpc-url "$RPC_URL")"
          echo "Deployer balance: $BALANCE_WEI wei"
          if [[ "$BALANCE_WEI" == "0" ]]; then
            echo "ERROR: deployer has zero Sepolia ETH. Fund this exact Sepolia address before broadcasting: $DEPLOYER"
            echo "Use a Sepolia faucet; do not fund this address with mainnet ETH."
            exit 1
          fi
          CHAIN_ID="$(cast chain-id --rpc-url "$RPC_URL")"
          test "$CHAIN_ID" = "11155111"
          NONCE="$(cast nonce "$DEPLOYER" --rpc-url "$RPC_URL")"
          echo "Deployer nonce: $NONCE"

      - name: Deploy
        working-directory: contracts
        run: |
          set -euo pipefail
          export PRIVATE_KEY="$GLORIFIER_DEPLOYER_PRIVATE_KEY_NORMALIZED"
          export GLORIFIER_INITIAL_HOLDER="$GLORIFIER_INITIAL_HOLDER"
          rm -rf broadcast
          forge script script/DeployGLORIFIER.s.sol:DeployGLORIFIER --rpc-url "$RPC_URL" --broadcast --slow

      - name: Extract and verify deployment evidence
        working-directory: contracts
        run: |
          set -euo pipefail
          export DEPLOYER_PRIVATE_KEY="$GLORIFIER_DEPLOYER_PRIVATE_KEY_NORMALIZED"
          export INITIAL_HOLDER="$GLORIFIER_INITIAL_HOLDER"
          RUN_FILE="broadcast/DeployGLORIFIER.s.sol/11155111/run-latest.json"
          test -s "$RUN_FILE"

          DEPLOYER_ADDRESS="$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")"
          CONTRACT_ADDRESS="$(jq -r '.transactions[] | select(.contractAddress != null and .contractAddress != "") | .contractAddress' "$RUN_FILE" | head -n1)"
          TX_HASH="$(jq -r '.transactions[] | select(.hash != null and .hash != "") | .hash' "$RUN_FILE" | head -n1)"
          test -n "$CONTRACT_ADDRESS" && test "$CONTRACT_ADDRESS" != "null"
          test -n "$TX_HASH" && test "$TX_HASH" != "null"

          CODE="$(cast code "$CONTRACT_ADDRESS" --rpc-url "$RPC_URL")"
          test "$CODE" != "0x"
          NAME="$(cast call "$CONTRACT_ADDRESS" "name()(string)" --rpc-url "$RPC_URL")"
          SYMBOL="$(cast call "$CONTRACT_ADDRESS" "symbol()(string)" --rpc-url "$RPC_URL")"
          DECIMALS="$(cast call "$CONTRACT_ADDRESS" "decimals()(uint8)" --rpc-url "$RPC_URL")"
          TOTAL_SUPPLY="$(cast call "$CONTRACT_ADDRESS" "totalSupply()(uint256)" --rpc-url "$RPC_URL")"
          HOLDER_BALANCE="$(cast call "$CONTRACT_ADDRESS" "balanceOf(address)(uint256)" "$INITIAL_HOLDER" --rpc-url "$RPC_URL")"

          test "$NAME" = "GLORIFIER"
          test "$SYMBOL" = "GLR"
          test "$DECIMALS" = "18"
          test "$TOTAL_SUPPLY" = "1000000000000000000000000000"
          test "$HOLDER_BALANCE" = "$TOTAL_SUPPLY"

          RECEIPT="$(cast receipt "$TX_HASH" --rpc-url "$RPC_URL" --json)"
          BLOCK_NUMBER="$(echo "$RECEIPT" | jq -r '.blockNumber')"
          STATUS="$(echo "$RECEIPT" | jq -r '.status')"
          test "$STATUS" = "1"

          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_TX_HASH=$TX_HASH" >> "$GITHUB_ENV"

          jq -n             --arg network "Ethereum Sepolia"             --arg contract "$CONTRACT_ADDRESS"             --arg tx "$TX_HASH"             --arg holder "$INITIAL_HOLDER"             --arg block "$BLOCK_NUMBER"             --arg deployer "$DEPLOYER_ADDRESS"             '{
              evidence_type:"GLORIFIER ERC-20 deployment",
              network:$network,
              chain_id:11155111,
              contract_address:$contract,
              transaction_hash:$tx,
              block_number:($block|tonumber),
              transaction_status:1,
              deployer_address:$deployer,
              initial_holder:$holder,
              on_chain_assertions:{
                name:"GLORIFIER",
                symbol:"GLR",
                decimals:18,
                total_supply_wei:"1000000000000000000000000000"
              }
            }' > deployment-evidence.json

          echo "Contract address: $CONTRACT_ADDRESS"
          echo "Transaction hash: $TX_HASH"
          cat deployment-evidence.json

      - name: Verify contract on Etherscan
        if: \${{ env.CONTRACT_ADDRESS != '' }}
        working-directory: contracts
        env:
          INITIAL_HOLDER: ${{ env.GLORIFIER_INITIAL_HOLDER }}
          CONTRACT_ADDRESS: ${{ env.CONTRACT_ADDRESS }}
        run: |
          set -euo pipefail
          CONSTRUCTOR_ARGS="$(cast abi-encode "constructor(address)" "$INITIAL_HOLDER")"
          forge verify-contract             "$CONTRACT_ADDRESS"             src/GLORIFIER.sol:GLORIFIER             --chain sepolia             --constructor-args "$CONSTRUCTOR_ARGS"             --etherscan-api-key "$ETHERSCAN_API_KEY"             --watch
          echo "ETHERSCAN_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## GLORIFIER GLR Testnet Deployment"
            echo "- Network: Ethereum Sepolia"
            echo "- RPC provider: ${RPC_PROVIDER:-NOT SELECTED}"
            if [ -n "${CONTRACT_ADDRESS:-}" ] && [ -n "${DEPLOYMENT_TX_HASH:-}" ]; then
              echo "- Contract: $CONTRACT_ADDRESS"
              echo "- Transaction: $DEPLOYMENT_TX_HASH"
              echo "- Initial holder: ${GLORIFIER_INITIAL_HOLDER:-NOT AVAILABLE}"
              echo "- On-chain verification: **PASSED**"
              if [ "${ETHERSCAN_VERIFIED:-false}" = "true" ]; then
                echo "- Etherscan source verification: **PASSED**"
              else
                echo "- Etherscan source verification: **FAILED / NOT VERIFIED**"
              fi
              echo "- Sepolia contract URL: https://sepolia.etherscan.io/address/$CONTRACT_ADDRESS"
              echo "- Sepolia transaction URL: https://sepolia.etherscan.io/tx/$DEPLOYMENT_TX_HASH"
            else
              echo "- Deployment: **NOT COMPLETED**"
              echo "- Contract/transaction evidence: **NOT AVAILABLE**"
              echo "- On-chain verification: **NOT VERIFIED**"
              echo "- Sepolia transaction: **NOT BROADCAST**"
              echo "- Contract address: **NOT AVAILABLE**"
              echo "- Etherscan source verification: **NOT VERIFIED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-testnet-deployment
          if-no-files-found: ignore
          path: |
            broadcast/DeployGLORIFIER.s.sol/11155111/run-latest.json
            deployment-evidence.json
