name: GLORIFIER Testnet Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose recover_existing to verify an existing GLR contract; choose deploy_new only when no existing GLR contract exists."
        required: true
        default: "deploy_new"
        type: choice
        options:
          - recover_existing
          - deploy_new
      contract_address:
        description: "Existing GLR contract address for evidence recovery"
        required: false
        default: ""
        type: string
      transaction_hash:
        description: "Existing deployment transaction hash, if already known"
        required: false
        default: ""
        type: string
      initial_holder:
        description: "GLR initial holder address"
        required: false
        default: ""
        type: string

concurrency:
  group: glorifier-testnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: testnet
    permissions:
      contents: read
    env:
      ETHERSCAN_API_KEY: ${{ secrets.GLORIFIER_ETHERSCAN_API_KEY }}
      CHAINSTACK_RPC_URL: ${{ secrets.GLORIFIER_CHAINSTACK_SEPOLIA_RPC_URL }}
      ALCHEMY_RPC_URL: ${{ secrets.GLORIFIER_ALCHEMY_SEPOLIA_RPC_URL }}
      ALCHEMY_API_KEY: ${{ secrets.GLORIFIER_ALCHEMY_API_KEY }}
      INFURA_RPC_URL: ${{ secrets.GLORIFIER_TESTNET_RPC_URL }}
      INFURA_PROJECT_ID: ${{ secrets.GLORIFIER_INFURA_PROJECT_ID }}
      PUBLIC_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
      PUBLIC_SEPOLIA_RPC_URL_2: https://rpc.sepolia.org
      PUBLIC_SEPOLIA_RPC_URL_3: https://1rpc.io/sepolia

    steps:
      - uses: actions/checkout@v7

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        working-directory: contracts
        run: |
          set -euo pipefail
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test
        working-directory: contracts
        run: forge test -vv

      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          if [[ -z "$ETHERSCAN_API_KEY" ]]; then
            echo "INFO: GLORIFIER_ETHERSCAN_API_KEY is not configured; explorer creation-tx recovery and source verification may be unavailable."
          fi

      - name: Select and validate Sepolia RPC provider
        working-directory: contracts
        env:
          PRIVATE_KEY: ${{ secrets.GLORIFIER_DEPLOYER_PRIVATE_KEY }}
          CHAINSTACK_RPC_URL: ${{ secrets.GLORIFIER_CHAINSTACK_SEPOLIA_RPC_URL }}
          ALCHEMY_RPC_URL: ${{ secrets.GLORIFIER_ALCHEMY_SEPOLIA_RPC_URL }}
          ALCHEMY_API_KEY: ${{ secrets.GLORIFIER_ALCHEMY_API_KEY }}
          INFURA_RPC_URL: ${{ secrets.GLORIFIER_TESTNET_RPC_URL }}
          INFURA_PROJECT_ID: ${{ secrets.GLORIFIER_INFURA_PROJECT_ID }}
          PUBLIC_SEPOLIA_RPC_URL: https://ethereum-sepolia-rpc.publicnode.com
          PUBLIC_SEPOLIA_RPC_URL_2: https://rpc.sepolia.org
          PUBLIC_SEPOLIA_RPC_URL_3: https://1rpc.io/sepolia
          INITIAL_HOLDER_INPUT: ${{ inputs.initial_holder }}
        run: |
          set -euo pipefail

          if [[ -z "$PRIVATE_KEY" && "${{ inputs.mode }}" == "deploy_new" ]]; then
            echo "ERROR: GLORIFIER_DEPLOYER_PRIVATE_KEY is required only for deploy_new mode."
            exit 1
          fi

          PRIVATE_KEY="$(printf '%s' "$PRIVATE_KEY" | tr -d '[:space:]')"
          PRIVATE_KEY="${PRIVATE_KEY#\"}"
          PRIVATE_KEY="${PRIVATE_KEY%\"}"
          PRIVATE_KEY="${PRIVATE_KEY#\'}"
          PRIVATE_KEY="${PRIVATE_KEY%\'}"
          PRIVATE_KEY="${PRIVATE_KEY#GLORIFIER_DEPLOYER_PRIVATE_KEY=}"
          PRIVATE_KEY="${PRIVATE_KEY#PRIVATE_KEY=}"
          PRIVATE_KEY="${PRIVATE_KEY#0x}"
          PRIVATE_KEY="${PRIVATE_KEY#0X}"

          if [[ -n "$PRIVATE_KEY" && ! "$PRIVATE_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: GLORIFIER_DEPLOYER_PRIVATE_KEY is not a valid 64-hex-character private key."
            exit 1
          fi

          if [[ -n "$PRIVATE_KEY" ]]; then
            echo "::add-mask::$PRIVATE_KEY"
            echo "GLORIFIER_DEPLOYER_PRIVATE_KEY_NORMALIZED=$PRIVATE_KEY" >> "$GITHUB_ENV"
            echo "GLORIFIER_DEPLOYER_PRIVATE_KEY_FOUNDRY=0x$PRIVATE_KEY" >> "$GITHUB_ENV"
          fi

          INITIAL_HOLDER="$(printf '%s' "$INITIAL_HOLDER_INPUT" | tr -d '[:space:]')"
          if [[ -z "$INITIAL_HOLDER" && "${{ inputs.mode }}" == "deploy_new" ]]; then
            INITIAL_HOLDER="$(cast wallet address --private-key "0x$PRIVATE_KEY")"
            echo "No initial_holder supplied; using the deployer address as initial holder."
          fi

          if [[ "${{ inputs.mode }}" == "deploy_new" ]]; then
            if [[ ! "$INITIAL_HOLDER" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "ERROR: initial_holder must be a 40-hex Ethereum address beginning with 0x."
              exit 1
            fi
            HOLDER_LOWER="$(printf '%s' "$INITIAL_HOLDER" | tr '[:upper:]' '[:lower:]')"
            if [[ "$HOLDER_LOWER" == "0x0000000000000000000000000000000000000000" ]]; then
              echo "ERROR: initial_holder cannot be the zero address."
              exit 1
            fi
            echo "GLORIFIER_INITIAL_HOLDER=$INITIAL_HOLDER" >> "$GITHUB_ENV"
          fi

          if [[ -n "$ALCHEMY_API_KEY" ]]; then
            ALCHEMY_API_KEY="$(printf '%s' "$ALCHEMY_API_KEY" | tr -d '[:space:]')"
            ALCHEMY_RPC_URL="https://eth-sepolia.g.alchemy.com/v2/$ALCHEMY_API_KEY"
          fi

          if [[ -n "$INFURA_PROJECT_ID" ]]; then
            INFURA_PROJECT_ID="$(printf '%s' "$INFURA_PROJECT_ID" | tr -d '[:space:]')"
            INFURA_RPC_URL="https://sepolia.infura.io/v3/$INFURA_PROJECT_ID"
          fi

          validate_sepolia_rpc() {
            local provider="$1"
            local url="$2"
            local chain_id=""
            local attempt=1
            if [[ -z "$url" ]]; then echo "$provider: NOT CONFIGURED"; return 1; fi
            case "$url" in
              https://gas.api.infura.io/*|https://gas.api.infura.io) echo "$provider: INVALID ENDPOINT TYPE"; return 1 ;;
              https://*) ;;
              *) echo "$provider: INVALID URL SCHEME"; return 1 ;;
            esac
            while (( attempt <= 3 )); do
              if chain_id="$(cast chain-id --rpc-url "$url" 2>/dev/null)"; then
                if [[ "$chain_id" == "11155111" ]]; then echo "$provider: HEALTHY (Sepolia chain ID 11155111)."; return 0; fi
                echo "$provider: WRONG NETWORK (chain ID $chain_id; expected 11155111)."; return 1
              fi
              sleep $((attempt * 2))
              attempt=$((attempt + 1))
            done
            echo "$provider: UNREACHABLE OR AUTHENTICATION FAILED"
            return 1
          }

          RPC_URL=""
          RPC_PROVIDER=""
          if validate_sepolia_rpc "Chainstack" "$CHAINSTACK_RPC_URL"; then RPC_URL="$CHAINSTACK_RPC_URL"; RPC_PROVIDER="Chainstack"
          elif validate_sepolia_rpc "Alchemy" "$ALCHEMY_RPC_URL"; then RPC_URL="$ALCHEMY_RPC_URL"; RPC_PROVIDER="Alchemy"
          elif validate_sepolia_rpc "Infura" "$INFURA_RPC_URL"; then RPC_URL="$INFURA_RPC_URL"; RPC_PROVIDER="Infura"
          elif validate_sepolia_rpc "PublicNode Sepolia" "$PUBLIC_SEPOLIA_RPC_URL"; then RPC_URL="$PUBLIC_SEPOLIA_RPC_URL"; RPC_PROVIDER="PublicNode Sepolia"
          elif validate_sepolia_rpc "Sepolia.org" "$PUBLIC_SEPOLIA_RPC_URL_2"; then RPC_URL="$PUBLIC_SEPOLIA_RPC_URL_2"; RPC_PROVIDER="Sepolia.org"
          elif validate_sepolia_rpc "1RPC Sepolia" "$PUBLIC_SEPOLIA_RPC_URL_3"; then RPC_URL="$PUBLIC_SEPOLIA_RPC_URL_3"; RPC_PROVIDER="1RPC Sepolia"
          else echo "ERROR: no healthy Ethereum Sepolia RPC provider is available."; exit 1; fi

          echo "RPC_URL=$RPC_URL" >> "$GITHUB_ENV"
          echo "RPC_PROVIDER=$RPC_PROVIDER" >> "$GITHUB_ENV"
          printf 'RPC_PROVIDER=%s\nRPC_SELECTED=true\n' "$RPC_PROVIDER" > deployment-preflight.env

          CHAIN_ID="$(cast chain-id --rpc-url "$RPC_URL")"
          test "$CHAIN_ID" = "11155111"

          if [[ "${{ inputs.mode }}" == "deploy_new" ]]; then
            DEPLOYER="$(cast wallet address --private-key "0x$PRIVATE_KEY")"
            BALANCE_WEI="$(cast balance "$DEPLOYER" --rpc-url "$RPC_URL")"
            echo "Deployer: $DEPLOYER"
            echo "Deployer balance: $BALANCE_WEI wei"
            if [[ "$BALANCE_WEI" =~ ^[0-9]+$ ]] && (( BALANCE_WEI == 0 )); then
              echo "ERROR: deployer has 0 Sepolia ETH; deployment cannot be broadcast."
              echo "Fund the deployer on Sepolia, then rerun deploy_new."
              exit 1
            fi
            NONCE="$(cast nonce "$DEPLOYER" --rpc-url "$RPC_URL")"
            echo "Deployer nonce: $NONCE"
          else
            echo "Recovery mode: skipping private-key-derived deployer, balance, and nonce checks."
          fi

      - name: Guard against duplicate GLR deployment
        if: ${{ inputs.mode == 'deploy_new' }}
        working-directory: contracts
        run: |
          set -euo pipefail
          EXISTING="${{ inputs.contract_address }}"
          if [[ -n "$EXISTING" ]]; then
            if [[ ! "$EXISTING" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
              echo "ERROR: contract_address must be a 0x-prefixed 40-hex address when supplied."
              exit 1
            fi
            CODE="$(cast code "$EXISTING" --rpc-url "$RPC_URL")"
            if [[ "$CODE" != "0x" ]]; then
              echo "ERROR: deploy_new requested, but contract_address already has bytecode at $EXISTING."
              echo "Use mode=recover_existing to verify that existing deployment."
              echo "No transaction was broadcast."
              exit 1
            fi
          fi

      - name: Recover existing GLR evidence
        if: ${{ inputs.mode == 'recover_existing' }}
        working-directory: contracts
        env:
          CONTRACT_INPUT: ${{ inputs.contract_address }}
          TX_INPUT: ${{ inputs.transaction_hash }}
        run: |
          set -euo pipefail
          
          normalize_cast_uint() {
            printf '%s' "${1:-}" | awk '{print $1}' | tr -d '\r\n'
          }

          CONTRACT="$CONTRACT_INPUT"
          TX_HASH="$TX_INPUT"
          if [[ ! "$CONTRACT" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: contract_address must be a 0x-prefixed 40-hex address."
            exit 1
          fi
          CODE="$(cast code "$CONTRACT" --rpc-url "$RPC_URL")"
          if [[ "$CODE" == "0x" ]]; then
            echo "ERROR: no contract bytecode at $CONTRACT on Sepolia."
            echo "No deployment will be created in recovery mode."
            exit 1
          fi
          echo "Existing contract bytecode confirmed at $CONTRACT."

          # cast returns ABI string values JSON-encoded (for example, "GLORIFIER").
          # Normalize both name() and symbol() to plain text before asserting them.
          if ! NAME="$(cast call "$CONTRACT" "name()(string)" --rpc-url "$RPC_URL" | jq -er 'if type == "string" then . else tostring end')"; then
            echo "ERROR: contract at $CONTRACT does not expose a parseable ERC-20 name()."
            exit 1
          fi
          if ! SYMBOL="$(cast call "$CONTRACT" "symbol()(string)" --rpc-url "$RPC_URL" | jq -er 'if type == "string" then . else tostring end')"; then
            echo "ERROR: contract at $CONTRACT does not expose a parseable ERC-20 symbol()."
            exit 1
          fi
          NAME="$(printf '%s' "$NAME" | tr -d '\r\n')"
          SYMBOL="$(printf '%s' "$SYMBOL" | tr -d '\r\n')"
          if ! DECIMALS_RAW="$(cast call "$CONTRACT" "decimals()(uint8)" --rpc-url "$RPC_URL")"; then
            echo "ERROR: contract at $CONTRACT does not expose ERC-20 decimals()."
            exit 1
          fi
          DECIMALS="$(normalize_cast_uint "$DECIMALS_RAW")"

          if ! TOTAL_SUPPLY_RAW="$(cast call "$CONTRACT" "totalSupply()(uint256)" --rpc-url "$RPC_URL")"; then
            echo "ERROR: contract at $CONTRACT does not expose ERC-20 totalSupply()."
            exit 1
          fi
          TOTAL_SUPPLY="$(normalize_cast_uint "$TOTAL_SUPPLY_RAW")"

          test "$NAME" = "GLORIFIER" || { echo "ERROR: token name is '$NAME', expected GLORIFIER."; exit 1; }
          test "$SYMBOL" = "GLR" || { echo "ERROR: token symbol is '$SYMBOL', expected GLR."; exit 1; }
          test "$DECIMALS" = "18" || { echo "ERROR: token decimals are '$DECIMALS', expected 18."; exit 1; }
          test "$TOTAL_SUPPLY" = "1000000000000000000000000000" || { echo "ERROR: totalSupply is '$TOTAL_SUPPLY', expected 1000000000000000000000000000."; exit 1; }

          if [[ -z "$TX_HASH" && -n "$ETHERSCAN_API_KEY" ]]; then
            echo "Attempting Etherscan creation-transaction recovery for $CONTRACT."
            RESPONSE="$(curl -fsS --max-time 20 "https://api.etherscan.io/v2/api?chainid=11155111&module=contract&action=getcontractcreation&contractaddresses=$CONTRACT&apikey=$ETHERSCAN_API_KEY" || true)"
            CANDIDATE="$(printf '%s' "$RESPONSE" | jq -r '.result[0].txHash // empty')"
            if [[ "$CANDIDATE" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
              TX_HASH="$CANDIDATE"
              echo "Recovered deployment transaction from Etherscan."
            else
              echo "Etherscan did not return a usable creation transaction; trying Blockscout."
            fi
          fi

          # Blockscout V2 fallback: first use the address record's authoritative creation_tx_hash.
          # If that field is unavailable, query the address transaction history without the
          # invalid combined "from | to" filter and select a transaction with no recipient.
          if [[ -z "$TX_HASH" ]]; then
            BLOCKSCOUT_ADDRESS_RESPONSE="$(curl -fsS --max-time 20 "https://eth-sepolia.blockscout.com/api/v2/addresses/$CONTRACT" || true)"
            BLOCKSCOUT_CANDIDATE="$(printf '%s' "$BLOCKSCOUT_ADDRESS_RESPONSE" | jq -r '.creation_tx_hash // empty')"
            if [[ "$BLOCKSCOUT_CANDIDATE" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
              TX_HASH="$BLOCKSCOUT_CANDIDATE"
              echo "Recovered deployment transaction from Blockscout V2 address metadata."
            fi
          fi

          if [[ -z "$TX_HASH" ]]; then
            # Prefer Blockscout's current unified API. Its address metadata exposes
            # creation_tx_hash for contracts, avoiding a potentially long history scan.
            for BLOCKSCOUT_BASE in               "https://api.blockscout.com/11155111/api/v2"               "https://eth-sepolia.blockscout.com/api/v2"
            do
              echo "Querying Blockscout address metadata: $BLOCKSCOUT_BASE"
              BLOCKSCOUT_ADDRESS_RESPONSE="$(curl -fsS --max-time 20 "$BLOCKSCOUT_BASE/addresses/$CONTRACT" || true)"
              BLOCKSCOUT_CANDIDATE="$(printf '%s' "$BLOCKSCOUT_ADDRESS_RESPONSE" | jq -r '.creation_tx_hash // empty')"
              if [[ "$BLOCKSCOUT_CANDIDATE" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
                TX_HASH="$BLOCKSCOUT_CANDIDATE"
                echo "Recovered deployment transaction from Blockscout address metadata."
                break
              fi
            done
          fi

          if [[ -z "$TX_HASH" ]]; then
            # Blockscout V2 global contract-creation index.
            BLOCKSCOUT_BASE="https://eth-sepolia.blockscout.com/api/v2"
            BLOCKSCOUT_URL="$BLOCKSCOUT_BASE/transactions?type=contract_creation"
            for page in $(seq 1 100); do
              BLOCKSCOUT_RESPONSE="$(curl -fsS --max-time 20 "$BLOCKSCOUT_URL" || true)"
              if [[ -z "$BLOCKSCOUT_RESPONSE" ]] || ! printf '%s' "$BLOCKSCOUT_RESPONSE" | jq -e '.items and (.items | type == "array")' >/dev/null 2>&1; then
                echo "Blockscout contract-creation request returned no usable JSON on page $page."
                break
              fi

              BLOCKSCOUT_CANDIDATE="$(printf '%s' "$BLOCKSCOUT_RESPONSE" | jq -r --arg contract "$CONTRACT" '
                [.items[]?
                 | select(
                     ((.created_contract.address_hash // "" | ascii_downcase) == ($contract | ascii_downcase))
                     or ((.created_contract.address // "" | ascii_downcase) == ($contract | ascii_downcase))
                   )
                 | (.hash // empty)
                 | select(test("^0x[0-9a-fA-F]{64}$"))]
                | first // empty')"
              if [[ "$BLOCKSCOUT_CANDIDATE" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
                TX_HASH="$BLOCKSCOUT_CANDIDATE"
                echo "Recovered deployment transaction from Blockscout contract-creation index (page $page)."
                break
              fi

              NEXT_PARAMS="$(printf '%s' "$BLOCKSCOUT_RESPONSE" | jq -c '.next_page_params // empty')"
              if [[ -z "$NEXT_PARAMS" || "$NEXT_PARAMS" == "null" || "$NEXT_PARAMS" == "{}" ]]; then
                echo "Blockscout contract-creation index exhausted after $page page(s)."
                break
              fi

              BLOCKSCOUT_URL="$BLOCKSCOUT_BASE/transactions?type=contract_creation"
              while IFS=$'\t' read -r key value; do
                [[ -n "$key" ]] || continue
                if [[ "$BLOCKSCOUT_URL" == *"?"* ]]; then
                  BLOCKSCOUT_URL+="&"
                else
                  BLOCKSCOUT_URL+="?"
                fi
                BLOCKSCOUT_URL+="$(printf '%s' "$key" | jq -sRr @uri)=$(printf '%s' "$value" | jq -sRr @uri)"
              done < <(printf '%s' "$NEXT_PARAMS" | jq -r 'to_entries[] | [.key, (.value | tostring)] | @tsv')
            done
          fi

          if [[ -z "$TX_HASH" ]]; then
            # Fallback: paginate the target contract's transaction history.
            BLOCKSCOUT_BASE="https://eth-sepolia.blockscout.com/api/v2"
            BLOCKSCOUT_URL="$BLOCKSCOUT_BASE/addresses/$CONTRACT/transactions"
            for page in $(seq 1 100); do
              BLOCKSCOUT_RESPONSE="$(curl -fsS --max-time 20 "$BLOCKSCOUT_URL" || true)"
              if [[ -z "$BLOCKSCOUT_RESPONSE" ]] || ! printf '%s' "$BLOCKSCOUT_RESPONSE" | jq -e '.items and (.items | type == "array")' >/dev/null 2>&1; then
                echo "Blockscout transaction-history request returned no usable JSON on page $page."
                break
              fi

              BLOCKSCOUT_CANDIDATE="$(printf '%s' "$BLOCKSCOUT_RESPONSE" | jq -r --arg contract "$CONTRACT" '
                [.items[]?
                 | select(
                     ((.to // null) == null)
                     or ((.created_contract.address_hash // "" | ascii_downcase) == ($contract | ascii_downcase))
                     or ((.created_contract.address // "" | ascii_downcase) == ($contract | ascii_downcase))
                   )
                 | (.hash // empty)
                 | select(test("^0x[0-9a-fA-F]{64}$"))]
                | first // empty')"
              if [[ "$BLOCKSCOUT_CANDIDATE" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
                TX_HASH="$BLOCKSCOUT_CANDIDATE"
                echo "Recovered deployment transaction from Blockscout V2 transaction history (page $page)."
                break
              fi

              NEXT_PARAMS="$(printf '%s' "$BLOCKSCOUT_RESPONSE" | jq -c '.next_page_params // empty')"
              if [[ -z "$NEXT_PARAMS" || "$NEXT_PARAMS" == "null" || "$NEXT_PARAMS" == "{}" ]]; then
                echo "Blockscout V2 transaction history exhausted after $page page(s)."
                break
              fi

              BLOCKSCOUT_URL="$BLOCKSCOUT_BASE/addresses/$CONTRACT/transactions"
              while IFS=$'\t' read -r key value; do
                [[ -n "$key" ]] || continue
                if [[ "$BLOCKSCOUT_URL" == *"?"* ]]; then
                  BLOCKSCOUT_URL+="&"
                else
                  BLOCKSCOUT_URL+="?"
                fi
                BLOCKSCOUT_URL+="$(printf '%s' "$key" | jq -sRr @uri)=$(printf '%s' "$value" | jq -sRr @uri)"
              done < <(printf '%s' "$NEXT_PARAMS" | jq -r 'to_entries[] | [.key, (.value | tostring)] | @tsv')
            done
          fi

          if [[ ! "$TX_HASH" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            echo "WARNING: existing GLR contract is valid, but the deployment transaction hash could not be recovered."
            echo "No redeployment will occur. Recording truthful PARTIALLY VERIFIED evidence."
            echo "Provide the original transaction hash or configure GLORIFIER_ETHERSCAN_API_KEY for full deployment evidence."
            echo "CONTRACT_ADDRESS=$CONTRACT" >> "$GITHUB_ENV"
            echo "DEPLOYMENT_TX_HASH=" >> "$GITHUB_ENV"
            jq -n --arg network "Ethereum Sepolia" --arg contract "$CONTRACT"               '{evidence_type:"GLORIFIER ERC-20 existing deployment verification",verification_level:"PARTIALLY VERIFIED",network:$network,chain_id:11155111,contract_address:$contract,transaction_hash:null,transaction_receipt:null,on_chain_assertions:{name:"GLORIFIER",symbol:"GLR",decimals:18,total_supply_wei:"1000000000000000000000000000"},missing_evidence:["deployment_transaction_hash","deployment_receipt"],note:"Contract bytecode and ERC-20 assertions are verified on-chain; deployment provenance was not recovered."}' > deployment-evidence.json
            echo "EXISTING GLR PARTIALLY VERIFIED"
            cat deployment-evidence.json
            exit 0
          fi

          RECEIPT=""
          for provider in "$RPC_URL" "$PUBLIC_SEPOLIA_RPC_URL" "$PUBLIC_SEPOLIA_RPC_URL_2" "$PUBLIC_SEPOLIA_RPC_URL_3"; do
            [[ -n "$provider" ]] || continue
            if RECEIPT="$(timeout 20s cast receipt "$TX_HASH" --rpc-url "$provider" --json 2>/dev/null)"; then
              if echo "$RECEIPT" | jq -e '(.status == "0x1") or (.status == "1") or (.status == 1)' >/dev/null; then break; fi
              RECEIPT=""
            fi
          done
          if [[ -z "$RECEIPT" ]]; then
            echo "ERROR: deployment transaction was not confirmed with a successful Sepolia receipt."
            exit 1
          fi

          RECEIPT_CONTRACT="$(echo "$RECEIPT" | jq -r '.contractAddress // empty')"
          BLOCK_NUMBER="$(echo "$RECEIPT" | jq -r '.blockNumber // empty')"
          STATUS="$(echo "$RECEIPT" | jq -r '.status // empty')"
          test "$STATUS" = "0x1" || test "$STATUS" = "1"
          test -z "$RECEIPT_CONTRACT" || test "$RECEIPT_CONTRACT" = "$CONTRACT"
          test -n "$BLOCK_NUMBER"

          TRANSFER_TOPIC="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
          HOLDER_TOPIC="$(echo "$RECEIPT" | jq -r --arg topic "$TRANSFER_TOPIC" '[.logs[]? | select((.topics[0] // "" | ascii_downcase) == ($topic | ascii_downcase)) | select((.topics[1] // "" | ascii_downcase) == ("0x" + ("00" * 32))) | .topics[2]] | first // empty')"
          if [[ "$HOLDER_TOPIC" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
            HOLDER="0x${HOLDER_TOPIC: -40}"
          elif [[ -n "$GLORIFIER_INITIAL_HOLDER" ]]; then
            HOLDER="$GLORIFIER_INITIAL_HOLDER"
          else
            echo "ERROR: could not recover the GLR initial holder from the deployment receipt."
            exit 1
          fi
          if ! HOLDER_BALANCE_RAW="$(cast call "$CONTRACT" "balanceOf(address)(uint256)" "$HOLDER" --rpc-url "$RPC_URL")"; then
            echo "ERROR: contract at $CONTRACT does not expose ERC-20 balanceOf()."
            exit 1
          fi
          HOLDER_BALANCE="$(normalize_cast_uint "$HOLDER_BALANCE_RAW")"
          test "$HOLDER_BALANCE" = "$TOTAL_SUPPLY"

          echo "CONTRACT_ADDRESS=$CONTRACT" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_TX_HASH=$TX_HASH" >> "$GITHUB_ENV"
          echo "GLORIFIER_EVIDENCE_HOLDER=$HOLDER" >> "$GITHUB_ENV"
          echo "GLORIFIER_INITIAL_HOLDER=$HOLDER" >> "$GITHUB_ENV"
          jq -n --arg network "Ethereum Sepolia" --arg contract "$CONTRACT" --arg tx "$TX_HASH" --arg holder "$HOLDER" --arg block "$BLOCK_NUMBER" --arg deployer "$(echo "$RECEIPT" | jq -r '.from // empty')"             '{evidence_type:"GLORIFIER ERC-20 existing deployment verification",network:$network,chain_id:11155111,contract_address:$contract,transaction_hash:$tx,block_number_hex:$block,transaction_status:1,deployer_address:$deployer,initial_holder:$holder,on_chain_assertions:{name:"GLORIFIER",symbol:"GLR",decimals:18,total_supply_wei:"1000000000000000000000000000",holder_balance_equals_total_supply:true}}' > deployment-evidence.json

          echo "EXISTING GLR EVIDENCE RECOVERED"
          cat deployment-evidence.json

      - name: Deploy new GLR
        if: ${{ inputs.mode == 'deploy_new' }}
        working-directory: contracts
        run: |
          set -euo pipefail
          # Explicit opt-in only. This mode is blocked if the known existing GLR address already has code.
          EXISTING="${{ inputs.contract_address }}"
          if [[ -n "$EXISTING" ]]; then
            EXISTING_CODE="$(cast code "$EXISTING" --rpc-url "$RPC_URL")"
            if [[ "$EXISTING_CODE" != "0x" ]]; then
              echo "ERROR: contract_address already has bytecode at $EXISTING."
              echo "Refusing to create a second GLR contract at a known address."
              echo "Use mode=recover_existing to verify the existing deployment."
              exit 1
            fi
          fi

          export PRIVATE_KEY="$GLORIFIER_DEPLOYER_PRIVATE_KEY_FOUNDRY"
          export GLORIFIER_INITIAL_HOLDER="$GLORIFIER_INITIAL_HOLDER"
          cast wallet address --private-key "$PRIVATE_KEY" >/dev/null
          rm -rf broadcast
          forge script script/DeployGLORIFIER.s.sol:DeployGLORIFIER --rpc-url "$RPC_URL" --broadcast --slow

      - name: Extract and verify new deployment evidence
        if: ${{ inputs.mode == 'deploy_new' }}
        working-directory: contracts
        run: |
          set -euo pipefail

          normalize_cast_uint() {
            printf '%s' "${1:-}" | awk '{print $1}' | tr -d '\r\n'
          }

          export DEPLOYER_PRIVATE_KEY="$GLORIFIER_DEPLOYER_PRIVATE_KEY_FOUNDRY"
          export INITIAL_HOLDER="$GLORIFIER_INITIAL_HOLDER"
          RUN_FILE="broadcast/DeployGLORIFIER.s.sol/11155111/run-latest.json"
          test -s "$RUN_FILE"
          DEPLOYER_ADDRESS="$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")"
          CONTRACT_ADDRESS="$(jq -r '[.transactions[] | select(.contractAddress != null and .contractAddress != "")][0].contractAddress // empty' "$RUN_FILE")"
          TX_HASH="$(jq -r '[.transactions[] | select(.hash != null and .hash != "")][0].hash // empty' "$RUN_FILE")"
          test -n "$CONTRACT_ADDRESS" && test "$CONTRACT_ADDRESS" != "null"
          test -n "$TX_HASH" && test "$TX_HASH" != "null"
          CODE="$(cast code "$CONTRACT_ADDRESS" --rpc-url "$RPC_URL")"
          test "$CODE" != "0x"
          NAME="$(cast call "$CONTRACT_ADDRESS" "name()(string)" --rpc-url "$RPC_URL" | jq -er 'if type == "string" then . else tostring end')"
          SYMBOL="$(cast call "$CONTRACT_ADDRESS" "symbol()(string)" --rpc-url "$RPC_URL" | jq -er 'if type == "string" then . else tostring end')"
          if ! DECIMALS_RAW="$(cast call "$CONTRACT_ADDRESS" "decimals()(uint8)" --rpc-url "$RPC_URL")"; then
            echo "ERROR: contract at $CONTRACT_ADDRESS does not expose ERC-20 decimals()."
            exit 1
          fi
          DECIMALS="$(normalize_cast_uint "$DECIMALS_RAW")"
          if ! TOTAL_SUPPLY_RAW="$(cast call "$CONTRACT_ADDRESS" "totalSupply()(uint256)" --rpc-url "$RPC_URL")"; then
            echo "ERROR: contract at $CONTRACT_ADDRESS does not expose ERC-20 totalSupply()."
            exit 1
          fi
          TOTAL_SUPPLY="$(normalize_cast_uint "$TOTAL_SUPPLY_RAW")"
          if ! HOLDER_BALANCE_RAW="$(cast call "$CONTRACT_ADDRESS" "balanceOf(address)(uint256)" "$INITIAL_HOLDER" --rpc-url "$RPC_URL")"; then
            echo "ERROR: contract at $CONTRACT_ADDRESS does not expose ERC-20 balanceOf()."
            exit 1
          fi
          HOLDER_BALANCE="$(normalize_cast_uint "$HOLDER_BALANCE_RAW")"
          test "$NAME" = "GLORIFIER"
          test "$SYMBOL" = "GLR"
          test "$DECIMALS" = "18"
          test "$TOTAL_SUPPLY" = "1000000000000000000000000000"
          test "$HOLDER_BALANCE" = "$TOTAL_SUPPLY"
          RECEIPT="$(timeout 20s cast receipt "$TX_HASH" --rpc-url "$RPC_URL" --json)"
          echo "$RECEIPT" | jq -e '(.status == "0x1") or (.status == "1") or (.status == 1)' >/dev/null
          BLOCK_NUMBER="$(echo "$RECEIPT" | jq -r '.blockNumber // empty')"
          test -n "$BLOCK_NUMBER"
          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> "$GITHUB_ENV"
          echo "DEPLOYMENT_TX_HASH=$TX_HASH" >> "$GITHUB_ENV"
          echo "GLORIFIER_EVIDENCE_HOLDER=$INITIAL_HOLDER" >> "$GITHUB_ENV"
          jq -n --arg network "Ethereum Sepolia" --arg contract "$CONTRACT_ADDRESS" --arg tx "$TX_HASH" --arg holder "$INITIAL_HOLDER" --arg block "$BLOCK_NUMBER" --arg deployer "$DEPLOYER_ADDRESS"             '{evidence_type:"GLORIFIER ERC-20 deployment",network:$network,chain_id:11155111,contract_address:$contract,transaction_hash:$tx,block_number_hex:$block,transaction_status:1,deployer_address:$deployer,initial_holder:$holder,on_chain_assertions:{name:"GLORIFIER",symbol:"GLR",decimals:18,total_supply_wei:"1000000000000000000000000000"}}' > deployment-evidence.json

      - name: Verify contract on Etherscan
        if: ${{ env.ETHERSCAN_API_KEY != '' && env.CONTRACT_ADDRESS != '' && env.GLORIFIER_EVIDENCE_HOLDER != '' }}
        continue-on-error: true
        working-directory: contracts
        run: |
          set -euo pipefail
          CONSTRUCTOR_ARGS="$(cast abi-encode "constructor(address)" "${GLORIFIER_EVIDENCE_HOLDER:-$GLORIFIER_INITIAL_HOLDER}")"
          if forge verify-contract "$CONTRACT_ADDRESS" src/GLORIFIER.sol:GLORIFIER --chain sepolia --constructor-args "$CONSTRUCTOR_ARGS" --etherscan-api-key "$ETHERSCAN_API_KEY" --watch; then
            echo "ETHERSCAN_VERIFIED=true" >> "$GITHUB_ENV"
          else
            echo "ETHERSCAN_VERIFIED=false" >> "$GITHUB_ENV"
            echo "WARNING: Etherscan verification failed; on-chain deployment evidence remains valid."
          fi

      - name: Etherscan verification status
        if: ${{ always() }}
        run: |
          if [[ "${ETHERSCAN_VERIFIED:-false}" == "true" ]]; then
            echo "Etherscan source verification: VERIFIED."
          else
            echo "Etherscan source verification: NOT VERIFIED."
          fi

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## GLORIFIER GLR Testnet Deployment"
            echo "- Network: Ethereum Sepolia"
            echo "- Mode: ${{ inputs.mode }}"
            echo "- RPC provider: ${RPC_PROVIDER:-NOT SELECTED}"
            if [ -n "${CONTRACT_ADDRESS:-}" ] && [ -n "${DEPLOYMENT_TX_HASH:-}" ]; then
              echo "- Contract: $CONTRACT_ADDRESS"
              echo "- Transaction: $DEPLOYMENT_TX_HASH"
              if [ "${ETHERSCAN_VERIFIED:-false}" = "true" ]; then
                echo "- On-chain verification: **PASSED**"
                echo "- Etherscan source verification: **PASSED**"
                echo "- GLR status: **FULLY VERIFIED**"
              else
                echo "- On-chain verification: **PASSED**"
                echo "- Etherscan source verification: **NOT VERIFIED**"
                echo "- GLR status: **PARTIALLY VERIFIED**"
              fi
            elif [ -n "${CONTRACT_ADDRESS:-}" ]; then
              echo "- Contract: $CONTRACT_ADDRESS"
              echo "- Deployment transaction: **NOT RECOVERED**"
              echo "- On-chain ERC-20 assertions: **PASSED**"
              echo "- Deployment provenance: **NOT VERIFIED**"
              echo "- GLR status: **PARTIALLY VERIFIED**"
            else
              echo "- Deployment: **NOT COMPLETED**"
              echo "- Contract/transaction evidence: **NOT AVAILABLE**"
              echo "- On-chain verification: **NOT VERIFIED**"
              echo "- GLR status: **NOT VERIFIED**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-testnet-deployment
          if-no-files-found: ignore
          path: |
            contracts/broadcast/DeployGLORIFIER.s.sol/11155111/run-latest.json
            contracts/deployment-evidence.json
            contracts/deployment-preflight.env
