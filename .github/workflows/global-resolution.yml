name: GLORIFIER Global Issue Resolution

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: glorifier-global-resolution
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check database configuration
        id: database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_CONFIGURED=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DATABASE_URL is not configured; global issue resolution is NOT_OBSERVABLE and will not fabricate a success state."
          else
            echo "DATABASE_CONFIGURED=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Discover and queue global resolution candidates
        if: steps.database.outputs.DATABASE_CONFIGURED == 'true'
        run: npx tsx scripts/run-global-resolution.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GLORIFIER_RESOLUTION_LIMIT: "200"
      - name: Report unconfigured database boundary
        if: steps.database.outputs.DATABASE_CONFIGURED != 'true'
        run: echo "Global resolution cycle skipped truthfully because DATABASE_URL is unavailable."

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v7:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/actions/setup-node@v7:sha1-820762786026740c76f36085b0efc47a31fe5020
