name: GLORIFIER Global Collaboration & Resolution

on:
  workflow_dispatch:
  schedule:
    # Reduced from every 15 minutes to every 6 hours to conserve Neon free-tier quota.
    # Manual dispatch remains available for urgent runs.
    - cron: "47 */6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: glorifier-global-collaboration
  cancel-in-progress: false

jobs:
  collaborate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require the collaboration database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::DATABASE_URL is unavailable. Global collaboration did not execute; configure the repository secret before retrying."
            exit 1
          fi

      - name: Request GitHub OIDC identity
        uses: actions/github-script@v9
        with:
          script: |
            const token = await core.getIDToken();
            if (typeof token !== 'string' || token.length === 0) {
              throw new Error('GitHub Actions did not issue an OIDC identity token.');
            }
            core.info('GitHub Actions issued an OIDC identity token. No external token exchange or database credential federation is configured by this workflow.');

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run global collaboration and resolution cycle
        run: ./node_modules/.bin/tsx scripts/run-global-collaboration.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GLORIFIER_COLLABORATION_LIMIT: "200"
