name: GLORIFIER Solana Devnet Reconciliation (Manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VERIFY_GLORIFIER_SOLANA_DEVNET
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Manual reconciliation authorization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "VERIFY_GLORIFIER_SOLANA_DEVNET"
          bash -n solana/reconcile-token2022-devnet.sh
