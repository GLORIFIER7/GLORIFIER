name: GLORIFIER Governed AI Coding Fleet

on:
  schedule:
    # Weekly at 09:17 Laos time; cost-gated with AI_MAINTENANCE_AUTORUN=true.
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      authorize_pull_request:
        description: "Authorize this run to open draft PRs after validation."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: glorifier-ai-fleet-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  coding-fleet:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - role: architect
            prompt: Inspect the repository and make one small, high-value reliability or architecture improvement.
          - role: security
            prompt: Find one concrete, verifiable security or dependency risk and fix it if low-risk.
          - role: qa
            prompt: Make one small improvement to tests, type safety, build reliability, error handling, or observability.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve AI maintenance authorization
        id: authorization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_AUTHORIZATION: ${{ inputs.authorize_pull_request }}
          SCHEDULE_AUTHORIZATION: ${{ vars.AI_MAINTENANCE_AUTORUN }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_AUTHORIZATION" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_AUTHORIZATION" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce PR publication window (Laos)
        id: time_window
        shell: bash
        run: |
          set -euo pipefail
          current_hhmm="$(TZ=Asia/Vientiane date +%H%M)"
          if [[ ! "$current_hhmm" =~ ^[0-9]{4}$ ]]; then
            echo "::error::The Asia/Vientiane clock did not return HHMM digits."
            exit 1
          fi
          current_hhmm_decimal=$((10#$current_hhmm))
          if (( current_hhmm_decimal < 831 )); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AI maintenance publication is held until after 08:30 Asia/Vientiane."
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Laos time-window boundaries
        shell: bash
        run: |
          set -euo pipefail
          for sample in 0000 0830 0831 0917 2359; do
            actual=false
            if (( 10#$sample >= 831 )); then
              actual=true
            fi
            case "$sample:$actual" in
              0000:false|0830:false|0831:true|0917:true|2359:true) ;;
              *)
                echo "::error::Incorrect time-window boundary for $sample: $actual"
                exit 1
                ;;
            esac
          done

      - name: Check OpenAI credential availability
        id: provider
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.time_window.outputs.allowed == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.time_window.outputs.allowed == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install trusted validation dependencies
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.time_window.outputs.allowed == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Codex
        id: codex
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.time_window.outputs.allowed == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # pinned action revision
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          effort: high
          prompt: |
            ${{ matrix.prompt }}

            Follow AGENTS.md. Keep the change small and reviewable. Never expose or modify secrets.
            Do not alter the trusted AI-fleet validator, its tests, capability authorization, package
            manifests, lockfiles, or workflow files. Run npm run lint and npm run build when applicable.
            If there is no safe worthwhile change, make no code change.

      - name: Stage AI-generated changes for review
        id: stage
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.provider.outputs.configured == 'true' && steps.codex.outcome == 'success' && steps.time_window.outputs.allowed == 'true' }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify trusted validator and package files were not modified
        if: ${{ steps.stage.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              scripts/ai-fleet-diff-policy.mjs|scripts/ai-fleet-diff-policy.test.mjs|scripts/validate-ai-fleet-diff.mjs|scripts/validate-ai-fleet-diff.test.mjs|src/lib/capability-authorization.ts|package.json|package-lock.json|npm-shrinkwrap.json|.npmrc|.github/workflows/*)
                echo "Protected validation dependency changed: $path"
                exit 1
                ;;
            esac
          done < <(git diff --cached --no-renames --name-only -z)

      - name: Reinstall trusted dependencies after AI execution
        if: ${{ steps.stage.outputs.changed == 'true' }}
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate generated changes before publication
        id: validation
        if: ${{ steps.stage.outputs.changed == 'true' }}
        run: |
          npm run lint
          npm run test:ai-fleet-diff-policy
          npm run test:provider-discovery
          npm run test:provider-model-selection
          npm run test:provider-routing
          npm run build

      - name: Remove any agent-created trusted-policy directory
        if: ${{ steps.stage.outputs.changed == 'true' && steps.validation.outcome == 'success' }}
        run: rm -rf trusted-policy

      - name: Check out trusted PR-gate source
        if: ${{ steps.stage.outputs.changed == 'true' && steps.validation.outcome == 'success' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: trusted-policy
          persist-credentials: false
          fetch-depth: 1

      - name: Validate dedicated PR capability and reviewable diff
        id: policy
        if: ${{ steps.stage.outputs.changed == 'true' && steps.validation.outcome == 'success' }}
        env:
          GLORIFIER_PR_CREATION_AUTHORIZED: ${{ steps.authorization.outputs.enabled }}
        run: node --import tsx/esm trusted-policy/scripts/validate-ai-fleet-diff.mjs

      - name: Create PR branch
        if: ${{ steps.stage.outputs.changed == 'true' && steps.policy.outcome == 'success' }}
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "GLORIFIER AI Fleet (${{ matrix.role }})"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ai/${{ matrix.role }}/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git -c core.hooksPath=/dev/null commit -m "ai(${{ matrix.role }}): governed maintenance"
          git -c core.hooksPath=/dev/null push --set-upstream "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request
        if: ${{ steps.branch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --draft --base main --head "${{ steps.branch.outputs.branch }}" \
            --title "AI Fleet: ${{ matrix.role }} maintenance" \
            --body "Autonomous GLORIFIER maintenance proposal. The repository pull_request CI runs after publication. This PR remains a draft and is not auto-merged."

      - name: Report that the Laos publication window is closed
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.time_window.outputs.allowed != 'true' }}
        run: echo "::notice::No model was invoked and no PR was created because it is before 08:31 Asia/Vientiane."

      - name: Report that AI maintenance is not enabled
        if: ${{ steps.authorization.outputs.enabled != 'true' }}
        run: |
          echo "::notice::No AI model was invoked. Enable the weekly schedule by setting the repository Actions variable AI_MAINTENANCE_AUTORUN=true, or manually dispatch with authorize_pull_request=true."

      - name: Report missing API key
        if: ${{ steps.authorization.outputs.enabled == 'true' && steps.time_window.outputs.allowed == 'true' && steps.provider.outputs.configured != 'true' }}
        run: |
          echo "::warning::OPENAI_API_KEY is not configured. AI maintenance did not run."

      - name: Report Codex capacity limitation
        if: ${{ failure() && steps.codex.outcome == 'failure' }}
        run: echo "::warning::Codex execution failed; inspect provider quota/capacity and do not retry aggressively."
