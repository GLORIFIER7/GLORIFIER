name: GLORIFIER 24x7 AI Coding Fleet

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: glorifier-ai-fleet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coding-fleet:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - role: architect
            prompt: Inspect the repository and make one small, high-value reliability or architecture improvement.
          - role: security
            prompt: Find one concrete, verifiable security or dependency risk and fix it if low-risk.
          - role: qa
            prompt: Make one small improvement to tests, type safety, build reliability, error handling, or observability.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex
        id: codex
        continue-on-error: true
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          effort: high
          prompt: |
            ${{ matrix.prompt }}

            Follow AGENTS.md. Keep the change small and reviewable. Never expose or modify secrets. Run npm run lint and npm run build when applicable. If there is no safe worthwhile change, make no code change.

      - name: Create PR branch
        if: ${{ env.OPENAI_API_KEY != '' && steps.codex.outcome == 'success' }}
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "GLORIFIER AI Fleet (${{ matrix.role }})"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ai/${{ matrix.role }}/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ai(${{ matrix.role }}): autonomous maintenance"
          git push --set-upstream "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: ${{ steps.branch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.branch.outputs.branch }}" --title "AI Fleet: ${{ matrix.role }} maintenance" --body "Autonomous GLORIFIER maintenance task. Review CI and the diff before merge."

      - name: Report Codex capacity limitation
        if: ${{ steps.codex.outcome == 'failure' }}
        run: echo "::warning::Codex execution failed; inspect provider quota/capacity and do not retry aggressively."

      - name: Missing API key notice
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "::warning::OPENAI_API_KEY is not configured. The AI coding fleet is installed but dormant until the GitHub Actions secret is added."

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675:sha1-bdf19a4a223ec2549a3e2274a0cf61556bc07675
