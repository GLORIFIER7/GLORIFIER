name: GLORIFIER 24x7 AI Coding Fleet

on:
  workflow_dispatch:
    inputs:
      authorize_pull_request:
        description: "Authorize this run to open a PR after the dedicated capability and diff checks pass."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: glorifier-ai-fleet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coding-fleet:
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - role: architect
            prompt: Inspect the repository and make one small, high-value reliability or architecture improvement.
          - role: security
            prompt: Find one concrete, verifiable security or dependency risk and fix it if low-risk.
          - role: qa
            prompt: Make one small improvement to tests, type safety, build reliability, error handling, or observability.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check OpenAI credential availability
        id: provider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: ${{ inputs.authorize_pull_request == true && steps.provider.outputs.configured == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install trusted validation dependencies
        if: ${{ inputs.authorize_pull_request == true && steps.provider.outputs.configured == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Codex
        id: codex
        if: ${{ inputs.authorize_pull_request == true && steps.provider.outputs.configured == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1 tag target observed 2026-10-26
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          effort: high
          prompt: |
            ${{ matrix.prompt }}

            Follow AGENTS.md. Keep the change small and reviewable. Never expose or modify secrets. Run npm run lint and npm run build when applicable. If there is no safe worthwhile change, make no code change.

      - name: Stage AI-generated changes for review
        id: stage
        if: ${{ inputs.authorize_pull_request == true && steps.provider.outputs.configured == 'true' && steps.codex.outcome == 'success' }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify trusted validator and package files were not modified
        if: ${{ steps.stage.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            case "$path" in
              scripts/ai-fleet-diff-policy.mjs|scripts/ai-fleet-diff-policy.test.mjs|scripts/validate-ai-fleet-diff.mjs|src/lib/capability-authorization.ts|package.json|package-lock.json|npm-shrinkwrap.json|.npmrc)
                echo "Protected validation dependency changed: $path"
                exit 1
                ;;
            esac
          done < <(git diff --cached --no-renames --name-only -z)

      - name: Reinstall trusted dependencies after AI execution
        if: ${{ steps.stage.outputs.changed == 'true' }}
        run: |
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate generated changes before publication
        id: validation
        if: ${{ steps.stage.outputs.changed == 'true' }}
        run: |
          npm run lint
          npm run test:ai-fleet-diff-policy
          npm run test:provider-discovery
          npm run test:provider-model-selection
          npm run test:provider-routing
          npm run build

      - name: Validate dedicated PR capability and reviewable diff
        id: policy
        if: ${{ steps.stage.outputs.changed == 'true' && steps.validation.outcome == 'success' }}
        env:
          GLORIFIER_PR_CREATION_AUTHORIZED: ${{ inputs.authorize_pull_request }}
        run: node --import tsx/esm scripts/validate-ai-fleet-diff.mjs

      - name: Create PR branch
        if: ${{ steps.stage.outputs.changed == 'true' && steps.policy.outcome == 'success' }}
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "GLORIFIER AI Fleet (${{ matrix.role }})"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ai/${{ matrix.role }}/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "ai(${{ matrix.role }}): governed maintenance"
          git push --set-upstream "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: ${{ steps.branch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head "${{ steps.branch.outputs.branch }}" --title "AI Fleet: ${{ matrix.role }} maintenance" --body "Autonomous GLORIFIER maintenance task. Review CI and the diff before merge."

      - name: Report that PR creation was not authorized
        if: ${{ inputs.authorize_pull_request != true }}
        run: echo "::notice::AI work was not published. Re-run with the explicit authorize_pull_request input only after reviewing the intended automation scope."

      - name: Report Codex capacity limitation
        if: ${{ failure() && steps.codex.outcome == 'failure' }}
        run: echo "::warning::Codex execution failed; inspect provider quota/capacity and do not retry aggressively."

      - name: Missing API key notice
        if: ${{ steps.provider.outputs.configured != 'true' }}
        run: |
          echo "::warning::OPENAI_API_KEY is not configured. The AI coding fleet is installed but dormant until the GitHub Actions secret is added."
