name: GLORIFIER Solana Devnet Deployment Gate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_GLORIFIER_SOLANA_DEVNET to authorize the deployment gate"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deployment-gate:
    name: Authorize and validate real deployment evidence
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: glorifier-solana-devnet-deployment
      cancel-in-progress: false
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Refuse every non-authorized invocation
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${CONFIRMATION}" = "DEPLOY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Exact authorization is required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify canonical Devnet boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${SOLANA_RPC_URL}" = "https://api.devnet.solana.com" || {
            echo "::error::Only canonical Solana Devnet RPC is permitted."
            exit 1
          }

          grep -Fq '"network": "solana-devnet"' solana/canonical-devnet-identity.json
          grep -Fq '"token_standard": "Token-2022"' solana/canonical-devnet-identity.json
          grep -Fq '"symbol": "GLR"' solana/canonical-devnet-identity.json
          grep -Fq '"status": "NOT VERIFIED"' solana/canonical-devnet-identity.json || {
            echo "::error::Deployment gate must never start from a canonical FULLY_VERIFIED identity."
            exit 1
          }

      - name: Explicitly block synthetic deployment evidence
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE 'MOCK_MINT|placeholder deployment evidence' \
            solana/deployment-evidence.json \
            solana/canonical-devnet-identity.json 2>/dev/null; then
            echo "::error::Synthetic or premature verification state detected."
            exit 1
          fi

          echo "::notice::No synthetic mint, transaction signature, or verification status may be generated by this workflow."

      - name: Deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF'
          GLORIFIER Solana Devnet deployment is intentionally not executed by this
          GitHub workflow.

          This workflow is an authorization/boundary gate only. It does not create
          a mint, initialize metadata, create token accounts, mint supply, revoke
          authorities, or fabricate deployment evidence.

          Required post-deployment evidence for the separate read-only reconciliation
          workflow:
            - real Token-2022 mint address
            - creation transaction signature
            - metadata initialization transaction signature
            - token-account creation transaction signature
            - 1,000,000,000 GLR mint transaction signature
            - mint-authority revocation transaction signature
            - freeze-authority revocation transaction signature

          The reconciliation workflow independently verifies those signatures and
          current on-chain state before any canonical status can become
          FULLY_VERIFIED.
          EOF
          exit 0

      - name: Upload boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glorifier-solana-devnet-deployment-gate
          retention-days: 30
          if-no-files-found: warn
          path: |
            solana/canonical-devnet-identity.json
