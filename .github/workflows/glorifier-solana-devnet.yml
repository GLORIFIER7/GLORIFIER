name: GLORIFIER Solana Devnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_GLORIFIER_SOLANA_DEVNET to authorize a new Solana Devnet mint"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy GLORIFIER GLR to Solana Devnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: glorifier-solana-devnet-deploy
      cancel-in-progress: false
    environment: glorifier-solana-devnet
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      AGAVE_VERSION: v4.2.2
      GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_KEYPAIR_JSON }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Validate deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Refusing Solana Devnet deployment: exact confirmation required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository deployment contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n solana/deploy-token2022-devnet.sh
          bash -n solana/reconcile-token2022-devnet.sh
          bash -n solana/deploy-devnet.sh

          jq -e '
            .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .transferFeeBasisPoints == 0
            and .permanentDelegate == null
            and .finalMintAuthority == null
            and .finalFreezeAuthority == null
            and .devnetFirst == true
            and .mainnetRequiresHumanApproval == true
          ' solana/token-config.json >/dev/null

          jq -e '
            .asset == "GLORIFIER"
            and .symbol == "GLR"
            and .network == "solana-devnet"
            and .token_standard == "Token-2022"
            and .program_id == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PH"
            and .status == "NOT VERIFIED"
            and .canonical_mint == null
            and .creation_transaction == null
            and .mint_transaction == null
            and .authority_revocation_transaction == null
          ' solana/canonical-devnet-identity.json >/dev/null

          python3 - <<'PY'
from pathlib import Path
import subprocess
import tempfile

path = Path(".github/workflows/glorifier-solana-devnet.yml")
lines = path.read_text(encoding="utf-8").splitlines()
blocks = []
for i, line in enumerate(lines):
    if line.strip() != "run: |":
        continue
    base_indent = len(line) - len(line.lstrip(" "))
    block = []
    j = i + 1
    while j < len(lines):
        candidate = lines[j]
        if not candidate.strip():
            block.append("")
            j += 1
            continue
        indent = len(candidate) - len(candidate.lstrip(" "))
        if indent <= base_indent:
            break
        block.append(candidate[base_indent + 2:])
        j += 1
    blocks.append("\n".join(block) + "\n")

if not blocks:
    raise SystemExit("No inline bash run blocks found in deployment workflow.")

with tempfile.TemporaryDirectory() as tmp:
    for n, block in enumerate(blocks):
        p = Path(tmp) / f"step-{n}.sh"
        p.write_text(block, encoding="utf-8")
        subprocess.run(["bash", "-n", str(p)], check=True)

print(f"Validated {len(blocks)} inline GitHub Actions bash blocks.")
PY

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.0.2
          spl-token --version

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GLORIFIER_SOLANA_KEYPAIR_JSON}" || {
            echo "::error::Missing GLORIFIER_SOLANA_KEYPAIR_JSON in the glorifier-solana-devnet environment."
            exit 1
          }
          test -n "${SOLANA_RPC_URL}" || {
            echo "::error::Canonical Solana Devnet RPC is unexpectedly empty."
            exit 1
          }
          cat > solana/deployment-status.txt <<'EOF'
STATUS=CONFIGURED
EOF

      - name: Check deployment replay lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUNS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/glorifier-solana-devnet.yml/runs?event=workflow_dispatch&per_page=100")"
          if jq -e --arg current "${GITHUB_RUN_ID}" '
            any(.workflow_runs[]?;
              ((.id | tostring) != $current) and (.conclusion == "success")
            )
          ' <<<"$RUNS_JSON" >/dev/null; then
            echo "::error::A previous GLORIFIER Solana Devnet deployment workflow already succeeded."
            echo "::error::Use glorifier-solana-devnet-reconcile.yml with the existing mint instead of creating another mint."
            exit 1
          fi

          ARTIFACTS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=glorifier-solana-devnet-evidence&per_page=100")"
          while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_RUN_ID; do
            [[ -n "${ARTIFACT_ID}" ]] || continue
            [[ "${ARTIFACT_RUN_ID}" == "${GITHUB_RUN_ID}" ]] && continue

            rm -rf /tmp/glorifier-replay-check
            mkdir -p /tmp/glorifier-replay-check/unpacked
            if ! gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/glorifier-replay-check/evidence.zip; then
              echo "::error::Could not inspect prior deployment artifact ${ARTIFACT_ID}; refusing to mint."
              exit 1
            fi
            unzip -oq /tmp/glorifier-replay-check/evidence.zip -d /tmp/glorifier-replay-check/unpacked

            EVIDENCE_FILE="$(find /tmp/glorifier-replay-check/unpacked -type f -name deployment-evidence.json -print -quit)"
            if [[ -n "${EVIDENCE_FILE}" ]] && jq -e '
              (.status == "DEPLOYED"
               or .status == "READY_FOR_VERIFICATION"
               or .status == "FULLY_VERIFIED")
              and (.network == "solana-devnet")
              and (.programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PH")
              and (.mint | type == "string" and length >= 32 and length <= 44)
            ' "${EVIDENCE_FILE}" >/dev/null; then
              echo "::error::Prior GLORIFIER Solana Devnet mint evidence exists in artifact ${ARTIFACT_ID}."
              echo "::error::Mint creation is locked. Use glorifier-solana-devnet-reconcile.yml instead."
              exit 1
            fi
          done < <(
            jq -r '
              .artifacts[]?
              | select(.expired == false)
              | [(.id | tostring), ((.workflow_run.id // -1) | tostring)]
              | @tsv
            ' <<<"$ARTIFACTS_JSON"
          )

          echo "Replay lock: no prior successful deployment or valid partial-mint evidence found."

      - name: Configure dedicated deployment wallet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          printf '%s' "${GLORIFIER_SOLANA_KEYPAIR_JSON}" > "$HOME/.config/solana/glorifier-devnet-keypair.json"
          chmod 600 "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana config set --url "${SOLANA_RPC_URL}" --keypair "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana address

      - name: Verify Devnet RPC and funding
        shell: bash
        run: |
          set -euo pipefail
          RPC_URL="$(solana config get | awk -F': ' '/RPC URL/ {print $2}')"
          test "$RPC_URL" = "https://api.devnet.solana.com" || {
            echo "::error::Refusing deployment: configured RPC is not canonical Solana Devnet: $RPC_URL"
            exit 1
          }
          solana cluster-version
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          test "${BALANCE:-0}" -gt 0 || {
            echo "::error::Deployment wallet has no SOL for Devnet fees."
            exit 1
          }

      - name: Deploy Token-2022 GLORIFIER
        shell: bash
        run: |
          set -euo pipefail
          chmod +x solana/deploy-token2022-devnet.sh
          solana config set --commitment confirmed
          ./solana/deploy-token2022-devnet.sh | tee solana/deployment-output.txt

      - name: Verify final mint state
        shell: bash
        run: |
          set -euo pipefail
          readonly TOKEN_2022_PROGRAM="TokenzQdBNbLqP5VEhdkAS6EPFLC1PH"
          MINT="$(grep -E '^MINT=' solana/deployment-output.txt | tail -n1 | cut -d= -f2)"
          test -n "$MINT"
          echo "MINT=$MINT"

          spl-token --program-2022 supply "$MINT" | tee solana/final-supply.txt
          spl-token --program-2022 display "$MINT" | tee solana/final-mint-state.txt
          solana account "$MINT" | tee solana/mint-account.txt

          ACTUAL_SUPPLY="$(awk 'NR==1 {print $1}' solana/final-supply.txt | tr -d '\r')"
          test "$ACTUAL_SUPPLY" = "1000000000"

          grep -Fq "Owner: $TOKEN_2022_PROGRAM" solana/mint-account.txt
          grep -Fq "Name: GLORIFIER" solana/final-mint-state.txt
          grep -Fq "Symbol: GLR" solana/final-mint-state.txt
          grep -Fq "Decimals: 9" solana/final-mint-state.txt
          grep -Eiq 'Mint[[:space:]]+Authority.*None' solana/final-mint-state.txt
          grep -Eiq 'Freeze[[:space:]]+Authority.*None' solana/final-mint-state.txt

          test -s solana/deployment-evidence.json
          jq -e --arg mint "$MINT" --arg program "$TOKEN_2022_PROGRAM" '
            .status == "READY_FOR_VERIFICATION"
            and .network == "solana-devnet"
            and .mint == $mint
            and .programId == $program
            and .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .mintAuthority == null
            and .freezeAuthority == null
            and (.creationTransaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
            and (.metadataTransaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
            and (.tokenAccountCreationTransaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
            and (.mintTransaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
            and (.mintAuthorityRevocationTransaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
            and (.freezeAuthorityRevocationTransaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
          ' solana/deployment-evidence.json >/dev/null

          jq             --arg run_id "${GITHUB_RUN_ID}"             --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '.status = "FULLY_VERIFIED" |
             .verification = {
               "runId": $run_id,
               "runUrl": $run_url,
               "verifiedAt": $verified_at
             }'             solana/deployment-evidence.json > solana/deployment-evidence.tmp.json
          mv solana/deployment-evidence.tmp.json solana/deployment-evidence.json

          cp solana/deployment-evidence.json solana/deployment-record.json
          echo "GLR_STATUS=FULLY_VERIFIED" | tee solana/deployment-status.txt

      - name: Prepare canonical identity update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          readonly BRANCH="automation/solana-devnet-canonical-${GITHUB_RUN_ID}"
          readonly RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          MINT="$(jq -r '.mint' solana/deployment-evidence.json)"
          CREATION_TX="$(jq -r '.creationTransaction' solana/deployment-evidence.json)"
          METADATA_TX="$(jq -r '.metadataTransaction' solana/deployment-evidence.json)"
          ACCOUNT_TX="$(jq -r '.tokenAccountCreationTransaction' solana/deployment-evidence.json)"
          MINT_TX="$(jq -r '.mintTransaction' solana/deployment-evidence.json)"
          MINT_AUTH_TX="$(jq -r '.mintAuthorityRevocationTransaction' solana/deployment-evidence.json)"
          FREEZE_AUTH_TX="$(jq -r '.freezeAuthorityRevocationTransaction' solana/deployment-evidence.json)"

          jq \
            --arg mint "$MINT" \
            --arg creation "$CREATION_TX" \
            --arg metadata "$METADATA_TX" \
            --arg account "$ACCOUNT_TX" \
            --arg mint_tx "$MINT_TX" \
            --arg mint_auth "$MINT_AUTH_TX" \
            --arg freeze_auth "$FREEZE_AUTH_TX" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_url "$RUN_URL" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.canonical_mint = $mint
             | .creation_transaction = $creation
             | .metadata_transaction = $metadata
             | .token_account_creation_transaction = $account
             | .mint_transaction = $mint_tx
             | .authority_revocation_transaction = $mint_auth
             | .freeze_authority_revocation_transaction = $freeze_auth
             | .status = "FULLY_VERIFIED"
             | .verification_run_id = $run_id
             | .verification_run_url = $run_url
             | .verified_at = $verified_at
             | .next_action = "Do not create another mint. Use glorifier-solana-devnet-reconcile.yml for later read-only reconciliation."' \
            solana/canonical-devnet-identity.json > solana/canonical-devnet-identity.tmp.json
          mv solana/canonical-devnet-identity.tmp.json solana/canonical-devnet-identity.json

          jq -e \
            --arg mint "$MINT" \
            --arg creation "$CREATION_TX" \
            --arg mint_tx "$MINT_TX" \
            --arg mint_auth "$MINT_AUTH_TX" \
            --arg freeze_auth "$FREEZE_AUTH_TX" \
            '.status == "FULLY_VERIFIED"
             and .canonical_mint == $mint
             and .creation_transaction == $creation
             and .mint_transaction == $mint_tx
             and .authority_revocation_transaction == $mint_auth
             and .freeze_authority_revocation_transaction == $freeze_auth
             and (.canonical_mint | type == "string" and length >= 32 and length <= 44)
             and (.creation_transaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
             and (.mint_transaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
             and (.authority_revocation_transaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))
             and (.freeze_authority_revocation_transaction | type == "string" and test("^[1-9A-HJ-NP-Za-km-z]{80,96}$"))' \
            solana/canonical-devnet-identity.json >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add solana/canonical-devnet-identity.json solana/deployment-evidence.json solana/deployment-record.json
          git commit -m "chore: record verified Solana Devnet GLR identity"
          git push --set-upstream origin "$BRANCH"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: record verified Solana Devnet GLR canonical mint" \
            --body "Automated canonical identity handoff for successful GLORIFIER Solana Devnet deployment.

Run: ${RUN_URL}

The mint and transaction evidence in this branch was generated and checked by the deployment workflow. Merge this PR to publish the canonical mint in solana/canonical-devnet-identity.json.

Do not create another GLORIFIER mint."
          )"

          echo "Canonical identity PR: ${PR_URL}"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glorifier-solana-devnet-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            solana/deployment-status.txt
            solana/deployment-output.txt
            solana/mint-account.txt
            solana/final-supply.txt
            solana/final-mint-state.txt
            solana/deployment-evidence.json
            solana/deployment-record.json
