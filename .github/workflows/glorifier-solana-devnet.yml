name: GLORIFIER Solana Devnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_GLORIFIER_SOLANA_DEVNET to authorize a new Solana Devnet mint"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy GLORIFIER GLR to Solana Devnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: glorifier-solana-devnet-deploy
      cancel-in-progress: false
    environment: glorifier-solana-devnet
    env:
      SOLANA_RPC_URL: ${{ secrets.GLORIFIER_SOLANA_DEVNET_RPC_URL }}
      AGAVE_VERSION: v4.2.2
      GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_KEYPAIR_JSON }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Validate deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Refusing Solana Devnet deployment: exact confirmation required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.0.2
          spl-token --version

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GLORIFIER_SOLANA_KEYPAIR_JSON}" || {
            echo "::error::Missing GLORIFIER_SOLANA_KEYPAIR_JSON in the glorifier-solana-devnet environment."
            exit 1
          }
          test -n "${SOLANA_RPC_URL}" || {
            echo "::error::Missing GLORIFIER_SOLANA_DEVNET_RPC_URL in the glorifier-solana-devnet environment."
            exit 1
          }
          cat > solana/deployment-status.txt <<'EOF'
STATUS=CONFIGURED
EOF

      - name: Check deployment replay lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RUNS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/glorifier-solana-devnet.yml/runs?event=workflow_dispatch&per_page=100")"
          if jq -e --arg current "${GITHUB_RUN_ID}" '
            any(.workflow_runs[]?;
              ((.id | tostring) != $current) and (.conclusion == "success")
            )
          ' <<<"$RUNS_JSON" >/dev/null; then
            echo "::error::A previous GLORIFIER Solana Devnet deployment workflow already succeeded."
            echo "::error::Use glorifier-solana-devnet-reconcile.yml with the existing mint instead of creating another mint."
            exit 1
          fi

          ARTIFACTS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=glorifier-solana-devnet-evidence&per_page=100")"
          if jq -e --arg current "${GITHUB_RUN_ID}" '
            any(.artifacts[]?;
              (.expired == false) and ((.workflow_run.id // -1 | tostring) != $current)
            )
          ' <<<"$ARTIFACTS_JSON" >/dev/null; then
            echo "::error::Prior Solana Devnet deployment evidence exists."
            echo "::error::Mint creation is locked. Reconcile the recorded/existing mint instead."
            exit 1
          fi

          echo "Replay lock: no prior successful deployment or unexpired deployment evidence found."

      - name: Configure dedicated deployment wallet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          printf '%s' "${GLORIFIER_SOLANA_KEYPAIR_JSON}" > "$HOME/.config/solana/glorifier-devnet-keypair.json"
          chmod 600 "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana config set --url "${SOLANA_RPC_URL}" --keypair "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana address

      - name: Verify Devnet RPC and funding
        shell: bash
        run: |
          set -euo pipefail
          RPC_URL="$(solana config get | awk -F': ' '/RPC URL/ {print $2}')"
          test "$RPC_URL" = "https://api.devnet.solana.com" || {
            echo "::error::Refusing deployment: configured RPC is not canonical Solana Devnet: $RPC_URL"
            exit 1
          }
          solana cluster-version
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          test "${BALANCE:-0}" -gt 0 || {
            echo "::error::Deployment wallet has no SOL for Devnet fees."
            exit 1
          }

      - name: Deploy Token-2022 GLORIFIER
        shell: bash
        run: |
          set -euo pipefail
          chmod +x solana/deploy-token2022-devnet.sh
          solana config set --commitment confirmed
          ./solana/deploy-token2022-devnet.sh | tee solana/deployment-output.txt

      - name: Verify final mint state
        shell: bash
        run: |
          set -euo pipefail
          readonly TOKEN_2022_PROGRAM="TokenzQdBNbLqP5VEhdkAS6EPFLC1PH"
          MINT="$(grep -E '^MINT=' solana/deployment-output.txt | tail -n1 | cut -d= -f2)"
          [[ "$MINT" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]] || {
            echo "::error::Deployment script returned an invalid Solana mint address."
            exit 1
          }
          echo "MINT=$MINT"

          spl-token --program-2022 supply "$MINT" | tee solana/final-supply.txt
          spl-token --program-2022 display "$MINT" | tee solana/final-mint-state.txt
          solana account "$MINT" | tee solana/mint-account.txt

          ACTUAL_SUPPLY="$(awk 'NR==1 {print $1}' solana/final-supply.txt | tr -d '\r')"
          test "$ACTUAL_SUPPLY" = "1000000000"

          grep -Fq "Owner: $TOKEN_2022_PROGRAM" solana/mint-account.txt
          grep -Eiq '^[[:space:]]*Name:[[:space:]]*GLORIFIER[[:space:]]*          grep -Eiq 'Mint[[:space:]]+Authority.*None' solana/final-mint-state.txt
          grep -Eiq 'Freeze[[:space:]]+Authority.*None' solana/final-mint-state.txt

          test -s solana/deployment-evidence.json
          jq -e --arg mint "$MINT" --arg program "$TOKEN_2022_PROGRAM" '
            .status == "READY_FOR_VERIFICATION"
            and .network == "solana-devnet"
            and .mint == $mint
            and .programId == $program
            and .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .mintAuthority == null
            and .freezeAuthority == null
          ' solana/deployment-evidence.json >/dev/null

          jq             --arg run_id "${GITHUB_RUN_ID}"             --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '.status = "FULLY_VERIFIED" |
             .verification = {
               "runId": $run_id,
               "runUrl": $run_url,
               "verifiedAt": $verified_at
             }'             solana/deployment-evidence.json > solana/deployment-evidence.tmp.json
          mv solana/deployment-evidence.tmp.json solana/deployment-evidence.json

          cp solana/deployment-evidence.json solana/deployment-record.json
          echo "GLR_STATUS=FULLY_VERIFIED" | tee solana/deployment-status.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glorifier-solana-devnet-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            solana/deployment-status.txt
            solana/deployment-output.txt
            solana/mint-account.txt
            solana/final-supply.txt
            solana/final-mint-state.txt
            solana/deployment-evidence.json
            solana/deployment-record.json
 solana/final-mint-state.txt
          grep -Eiq '^[[:space:]]*Symbol:[[:space:]]*GLR[[:space:]]*          grep -Eiq 'Mint[[:space:]]+Authority.*None' solana/final-mint-state.txt
          grep -Eiq 'Freeze[[:space:]]+Authority.*None' solana/final-mint-state.txt

          test -s solana/deployment-evidence.json
          jq -e --arg mint "$MINT" --arg program "$TOKEN_2022_PROGRAM" '
            .status == "READY_FOR_VERIFICATION"
            and .network == "solana-devnet"
            and .mint == $mint
            and .programId == $program
            and .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .mintAuthority == null
            and .freezeAuthority == null
          ' solana/deployment-evidence.json >/dev/null

          jq             --arg run_id "${GITHUB_RUN_ID}"             --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '.status = "FULLY_VERIFIED" |
             .verification = {
               "runId": $run_id,
               "runUrl": $run_url,
               "verifiedAt": $verified_at
             }'             solana/deployment-evidence.json > solana/deployment-evidence.tmp.json
          mv solana/deployment-evidence.tmp.json solana/deployment-evidence.json

          cp solana/deployment-evidence.json solana/deployment-record.json
          echo "GLR_STATUS=FULLY_VERIFIED" | tee solana/deployment-status.txt

