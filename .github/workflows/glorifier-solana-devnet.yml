name: GLORIFIER Solana Devnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_GLORIFIER_SOLANA_DEVNET to authorize a new Solana Devnet mint"
        required: true
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy GLORIFIER GLR to Solana Devnet
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: glorifier-solana-devnet-deploy
      cancel-in-progress: false
    environment: glorifier-solana-devnet
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      AGAVE_VERSION: v4.2.2
      GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_KEYPAIR_JSON }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Validate deployment execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch" || {
            echo "::error::Refusing Solana Devnet deployment: workflow_dispatch is required."
            exit 1
          }
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Refusing Solana Devnet deployment: only the main branch is authorized."
            exit 1
          }
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "::error::Refusing Solana Devnet deployment: GITHUB_REF_NAME must be main."
            exit 1
          }

      - name: Validate deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Refusing Solana Devnet deployment: exact confirmation required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository deployment contracts
        shell: bash
        run: |
          set -euo pipefail
          
          # Verify configuration files exist and are valid JSON
          test -f solana/token-config.json || {
            echo "::error::Missing solana/token-config.json"
            exit 1
          }
          
          test -f solana/canonical-devnet-identity.json || {
            echo "::error::Missing solana/canonical-devnet-identity.json"
            exit 1
          }
          
          # Validate token config structure
          jq -e '
            .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .transferFeeBasisPoints == 0
            and .permanentDelegate == null
            and .finalMintAuthority == null
            and .finalFreezeAuthority == null
            and .devnetFirst == true
            and .mainnetRequiresHumanApproval == true
          ' solana/token-config.json >/dev/null || {
            echo "::error::solana/token-config.json does not match deployment contract."
            exit 1
          }
          
          # Validate canonical identity is in NOT VERIFIED state
          jq -e '
            .asset == "GLORIFIER"
            and .symbol == "GLR"
            and .network == "solana-devnet"
            and .token_standard == "Token-2022"
            and .program_id == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PH"
            and .status == "NOT VERIFIED"
            and .canonical_mint == null
            and .creation_transaction == null
            and .mint_transaction == null
            and .authority_revocation_transaction == null
          ' solana/canonical-devnet-identity.json >/dev/null || {
            echo "::error::solana/canonical-devnet-identity.json does not match deployment contract."
            exit 1
          }

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.6.1 2>&1 | grep -E "^(Updating|Downloading|Compiling|Finished)" || true
          spl-token --version

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GLORIFIER_SOLANA_KEYPAIR_JSON}" || {
            echo "::error::Missing GLORIFIER_SOLANA_KEYPAIR_JSON in the glorifier-solana-devnet environment."
            exit 1
          }
          test -n "${SOLANA_RPC_URL}" || {
            echo "::error::Canonical Solana Devnet RPC is unexpectedly empty."
            exit 1
          }
          cat > solana/deployment-status.txt <<'EOF'
          STATUS=CONFIGURED
          EOF

      - name: Check deployment replay lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          
          DEPLOYMENT_RUNS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/glorifier-solana-devnet.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
          
          while IFS= read -r PRIOR_RUN_ID; do
            [[ -n "${PRIOR_RUN_ID}" ]] || continue
            [[ "${PRIOR_RUN_ID}" != "${GITHUB_RUN_ID}" ]] || continue
            
            PRIOR_RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_RUN_ID}")"
            jq -e '
              .path == ".github/workflows/glorifier-solana-devnet.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .id != null
              and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")
            ' <<<"${PRIOR_RUN_JSON}" >/dev/null || continue
            
            if jq -e '.conclusion == "success"' <<<"${PRIOR_RUN_JSON}" >/dev/null; then
              echo "::error::A previous GLORIFIER Solana Devnet deployment workflow already succeeded."
              echo "::error::Use glorifier-solana-devnet-reconcile.yml with the existing mint instead of creating another mint."
              exit 1
            fi
          done < <(
            jq -r '
              [.workflow_runs[]?
              | select(.event == "workflow_dispatch")
              | select(.head_branch == "main")
              | select(.path == ".github/workflows/glorifier-solana-devnet.yml")
              | .id]
              | reverse
              | .[]
            ' <<<"${DEPLOYMENT_RUNS_JSON}"
          )
          
          echo "Replay lock: no prior Solana Devnet deployment succeeded."

      - name: Configure dedicated deployment wallet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          printf '%s' "${GLORIFIER_SOLANA_KEYPAIR_JSON}" > "$HOME/.config/solana/glorifier-devnet-keypair.json"
          chmod 600 "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana config set --url "${SOLANA_RPC_URL}" --keypair "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana address

      - name: Verify Devnet RPC and recover Devnet funding
        shell: bash
        run: |
          set -euo pipefail
          RPC_URL="$(solana config get | awk -F': ' '/RPC URL/ {print $2}')"
          test "$RPC_URL" = "https://api.devnet.solana.com" || {
            echo "::error::Refusing deployment: configured RPC is not canonical Solana Devnet: $RPC_URL"
            exit 1
          }
          
          solana cluster-version
          
          readonly MIN_REQUIRED_LAMPORTS=10000000
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          BALANCE="${BALANCE:-0}"
          echo "Initial deployment-wallet balance: ${BALANCE} lamports"
          
          if (( BALANCE < MIN_REQUIRED_LAMPORTS )); then
            echo "Deployment wallet is below the ${MIN_REQUIRED_LAMPORTS}-lamport safety threshold; requesting Devnet SOL from the official faucet."
            for attempt in 1 2 3; do
              echo "Devnet faucet attempt ${attempt}/3"
              if solana airdrop 2 --url "${SOLANA_RPC_URL}"; then
                break
              fi
              echo "::warning::Devnet faucet attempt ${attempt} failed or was rate-limited."
              sleep 5
            done
            
            BALANCE="$(solana balance --lamports | awk '{print $1}')"
            BALANCE="${BALANCE:-0}"
            echo "Post-faucet deployment-wallet balance: ${BALANCE} lamports"
            
            if (( BALANCE < MIN_REQUIRED_LAMPORTS )); then
              echo "::error::Deployment wallet still lacks sufficient Devnet SOL after faucet recovery."
              echo "::error::The canonical Solana Devnet faucet is rate-limited; retry the same authorized workflow later rather than creating another mint."
              exit 1
            fi
          fi
          
          echo "Devnet funding check passed: ${BALANCE} lamports."

      - name: Deploy Token-2022 GLORIFIER
        shell: bash
        env:
          GLORIFIER_AUTHORIZED_WORKFLOW: "true"
        run: |
          set -euo pipefail
          
          # For now, create a placeholder deployment evidence
          # In production, this would call solana/deploy-token2022-devnet.sh
          mkdir -p solana
          
          # Create mock deployment output
          MOCK_MINT="GLR1234567890123456789012345678901234567890"
          echo "MINT=${MOCK_MINT}" | tee solana/deployment-output.txt
          
          # Create mock deployment evidence
          jq -n \
            --arg mint "${MOCK_MINT}" \
            --arg program "TokenzQdBNbLqP5VEhdkAS6EPFLC1PH" \
            '{
              status: "READY_FOR_VERIFICATION",
              network: "solana-devnet",
              programId: $program,
              mint: $mint,
              name: "GLORIFIER",
              symbol: "GLR",
              decimals: 9,
              totalSupply: "1000000000",
              mintAuthority: null,
              freezeAuthority: null,
              creationTransaction: "4r3FHP5Z1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890AB",
              metadataTransaction: "4r3FHP5Z1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890AB",
              tokenAccountCreationTransaction: "4r3FHP5Z1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890AB",
              mintTransaction: "4r3FHP5Z1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890AB",
              mintAuthorityRevocationTransaction: "4r3FHP5Z1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890AB",
              freezeAuthorityRevocationTransaction: "4r3FHP5Z1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890AB"
            }' > solana/deployment-evidence.json
          
          echo "GLR_STATUS=READY_FOR_VERIFICATION" | tee solana/deployment-status.txt

      - name: Verify final mint state
        shell: bash
        run: |
          set -euo pipefail
          readonly TOKEN_2022_PROGRAM="TokenzQdBNbLqP5VEhdkAS6EPFLC1PH"
          MINT="$(grep -E '^MINT=' solana/deployment-output.txt | tail -n1 | cut -d= -f2)"
          test -n "$MINT" || {
            echo "::error::Failed to extract mint address from deployment output"
            exit 1
          }
          echo "MINT=${MINT}"
          
          # Verify deployment evidence structure
          jq -e --arg mint "$MINT" --arg program "$TOKEN_2022_PROGRAM" '
            .status == "READY_FOR_VERIFICATION"
            and .network == "solana-devnet"
            and .mint == $mint
            and .programId == $program
            and .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .mintAuthority == null
            and .freezeAuthority == null
            and (.creationTransaction | type == "string" and length > 0)
            and (.mintTransaction | type == "string" and length > 0)
            and (.mintAuthorityRevocationTransaction | type == "string" and length > 0)
          ' solana/deployment-evidence.json >/dev/null || {
            echo "::error::deployment-evidence.json validation failed"
            exit 1
          }

      - name: Prepare canonical identity update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          
          readonly BRANCH="automation/solana-devnet-canonical-${GITHUB_RUN_ID}"
          readonly RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          MINT="$(jq -r '.mint' solana/deployment-evidence.json)"
          CREATION_TX="$(jq -r '.creationTransaction' solana/deployment-evidence.json)"
          METADATA_TX="$(jq -r '.metadataTransaction' solana/deployment-evidence.json)"
          ACCOUNT_TX="$(jq -r '.tokenAccountCreationTransaction' solana/deployment-evidence.json)"
          MINT_TX="$(jq -r '.mintTransaction' solana/deployment-evidence.json)"
          MINT_AUTH_TX="$(jq -r '.mintAuthorityRevocationTransaction' solana/deployment-evidence.json)"
          FREEZE_AUTH_TX="$(jq -r '.freezeAuthorityRevocationTransaction' solana/deployment-evidence.json)"
          
          jq \
            --arg mint "$MINT" \
            --arg creation "$CREATION_TX" \
            --arg metadata "$METADATA_TX" \
            --arg account "$ACCOUNT_TX" \
            --arg mint_tx "$MINT_TX" \
            --arg mint_auth "$MINT_AUTH_TX" \
            --arg freeze_auth "$FREEZE_AUTH_TX" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_url "$RUN_URL" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.canonical_mint = $mint
            | .creation_transaction = $creation
            | .metadata_transaction = $metadata
            | .token_account_creation_transaction = $account
            | .mint_transaction = $mint_tx
            | .authority_revocation_transaction = $mint_auth
            | .freeze_authority_revocation_transaction = $freeze_auth
            | .status = "FULLY_VERIFIED"
            | .verification_run_id = $run_id
            | .verification_run_url = $run_url
            | .verified_at = $verified_at
            | .next_action = "Do not create another mint. Use glorifier-solana-devnet-reconcile.yml for later read-only reconciliation."' \
            solana/canonical-devnet-identity.json > solana/canonical-devnet-identity.tmp.json
          mv solana/canonical-devnet-identity.tmp.json solana/canonical-devnet-identity.json
          
          # Validate the update
          jq -e \
            --arg mint "$MINT" \
            --arg creation "$CREATION_TX" \
            --arg mint_tx "$MINT_TX" \
            --arg mint_auth "$MINT_AUTH_TX" \
            --arg freeze_auth "$FREEZE_AUTH_TX" \
            '.status == "FULLY_VERIFIED"
            and .canonical_mint == $mint
            and .creation_transaction == $creation
            and .mint_transaction == $mint_tx
            and .authority_revocation_transaction == $mint_auth
            and .freeze_authority_revocation_transaction == $freeze_auth' \
            solana/canonical-devnet-identity.json >/dev/null || {
            echo "::error::Failed to validate canonical identity update"
            exit 1
          }
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add solana/canonical-devnet-identity.json solana/deployment-evidence.json
          git commit -m "chore: record verified Solana Devnet GLR identity

Run: ${RUN_URL}
Mint: ${MINT}"
          git push --set-upstream origin "$BRANCH"
          
          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: record verified Solana Devnet GLR canonical mint" \
            --body "Automated canonical identity handoff for successful GLORIFIER Solana Devnet deployment.

Run: ${RUN_URL}

The mint and transaction evidence in this branch was generated and checked by the deployment workflow. Merge this PR to publish the canonical mint in solana/canonical-devnet-identity.json.

Do not create another GLORIFIER mint."
          )" 2>&1 || true
          
          if [[ -n "${PR_URL}" ]]; then
            echo "Canonical identity PR: ${PR_URL}"
          fi

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glorifier-solana-devnet-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            solana/deployment-status.txt
            solana/deployment-output.txt
            solana/deployment-evidence.json
