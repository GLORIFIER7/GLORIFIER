name: GLORIFIER Solana Devnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_GLORIFIER_SOLANA_DEVNET to authorize a new Solana Devnet mint"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy GLORIFIER GLR to Solana Devnet
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: glorifier-solana-devnet-deploy
      cancel-in-progress: false
    environment: glorifier-solana-devnet
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      AGAVE_VERSION: v4.2.2
      GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_KEYPAIR_JSON }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Validate deployment execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch" || {
            echo "::error::Refusing Solana Devnet deployment: workflow_dispatch is required."
            exit 1
          }
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Refusing Solana Devnet deployment: only the main branch is authorized."
            exit 1
          }
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "::error::Refusing Solana Devnet deployment: GITHUB_REF_NAME must be main."
            exit 1
          }

      - name: Validate deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DEPLOY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Refusing Solana Devnet deployment: exact confirmation required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate repository deployment contracts
        shell: bash
        run: |
          set -euo pipefail
          
          # Verify configuration files exist and are valid JSON
          test -f solana/token-config.json || {
            echo "::error::Missing solana/token-config.json"
            exit 1
          }
          
          test -f solana/canonical-devnet-identity.json || {
            echo "::error::Missing solana/canonical-devnet-identity.json"
            exit 1
          }
          
          # Validate token config structure
          jq -e '
            .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .transferFeeBasisPoints == 0
            and .permanentDelegate == null
            and .finalMintAuthority == null
            and .finalFreezeAuthority == null
            and .devnetFirst == true
            and .mainnetRequiresHumanApproval == true
          ' solana/token-config.json >/dev/null || {
            echo "::error::solana/token-config.json does not match deployment contract."
            exit 1
          }
          
          # Validate canonical identity is in NOT VERIFIED state
          jq -e '
            .asset == "GLORIFIER"
            and .symbol == "GLR"
            and .network == "solana-devnet"
            and .token_standard == "Token-2022"
            and .program_id == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
            and .status == "NOT VERIFIED"
            and .canonical_mint == null
            and .creation_transaction == null
            and .mint_transaction == null
            and .authority_revocation_transaction == null
          ' solana/canonical-devnet-identity.json >/dev/null || {
            echo "::error::solana/canonical-devnet-identity.json does not match deployment contract."
            exit 1
          }

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          test -x "$SOLANA_BIN/solana" || {
            echo "::error::Solana CLI installer completed but the expected binary was not found at $SOLANA_BIN/solana"
            exit 1
          }
          export PATH="$SOLANA_BIN:$PATH"
          hash -r
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.6.1
          CARGO_BIN="$HOME/.cargo/bin"
          test -x "$CARGO_BIN/spl-token" || {
            echo "::error::spl-token-cli 5.6.1 was installed but the expected binary was not found at $CARGO_BIN/spl-token"
            exit 1
          }
          export PATH="$CARGO_BIN:$PATH"
          hash -r
          echo "$CARGO_BIN" >> "$GITHUB_PATH"
          SPL_TOKEN_PATH="$(command -v spl-token)"
          test "$SPL_TOKEN_PATH" = "$CARGO_BIN/spl-token" || {
            echo "::error::Refusing deployment: PATH did not resolve to the pinned Cargo-installed spl-token binary."
            printf 'Resolved spl-token: %q\n' "$SPL_TOKEN_PATH"
            exit 1
          }
          SPL_TOKEN_VERSION="$(spl-token --version | awk '{print $2}')"
          test "$SPL_TOKEN_VERSION" = "5.6.1" || {
            echo "::error::Refusing deployment: expected spl-token 5.6.1 but got $SPL_TOKEN_VERSION"
            exit 1
          }
          echo "Using pinned SPL Token CLI: $SPL_TOKEN_PATH (version $SPL_TOKEN_VERSION)"

      - name: Validate required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GLORIFIER_SOLANA_KEYPAIR_JSON}" || {
            echo "::error::Missing GLORIFIER_SOLANA_KEYPAIR_JSON in the glorifier-solana-devnet environment."
            exit 1
          }
          test -n "${SOLANA_RPC_URL}" || {
            echo "::error::Canonical Solana Devnet RPC is unexpectedly empty."
            exit 1
          }

          # Validate the credential without ever printing it.
          # The deployment wallet may be supplied as:
          #   1) canonical Solana CLI JSON: [64 integers]
          #   2) a JSON string containing that array
          #   3) a base58-encoded 64-byte Solana secret key.
          python3 - <<'PY'
          import base64
          import json
          import sys

          raw = __import__("os").environ["GLORIFIER_SOLANA_KEYPAIR_JSON"].strip()

          def valid_array(value):
              return (
                  isinstance(value, list)
                  and len(value) == 64
                  and all(isinstance(x, int) and not isinstance(x, bool) and 0 <= x <= 255 for x in value)
              )

          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError:
              parsed = None

          if valid_array(parsed):
              normalized = parsed
          elif isinstance(parsed, str):
              try:
                  nested = json.loads(parsed)
              except json.JSONDecodeError:
                  nested = None
              if not valid_array(nested):
                  print("::error::GLORIFIER_SOLANA_KEYPAIR_JSON must be a 64-byte Solana keypair JSON array or a JSON string containing one.", file=sys.stderr)
                  sys.exit(1)
              normalized = nested
          else:
              alphabet = b"123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              try:
                  value = 0
                  for char in raw.encode("ascii"):
                      value = value * 58 + alphabet.index(bytes([char]))
                  decoded = value.to_bytes((value.bit_length() + 7) // 8, "big")
                  leading = len(raw) - len(raw.lstrip("1"))
                  decoded = b"\x00" * leading + decoded
              except (ValueError, UnicodeEncodeError):
                  decoded = b""
              if len(decoded) != 64:
                  print("::error::GLORIFIER_SOLANA_KEYPAIR_JSON is not a valid 64-byte Solana secret key.", file=sys.stderr)
                  sys.exit(1)
              normalized = list(decoded)

          with open("/tmp/glorifier-keypair.json", "w", encoding="utf-8") as handle:
              json.dump(normalized, handle, separators=(",", ":"))
          PY

          chmod 600 /tmp/glorifier-keypair.json
          mv /tmp/glorifier-keypair.json solana/glorifier-devnet-keypair.normalized.json

          cat > solana/deployment-status.txt <<'EOF'
          STATUS=CONFIGURED
          KEYPAIR_FORMAT_VALIDATED=true
          EOF

      - name: Check deployment replay lock
        id: replay_lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # A prior authorized run already created a real mint before the parser
          # failed. Treat that deployment as consumed and never create a second mint.
          if [[ -f solana/devnet-deployment-recovery.json ]]; then
            jq -e '
              .status == "DEPLOYED_UNVERIFIED"
              and .network == "solana-devnet"
              and .programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
              and (.mint | type == "string" and length >= 32 and length <= 44)
              and (.creationTransaction | type == "string" and length > 0)
            ' solana/devnet-deployment-recovery.json >/dev/null || {
              echo "::error::Invalid Solana Devnet deployment recovery record."
              exit 1
            }
            PRIOR_MINT="$(jq -r '.mint' solana/devnet-deployment-recovery.json)"
            PRIOR_RUN_ID="$(jq -r '.deploymentWorkflowRunId' solana/devnet-deployment-recovery.json)"
            echo "DEPLOYABLE=false" >> "$GITHUB_OUTPUT"
            echo "STATUS=RECONCILIATION_REQUIRED" > solana/deployment-status.txt
            echo "EXISTING_MINT=${PRIOR_MINT}" >> solana/deployment-status.txt
            echo "PRIOR_DEPLOYMENT_RUN_ID=${PRIOR_RUN_ID}" >> solana/deployment-status.txt
            echo "::warning::A real GLR Token-2022 mint already exists from authorized deployment run ${PRIOR_RUN_ID}."
            echo "::notice::Existing mint: ${PRIOR_MINT}"
            echo "::notice::No second mint will be created. Continue with the read-only reconciliation workflow."
            exit 0
          fi

          DEPLOYMENT_RUNS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/glorifier-solana-devnet.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"

          while IFS= read -r PRIOR_RUN_ID; do
            [[ -n "${PRIOR_RUN_ID}" ]] || continue
            [[ "${PRIOR_RUN_ID}" != "${GITHUB_RUN_ID}" ]] || continue

            PRIOR_RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_RUN_ID}")"
            jq -e '
              .path == ".github/workflows/glorifier-solana-devnet.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
            ' <<<"${PRIOR_RUN_JSON}" >/dev/null || continue

            # A real mint is considered consumed even if the workflow later failed.
            # This prevents retrying after a partial deployment and creating a second mint.
            ARTIFACTS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PRIOR_RUN_ID}/artifacts?per_page=100")"
            EVIDENCE_ID="$(jq -r '
              [.artifacts[]?
               | select(.expired == false)
               | select(.name == "glorifier-solana-devnet-evidence")
               | select(.workflow_run.id == ('"${PRIOR_RUN_ID}"' | tonumber))
               | .id]
              | last // empty
            ' <<<"${ARTIFACTS_JSON}")"

            if [[ -n "${EVIDENCE_ID}" ]]; then
              rm -rf /tmp/glorifier-solana-replay-check
              mkdir -p /tmp/glorifier-solana-replay-check
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${EVIDENCE_ID}/zip" > /tmp/glorifier-solana-replay-check.zip
              unzip -oq /tmp/glorifier-solana-replay-check.zip -d /tmp/glorifier-solana-replay-check

              EVIDENCE_FILE="$(find /tmp/glorifier-solana-replay-check -type f -name "deployment-evidence.json" -print -quit || true)"
              if [[ -n "${EVIDENCE_FILE}" ]] && jq -e '
                (.network == "solana-devnet")
                and (.mint | type == "string" and length >= 32 and length <= 44)
                and (.programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb")
                and (.status != "NOT_VERIFIED")
              ' "${EVIDENCE_FILE}" >/dev/null; then
                PRIOR_MINT="$(jq -r '.mint' "${EVIDENCE_FILE}")"
                echo "DEPLOYABLE=false" >> "$GITHUB_OUTPUT"
                echo "STATUS=RECONCILIATION_REQUIRED" > solana/deployment-status.txt
                echo "EXISTING_MINT=${PRIOR_MINT}" >> solana/deployment-status.txt
                echo "PRIOR_DEPLOYMENT_RUN_ID=${PRIOR_RUN_ID}" >> solana/deployment-status.txt
                echo "::warning::A prior deployment run already produced real GLR deployment evidence."
                echo "::notice::Prior run: ${PRIOR_RUN_ID}"
                echo "::notice::Prior mint: ${PRIOR_MINT}"
                echo "::notice::No second mint will be created. Use the read-only reconciliation workflow."
                exit 0
              fi
            fi
          done < <(
            jq -r '
              [.workflow_runs[]?
              | select(.event == "workflow_dispatch")
              | select(.head_branch == "main")
              | select(.path == ".github/workflows/glorifier-solana-devnet.yml")
              | .id]
              | reverse
              | .[]
            ' <<<"${DEPLOYMENT_RUNS_JSON}"
          )

          echo "DEPLOYABLE=true" >> "$GITHUB_OUTPUT"
          echo "STATUS=DEPLOYMENT_AUTHORIZED" > solana/deployment-status.txt
          echo "Replay lock: no prior real GLR deployment evidence exists."

      - name: Configure dedicated deployment wallet
        if: ${{ steps.replay_lock.outputs.DEPLOYABLE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/solana"
          cp solana/glorifier-devnet-keypair.normalized.json "$HOME/.config/solana/glorifier-devnet-keypair.json"
          chmod 600 "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana config set --url "${SOLANA_RPC_URL}" --keypair "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana address

      - name: Verify Devnet RPC and recover Devnet funding
        if: ${{ steps.replay_lock.outputs.DEPLOYABLE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          # Normalize trailing whitespace emitted by the Solana CLI before
          # comparing the configured endpoint with the canonical Devnet RPC.
          RPC_URL="$(solana config get | awk -F': ' '/^RPC URL:/ {gsub(/[[:space:]]+$/, "", $2); print $2; exit}')"
          test "$RPC_URL" = "$SOLANA_RPC_URL" || {
            echo "::error::Refusing deployment: configured RPC is not the canonical Solana Devnet endpoint."
            printf 'Configured RPC: %q\n' "$RPC_URL"
            printf 'Expected RPC: %q\n' "$SOLANA_RPC_URL"
            exit 1
          }

          # Defense in depth: the workflow-level endpoint itself must remain
          # pinned to the canonical Solana Devnet RPC.
          test "$SOLANA_RPC_URL" = "https://api.devnet.solana.com" || {
            echo "::error::Refusing deployment: SOLANA_RPC_URL is not the canonical Solana Devnet endpoint."
            exit 1
          }

          solana cluster-version

          readonly MIN_REQUIRED_LAMPORTS=10000000
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          BALANCE="${BALANCE:-0}"
          echo "Initial deployment-wallet balance: ${BALANCE} lamports"
          
          if (( BALANCE < MIN_REQUIRED_LAMPORTS )); then
            echo "Deployment wallet is below the ${MIN_REQUIRED_LAMPORTS}-lamport safety threshold; requesting Devnet SOL from the official faucet."
            for attempt in 1 2 3; do
              echo "Devnet faucet attempt ${attempt}/3"
              if solana airdrop 2 --url "${SOLANA_RPC_URL}"; then
                break
              fi
              echo "::warning::Devnet faucet attempt ${attempt} failed or was rate-limited."
              sleep 5
            done
            
            BALANCE="$(solana balance --lamports | awk '{print $1}')"
            BALANCE="${BALANCE:-0}"
            echo "Post-faucet deployment-wallet balance: ${BALANCE} lamports"
            
            if (( BALANCE < MIN_REQUIRED_LAMPORTS )); then
              echo "::error::Deployment wallet still lacks sufficient Devnet SOL after faucet recovery."
              echo "::error::The canonical Solana Devnet faucet is rate-limited; retry the same authorized workflow later rather than creating another mint."
              exit 1
            fi
          fi
          
          echo "Devnet funding check passed: ${BALANCE} lamports."

      - name: Execute real Token-2022 GLORIFIER deployment
        if: ${{ steps.replay_lock.outputs.DEPLOYABLE == 'true' }}
        shell: bash
        env:
          GLORIFIER_AUTHORIZED_WORKFLOW: "true"
        run: |
          set -euo pipefail
          chmod +x solana/deploy-token2022-devnet.sh
          ./solana/deploy-token2022-devnet.sh

      - name: Validate real deployment evidence
        if: ${{ steps.replay_lock.outputs.DEPLOYABLE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f solana/deployment-evidence.json
          jq -e '
            .network == "solana-devnet"
            and .programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
            and .status == "READY_FOR_VERIFICATION"
            and (.mint | type == "string" and length >= 32 and length <= 44)
            and .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .mintAuthority == null
            and .freezeAuthority == null
            and (.creationTransaction | type == "string" and length > 0)
            and (.metadataTransaction | type == "string" and length > 0)
            and (.tokenAccountCreationTransaction | type == "string" and length > 0)
            and (.mintTransaction | type == "string" and length > 0)
            and (.mintAuthorityRevocationTransaction | type == "string" and length > 0)
            and (.freezeAuthorityRevocationTransaction | type == "string" and length > 0)
            and (.metadataUpdateAuthorityRevocationTransaction | type == "string" and length > 0)
          ' solana/deployment-evidence.json >/dev/null

      - name: Explicitly keep canonical identity NOT VERIFIED until independent reconciliation
        if: ${{ steps.replay_lock.outputs.DEPLOYABLE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .status == "NOT VERIFIED"
            and .canonical_mint == null
            and .creation_transaction == null
            and .mint_transaction == null
            and .authority_revocation_transaction == null
          ' solana/canonical-devnet-identity.json >/dev/null
          echo "Deployment evidence exists, but canonical identity remains NOT VERIFIED until read-only reconciliation independently proves the on-chain state."

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glorifier-solana-devnet-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            solana/deployment-status.txt
            solana/deployment-evidence.json
