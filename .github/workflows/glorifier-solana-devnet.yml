name: GLORIFIER Solana Devnet Deployment

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_GLORIFIER_SOLANA_DEVNET to authorize a new Solana Devnet mint"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy GLORIFIER GLR to Solana Devnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: glorifier-solana-devnet
    env:
      SOLANA_RPC_URL: ${{ secrets.GLORIFIER_SOLANA_DEVNET_RPC_URL }}
      GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_KEYPAIR_JSON }}
    steps:
      - name: Validate deployment authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "DEPLOY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Refusing Solana Devnet deployment: exact confirmation required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.0.2
          spl-token --version

      - name: Validate required deployment secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GLORIFIER_SOLANA_KEYPAIR_JSON}" ]]; then
            echo "::error::Missing GLORIFIER_SOLANA_KEYPAIR_JSON in the glorifier-solana-devnet environment."
            exit 1
          fi
          cat > solana/deployment-status.txt <<'EOF'
STATUS=CONFIGURED
EOF

      - name: Configure dedicated deployment wallet
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GLORIFIER_SOLANA_KEYPAIR_JSON}" || { echo "Missing GLORIFIER_SOLANA_KEYPAIR_JSON"; exit 1; }
          mkdir -p "$HOME/.config/solana"
          printf '%s' "${GLORIFIER_SOLANA_KEYPAIR_JSON}" > "$HOME/.config/solana/glorifier-devnet-keypair.json"
          chmod 600 "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana config set --url "${SOLANA_RPC_URL:-https://api.devnet.solana.com}" --keypair "$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana address

      - name: Verify Devnet RPC and funding
        shell: bash
        run: |
          set -euo pipefail
          RPC_URL="$(solana config get | awk -F': ' '/RPC URL/ {print $2}')"
          test "$RPC_URL" = "https://api.devnet.solana.com" || {
            echo "::error::Refusing deployment: configured RPC is not canonical Solana Devnet: $RPC_URL"
            exit 1
          }
          solana cluster-version
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          test "${BALANCE:-0}" -gt 0 || {
            echo "::error::Deployment wallet has no SOL for Devnet fees."
            exit 1
          }

      - name: Deploy Token-2022 GLORIFIER
        shell: bash
        run: |
          set -euo pipefail
          chmod +x solana/deploy-token2022-devnet.sh
          solana config set --commitment confirmed
          ./solana/deploy-token2022-devnet.sh | tee solana/deployment-output.txt

      - name: Verify final mint state
        shell: bash
        run: |
          set -euo pipefail
          MINT="$(grep -E '^MINT=' solana/deployment-output.txt | tail -n1 | cut -d= -f2)"
          test -n "$MINT"
          echo "MINT=$MINT"
          spl-token --program-2022 supply "$MINT" | tee solana/final-supply.txt
          spl-token --program-2022 display "$MINT" | tee solana/final-mint-state.txt
          ACTUAL_SUPPLY="$(awk 'NR==1 {print $1}' solana/final-supply.txt | tr -d '\r')"
          test "$ACTUAL_SUPPLY" = "1000000000"
          grep -q 'GLORIFIER' solana/final-mint-state.txt
          grep -q 'GLR' solana/final-mint-state.txt
          grep -Eiq 'Mint[[:space:]]+Authority.*None' solana/final-mint-state.txt
          grep -Eiq 'Freeze[[:space:]]+Authority.*None' solana/final-mint-state.txt
          test -s solana/deployment-evidence.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-solana-devnet-evidence
          if-no-files-found: warn
          path: |
            solana/deployment-status.txt
            solana/deployment-output.txt
            solana/final-supply.txt
            solana/final-mint-state.txt
            solana/deployment-evidence.json
