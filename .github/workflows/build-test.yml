name: GLORIFIER Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Architecture tests
        run: npm run test:architecture
      - name: Interoperability policy tests
        run: npm run test:interoperability-evidence-policy
      - name: AI provider council routing tests
        run: npm run test:ai-council-routing
