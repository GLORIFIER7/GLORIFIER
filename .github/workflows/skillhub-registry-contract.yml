name: SkillHub Registry Contract

on:
  push:
    branches: ["**"]
    paths:
      - "src/lib/skillhub-registry.ts"
      - "src/lib/skillhub-registry.test.ts"
      - "config/skillhub-registry-policy.json"
      - "docs/architecture/skillhub-governed-registry.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/skillhub-registry-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/lib/skillhub-registry.ts"
      - "src/lib/skillhub-registry.test.ts"
      - "config/skillhub-registry-policy.json"
      - "docs/architecture/skillhub-governed-registry.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/skillhub-registry-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillhub-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Skill package and governance contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run SkillHub governance contract tests
        run: npm run test:skillhub-registry
      - name: Run TypeScript type check
        run: npm run lint
