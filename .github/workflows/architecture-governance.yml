name: Architecture Governance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/architecture-governance.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'config/**'
      - 'docs/**'
      - '.github/workflows/architecture-governance.yml'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - name: Validate architecture policy JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('config/glorifier-service-ownership.json','utf8')); JSON.parse(require('fs').readFileSync('config/glorifier-capabilities.json','utf8')); console.log('Architecture policy JSON valid')"
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
