name: GLORIFIER Mediator Expansion Monitor

on:
  workflow_dispatch:
  schedule:
    # Reduced from every 15 minutes to every 6 hours to conserve Neon free-tier quota.
    # Manual dispatch remains available for urgent runs.
    - cron: "37 */6 * * *"

permissions:
  contents: read

concurrency:
  group: glorifier-mediator-expansion
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Require the mediator database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::DATABASE_URL is unavailable. Mediator expansion did not execute; configure the repository secret before retrying."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Refresh mediator registry snapshot
        run: ./node_modules/.bin/tsx scripts/run-mediator-expansion.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
