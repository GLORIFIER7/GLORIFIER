name: GLORIFIER Solana Devnet Resume Existing Mint

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESUME_GLORIFIER_SOLANA_DEVNET to authorize completion of the existing recovered mint"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resume:
    name: Complete recovered GLORIFIER GLR Devnet mint
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: glorifier-solana-devnet-resume
      cancel-in-progress: false
    environment: glorifier-solana-devnet
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      AGAVE_VERSION: v4.2.2
      CONFIRMATION: ${{ inputs.confirm }}
      GLORIFIER_RESUME_AUTHORIZED_WORKFLOW: "true"

    steps:
      - name: Validate resume execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$CONFIRMATION" = "RESUME_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Exact resume authorization is required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve immutable recovery identity
        shell: bash
        run: |
          set -euo pipefail
          test -f solana/devnet-deployment-recovery.json || {
            echo "::error::Missing immutable Devnet deployment recovery record."
            exit 1
          }

          MINT="$(jq -r '.mint // empty' solana/devnet-deployment-recovery.json)"
          DEPLOYMENT_RUN_ID="$(jq -r '.deploymentWorkflowRunId // empty' solana/devnet-deployment-recovery.json)"

          jq -e --arg mint "$MINT" --arg run_id "$DEPLOYMENT_RUN_ID" '
            .status=="DEPLOYED_UNVERIFIED"
            and .network=="solana-devnet"
            and .programId=="TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
            and (.mint | type=="string" and test("^[1-9A-HJ-NP-Za-km-z]{32,44}$"))
            and .mint==$mint
            and (.deploymentWorkflowRunId | type=="string" and length>0)
            and .deploymentWorkflowRunId==$run_id
            and (.creationTransaction | type=="string" and length>0)
          ' solana/devnet-deployment-recovery.json >/dev/null || {
            echo "::error::Immutable recovery record failed provenance validation."
            exit 1
          }

          [[ "$MINT" != "FrJhrVGjNRiB1eZpg5PTqLp9VSQS5rpwMp7jxNtEmV9G" ]] || {
            echo "::error::Recovered mint is explicitly excluded from GLR canonicalization."
            exit 1
          }

          {
            echo "MINT=$MINT"
            echo "RECOVERED_DEPLOYMENT_RUN_ID=$DEPLOYMENT_RUN_ID"
          } >> "$GITHUB_ENV"

          echo "Recovered existing GLR mint from immutable deployment provenance."
          echo "Deployment run: $DEPLOYMENT_RUN_ID"

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          sh -c "$(curl -sSfL "https://release.anza.xyz/$AGAVE_VERSION/install")"
          test -x "$SOLANA_BIN/solana"
          export PATH="$SOLANA_BIN:$PATH"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.6.1
          test "$(spl-token --version | awk '{print $2}')" = "5.6.1"

      - name: Validate and configure deployment wallet
        env:
          GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_KEYPAIR_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GLORIFIER_SOLANA_KEYPAIR_JSON" || {
            echo "::error::Missing GLORIFIER_SOLANA_KEYPAIR_JSON in the glorifier-solana-devnet environment."
            exit 1
          }

          # Accept canonical 64-byte JSON, a JSON string containing it, or base58 64-byte secret.
          # Never print secret material.
          python3 - <<'PY'
          import json, os, sys
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          raw = os.environ["GLORIFIER_SOLANA_KEYPAIR_JSON"].strip()

          def valid_array(value):
              return (isinstance(value, list) and len(value) == 64 and
                      all(isinstance(x, int) and not isinstance(x, bool) and 0 <= x <= 255 for x in value))

          def decode_base58(value):
              if not value: return None
              try:
                  n = 0
                  for ch in value: n = n * 58 + alphabet.index(ch)
              except (ValueError, UnicodeEncodeError):
                  return None
              decoded = b'' if n == 0 else n.to_bytes((n.bit_length() + 7) // 8, 'big')
              decoded = (b'\x00' * (len(value) - len(value.lstrip('1')))) + decoded
              return decoded if len(decoded) == 64 else None

          try: value = json.loads(raw)
          except json.JSONDecodeError: value = None
          if isinstance(value, str):
              try: value = json.loads(value)
              except json.JSONDecodeError: value = None
          if valid_array(value): normalized = value
          else:
              decoded = decode_base58(raw)
              if decoded is None:
                  print("::error::GLORIFIER_SOLANA_KEYPAIR_JSON must be a 64-byte JSON keypair, a JSON string containing one, or base58 encoding of exactly 64 secret-key bytes.", file=sys.stderr)
                  sys.exit(1)
              normalized = list(decoded)

          path = os.path.expanduser("~/.config/solana/glorifier-devnet-keypair.json")
          os.makedirs(os.path.dirname(path), exist_ok=True)
          with open(path, 'w', encoding='utf-8') as handle: json.dump(normalized, handle, separators=(',', ':'))
          os.chmod(path, 0o600)
          PY

          KEYPAIR="$HOME/.config/solana/glorifier-devnet-keypair.json"
          test -s "$KEYPAIR"
          chmod 600 "$KEYPAIR"
          solana config set --url "$SOLANA_RPC_URL" --keypair "$KEYPAIR"
          test "$(solana config get | grep "^RPC URL:" | sed "s/^RPC URL:[[:space:]]*//")" = "$SOLANA_RPC_URL"
          # Resolve the signer explicitly from the normalized keypair instead of
          # relying on ambient CLI signer state. This keeps resume deterministic and
          # makes malformed/incompatible keypair failures observable.
          KEYPAIR_ERROR_FILE="$(mktemp)"
          if ! ADDRESS="$(solana-keygen pubkey "$KEYPAIR" 2>"$KEYPAIR_ERROR_FILE")"; then
            echo "::error::Normalized Solana keypair could not be decoded by solana-keygen."
            sed -n '1,8p' "$KEYPAIR_ERROR_FILE" >&2 || true
            rm -f "$KEYPAIR_ERROR_FILE"
            exit 1
          fi
          rm -f "$KEYPAIR_ERROR_FILE"
          test -n "$ADDRESS"
          printf '%s' "$ADDRESS" | grep -Eq '^[1-9A-HJ-NP-Za-km-z]{32,44}
      - name: Verify Devnet funding for completion
        shell: bash
        run: |
          set -euo pipefail
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          BALANCE="${BALANCE:-0}"
          if (( BALANCE < 10000000 )); then
            echo "Deployment wallet is below the 10,000,000-lamport resume safety threshold; requesting Devnet SOL."
            for attempt in 1 2 3; do
              if solana airdrop 2 --url "$SOLANA_RPC_URL"; then
                break
              fi
              echo "::warning::Devnet faucet attempt ${attempt} failed or was rate-limited."
              sleep 5
            done
            BALANCE="$(solana balance --lamports | awk '{print $1}')"
            BALANCE="${BALANCE:-0}"
          fi
          (( BALANCE >= 10000000 )) || {
            echo "::error::Insufficient Devnet SOL to safely complete the recovered mint."
            echo "::error::Retry the same authorized resume workflow later; do not create another mint."
            exit 1
          }
          echo "Resume funding check passed: ${BALANCE} lamports."

      - name: Restore latest resume evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/glorifier-solana-devnet-resume.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
          while IFS= read -r RUN_ID; do
            [[ -n "$RUN_ID" && "$RUN_ID" != "$GITHUB_RUN_ID" ]] || continue
            ARTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
            ROW="$(jq -r '
              [.artifacts[]?
               | select(.expired==false)
               | select(.name=="glorifier-solana-devnet-resume-evidence")
               | select(.digest!=null and (.digest|startswith("sha256:")))]
              | sort_by(.created_at) | last
              | [(.id//""),(.digest//"")] | @tsv
            ' <<<"$ARTS")"
            AID="${ROW%%$'\t'*}"; DIGEST="${ROW#*$'\t'}"
            if [[ -n "$AID" && -n "$DIGEST" && "$AID" != "$DIGEST" ]]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > /tmp/resume-evidence.zip
              test "sha256:$(sha256sum /tmp/resume-evidence.zip | awk '{print $1}')" = "$DIGEST"
              rm -rf /tmp/resume-evidence && mkdir -p /tmp/resume-evidence
              unzip -oq /tmp/resume-evidence.zip -d /tmp/resume-evidence
              FOUND="$(find /tmp/resume-evidence -type f -name devnet-resume-evidence.json -print -quit || true)"
              if [[ -n "$FOUND" ]] && jq -e --arg mint "$MINT" '.mint==$mint and .network=="solana-devnet"' "$FOUND" >/dev/null; then
                cp "$FOUND" /tmp/prior-resume-evidence.json
                echo "Restored prior resume evidence from run $RUN_ID."
                exit 0
              fi
            fi
          done < <(jq -r '[.workflow_runs[]? | .id] | .[]' <<<"$RUNS_JSON")
          echo "No prior resume evidence found; starting from the recovered create-token state."

      - name: Verify canonical Devnet RPC and recovered mint
        shell: bash
        run: |
          set -euo pipefail
          test "$SOLANA_RPC_URL" = "https://api.devnet.solana.com"
          solana cluster-version
          solana account "$MINT" | grep -Fq "Owner: TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"

      - name: Complete existing Token-2022 mint
        shell: bash
        env:
          GLORIFIER_RESUME_AUTHORIZED_WORKFLOW: "true"
        run: |
          set -euo pipefail
          chmod +x solana/resume-token2022-devnet.sh
          ./solana/resume-token2022-devnet.sh

      - name: Upload resume evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glorifier-solana-devnet-resume-evidence
          retention-days: 3650
          if-no-files-found: warn
          path: |
            solana/devnet-resume-evidence.json
            solana/resume-status.txt
            solana/resume-mint-account.txt
            solana/resume-mint-display.txt
            solana/resume-final-mint-state.txt
 || {
            echo "::error::solana-keygen returned an invalid public-key encoding."
            exit 1
          }
          CONFIGURED_ADDRESS="$(solana address --keypair "$KEYPAIR")"
          test "$CONFIGURED_ADDRESS" = "$ADDRESS" || {
            echo "::error::Configured Solana signer does not match the normalized keypair."
            exit 1
          }
          echo "Resume deployment wallet public key: $ADDRESS"
      - name: Verify Devnet funding for completion
        shell: bash
        run: |
          set -euo pipefail
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          BALANCE="${BALANCE:-0}"
          if (( BALANCE < 10000000 )); then
            echo "Deployment wallet is below the 10,000,000-lamport resume safety threshold; requesting Devnet SOL."
            for attempt in 1 2 3; do
              if solana airdrop 2 --url "$SOLANA_RPC_URL"; then
                break
              fi
              echo "::warning::Devnet faucet attempt ${attempt} failed or was rate-limited."
              sleep 5
            done
            BALANCE="$(solana balance --lamports | awk '{print $1}')"
            BALANCE="${BALANCE:-0}"
          fi
          (( BALANCE >= 10000000 )) || {
            echo "::error::Insufficient Devnet SOL to safely complete the recovered mint."
            echo "::error::Retry the same authorized resume workflow later; do not create another mint."
            exit 1
          }
          echo "Resume funding check passed: ${BALANCE} lamports."

      - name: Restore latest resume evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/glorifier-solana-devnet-resume.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
          while IFS= read -r RUN_ID; do
            [[ -n "$RUN_ID" && "$RUN_ID" != "$GITHUB_RUN_ID" ]] || continue
            ARTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"
            ROW="$(jq -r '
              [.artifacts[]?
               | select(.expired==false)
               | select(.name=="glorifier-solana-devnet-resume-evidence")
               | select(.digest!=null and (.digest|startswith("sha256:")))]
              | sort_by(.created_at) | last
              | [(.id//""),(.digest//"")] | @tsv
            ' <<<"$ARTS")"
            AID="${ROW%%$'\t'*}"; DIGEST="${ROW#*$'\t'}"
            if [[ -n "$AID" && -n "$DIGEST" && "$AID" != "$DIGEST" ]]; then
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > /tmp/resume-evidence.zip
              test "sha256:$(sha256sum /tmp/resume-evidence.zip | awk '{print $1}')" = "$DIGEST"
              rm -rf /tmp/resume-evidence && mkdir -p /tmp/resume-evidence
              unzip -oq /tmp/resume-evidence.zip -d /tmp/resume-evidence
              FOUND="$(find /tmp/resume-evidence -type f -name devnet-resume-evidence.json -print -quit || true)"
              if [[ -n "$FOUND" ]] && jq -e --arg mint "$MINT" '.mint==$mint and .network=="solana-devnet"' "$FOUND" >/dev/null; then
                cp "$FOUND" /tmp/prior-resume-evidence.json
                echo "Restored prior resume evidence from run $RUN_ID."
                exit 0
              fi
            fi
          done < <(jq -r '[.workflow_runs[]? | .id] | .[]' <<<"$RUNS_JSON")
          echo "No prior resume evidence found; starting from the recovered create-token state."

      - name: Verify canonical Devnet RPC and recovered mint
        shell: bash
        run: |
          set -euo pipefail
          test "$SOLANA_RPC_URL" = "https://api.devnet.solana.com"
          solana cluster-version
          solana account "$MINT" | grep -Fq "Owner: TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"

      - name: Complete existing Token-2022 mint
        shell: bash
        env:
          GLORIFIER_RESUME_AUTHORIZED_WORKFLOW: "true"
        run: |
          set -euo pipefail
          chmod +x solana/resume-token2022-devnet.sh
          ./solana/resume-token2022-devnet.sh

      - name: Upload resume evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glorifier-solana-devnet-resume-evidence
          retention-days: 3650
          if-no-files-found: warn
          path: |
            solana/devnet-resume-evidence.json
            solana/resume-status.txt
            solana/resume-mint-account.txt
            solana/resume-mint-display.txt
            solana/resume-final-mint-state.txt
