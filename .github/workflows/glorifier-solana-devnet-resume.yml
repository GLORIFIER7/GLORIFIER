name: GLORIFIER Solana Devnet Resume Existing Mint

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESUME_GLORIFIER_SOLANA_DEVNET to authorize completion of the existing recovered mint"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resume:
    name: Complete recovered GLORIFIER GLR Devnet mint
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: glorifier-solana-devnet-resume
      cancel-in-progress: false
    environment: glorifier-solana-devnet
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      AGAVE_VERSION: v4.2.2
      CONFIRMATION: ${{ inputs.confirm }}
      GLORIFIER_RESUME_AUTHORIZED_WORKFLOW: "true"

    steps:
      - name: Validate authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$CONFIRMATION" = "RESUME_GLORIFIER_SOLANA_DEVNET" || exit 1

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate recovery contract
        shell: bash
        run: |
          set -euo pipefail
          test -f solana/devnet-deployment-recovery.json
          test -f solana/resume-token2022-devnet.sh
          jq -e '.status=="DEPLOYED_UNVERIFIED" and .network=="solana-devnet" and .programId=="TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb" and (.mint|type=="string" and test("^[1-9A-HJ-NP-Za-km-z]{32,44}$")) and (.creationTransaction|type=="string" and length>0) and (.deploymentWorkflowRunId|type=="string" and length>0)' solana/devnet-deployment-recovery.json >/dev/null
          MINT="$(jq -r '.mint' solana/devnet-deployment-recovery.json)"
          test "$MINT" != "FrJhrVGjNRiB1eZpg5PTqLp9VSQS5rpwMp7jxNtEmV9G"
          echo "MINT=$MINT" >> "$GITHUB_ENV"
          bash -n solana/resume-token2022-devnet.sh

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/$AGAVE_VERSION/install")"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/solana-keygen"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          export PATH="$SOLANA_BIN:$PATH"
          solana --version
          solana-keygen --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.6.1
          test -x "$HOME/.cargo/bin/spl-token"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          test "$(spl-token --version | awk '{print $2}')" = "5.6.1"

      - name: Normalize and validate deployment wallet
        env:
          GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_KEYPAIR_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GLORIFIER_SOLANA_KEYPAIR_JSON"
          python3 - <<'PY'
          import json, os, sys
          alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
          raw = os.environ["GLORIFIER_SOLANA_KEYPAIR_JSON"].strip()
          def valid(v):
              return isinstance(v,list) and len(v)==64 and all(isinstance(x,int) and not isinstance(x,bool) and 0<=x<=255 for x in v)
          def b58(v):
              try:
                  n=0
                  for c in v: n=n*58+alphabet.index(c)
                  d=b"" if n==0 else n.to_bytes((n.bit_length()+7)//8,"big")
                  d=b"\0"*(len(v)-len(v.lstrip("1")))+d
                  return d if len(d)==64 else None
              except (ValueError,UnicodeEncodeError):
                  return None
          try: value=json.loads(raw)
          except json.JSONDecodeError: value=None
          if isinstance(value,str):
              try: value=json.loads(value)
              except json.JSONDecodeError: value=None
          if valid(value): normalized=value
          else:
              d=b58(raw)
              if d is None:
                  print("::error::Invalid GLORIFIER_SOLANA_KEYPAIR_JSON",file=sys.stderr)
                  sys.exit(1)
              normalized=list(d)
          path=os.path.expanduser("~/.config/solana/glorifier-devnet-keypair.json")
          os.makedirs(os.path.dirname(path),exist_ok=True)
          with open(path,"w") as f: json.dump(normalized,f,separators=(",",":"))
          os.chmod(path,0o600)
          PY
          KEYPAIR="$HOME/.config/solana/glorifier-devnet-keypair.json"
          solana config set --url "$SOLANA_RPC_URL" --keypair "$KEYPAIR"
          ADDRESS="$(solana-keygen pubkey "$KEYPAIR")"
          test -n "$ADDRESS"
          printf '%s' "$ADDRESS" | grep -Eq '^[1-9A-HJ-NP-Za-km-z]{32,44}$'
          test "$(solana address --keypair "$KEYPAIR")" = "$ADDRESS"
          echo "Resume signer: $ADDRESS"

      - name: Verify Devnet funding and recovered mint
        shell: bash
        run: |
          set -euo pipefail
          test "$SOLANA_RPC_URL" = "https://api.devnet.solana.com"
          solana cluster-version
          BALANCE="$(solana balance --lamports | awk '{print $1}')"
          if [ -z "$BALANCE" ]; then BALANCE=0; fi
          if (( BALANCE < 10000000 )); then
            for attempt in 1 2 3; do
              if solana airdrop 2 --url "$SOLANA_RPC_URL"; then break; fi
              sleep 5
            done
            BALANCE="$(solana balance --lamports | awk '{print $1}')"
            if [ -z "$BALANCE" ]; then BALANCE=0; fi
          fi
          (( BALANCE >= 10000000 )) || { echo "::error::Insufficient Devnet SOL; retry the same authorized resume."; exit 1; }
          solana account "$MINT" | tee solana/resume-mint-account.txt
          grep -Fq "Owner: TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb" solana/resume-mint-account.txt

      - name: Complete existing Token-2022 mint
        env:
          GLORIFIER_RESUME_AUTHORIZED_WORKFLOW: "true"
        shell: bash
        run: |
          set -euo pipefail
          chmod +x solana/resume-token2022-devnet.sh
          ./solana/resume-token2022-devnet.sh

      - name: Validate resume evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f solana/devnet-resume-evidence.json
          jq -e --arg mint "$MINT" '.status=="READY_FOR_VERIFICATION" and .network=="solana-devnet" and .programId=="TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb" and .mint==$mint and .name=="GLORIFIER" and .symbol=="GLR" and .decimals==9 and .totalSupply=="1000000000" and .mintAuthority==null and .freezeAuthority==null and (.creationTransaction|type=="string" and length>0) and (.metadataTransaction|type=="string" and length>0) and (.tokenAccountCreationTransaction|type=="string" and length>0) and (.mintTransaction|type=="string" and length>0) and (.mintAuthorityRevocationTransaction|type=="string" and length>0) and (.freezeAuthorityRevocationTransaction|type=="string" and length>0) and (.metadataUpdateAuthorityRevocationTransaction|type=="string" and length>0)' solana/devnet-resume-evidence.json >/dev/null

      - name: Upload resume evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: glorifier-solana-devnet-resume-evidence
          retention-days: 3650
          if-no-files-found: warn
          path: |
            solana/devnet-resume-evidence.json
            solana/resume-status.txt
            solana/resume-mint-account.txt
            solana/resume-mint-display.txt
            solana/resume-final-mint-state.txt
