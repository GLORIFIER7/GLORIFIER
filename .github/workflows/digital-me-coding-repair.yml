          const oldTest="... ['08000','08001','08003','08004','08006','08007','08P01','57P01','57P02','57P03','57P04','57P05'].map(code=>[code,'ADMISSION_DB_NETWORK_FAILED']),['secret arbitrary code','ADMISSION_DB_WRITE_FAILED']";
          const newTest="... ['08000','08001','08003','08004','08006','08007','57P01','57P02','57P03','57P05'].map(code=>[code,'ADMISSION_DB_NETWORK_FAILED']),['08P01','ADMISSION_DB_WRITE_FAILED'],['57P04','ADMISSION_DB_WRITE_FAILED'],['secret arbitrary code','ADMISSION_DB_WRITE_FAILED']";
