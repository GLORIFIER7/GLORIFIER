           for(const f of manifest.changes){const actual=await api(R+'/contents/'+f.path+'?ref='+head);check(actual.sha===f.after&&actual.path===f.path&&actual.type==='file'&&actual.encoding==='base64'&&blob(Buffer.from(actual.content,'base64'))===f.after);}
           await main();const pr=await api(R+'/pulls','POST',{title:'fix(digital-me): classify PostgreSQL connection outages',head:branch,base:'main',draft:true,body:`Exact owner-command mission: ${mission}\nBase: ${base}\nCandidate digest: ${expected}\nBounded rule; focused regression tests passed. Independent review and protected CI required. No automatic merge. #471 remains open.`});
           const valid=p=>Number.isSafeInteger(p?.number)&&p.number>0&&p.draft===true&&p.state==='open'&&p.user?.login===BOT&&p.base?.ref==='main'&&p.base?.sha===base&&p.base?.repo?.full_name===REPO&&p.head?.ref===branch&&p.head?.sha===head&&p.head?.repo?.full_name===REPO;
