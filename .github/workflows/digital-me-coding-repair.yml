          function fixture(){const changes=['digital-me/src/coding-admission-actions.mjs','digital-me/test/coding-admission-actions.test.mjs'].map((path,i)=>({path,before:blob(Buffer.from('before'+i)),after:blob(Buffer.from('after'+i)),contents:Buffer.from('after'+i).toString('base64')}));const manifest={changes,digest:digest(JSON.stringify(changes))};const branch='digital-me/repair-'+digest(base+mission+manifest.digest);const verified=sha=>({sha,commit:{verification:{verified:true,reason:'valid'}}});const pr={number:101,draft:true,state:'open',user:{login:bot},base:{ref:'main',sha:base,repo:{full_name:repo}},head:{ref:branch,sha:head,repo:{full_name:repo}}};const writes=[];const state={main:base,existing:false,unsigned:false};const api=async(path,method='GET',body)=>{if(method!=='GET')writes.push({path,method,body});if(path===R+'/commits/main')return verified(state.main);if(path.startsWith(R+'/contents/')){const f=changes.find(x=>path.includes(x.path));const isHead=path.endsWith(head);return {path:f.path,type:'file',encoding:'base64',sha:isHead?f.after:f.before,content:Buffer.from((isHead?'after':'before')+changes.indexOf(f)).toString('base64')};}if(path.startsWith(R+'/pulls?'))return state.existing?[pr]:[];if(path.startsWith(R+'/git/matching-refs/'))return [];if(path===R+'/git/refs')return {ref:'refs/heads/'+branch,object:{sha:base}};if(path==='/graphql')return {data:{createCommitOnBranch:{commit:{oid:head}}}};if(path===R+'/commits/'+head)return {...verified(head),commit:{verification:{verified:!state.unsigned,reason:state.unsigned?'unsigned':'valid'}},author:{login:bot},parents:[{sha:base}],files:changes.map(f=>({filename:f.path,status:'modified',sha:f.after}))};if(path===R+'/pulls'||path===R+'/pulls/101')return pr;throw Error('unexpected endpoint');};return {manifest,writes,state,api};}
