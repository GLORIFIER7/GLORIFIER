          const R='/repos/GLORIFIER7/GLORIFIER',repo='GLORIFIER7/GLORIFIER',bot='glorifier-digital-me[bot]',base='a'.repeat(40),head='b'.repeat(40),mission='mission-coding-'+'c'.repeat(64);
