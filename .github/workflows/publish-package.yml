name: Publish GLORIFIER to npmjs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm trusted-publishing prerequisites
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const [M,n,p]=process.versions.node.split('.').map(Number); if (M < 22 || (M === 22 && n < 14)) process.exit(1)"
          npm --version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build:frontend

      - name: Inspect publish contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --access public
