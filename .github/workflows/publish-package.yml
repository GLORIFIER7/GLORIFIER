name: Publish GLORIFIER to npmjs

on:
  # Publish only once when a GitHub Release is published. Release creation also
  # creates a tag; listening to both events can cause duplicate npm publishes.
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-package.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
  # Manual dispatch validates only; it never publishes a package.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Node and npm trusted-publishing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const [M,n]=process.versions.node.split('.').map(Number); if (M < 24 || (M === 24 && n < 12)) process.exit(1)"
          NPM_VERSION="$(npm --version)"
          node -e "const [M,n,p]=process.argv[1].split('.').map(Number); if (M < 11 || (M === 11 && n < 5) || (M === 11 && n === 5 && p < 1)) { console.error('npm 11.5.1+ is required for trusted publishing'); process.exit(1) }" "$NPM_VERSION"

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.name!=='@glorifier7/glorifier') process.exit(1); if(!p.repository?.url?.endsWith('GLORIFIER7/GLORIFIER.git')) process.exit(1); if(p.publishConfig?.access!=='public') process.exit(1)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build:frontend

      - name: Inspect publish contents
        run: npm pack --dry-run

  publish:
    name: Publish npm package
    needs: validate
    # A published GitHub Release is the single publication event.
    # Pull requests and manual dispatches can validate but cannot publish.
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify Node and npm trusted-publishing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const [M,n]=process.versions.node.split('.').map(Number); if (M < 22 || (M === 22 && n < 14)) process.exit(1)"
          NPM_VERSION="$(npm --version)"
          node -e "const [M,n,p]=process.argv[1].split('.').map(Number); if (M < 11 || (M === 11 && n < 5) || (M === 11 && n === 5 && p < 1)) { console.error('npm 11.5.1+ is required for trusted publishing'); process.exit(1) }" "$NPM_VERSION"

      - name: Publish with npm trusted publishing
        run: npm publish --access public
