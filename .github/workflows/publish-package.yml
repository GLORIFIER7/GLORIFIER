name: Publish GLORIFIER to npmjs

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm trusted-publishing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const [M,n]=process.versions.node.split('.').map(Number); if (M < 22 || (M === 22 && n < 14)) process.exit(1)"
          NPM_VERSION="$(npm --version)"
          node -e "const [M,n,p]=process.argv[1].split('.').map(Number); if (M < 11 || (M === 11 && n < 5) || (M === 11 && n === 5 && p < 1)) { console.error('npm 11.5.1+ is required for trusted publishing'); process.exit(1) }" "$NPM_VERSION"

      - name: Validate package metadata
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.name!=='@glorifier7/glorifier') process.exit(1); if(!p.repository?.url?.endsWith('GLORIFIER7/GLORIFIER.git')) process.exit(1); if(p.publishConfig?.access!=='public') process.exit(1)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build:frontend

      - name: Inspect publish contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --access public

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v7:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/actions/setup-node@v7:sha1-820762786026740c76f36085b0efc47a31fe5020
