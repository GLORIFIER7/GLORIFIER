name: GLORIFIER Claude Development

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Specific coding task for Claude"
        required: true
        type: string
        default: "Inspect the repository and make one small, test-backed reliability improvement."

permissions:
  contents: read

concurrency:
  group: claude-development-${{ github.ref }}
  cancel-in-progress: false

jobs:
  claude:
    if: ${{ github.actor == 'GLORIFIER7' }}
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    env:
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the default branch for patch consistency
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "::error::Dispatch this workflow from main; the publisher applies patches to main."
          exit 1
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Use the pinned standalone CLI instead of the Action's Agent SDK execution path.
      # Upstream issue #1901 documents immediate Action-path request rejection with direct
      # CLI success in the same runner; the wrapper defensively clears Action-only markers.
      - name: Install Claude Code CLI with marker-clearing wrapper
        id: claude-cli
        if: ${{ env.HAS_ANTHROPIC_API_KEY == 'true' }}
        env:
          CLAUDE_CODE_VERSION: "2.1.318"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          CLI="$HOME/.local/bin/claude"
          if [ ! -x "$CLI" ]; then
            echo "::error::Pinned Claude Code CLI was not installed at $CLI"
            exit 1
          fi
          "$CLI" --version
          WRAPPER="$RUNNER_TEMP/claude-wrapper"
          cat > "$WRAPPER" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          unset CLAUDE_CODE_ENTRYPOINT
          unset CLAUDE_CODE_ACTION
          export DISABLE_AUTOUPDATER=1
          exec "$HOME/.local/bin/claude" "$@"
          EOF
          chmod 700 "$WRAPPER"
          printf 'path=%s\n' "$WRAPPER" >> "$GITHUB_OUTPUT"
      - name: Test direct Claude CLI runner
        run: node --test scripts/run-claude-workflow.test.mjs
      - name: Run Claude Code directly through the CLI
        id: run
        if: ${{ env.HAS_ANTHROPIC_API_KEY == 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_WRAPPER: ${{ steps.claude-cli.outputs.path }}
          TASK_TEXT: ${{ inputs.task }}
        shell: bash
        run: node scripts/run-claude-workflow.mjs
      - name: Reset workspace after failed Claude attempt
        if: ${{ steps.run.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
      - name: Report missing Claude key
        if: ${{ env.HAS_ANTHROPIC_API_KEY != 'true' }}
        run: echo "::warning::ANTHROPIC_API_KEY is unavailable to this workflow; no model call was made."
      - name: Prepare change patch
        id: patch
        if: ${{ env.HAS_ANTHROPIC_API_KEY == 'true' && steps.run.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          # The model job has read-only repository permissions. Git metadata is not trusted.
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false add -N -- .
          git -c core.hooksPath=/dev/null -c core.fsmonitor=false diff --binary --no-ext-diff HEAD > "$RUNNER_TEMP/ai-changes.patch"
          if [ ! -s "$RUNNER_TEMP/ai-changes.patch" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
      - name: Upload patch for isolated publishing
        if: ${{ steps.patch.outputs.has_changes == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: claude-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-changes.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: claude
    if: ${{ needs.claude.outputs.has_changes == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TASK: ${{ inputs.task }}
    steps:
      - name: Fresh checkout for publishing
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Download model patch
        uses: actions/download-artifact@v8
        with:
          name: claude-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-artifact
      - name: Validate and apply patch
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_CONFIG_GLOBAL=/dev/null
          GITC=(git -c core.hooksPath=/dev/null -c core.fsmonitor=false)
          # Apply to the clean worktree only. Scan every changed path before staging.
          "${GITC[@]}" apply --whitespace=error "$RUNNER_TEMP/ai-artifact/ai-changes.patch"
          python - <<'PY'
          import re, subprocess, sys
          git = ["git", "-c", "core.hooksPath=/dev/null", "-c", "core.fsmonitor=false"]
          changed = subprocess.check_output(git + ["diff", "--name-only", "-z"])
          untracked = subprocess.check_output(git + ["ls-files", "--others", "--exclude-standard", "-z"])
          paths = (changed + untracked).decode("utf-8", "surrogateescape").split("\0")
          protected = re.compile(
              r"(^|/)\.github/workflows/|(^|/)\.env(?:$|[./])|"
              r"(^|/)(?:secrets|credentials|signing)(?:/|$)|"
              r"\.(?:pem|key|p12|pfx|crt|cer|der|gpg|asc|jks|keystore|pkcs12|"
              r"p7b|p7c|p7m|p7s|spc|csr|mobileprovision|provisionprofile)$",
              re.IGNORECASE,
          )
          blocked = [p for p in paths if p and protected.search(p)]
          if blocked:
              print("::error::Blocked protected paths before staging: " + ", ".join(repr(p) for p in blocked))
              sys.exit(1)
          PY
          "${GITC[@]}" add -A
          "${GITC[@]}" diff --cached --check
      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git -c core.hooksPath=/dev/null -c core.fsmonitor=false status --porcelain)" ]; then
            echo "Claude produced no applicable changes; no PR needed."
            exit 0
          fi
          SHORT_TASK="$(printf '%s' "$TASK" | tr '\r\n' '  ' | cut -c1-60)"
          GITC=(git -c core.hooksPath=/dev/null -c core.fsmonitor=false)
          "${GITC[@]}" config user.name "GLORIFIER Claude Development"
          "${GITC[@]}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ai/claude/${GITHUB_RUN_ID}"
          "${GITC[@]}" checkout -b "$BRANCH"
          "${GITC[@]}" commit --no-verify -m "ai(claude): $SHORT_TASK"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          "${GITC[@]}" -c http.https://github.com/.extraheader="$AUTH_HEADER" push --no-verify --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "Claude: $SHORT_TASK" --body "AI-generated proposal from the owner-triggered Claude workflow. The model job had read-only repository permissions; publishing uses a separate fresh checkout. Protected workflow, credential, signing, environment, and key/certificate paths are blocked. No automatic merge or deployment was performed."

