name: GLORIFIER Digital Me — fixed frontend repair publication
'on':
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Confirm reviewed exact five-file repair and App-signed draft PR only (no merge/deploy)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: digital-me-frontend-repair-publication
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ github.repository == 'GLORIFIER7/GLORIFIER' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
      && github.actor_id == '32674233' && github.actor == 'GLORIFIER7' && github.triggering_actor == 'GLORIFIER7' && github.run_attempt
      == 1 && inputs.confirm_publication == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
      EXPECTED_MAIN: ${{ github.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
    - name: Materialize reviewed fixed publisher and patch
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        mkdir -p "$RUNNER_TEMP/frontend-publisher"
        cat > "$RUNNER_TEMP/frontend-publisher/publisher.mjs" <<'PUBLISHER_JS'
        // Fixed, owner-confirmed frontend repair. This program never executes candidate source.
        import {createHash,createSign} from 'node:crypto';
        import {execFileSync} from 'node:child_process';
        import {readFileSync} from 'node:fs';
        import {pathToFileURL} from 'node:url';
        const REPO='GLORIFIER7/GLORIFIER', R='/repos/'+REPO, APP=5876036, BOT='glorifier-digital-me[bot]';
        const sha=s=>typeof s==='string'&&/^[a-f0-9]{40}$/.test(s);
        export const FILES=Object.freeze({
         'src/components/Header.tsx':{before:'47f32d9849a41b0ffc533913cb7c3b2bceacc488',after:'3f696ee721153c3e6d9ad2ef8700b5a61e2f9343'},
         'src/components/AuthPanel.tsx':{before:'4dd11228cddc3cbba9486ec2f26fb44dd6eec5d5',after:'26faab5452022d61bfecfff12132913d9a9255e6'},
         'tests/e2e/production.spec.ts':{before:'eb6ac935ab832d1f74ac8cc2bb050b55018817c5',after:'a96afa5d1602c206c11f8069927f3f6e34f3e633'},
         'scripts/e2e-production-workflow-contract.test.mjs':{before:'3ce13bbb10588cbd76346f81ee43c91839607f39',after:'d0c58813bfc40a27ade04c5e84dc1a50fa682c7e'},
         'scripts/e2e-navigation-audit.test.mjs':{before:null,after:'66173a625b18468b185a21bcb7da852dc9caf51c'}
        });
        export const PATCH_SHA256='c2eec38c9f57325ec942f29bf5b3e1d966399ff9004d6cba944a4b0e84ebf219';
        const fail=s=>{throw Error(s)};
        export function validateContext(e){const required={GITHUB_REPOSITORY:REPO,GITHUB_REF:'refs/heads/main',GITHUB_EVENT_NAME:'workflow_dispatch',GITHUB_ACTOR:'GLORIFIER7',GITHUB_ACTOR_ID:'32674233',GITHUB_TRIGGERING_ACTOR:'GLORIFIER7',GITHUB_RUN_ATTEMPT:'1',CONFIRM_PUBLICATION:'true'};if(Object.entries(required).some(([k,v])=>e[k]!==v)||!sha(e.GITHUB_SHA)||e.EXPECTED_MAIN!==e.GITHUB_SHA||!/^\d{1,20}$/.test(e.GITHUB_RUN_ID||''))fail('Invalid owner/exact-main publication context');return e.GITHUB_SHA;}
        export function validateFiles(files){if(!Array.isArray(files)||files.length!==Object.keys(FILES).length||new Set(files.map(f=>f.path)).size!==files.length||files.some(f=>!Object.hasOwn(FILES,f.path)||FILES[f.path].before!==f.before||FILES[f.path].after!==f.after))fail('Repair file scope or digest mismatch');}
        export function validateInstallation(i){if(i.app_id!==APP||i.account?.login!=='GLORIFIER7'||i.repository_selection!=='selected'||!Number.isSafeInteger(i.id)||i.id<=0||i.permissions?.contents!=='write'||i.permissions?.pull_requests!=='write')fail('App installation scope or required permission mismatch');}
        const permissions={contents:'write',pull_requests:'write'};
        export function validateToken(t){if(typeof t?.token!=='string'||!t.token||t.repository_selection!=='selected'||t.repositories?.length!==1||t.repositories[0].full_name!==REPO||Object.entries(permissions).some(([k,v])=>t.permissions?.[k]!==v)||Object.entries(t.permissions||{}).some(([k,v])=>!(k in permissions)&&!(k==='metadata'&&v==='read')))fail('Short-lived token scope mismatch');}
        export function validateCommit(c,head,base){if(!sha(head)||!sha(base)||c.sha!==head||c.author?.login!==BOT||c.commit?.verification?.verified!==true||c.commit?.verification?.reason!=='valid'||c.parents?.length!==1||c.parents[0].sha!==base||c.files?.length!==Object.keys(FILES).length||Object.entries(FILES).some(([path,f])=>!c.files.some(x=>x.filename===path&&x.sha===f.after&&x.status===(f.before?'modified':'added'))))fail('Signed commit readback mismatch; no PR opened');}
        const hash=(algo,b)=>createHash(algo).update(b).digest('hex');
        const blob=b=>hash('sha1',Buffer.concat([Buffer.from(`blob ${b.length}\0`),b]));
        const git=(...a)=>execFileSync('git',['-c','core.hooksPath=/dev/null','-c','core.fsmonitor=false',...a],{encoding:'utf8',maxBuffer:1024*1024,stdio:['ignore','pipe','pipe']});
        export function preparePatch(base,patchPath){if(git('rev-parse','HEAD').trim()!==base||git('status','--porcelain','--untracked-files=all').trim())fail('Checkout is not a clean exact main');const patch=readFileSync(patchPath);if(hash('sha256',patch)!==PATCH_SHA256)fail('Patch digest mismatch');const before=Object.entries(FILES).map(([path,f])=>{const t=git('ls-tree',base,'--',path).trim();const m=t.match(/^100644 blob ([a-f0-9]{40})\t(.+)$/);const actual=t?(m&&m[2]===path?m[1]:'invalid'):null;if(actual!==f.before)fail('Original file does not match reviewed blob');return {path,before:actual};});git('apply','--index','--check','--whitespace=error',patchPath);git('apply','--index','--whitespace=error',patchPath);const changed=git('diff','--cached','--name-only','-z').split('\0').filter(Boolean);if(changed.length!==before.length||changed.some(p=>!Object.hasOwn(FILES,p)))fail('Unexpected changed paths');const files=before.map(f=>{const bytes=readFileSync(f.path);const after=blob(bytes);const index=git('ls-files','--stage','--',f.path).trim();if(index!==`100644 ${after} 0\t${f.path}`)fail('Unexpected index mode or blob');return {...f,after,contents:bytes.toString('base64')};});validateFiles(files);return files;}
        function makeJwt(pem){const b=x=>Buffer.from(JSON.stringify(x)).toString('base64url');const now=Math.floor(Date.now()/1000);const msg=b({alg:'RS256',typ:'JWT'})+'.'+b({iss:String(APP),iat:now-30,exp:now+540});const signer=createSign('RSA-SHA256');signer.update(msg);signer.end();return msg+'.'+signer.sign(pem).toString('base64url');}
        async function github(path,token,method='GET',body){const res=await fetch('https://api.github.com'+path,{method,redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},...(body===undefined?{}:{body:JSON.stringify(body)})});if(!res.ok)fail(`GitHub ${method} HTTP ${res.status}`);if(res.status===204)return null;const data=await res.json();if(data?.errors?.length)fail('GitHub GraphQL rejected request');return data;}
        export async function publish({api=github,jwt,base,runId,files}){if(!sha(base)||!/^\d{1,20}$/.test(runId))fail('Invalid publication scope');validateFiles(files);for(const f of files){if(typeof f.contents!=='string'||blob(Buffer.from(f.contents,'base64'))!==f.after)fail('Payload blob mismatch');}const installation=await api(R+'/installation',jwt);validateInstallation(installation);const t=await api('/app/installations/'+installation.id+'/access_tokens',jwt,'POST',{repositories:['GLORIFIER'],permissions});const token=t?.token;if(typeof token!=='string'||!token)fail('No installation token');try{validateToken(t);const main=await api(R+'/commits/main',token);if(main.sha!==base||main.commit?.verification?.verified!==true||main.commit.verification.reason!=='valid')fail('Main changed or unsigned');const branch='digital-me/frontend-e2e-'+runId,ref='refs/heads/'+branch;const created=await api(R+'/git/refs',token,'POST',{ref,sha:base});if(created.ref!==ref||created.object?.sha!==base)fail('Branch readback mismatch');const result=await api('/graphql',token,'POST',{query:'mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}',variables:{input:{branch:{repositoryNameWithOwner:REPO,branchName:branch},expectedHeadOid:base,message:{headline:'fix(frontend): expand E2E navigation and safe authentication diagnostics'},fileChanges:{additions:files.map(({path,contents})=>({path,contents}))}}}});const head=result?.data?.createCommitOnBranch?.commit?.oid;if(!sha(head))fail('Missing signed commit ID');validateCommit(await api(R+'/commits/'+head,token),head,base);if((await api(R+'/commits/main',token)).sha!==base)fail('Main changed after signing; no PR opened');const pr=await api(R+'/pulls',token,'POST',{head:branch,base:'main',draft:true,title:'fix(frontend): expand E2E coverage and safe authentication diagnostics',body:'Refs #471. Exact reviewed five-file repair; no authentication bypass or skipped tests. Local contract and hosted preflight validation precede signed publication. Human review and required checks are mandatory; no automated approval, merge, deployment, or spending.'});if(!Number.isSafeInteger(pr.number)||pr.head?.sha!==head||pr.draft!==true||pr.user?.login!==BOT)fail('Draft PR readback mismatch');return {status:'SIGNED_DRAFT_CREATED',pr:pr.number,sha:head,branch,merged:false};}finally{try{await api('/installation/token',token,'DELETE')}catch{console.error('Short-lived token revocation failed; token will expire.')}}}
        if(process.argv[1]&&import.meta.url===pathToFileURL(process.argv[1]).href){try{const base=validateContext(process.env);const mode=process.argv[2];if(!['validate','publish'].includes(mode))fail('Unknown mode');const pem=process.env.DIGITAL_ME_APP_PRIVATE_KEY;delete process.env.DIGITAL_ME_APP_PRIVATE_KEY;if(mode==='validate'&&pem)fail('Unexpected private key in validation');const files=preparePatch(base,process.argv[3]);if(mode==='validate'){console.log('Exact reviewed patch scope and blobs validated.');}else{if(!pem)fail('App credential missing');console.log(JSON.stringify(await publish({jwt:makeJwt(pem),base,runId:process.env.GITHUB_RUN_ID,files})));}}catch(e){console.error('Publication stopped:',e instanceof Error&&/^(Invalid |Repair |App |Short-lived |Signed |Checkout |Patch |Original |Unexpected |Payload |No installation|Main |Branch |Missing signed|Draft |GitHub |Unknown |Publication)/.test(e.message)?e.message:'Validated repair operation failed; inspect safe preflight output.');process.exitCode=1;}}
        PUBLISHER_JS
        cat > "$RUNNER_TEMP/frontend-publisher/publisher.test.mjs" <<'PUBLISHER_TEST'
        import {test} from 'node:test';
        import assert from 'node:assert/strict';
        import {validateContext,validateFiles,FILES,validateCommit,validateToken,validateInstallation} from './publisher.mjs';
        const base='a'.repeat(40), head='b'.repeat(40);
        const env={GITHUB_REPOSITORY:'GLORIFIER7/GLORIFIER',GITHUB_REF:'refs/heads/main',GITHUB_EVENT_NAME:'workflow_dispatch',GITHUB_ACTOR:'GLORIFIER7',GITHUB_ACTOR_ID:'32674233',GITHUB_TRIGGERING_ACTOR:'GLORIFIER7',GITHUB_RUN_ATTEMPT:'1',CONFIRM_PUBLICATION:'true',EXPECTED_MAIN:base,GITHUB_SHA:base,GITHUB_RUN_ID:'123'};
        const files=Object.entries(FILES).map(([path,f])=>({path,before:f.before,after:f.after}));
        const goodCommit={sha:head,author:{login:'glorifier-digital-me[bot]'},commit:{verification:{verified:true,reason:'valid'}},parents:[{sha:base}],files:files.map(f=>({filename:f.path,sha:f.after,status:f.before?'modified':'added'}))};
        const token={token:'short-lived-test-token',repository_selection:'selected',repositories:[{full_name:'GLORIFIER7/GLORIFIER'}],permissions:{contents:'write',pull_requests:'write',metadata:'read'}};
        test('owner explicit exact main dispatch only',()=>{assert.equal(validateContext(env),base);for(const [k,v] of Object.entries({GITHUB_REPOSITORY:'other/repo',GITHUB_REF:'refs/heads/test',GITHUB_EVENT_NAME:'push',GITHUB_ACTOR:'other',GITHUB_ACTOR_ID:'1',GITHUB_TRIGGERING_ACTOR:'other',GITHUB_RUN_ATTEMPT:'2',CONFIRM_PUBLICATION:'false',EXPECTED_MAIN:head,GITHUB_RUN_ID:'x'}))assert.throws(()=>validateContext({...env,[k]:v}));});
        test('exact five preimage and postimage blobs required',()=>{assert.doesNotThrow(()=>validateFiles(files));assert.throws(()=>validateFiles(files.slice(1)));assert.throws(()=>validateFiles([...files,{path:'.github/workflows/extra.yml',before:null,after:head}]));assert.throws(()=>validateFiles(files.map((f,i)=>i?f:{...f,before:head})));assert.throws(()=>validateFiles(files.map((f,i)=>i?f:{...f,after:head})));assert.throws(()=>validateFiles(files.map((f,i)=>i?f:{...f,path:files[1].path})));});
        test('signed bot commit exact parent and file blobs',()=>{assert.doesNotThrow(()=>validateCommit(goodCommit,head,base));for(const c of [{...goodCommit,author:{login:'GLORIFIER7'}},{...goodCommit,commit:{verification:{verified:false}}},{...goodCommit,parents:[{sha:head}]},{...goodCommit,files:goodCommit.files.slice(1)},{...goodCommit,files:goodCommit.files.map((f,i)=>i?f:{...f,sha:head})}])assert.throws(()=>validateCommit(c,head,base));});
        test('token restricted to one repo and only write capabilities needed',()=>{assert.doesNotThrow(()=>validateToken(token));for(const t of [{...token,repository_selection:'all'},{...token,repositories:[...token.repositories,{full_name:'other/repo'}]},{...token,permissions:{contents:'write',pull_requests:'read'}},{...token,permissions:{...token.permissions,workflows:'write'}}])assert.throws(()=>validateToken(t));});
        test('installation identity and permissions checked before token mint',()=>{const i={app_id:5876036,id:1,account:{login:'GLORIFIER7'},repository_selection:'selected',permissions:{contents:'write',pull_requests:'write'}};assert.doesNotThrow(()=>validateInstallation(i));for(const bad of [{...i,app_id:1},{...i,account:{login:'other'}},{...i,repository_selection:'all'},{...i,permissions:{contents:'read',pull_requests:'write'}}])assert.throws(()=>validateInstallation(bad));});
        PUBLISHER_TEST
        cat > "$RUNNER_TEMP/frontend-publisher/patch.b64" <<'PATCH_DATA'
