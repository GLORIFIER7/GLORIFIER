name: GLORIFIER Digital Me — one-time coding-agent signed bootstrap
'on':
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Confirm exact six-file coding-agent App-signed draft PR only
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: digital-me-signed-coding-bootstrap
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.repository == 'GLORIFIER7/GLORIFIER' && github.ref == 'refs/heads/digital-me/signed-coding-bootstrap' && github.event_name == 'workflow_dispatch' && github.actor_id == '32674233' && github.actor == 'GLORIFIER7' && github.triggering_actor == 'GLORIFIER7' && github.run_attempt == 1 && inputs.confirm_publication == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verify fixed publisher bytes and run offline tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object digital-me/bootstrap/publish.mjs)" = c762fa334944f1c902a5fac5d01c66b0593384c3
          test "$(git hash-object digital-me/bootstrap/publisher.test.mjs)" = 8d8cf4af0ef43934b241cf8ee549a614e6c365a3
          node --test digital-me/bootstrap/publisher.test.mjs
          node digital-me/bootstrap/publish.mjs
      - name: Publish fixed signed draft only
        shell: bash
        env:
          DIGITAL_ME_APP_PRIVATE_KEY: ${{ secrets.DIGITAL_ME_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test "$(git hash-object digital-me/bootstrap/publish.mjs)" = c762fa334944f1c902a5fac5d01c66b0593384c3
          node digital-me/bootstrap/publish.mjs --publish
