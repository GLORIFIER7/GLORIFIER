lidation precede signed publication. Human review and required checks are mandatory; no automated approval, merge, deployment, or spending.'});if(!Number.isSafeInteger(pr.number)||pr.head?.sha!==head||pr.draft!==true||pr.user?.login!==BOT)fail('Draft PR readback mismatch');return {status:'SIGNED_DRAFT_CREATED',pr:pr.number,sha:head,branch,merged:false};}finally{try{await api('/installation/token',token,'DELETE')}catch{console.error('Short-lived token revocation failed; token will expire.')}}}
