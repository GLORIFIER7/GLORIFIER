name: C durable memory

on:
  pull_request:
    paths:
      - 'native/memory/**'
      - '.github/workflows/c-durable-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-durable-memory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build and test C memory store
        run: make -C native/memory test
