      - name: Select one authorized scheduled mission (no App secret)
        if: github.event_name == 'schedule'
        id: mission
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/glorifier-reviewed-publisher/publisher.mjs" select
      - name: Validate approved patch as data (no App secret)
        if: github.event_name == 'workflow_dispatch' || steps.mission.outputs.selected == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$RUNNER_TEMP/glorifier-reviewed-publisher/publisher.mjs" prepare
      - name: Publish signed draft only
        if: (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'schedule' && steps.mission.outputs.selected == 'true')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIGITAL_ME_APP_PRIVATE_KEY: ${{ secrets.DIGITAL_ME_APP_PRIVATE_KEY }}
        run: node "$RUNNER_TEMP/glorifier-reviewed-publisher/publisher.mjs" publish
