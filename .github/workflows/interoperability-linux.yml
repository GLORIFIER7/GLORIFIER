name: Interoperability Linux validation

on:
  pull_request:
    paths:
      - "src/worker.ts"
      - "src/worker.test.ts"
      - "src/lib/github-mcp.ts"
      - "scripts/mcp-local-conformance-server.mjs"
      - "src/lib/a2a-runtime.ts"
      - "src/lib/a2a-runtime.test.ts"
      - "src/lib/a2a-v1-express.ts"
      - "src/lib/a2a-v1-express.test.ts"
      - "src/lib/a2a-v1.ts"
      - "src/lib/a2a-v1.test.ts"
      - "server.ts"
      - "sdk/python/**"
      - "docs/architecture/interoperability-capabilities*"
      - "docs/architecture/mcp-reference-conformance.md"
      - "scripts/validate-interoperability-registry.mjs"
      - "scripts/validate-interoperability-registry.test.mjs"
      - "scripts/interoperability-protocol-boundaries.test.mjs"
      - "scripts/mcp-conformance-target.mjs"
      - "scripts/mcp-conformance-target.test.mjs"
      - "scripts/mcp-live-smoke.mjs"
      - "scripts/mcp-live-smoke.test.mjs"
      - ".github/workflows/external-mcp-conformance.yml"
      - "docs/architecture/openapi/**"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/neural-engine-integration.md"
      - "scripts/validate-interoperability-capabilities.mjs"
      - "scripts/validate-interoperability-capabilities.test.mjs"
      - "scripts/interoperability-evidence-policy.mjs"
      - "scripts/interoperability-evidence-policy.test.mjs"
      - "src/lib/linux-host-agent*.ts"
      - "src/lib/auth/protected-api-paths.ts"
      - "src/lib/auth/protected-api-paths.test.ts"
      - "agents/linux-host-agent/**"
      - ".github/workflows/interoperability-linux.yml"
      - "Dockerfile"
      - "Dockerfile.ubuntu"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".env.example"
  push:
    branches: [main]
    paths:
      - "src/worker.ts"
      - "src/worker.test.ts"
      - "src/lib/github-mcp.ts"
      - "scripts/mcp-local-conformance-server.mjs"
      - "src/lib/a2a-runtime.ts"
      - "src/lib/a2a-runtime.test.ts"
      - "src/lib/a2a-v1-express.ts"
      - "src/lib/a2a-v1-express.test.ts"
      - "src/lib/a2a-v1.ts"
      - "src/lib/a2a-v1.test.ts"
      - "server.ts"
      - "sdk/python/**"
      - "docs/architecture/interoperability-capabilities*"
      - "docs/architecture/mcp-reference-conformance.md"
      - "scripts/validate-interoperability-registry.mjs"
      - "scripts/validate-interoperability-registry.test.mjs"
      - "scripts/interoperability-protocol-boundaries.test.mjs"
      - "scripts/mcp-conformance-target.mjs"
      - "scripts/mcp-conformance-target.test.mjs"
      - "scripts/mcp-live-smoke.mjs"
      - "scripts/mcp-live-smoke.test.mjs"
      - ".github/workflows/external-mcp-conformance.yml"
      - "docs/architecture/openapi/**"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/neural-engine-integration.md"
      - "scripts/validate-interoperability-capabilities.mjs"
      - "scripts/validate-interoperability-capabilities.test.mjs"
      - "scripts/interoperability-evidence-policy.mjs"
      - "scripts/interoperability-evidence-policy.test.mjs"
      - "src/lib/linux-host-agent*.ts"
      - "src/lib/auth/protected-api-paths.ts"
      - "src/lib/auth/protected-api-paths.test.ts"
      - "agents/linux-host-agent/**"
      - ".github/workflows/interoperability-linux.yml"
      - "Dockerfile"
      - "Dockerfile.ubuntu"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".env.example"

permissions:
  contents: read

jobs:
  linux-source-matrix:
    name: Source checks (${{ matrix.os }}, x86_64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Test evidence freshness policy
        run: npm run test:interoperability-evidence-policy
      - name: Test Linux host-agent contract
        run: npm run test:linux-host-agent-contract
      - name: Test Python Linux host agent
        run: python3 -m unittest discover -s agents/linux-host-agent -p "test_*.py" -v
      - name: Test API authentication bypass policy
        run: npm run test:protected-api-paths
      - name: Test MCP interoperability registry policy
        run: npm run test:interoperability-registry
      - name: Test A2A 1.0 JSON-RPC adapter contract
        run: npm run test:a2a-v1
      - name: Test A2A runtime prompt formatting
        run: npm run test:a2a-runtime
      - name: Test A2A Express endpoint routes
        run: npm run test:a2a-v1-express
      - name: Test pinned A2A and MCP protocol boundaries
        run: npm run test:interoperability-protocol-boundaries
      - name: Test external MCP guard and scoped smoke contracts
        run: node --test scripts/mcp-conformance-target.test.mjs scripts/mcp-live-smoke.test.mjs
      - name: Validate MCP interoperability registry
        run: npm run validate:interoperability-registry
      - name: Test capability registry evidence assertions
        run: node --test scripts/validate-interoperability-capabilities.test.mjs
      - name: Validate capability registry and evidence
        run: node scripts/validate-interoperability-capabilities.mjs
      - name: Type-check
        run: npm run lint
      - name: Test Worker and interoperability boundaries
        run: npm run test:cloudflare-worker
      - name: Run chain-specific read-only transfer verifier test vectors
        run: |
          npm run test:glr-ethereum-verifier
          npm run test:glr-bnb-verifier
          npm run test:glr-solana-verifier
      - name: Build frontend
        run: npm run build:frontend
      - name: Verify static output
        run: test -s dist/index.html

  mcp-local-conformance:
    name: Official MCP TCK against exact PR source
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      MCP_CONFORMANCE_URL: http://127.0.0.1:8787/mcp
    steps:
      - name: Checkout GLORIFIER source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked GLORIFIER dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Test MCP local conformance harness contracts
        run: node --import tsx/esm --test scripts/mcp-local-conformance-server.test.mjs
      - name: Checkout pinned official MCP conformance runner
        uses: actions/checkout@v4
        with:
          repository: modelcontextprotocol/conformance
          ref: 96a6f9478b7f2e125cf0360a213383cf57533893
          path: .mcp-conformance
          persist-credentials: false
      - name: Build official MCP conformance runner
        id: build_official_runner
        working-directory: .mcp-conformance
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
      - name: Start isolated GLORIFIER MCP route
        id: start_server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mcp-local-conformance-results
          node --import tsx/esm scripts/mcp-local-conformance-server.mjs \
            > "$RUNNER_TEMP/glorifier-mcp-local-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/glorifier-mcp-local-server.pid"

          ready=false
          for _ in $(seq 1 30); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$MCP_CONFORMANCE_URL" || true)"
            if [ "$status" = "405" ]; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/glorifier-mcp-local-server.log"
            echo "Local MCP route did not become ready."
            exit 1
          fi
      - name: Verify read-only GitHub MCP tool contract without external API dependency
        # Anonymous api.github.com access can return HTTP 403 due to shared IP rate limits.
        # This deterministic route-level test verifies success/error handling without
        # forwarding credentials to PR-controlled code or claiming live API reachability.
        run: node --import tsx/esm --test scripts/mcp-read-tool-offline.test.mjs
      - name: Run official legacy MCP 2025-11-25 tools-list scenario
        if: ${{ always() && steps.start_server.outcome == 'success' && steps.build_official_runner.outcome == 'success' }}
        working-directory: .mcp-conformance
        run: |
          node dist/index.js server \
            --url "$MCP_CONFORMANCE_URL" \
            --scenario tools-list \
            --spec-version 2025-11-25 \
            --timeout 30000 \
            --output-dir "$GITHUB_WORKSPACE/mcp-local-conformance-results" \
            --verbose
      - name: Run official MCP 2026-07-28 advertised read-only scenarios
        if: ${{ always() && steps.start_server.outcome == 'success' && steps.build_official_runner.outcome == 'success' }}
        working-directory: .mcp-conformance
        shell: bash
        run: |
          set -euo pipefail
          # Exercise only the capabilities GLORIFIER advertises: tools discovery,
          # read-only text results, tool errors, DNS-rebinding protection, and
          # HTTP header validation. The full requirements pack also runs
          # prompts/resources/completion/tasks/multimedia/elicitation fixtures
          # that this server deliberately does not advertise.
          failures=()
          for scenario in tools-list tools-call-error dns-rebinding-protection http-header-validation; do
            echo "::group::Official MCP scenario: $scenario"
            if node dist/index.js server \
              --url "$MCP_CONFORMANCE_URL" \
              --scenario "$scenario" \
              --spec-version 2026-07-28 \
              --timeout 30000 \
              --output-dir "$GITHUB_WORKSPACE/mcp-local-conformance-results" \
              --verbose; then
              echo "PASS: $scenario"
            else
              status=$?
              echo "::error::Official MCP scenario '$scenario' failed with exit code $status."
              failures+=("$scenario")
            fi
            echo "::endgroup::"
          done
          if ((${#failures[@]} > 0)); then
            printf 'MCP conformance scenarios failed: %s\n' "${failures[*]}" >&2
            exit 1
          fi
      - name: Capture local MCP harness diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p mcp-local-conformance-results
          cat "$RUNNER_TEMP/glorifier-mcp-local-server.log" \
            > mcp-local-conformance-results/local-server.log
          if [ -f "$RUNNER_TEMP/glorifier-mcp-local-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/glorifier-mcp-local-server.pid")" 2>/dev/null
          fi
      - name: Upload local MCP conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-local-conformance-${{ github.run_id }}
          path: mcp-local-conformance-results/
          if-no-files-found: warn
          retention-days: 14

  linux-container-builds:
    name: Container builds (Ubuntu 24.04, x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build distroless production image
        run: docker build --pull -f Dockerfile -t glorifier:ci .
      - name: Build Ubuntu 24.04 production image
        run: docker build --pull -f Dockerfile.ubuntu -t glorifier-ubuntu:ci .

      - name: Smoke-test distroless image health and graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          container="glorifier-distroless-smoke"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" -p 127.0.0.1:13000:3000 glorifier:ci >/dev/null
          ready=0
          for ((attempt=1; attempt<=30; attempt++)); do
            if curl --fail --silent --show-error http://127.0.0.1:13000/api/health > /tmp/glorifier-distroless-health.json; then
              ready=1
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
              echo "::error::Distroless container exited before /api/health became ready."
              docker logs "$container" || true
              docker inspect --format '{{json .State}}' "$container" || true
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Timed out waiting for distroless /api/health."
            docker logs "$container" || true
            docker inspect --format '{{json .State}}' "$container" || true
            exit 1
          fi
          node -e "const fs=require('node:fs');const h=JSON.parse(fs.readFileSync('/tmp/glorifier-distroless-health.json','utf8'));if(h.ok!==true||h.status!=='ok')throw Error('Unexpected container health payload: '+JSON.stringify(h));"
          readiness_status="$(curl --silent --show-error --output /tmp/glorifier-distroless-ready.json --write-out '%{http_code}' http://127.0.0.1:13000/api/health/ready)"
          test "$readiness_status" = "503"
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('/tmp/glorifier-distroless-ready.json','utf8'));if(r.ok!==false||r.status!=='not-ready'||r.reason!=='DATABASE_URL is not configured')throw Error('Unexpected readiness payload: '+JSON.stringify(r));"
          docker stop --time 10 "$container" >/dev/null
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          test "$exit_code" = "0"

      - name: Smoke-test Ubuntu image health and graceful shutdown
        shell: bash
        run: |
          set -euo pipefail
          container="glorifier-ubuntu-smoke"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" -p 127.0.0.1:13001:3000 glorifier-ubuntu:ci >/dev/null
          ready=0
          for ((attempt=1; attempt<=30; attempt++)); do
            if curl --fail --silent --show-error http://127.0.0.1:13001/api/health > /tmp/glorifier-ubuntu-health.json; then
              ready=1
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
              echo "::error::Ubuntu container exited before /api/health became ready."
              docker logs "$container" || true
              docker inspect --format '{{json .State}}' "$container" || true
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Timed out waiting for Ubuntu /api/health."
            docker logs "$container" || true
            docker inspect --format '{{json .State}}' "$container" || true
            exit 1
          fi
          node -e "const fs=require('node:fs');const h=JSON.parse(fs.readFileSync('/tmp/glorifier-ubuntu-health.json','utf8'));if(h.ok!==true||h.status!=='ok')throw Error('Unexpected container health payload: '+JSON.stringify(h));"
          readiness_status="$(curl --silent --show-error --output /tmp/glorifier-ubuntu-ready.json --write-out '%{http_code}' http://127.0.0.1:13001/api/health/ready)"
          test "$readiness_status" = "503"
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('/tmp/glorifier-ubuntu-ready.json','utf8'));if(r.ok!==false||r.status!=='not-ready'||r.reason!=='DATABASE_URL is not configured')throw Error('Unexpected readiness payload: '+JSON.stringify(r));"
          docker stop --time 10 "$container" >/dev/null
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          test "$exit_code" = "0"
