name: Hugging Face Space deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Do not interrupt an active publish midway through pushing to the Space.
concurrency:
  group: huggingface-space-deploy
  cancel-in-progress: false

jobs:
  deployment-disabled:
    if: ${{ vars.HF_SPACE_DEPLOY_ENABLED != 'true' || vars.HF_SPACE_ID == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why deployment was skipped
        shell: bash
        run: |
          echo "::notice::Hugging Face deployment is disabled. Set repository variable HF_SPACE_DEPLOY_ENABLED=true and set HF_SPACE_ID to owner/space-name to enable it."

  deploy-space:
    if: ${{ vars.HF_SPACE_DEPLOY_ENABLED == 'true' && vars.HF_SPACE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
      HF_SPACE_WRITE_TOKEN: ${{ secrets.HF_SPACE_WRITE_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HF_SPACE_WRITE_TOKEN:-}" ]]; then
            echo "::error::Repository secret HF_SPACE_WRITE_TOKEN is missing. Create a fine-grained Hugging Face write token scoped to the target Space and store it as a GitHub Actions secret."
            exit 1
          fi
          if [[ ! "$HF_SPACE_ID" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::HF_SPACE_ID must be an existing Hugging Face Space ID in owner/name form."
            exit 1
          fi
          if [[ ! -f Dockerfile ]]; then
            echo "::error::Dockerfile is missing from the repository root; refusing to publish a Docker Space without its build file."
            exit 1
          fi

      - name: Prepare Docker Space source
        shell: bash
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/hf-space-credentials"
          trap 'rm -f "$credential_file"' EXIT
          umask 077
          printf 'protocol=https\nhost=huggingface.co\nusername=user\npassword=%s\n\n' "$HF_SPACE_WRITE_TOKEN" \
            | git credential-store --file="$credential_file" store
          git -c credential.helper="store --file=$credential_file" \
            clone "https://huggingface.co/spaces/$HF_SPACE_ID" "$RUNNER_TEMP/hf-space"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='coverage/' \
            --exclude='android/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='.next/' \
            --exclude='.vercel/' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='secrets/' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            --exclude='*.db' \
            ./ "$RUNNER_TEMP/hf-space/"
          printf '%s\n' \
            '---' \
            'title: GLORIFIER' \
            'emoji: 🧠' \
            'colorFrom: blue' \
            'colorTo: purple' \
            'sdk: docker' \
            'app_port: 3000' \
            'pinned: false' \
            '---' \
            '' \
            '# GLORIFIER' \
            '' \
            'Governed, provider-neutral AI orchestration. This Space builds the repository Dockerfile.' \
            '' \
            'Configure application-specific runtime credentials through the Hugging Face Space Settings → Variables and secrets. Never put credentials in repository files.' \
            > "$RUNNER_TEMP/hf-space/README.md"
          cd "$RUNNER_TEMP/hf-space"
          git lfs install --local
          git lfs track "*.jpg" "*.jpeg" "*.png" "*.webp" "*.gif" "*.ico" "*.avif"

      - name: Publish source to Hugging Face Space
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hf-space"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Hugging Face Space already matches the source commit."
            exit 0
          fi
          git commit -m "Deploy GLORIFIER from GitHub ${GITHUB_SHA}"
          credential_file="$RUNNER_TEMP/hf-space-credentials"
          git -c credential.helper="store --file=$credential_file" lfs push origin HEAD
          git -c credential.helper="store --file=$credential_file" push origin HEAD:main
