name: GLORIFIER Docker Image

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.ubuntu"
      - "Dockerfile.orchestrator.ubuntu"
      - ".dockerignore"
      - "package.json"
      - "package-lock.json"
      - "server.ts"
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - ".github/workflows/docker-image.yml"
  workflow_run:
    workflows: ["GLORIFIER CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: glorifier-docker-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --pull --tag glorifier/glorifier:pr-${{ github.event.pull_request.number }} .

      - name: Verify primary image Node.js runtime
        run: |
          docker run --rm glorifier/glorifier:pr-${{ github.event.pull_request.number }} -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 24 || (major === 24 && minor < 12)) process.exit(1); console.log("Verified production Node.js runtime: " + process.versions.node)'

      - name: Build Ubuntu runtime image
        run: docker build --pull --file Dockerfile.ubuntu --tag glorifier/glorifier:ubuntu-pr-${{ github.event.pull_request.number }} .

      - name: Build permanent orchestrator runtime image
        run: docker build --pull --file Dockerfile.orchestrator.ubuntu --tag glorifier/orchestrator:pr-${{ github.event.pull_request.number }} .

      - name: Smoke test Ubuntu runtime health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container="glorifier-ubuntu-smoke-${{ github.event.pull_request.number }}"
          postgres="glorifier-postgres-smoke-${{ github.event.pull_request.number }}"
          network="glorifier-smoke-${{ github.event.pull_request.number }}"
          # Keep cleanup commands directly in the EXIT trap so actionlint's
          # embedded ShellCheck can correctly analyze the script.
          trap 'docker logs "$container" 2>/dev/null || true; docker logs "$postgres" 2>/dev/null || true; docker rm --force "$container" "$postgres" >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT

          # Use a disposable, isolated PostgreSQL service with TLS. Never connect CI to production.
          tls_dir="$RUNNER_TEMP/glorifier-postgres-tls"
          mkdir -p "$tls_dir"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -out "$tls_dir/server.crt" \
            -keyout "$tls_dir/server.key" \
            -subj "/CN=$postgres" \
            -addext "subjectAltName=DNS:$postgres"
          sudo chown 70:70 "$tls_dir/server.crt" "$tls_dir/server.key"
          sudo chmod 644 "$tls_dir/server.crt"
          sudo chmod 600 "$tls_dir/server.key"
          docker network create "$network"
          docker run --detach --name "$postgres" --network "$network" \
            --mount "type=bind,src=$tls_dir/server.crt,dst=/var/lib/postgresql/server.crt,readonly" \
            --mount "type=bind,src=$tls_dir/server.key,dst=/var/lib/postgresql/server.key,readonly" \
            --env POSTGRES_USER=glorifier_test \
            --env POSTGRES_PASSWORD=glorifier_test_only \
            --env POSTGRES_DB=glorifier_test \
            --health-cmd "pg_isready -U glorifier_test -d glorifier_test" \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            postgres:16-alpine postgres -c ssl=on \
              -c ssl_cert_file=/var/lib/postgresql/server.crt \
              -c ssl_key_file=/var/lib/postgresql/server.key

          for _ in $(seq 1 30); do
            db_status="$(docker inspect --format '{{.State.Health.Status}}' "$postgres")"
            if [ "$db_status" = "healthy" ]; then break; fi
            if [ "$db_status" = "unhealthy" ]; then
              echo "::error::Disposable PostgreSQL test service became unhealthy."
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$postgres")" = "healthy" || {
            echo "::error::Disposable PostgreSQL test service did not become healthy."
            exit 1
          }

          docker run --detach --name "$container" --network "$network" --publish 3000:3000 \
            --env PORT=3000 \
            --env NODE_ENV=production \
            --mount "type=bind,src=$tls_dir/server.crt,dst=/run/secrets/postgres-ca.crt,readonly" \
            --env DATABASE_SSL_CA=/run/secrets/postgres-ca.crt \
            --env DATABASE_URL=postgresql://glorifier_test:glorifier_test_only@"$postgres":5432/glorifier_test \
            glorifier/glorifier:ubuntu-pr-${{ github.event.pull_request.number }}

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              echo "Ubuntu runtime started with an isolated PostgreSQL service and /api/health returned success."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ubuntu runtime did not return a healthy response within 60 seconds."
          echo "Container state for diagnosis:"
          docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' "$container" || true
          echo "Application container logs:"
          docker logs "$container" || true
          echo "PostgreSQL test service logs:"
          docker logs "$postgres" || true
          exit 1

      - name: Report all image vulnerabilities (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glorifier/glorifier:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          version: v0.76.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Block image with high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glorifier/glorifier:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          version: v0.76.0
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Block Ubuntu image with high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glorifier/glorifier:ubuntu-pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          version: v0.76.0
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

  publish-after-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'GLORIFIER CI' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit that passed GLORIFIER CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm the CI commit is still the current main tip
        id: current_main
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote https://github.com/GLORIFIER7/GLORIFIER.git refs/heads/main | cut -f1)"
          test -n "$MAIN_SHA" || { echo "::error::Could not resolve current main tip; refusing to publish."; exit 1; }
          if [ "$CI_SHA" = "$MAIN_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale CI commit $CI_SHA; main is now $MAIN_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build candidate image
        if: steps.current_main.outputs.current == 'true'
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: docker build --pull --tag "glorifier/glorifier:${IMAGE_TAG}" .

      - name: Report all candidate image vulnerabilities (non-blocking)
        if: steps.current_main.outputs.current == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glorifier/glorifier:sha-${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: "0"
          vuln-type: os,library
          version: v0.76.0
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Block candidate image with high or critical vulnerabilities
        if: steps.current_main.outputs.current == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: glorifier/glorifier:sha-${{ github.event.workflow_run.head_sha }}
          format: table
          exit-code: "1"
          vuln-type: os,library
          version: v0.76.0
          severity: HIGH,CRITICAL
          skip-setup-trivy: true

      - name: Validate Docker Hub publishing credentials exist
        if: steps.current_main.outputs.current == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Add repository secret DOCKERHUB_USERNAME."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Add repository secret DOCKERHUB_TOKEN."; exit 1; }

      - name: Sign in to Docker Hub
        if: steps.current_main.outputs.current == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and publish verified image
        if: steps.current_main.outputs.current == 'true'
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SOURCE_TAG="glorifier/glorifier:sha-${IMAGE_SHA}"
          for tag in "latest" "${VERSION}" "sha-${IMAGE_SHA}"; do
            docker tag "$SOURCE_TAG" "glorifier/glorifier:${tag}"
            docker push "glorifier/glorifier:${tag}"
          done
          echo "Published tags for source commit ${IMAGE_SHA} after GLORIFIER CI and image vulnerability scan passed."
