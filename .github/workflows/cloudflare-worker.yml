name: GLORIFIER Cloudflare Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Explicitly authorize the production Cloudflare deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glorifier-cloudflare-${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production) && 'deploy' || format('{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Type-check
        run: npm run lint

      - name: Test Cloudflare Worker proxy and fallback handling
        run: npm run test:cloudflare-worker

      - name: Build public frontend for Cloudflare root paths
        run: npm run build:frontend
        env:
          CLOUDFLARE_BUILD: "true"

      - name: Verify static output
        run: test -s dist/index.html

      - name: Install pinned Wrangler CLI without lifecycle scripts
        run: npm install --global --ignore-scripts --no-audit --no-fund wrangler@4.151.1

      - name: Validate Worker bundle and Wrangler configuration (no deploy)
        run: wrangler deploy --dry-run


  deploy-production:
    needs: validate-and-build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build frontend for deployment
        run: npm run build:frontend
        env:
          CLOUDFLARE_BUILD: "true"

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install pinned Wrangler CLI without lifecycle scripts
        run: npm install --global --ignore-scripts --no-audit --no-fund wrangler@4.151.1

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Smoke-test deployed Worker health endpoint
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors https://glorifier.glorifier.workers.dev/api/health)"
          printf '%s' "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const body = JSON.parse(data);
              if (body.ok !== true || body.status !== "worker-ready" || body.layer !== "cloudflare-worker") {
                console.error("Unexpected health response:", data);
                process.exit(1);
              }
            });
          '

      - name: Smoke-test Worker-native business model endpoint
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors https://glorifier.glorifier.workers.dev/api/business-model)"
          printf '%s' "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const body = JSON.parse(data);
              if (body.ok !== true || !body.model || typeof body.model !== "object") {
                console.error("Unexpected business-model response:", data);
                process.exit(1);
              }
            });
          '

      - name: Smoke-test unauthenticated app-state boundary
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          status="$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --output "$output" --write-out '%{http_code}' https://glorifier.glorifier.workers.dev/api/app-state)"
          printf '%s %s\n' "$status" "/api/app-state (unauthenticated)"
          STATUS="$status" node - "$output" <<'NODE'
          const fs = require("node:fs");
          const status = Number(process.env.STATUS);
          const raw = fs.readFileSync(process.argv[2], "utf8");
          let body;
          try { body = JSON.parse(raw); }
          catch {
            console.error("Unauthenticated app-state returned non-JSON content");
            process.exit(1);
          }
          const validAuthFailure =
            body.code === "AUTHENTICATION_REQUIRED" ||
            (body.code === undefined && body.ok === false);
          if (status !== 401 || body === null || typeof body !== "object" || !validAuthFailure) {
            console.error("Unauthenticated app-state boundary failed; expected HTTP 401 and an authentication-required JSON contract; status=" + status + "; code=" + (typeof body?.code === "string" ? body.code : "absent"));
            process.exit(1);
          }
          console.log("Unauthenticated app-state boundary valid; status=401");
          NODE

      - name: Probe identity, runtime verification, and reporting contracts
        run: |
          set -euo pipefail
          probe() {
            local path="$1"
            local allowed_statuses="$2"
            local output
            local status
            output="$(mktemp)"
            status="$(curl --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --output "$output" --write-out '%{http_code}' "https://glorifier.glorifier.workers.dev$path")"
            printf '%s %s\n' "$status" "$path"
            STATUS="$status" ALLOWED="$allowed_statuses" PATHNAME="$path" node - "$output" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const status = Number(process.env.STATUS);
          const allowed = process.env.ALLOWED.split(",").map(Number);
          const path = process.env.PATHNAME;
          const raw = fs.readFileSync(file, "utf8");
          let body;
          try { body = JSON.parse(raw); }
          catch {
            console.error(path + " returned non-JSON content");
            process.exit(1);
          }
          if (!allowed.includes(status)) {
            console.error(path + " returned unexpected HTTP status " + status, raw);
            process.exit(1);
          }
          if (path === "/api/identity") {
            if (!body.identity || typeof body.identity.ready !== "boolean" ||
                !["ready", "not-ready"].includes(body.status)) {
              console.error("Invalid identity response contract", raw);
              process.exit(1);
            }
          } else if (path.startsWith("/api/runtime-verification")) {
            if (body.ok !== true ||
                body.status !== "verified-for-probed-dependencies" ||
                !body.checks || typeof body.checks !== "object" ||
                !body.checks.database || typeof body.checks.database !== "object" ||
                body.checks.database.ok !== true) {
              console.error("Runtime verification did not confirm healthy probed dependencies", raw);
              process.exit(1);
            }
          } else if (path === "/api/reports/summary") {
            if (body.status !== "operational-data-observed" || body.ok !== true) {
              console.error("Invalid reports-summary response contract", raw);
              process.exit(1);
            }
          }
          console.log(path + " response contract valid; status=" + status +
            (body.status ? "; applicationStatus=" + body.status : ""));
          NODE
            rm -f "$output"
          }
          # Identity may legitimately report not-ready until organization domain/email
          # configuration is completed. Database endpoints must return their documented
          # success or explicit degraded/unavailable contract, never HTML or an opaque 500.
          probe "/api/identity" "200,503"
          probe "/api/runtime-verification?probeAi=false" "200"
          probe "/api/reports/summary" "200"
