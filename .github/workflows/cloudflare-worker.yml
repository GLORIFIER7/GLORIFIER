name: GLORIFIER Cloudflare Worker

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Explicitly authorize the production Cloudflare deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: glorifier-cloudflare-${{ github.event_name == 'workflow_dispatch' && 'deploy' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Test Cloudflare Worker proxy and fallback handling
        run: npm run test:cloudflare-worker

      - name: Build public frontend for Cloudflare root paths
        run: npm run build:frontend
        env:
          CLOUDFLARE_BUILD: "true"

      - name: Verify static output
        run: test -s dist/index.html

      - name: Validate Worker bundle and Wrangler configuration (no deploy)
        run: npx --yes wrangler@4.151.1 deploy --dry-run


  deploy-production:
    needs: validate-and-build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend for deployment
        run: npm run build:frontend
        env:
          CLOUDFLARE_BUILD: "true"

      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.151.1 deploy

      - name: Smoke-test deployed Worker health endpoint
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors https://glorifier.glorifier.workers.dev/api/health)"
          printf '%s' "$response" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const body = JSON.parse(data);
              if (body.ok !== true || body.status !== "worker-ready" || body.layer !== "cloudflare-worker") {
                console.error("Unexpected health response:", data);
                process.exit(1);
              }
            });
          '
