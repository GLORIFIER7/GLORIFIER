name: GLORIFIER Full-Stack Verification
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GLORIFIER CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FRONTEND_URL: ${{ vars.GLORIFIER_FRONTEND_URL || 'https://glorifier.glorifier.workers.dev' }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Cloudflare production endpoints
        run: node scripts/full-stack-smoke.mjs
  report:
    if: always()
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Verification summary
        run: |
          if [ "${{ needs.smoke.result }}" = "success" ]; then
            echo "CLOUDFLARE PRODUCTION VERIFICATION: all configured endpoint checks passed."
          else
            echo "CLOUDFLARE PRODUCTION VERIFICATION: required endpoints are not ready; inspect the smoke job logs."
            echo "A missing identity or database configuration is a real readiness failure and must not be reported as healthy."
          fi
