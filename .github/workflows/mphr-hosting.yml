name: GEAS MPHR Hosting Verification

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.frontend"
      - "vercel.json"
      - "scripts/serve-frontend.mjs"
      - "scripts/frontend-static-server.test.mjs"
      - "scripts/mphr-hosting-contract.test.mjs"
      - "docs/architecture/geas-multi-provider-hosting-resilience.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mphr-hosting.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile.frontend"
      - "vercel.json"
      - "scripts/serve-frontend.mjs"
      - "scripts/frontend-static-server.test.mjs"
      - "scripts/mphr-hosting-contract.test.mjs"
      - "docs/architecture/geas-multi-provider-hosting-resilience.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mphr-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glorifier-mphr-hosting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-hosting-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Type-check application source
        run: npm run lint

      - name: Test MPHR frontend and hosting contracts
        run: npm run test:mphr-hosting

      - name: Build the original React/Vite frontend
        run: npm run build:frontend

      - name: Verify Cloudflare static asset manifest remains intact
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/_routes.json
          cmp public/_routes.json dist/_routes.json

      - name: Build portable static frontend container
        run: docker build --pull --file Dockerfile.frontend --tag "glorifier/frontend-mphr:${GITHUB_SHA}" .

      - name: Verify the frontend container runs as non-root
        run: |
          set -euo pipefail
          configured_user="$(docker image inspect --format '{{.Config.User}}' "glorifier/frontend-mphr:${GITHUB_SHA}")"
          test "$configured_user" = "node"

      - name: Smoke-test static frontend and fail-closed API boundary
        shell: bash
        run: |
          set -euo pipefail
          container="glorifier-mphr-smoke-${GITHUB_RUN_ID}"
          output="$RUNNER_TEMP/glorifier-mphr-response.json"
          trap 'docker logs "$container" 2>/dev/null || true; docker rm --force "$container" >/dev/null 2>&1 || true; rm -f "$output"' EXIT

          docker run --detach --name "$container" --publish 127.0.0.1:18080:8080 "glorifier/frontend-mphr:${GITHUB_SHA}"

          ready=false
          for attempt in $(seq 1 30); do
            echo "Waiting for static frontend readiness (attempt ${attempt}/30)"
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz --output "$output"; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = "true"

          node - "$output" <<'NODE'
          const fs = require("node:fs");
          const health = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (health.ok !== true ||
              health.service !== "glorifier-static-frontend" ||
              health.status !== "static-assets-ready" ||
              health.backend !== "not-probed") {
            throw new Error("Static health response must not claim backend readiness.");
          }
          NODE

          curl --fail --silent --show-error http://127.0.0.1:18080/ | grep -q 'id="root"'

          api_status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' http://127.0.0.1:18080/api/health)"
          test "$api_status" = "503"
          node - "$output" <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (body.ok !== false || body.code !== "BACKEND_NOT_CONFIGURED") {
            throw new Error("Static frontend must fail closed rather than return the SPA shell for API routes.");
          }
          NODE

          asset_status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' http://127.0.0.1:18080/assets/missing.js)"
          test "$asset_status" = "404"
