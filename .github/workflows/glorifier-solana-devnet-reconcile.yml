name: GLORIFIER Solana Devnet Reconciliation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY_GLORIFIER_SOLANA_DEVNET to authorize read-only reconciliation"
        required: true
        type: string
      mint_address:
        description: "Existing GLORIFIER Token-2022 Devnet mint address to verify (leave blank to recover it from deployment evidence)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  control-plane:
    name: Reconciliation control-plane health
    runs-on: ubuntu-latest
    steps:
      - name: Report authorization boundary
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "Authorized manual reconciliation request detected."
          else
            echo "Read-only reconciliation is manual-only; no asset mutation or verification is executed for this event."
          fi

  reconcile:
    name: Reconcile GLORIFIER GLR on Solana Devnet
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: glorifier-solana-devnet-reconcile
      cancel-in-progress: false
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      AGAVE_VERSION: v4.2.2
      CONFIRMATION: ${{ inputs.confirm }}
      MINT_ADDRESS_INPUT: ${{ inputs.mint_address }}

    steps:
      - name: Validate reconciliation execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch" || {
            echo "::error::Refusing reconciliation: workflow_dispatch is required."
            exit 1
          }
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Refusing reconciliation: only the main branch is authorized."
            exit 1
          }
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "::error::Refusing reconciliation: GITHUB_REF_NAME must be main."
            exit 1
          }

      - name: Validate reconciliation authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "VERIFY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Refusing reconciliation: exact confirmation required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve existing Devnet mint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${MINT_ADDRESS_INPUT}" ]]; then
            MINT_ADDRESS="${MINT_ADDRESS_INPUT}"
            echo "Using explicitly supplied existing mint address."
          else
            echo "No mint address supplied; checking canonical identity first."
            CANONICAL_MINT="$(jq -r '.canonical_mint // empty' solana/canonical-devnet-identity.json)"

            if [[ -n "${CANONICAL_MINT}" ]]; then
              MINT_ADDRESS="${CANONICAL_MINT}"
              echo "Recovered canonical mint from repository identity registry."
            else
              echo "Canonical mint is not published; searching only Solana Devnet deployment workflow runs on main."
              DEPLOYMENT_RUNS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/glorifier-solana-devnet.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"

              DEPLOYMENT_RUN_ID=""
              ARTIFACT_ID=""
              ARTIFACT_DIGEST=""

              while IFS= read -r DEPLOYMENT_RUN_ID_CANDIDATE; do
                [[ -n "${DEPLOYMENT_RUN_ID_CANDIDATE}" ]] || continue

                DEPLOYMENT_RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID_CANDIDATE}")"
                jq -e '.path == ".github/workflows/glorifier-solana-devnet.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and (.conclusion != "cancelled")' <<<"${DEPLOYMENT_RUN_JSON}" >/dev/null || continue

                RUN_ARTIFACTS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID_CANDIDATE}/artifacts?per_page=100")"

                CANDIDATE="$(jq -r --arg run_id "${DEPLOYMENT_RUN_ID_CANDIDATE}" '
                  [.artifacts[]?
                   | select(.expired == false)
                   | select(.name == "glorifier-solana-devnet-evidence")
                   | select(.workflow_run.id == ($run_id | tonumber))
                   | select(.digest != null and (.digest | startswith("sha256:")))]
                  | sort_by(.created_at)
                  | last
                  | [(.id // ""), (.digest // "")]
                  | @tsv
                ' <<<"${RUN_ARTIFACTS_JSON}")"

                CANDIDATE_ARTIFACT_ID="${CANDIDATE%%$'\t'*}"
                CANDIDATE_ARTIFACT_DIGEST="${CANDIDATE#*$'\t'}"

                if [[ -n "${CANDIDATE_ARTIFACT_ID}" && -n "${CANDIDATE_ARTIFACT_DIGEST}" && "${CANDIDATE_ARTIFACT_ID}" != "${CANDIDATE_ARTIFACT_DIGEST}" ]]; then
                  DEPLOYMENT_RUN_ID="${DEPLOYMENT_RUN_ID_CANDIDATE}"
                  ARTIFACT_ID="${CANDIDATE_ARTIFACT_ID}"
                  ARTIFACT_DIGEST="${CANDIDATE_ARTIFACT_DIGEST}"
                  break
                fi
              done < <(
                jq -r '
                  [.workflow_runs[]?
                   | select(.event == "workflow_dispatch")
                   | select(.head_branch == "main")
                   | select(.path == ".github/workflows/glorifier-solana-devnet.yml")
                   | select(.conclusion != "cancelled")]
                  | sort_by(.created_at)
                  | reverse
                  | .[].id
                ' <<<"${DEPLOYMENT_RUNS_JSON}"
              )

              if [[ -z "${ARTIFACT_ID}" ]]; then
                mkdir -p solana
                cat > solana/reconciliation-status.txt <<'EOF'
GLR_STATUS=NOT_VERIFIED
REASON=NO_CANONICAL_MINT_OR_DEPLOYMENT_EVIDENCE
EOF
                cat > solana/reconciliation-evidence.json <<'EOF'
{
  "network": "solana-devnet",
  "status": "NOT_VERIFIED",
  "mode": "RECONCILIATION_READ_ONLY",
  "verification_boundary": "No mint address or deployment evidence is currently published; this workflow did not create or mutate any asset.",
  "mint": null,
  "programId": "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb",
  "name": "GLORIFIER",
  "symbol": "GLR",
  "decimals": 9,
  "totalSupply": "1000000000",
  "mintAuthority": null,
  "freezeAuthority": null,
  "next_action": "Run the authorized Solana Devnet deployment workflow once before attempting reconciliation."
}
EOF
                jq -e '.status == "NOT_VERIFIED" and .mode == "RECONCILIATION_READ_ONLY" and .mint == null' solana/reconciliation-evidence.json >/dev/null
                echo "No canonical mint or deployment evidence exists; reconciliation remains NOT_VERIFIED."
                exit 0
              fi

              echo "Resolved deployment run: ${DEPLOYMENT_RUN_ID}"
              echo "Resolved deployment artifact: ${ARTIFACT_ID}"
              echo "Expected artifact digest: ${ARTIFACT_DIGEST}"

              rm -rf /tmp/glorifier-solana-recovered-evidence
              mkdir -p /tmp/glorifier-solana-recovered-evidence
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/glorifier-solana-devnet-evidence.zip

              ACTUAL_ARTIFACT_DIGEST="sha256:$(sha256sum /tmp/glorifier-solana-devnet-evidence.zip | awk '{print $1}')"
              test "${ACTUAL_ARTIFACT_DIGEST}" = "${ARTIFACT_DIGEST}" || {
                echo "::error::Deployment artifact digest mismatch; refusing untrusted evidence."
                echo "::error::Expected: ${ARTIFACT_DIGEST}"
                echo "::error::Actual:   ${ACTUAL_ARTIFACT_DIGEST}"
                exit 1
              }

              unzip -oq /tmp/glorifier-solana-devnet-evidence.zip -d /tmp/glorifier-solana-recovered-evidence

              EVIDENCE_FILE="$(find /tmp/glorifier-solana-recovered-evidence -type f -name "deployment-evidence.json" -print -quit)"
              test -n "${EVIDENCE_FILE}" || {
                echo "::error::Deployment evidence artifact does not contain deployment-evidence.json."
                exit 1
              }

              jq -e --arg run_id "${DEPLOYMENT_RUN_ID}" --arg repo "${GITHUB_REPOSITORY}" '
                (.network == "solana-devnet")
                and (.programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb")
                and (.status == "DEPLOYED" or .status == "READY_FOR_VERIFICATION" or .status == "FULLY_VERIFIED")
                and (.mint | type == "string" and length >= 32 and length <= 44)
                and (.status != "FULLY_VERIFIED" or (.verification.runId == $run_id and .verification.runUrl == ("https://github.com/" + $repo + "/actions/runs/" + $run_id)))
              ' "${EVIDENCE_FILE}" >/dev/null || {
                echo "::error::Recovered deployment evidence failed workflow-run provenance validation."
                exit 1
              }

              MINT_ADDRESS="$(jq -r '.mint // empty' "${EVIDENCE_FILE}")"
              test -n "${MINT_ADDRESS}" || {
                echo "::error::deployment-evidence.json does not contain a mint address."
                exit 1
              }

              echo "Recovered mint from deployment evidence artifact ${ARTIFACT_ID}."
            fi
          fi

          [[ "${MINT_ADDRESS}" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]] || {
            echo "::error::Invalid Solana mint address format."
            exit 1
          }

          readonly EXCLUDED_EXISTING_MINT="FrJhrVGjNRiB1eZpg5PTqLp9VSQS5rpwMp7jxNtEmV9G"
          [[ "${MINT_ADDRESS}" != "${EXCLUDED_EXISTING_MINT}" ]] || {
            echo "::error::Refusing the excluded pre-existing GLR mint."
            exit 1
          }

          echo "MINT_ADDRESS=${MINT_ADDRESS}" >> "${GITHUB_ENV}"

      - name: Validate resolved mint address
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MINT_ADDRESS}"
          echo "Resolved GLORIFIER Token-2022 Devnet mint: ${MINT_ADDRESS}"

      - name: Bind resolved mint to deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CANONICAL_MINT="$(jq -r '.canonical_mint // empty' solana/canonical-devnet-identity.json)"
          if [[ -n "${CANONICAL_MINT}" ]]; then
            test "${CANONICAL_MINT}" = "${MINT_ADDRESS}" || {
              echo "::error::Resolved mint does not match canonical identity."
              exit 1
            }
            jq -e --arg mint "${CANONICAL_MINT}" '
              .status == "VERIFIED_ON_CHAIN"
              and .canonical_mint == $mint
              and (.creation_transaction | type == "string" and length > 0)
              and (.metadata_transaction | type == "string" and length > 0)
              and (.token_account_creation_transaction | type == "string" and length > 0)
              and (.mint_transaction | type == "string" and length > 0)
              and (.authority_revocation_transaction | type == "string" and length > 0)
            ' solana/canonical-devnet-identity.json >/dev/null
            jq '. as $x | $x' solana/canonical-devnet-identity.json > solana/deployment-provenance.json
            echo "Canonical identity already contains deployment provenance for this mint."
            exit 0
          fi

          RUNS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/glorifier-solana-devnet.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
          FOUND=0

          while IFS= read -r RUN_ID; do
            [[ -n "${RUN_ID}" ]] || continue
            RUN_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
            jq -e '
              .path == ".github/workflows/glorifier-solana-devnet.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .conclusion == "success"
            ' <<<"${RUN_JSON}" >/dev/null || continue

            ARTIFACTS_JSON="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100")"
            while IFS=
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.0.2
          spl-token --version

      - name: Configure canonical Devnet RPC
        shell: bash
        run: |
          set -euo pipefail
          solana config set --url "$SOLANA_RPC_URL"
          RPC_URL="$(solana config get | awk -F': ' '/RPC URL/ {print $2}')"
          test "$RPC_URL" = "$SOLANA_RPC_URL" || {
            echo "::error::Refusing reconciliation: non-canonical Solana Devnet RPC: $RPC_URL"
            exit 1
          }
          solana cluster-version

      - name: Independently confirm deployment transactions on canonical Devnet
        shell: bash
        run: |
          set -euo pipefail

          test -f solana/deployment-provenance.json
          declare -a TX_FIELDS=(
            creationTransaction
            metadataTransaction
            tokenAccountCreationTransaction
            mintTransaction
            mintAuthorityRevocationTransaction
            freezeAuthorityRevocationTransaction
          )

          : > solana/reconciliation-transactions.txt
          for FIELD in "${TX_FIELDS[@]}"; do
            TX="$(jq -r --arg field "${FIELD}" '.[$field] // empty' solana/deployment-provenance.json)"
            [[ "${TX}" =~ ^[1-9A-HJ-NP-Za-km-z]{64,88}$ ]] || {
              echo "::error::Invalid transaction signature in deployment provenance: ${FIELD}"
              exit 1
            }

            echo "Confirming ${FIELD}: ${TX}"
            solana confirm "${TX}" --commitment confirmed | tee -a solana/reconciliation-transactions.txt
            solana confirm "${TX}" --commitment confirmed >/dev/null
          done

          echo "All deployment transactions independently confirmed on canonical Solana Devnet."
          
      - name: Reconcile existing Token-2022 mint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x solana/reconcile-token2022-devnet.sh
          solana config set --commitment confirmed
          ./solana/reconcile-token2022-devnet.sh "$MINT_ADDRESS"

      - name: Publish canonical identity only after independent on-chain reconciliation
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          test -f solana/reconciliation-evidence.json
          test -f solana/deployment-provenance.json

          jq -e --arg mint "${MINT_ADDRESS}" '
            .status == "VERIFIED_ON_CHAIN"
            and .mode == "RECONCILIATION_READ_ONLY"
            and .network == "solana-devnet"
            and .mint == $mint
            and .programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
            and .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .mintAuthority == null
            and .freezeAuthority == null
          ' solana/reconciliation-evidence.json >/dev/null

          jq -e --arg mint "${MINT_ADDRESS}" '
            .mint == $mint
            and (.creationTransaction | type == "string" and length > 0)
            and (.metadataTransaction | type == "string" and length > 0)
            and (.tokenAccountCreationTransaction | type == "string" and length > 0)
            and (.mintTransaction | type == "string" and length > 0)
            and (.mintAuthorityRevocationTransaction | type == "string" and length > 0)
            and (.freezeAuthorityRevocationTransaction | type == "string" and length > 0)
          ' solana/deployment-provenance.json >/dev/null

          jq --arg mint "${MINT_ADDRESS}"              --arg creation "$(jq -r '.creationTransaction' solana/deployment-provenance.json)"              --arg metadata "$(jq -r '.metadataTransaction' solana/deployment-provenance.json)"              --arg token_account "$(jq -r '.tokenAccountCreationTransaction' solana/deployment-provenance.json)"              --arg mint_tx "$(jq -r '.mintTransaction' solana/deployment-provenance.json)"              --arg authority "$(jq -r '.mintAuthorityRevocationTransaction' solana/deployment-provenance.json)"              --arg freeze "$(jq -r '.freezeAuthorityRevocationTransaction' solana/deployment-provenance.json)"              --arg run_id "${GITHUB_RUN_ID}"              --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"              --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            .canonical_mint = $mint
            | .creation_transaction = $creation
            | .metadata_transaction = $metadata
            | .token_account_creation_transaction = $token_account
            | .mint_transaction = $mint_tx
            | .authority_revocation_transaction = $authority
            | .freeze_authority_revocation_transaction = $freeze
            | .status = "VERIFIED_ON_CHAIN"
            | .verification_run_id = $run_id
            | .verification_run_url = $run_url
            | .verified_at = $verified_at
            | .next_action = "Independent read-only reconciliation passed. Solana Devnet identity is canonical for this verified deployment."
          ' solana/canonical-devnet-identity.json > solana/canonical-devnet-identity.json.tmp

          mv solana/canonical-devnet-identity.json.tmp solana/canonical-devnet-identity.json

          jq -e --arg mint "${MINT_ADDRESS}" '
            .status == "VERIFIED_ON_CHAIN"
            and .canonical_mint == $mint
            and .creation_transaction
            and .metadata_transaction
            and .token_account_creation_transaction
            and .mint_transaction
            and .authority_revocation_transaction
            and .freeze_authority_revocation_transaction
            and .verification_run_id
          ' solana/canonical-devnet-identity.json >/dev/null

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solana/canonical-devnet-identity.json
          if git diff --cached --quiet; then
            echo "Canonical identity already published; no commit required."
          else
            git commit -m "chore(solana): publish independently verified GLR devnet identity"
            git push origin HEAD:main
          fi

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glorifier-solana-devnet-reconciliation-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            solana/reconciliation-status.txt
            solana/reconciliation-account.txt
            solana/reconciliation-supply.txt
            solana/reconciliation-mint-state.txt
            solana/reconciliation-evidence.json
\t' read -r ARTIFACT_ID ARTIFACT_DIGEST; do
              [[ -n "${ARTIFACT_ID}" && -n "${ARTIFACT_DIGEST}" ]] || continue

              rm -rf /tmp/glorifier-solana-bind
              mkdir -p /tmp/glorifier-solana-bind
              gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/glorifier-solana-bind.zip
              ACTUAL="sha256:$(sha256sum /tmp/glorifier-solana-bind.zip | awk '{print $1}')"
              test "${ACTUAL}" = "${ARTIFACT_DIGEST}" || {
                echo "::error::Deployment artifact digest mismatch for artifact ${ARTIFACT_ID}."
                exit 1
              }
              unzip -oq /tmp/glorifier-solana-bind.zip -d /tmp/glorifier-solana-bind
              EVIDENCE_FILE="$(find /tmp/glorifier-solana-bind -type f -name deployment-evidence.json -print -quit || true)"
              [[ -n "${EVIDENCE_FILE}" ]] || continue

              if jq -e --arg mint "${MINT_ADDRESS}" --arg run_id "${RUN_ID}" --arg repo "${GITHUB_REPOSITORY}" '
                .network == "solana-devnet"
                and .programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
                and .mint == $mint
                and (.creationTransaction | type == "string" and length > 0)
                and (.metadataTransaction | type == "string" and length > 0)
                and (.tokenAccountCreationTransaction | type == "string" and length > 0)
                and (.mintTransaction | type == "string" and length > 0)
                and (.mintAuthorityRevocationTransaction | type == "string" and length > 0)
                and (.freezeAuthorityRevocationTransaction | type == "string" and length > 0)
                and (.status == "READY_FOR_VERIFICATION" or .status == "FULLY_VERIFIED")
              ' "${EVIDENCE_FILE}" >/dev/null; then
                jq --arg run_id "${RUN_ID}" --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --arg artifact_id "${ARTIFACT_ID}" --arg artifact_digest "${ARTIFACT_DIGEST}" '
                  . + {
                    deploymentRunId: $run_id,
                    deploymentRunUrl: $run_url,
                    deploymentArtifactId: $artifact_id,
                    deploymentArtifactDigest: $artifact_digest
                  }
                ' "${EVIDENCE_FILE}" > solana/deployment-provenance.json
                FOUND=1
                break 2
              fi
            done < <(
              jq -r '
                [.artifacts[]?
                 | select(.expired == false)
                 | select(.name == "glorifier-solana-devnet-evidence")
                 | select(.workflow_run.id != null)
                 | select(.digest != null and (.digest | startswith("sha256:")))]
                | sort_by(.created_at)
                | reverse
                | .[]
                | [(.id|tostring), .digest]
                | @tsv
              ' <<<"${ARTIFACTS_JSON}"
            )
          done < <(
            jq -r '
              [.workflow_runs[]?
               | select(.event == "workflow_dispatch")
               | select(.head_branch == "main")
               | select(.path == ".github/workflows/glorifier-solana-devnet.yml")]
              | sort_by(.created_at)
              | reverse
              | .[].id
            ' <<<"${RUNS_JSON}"
          )

          test "${FOUND}" -eq 1 || {
            echo "::error::No trusted deployment evidence artifact matches the resolved mint."
            exit 1
          }

          jq -e --arg mint "${MINT_ADDRESS}" '
            .mint == $mint
            and .creationTransaction
            and .metadataTransaction
            and .tokenAccountCreationTransaction
            and .mintTransaction
            and .mintAuthorityRevocationTransaction
            and .freezeAuthorityRevocationTransaction
          ' solana/deployment-provenance.json >/dev/null

          echo "Resolved mint is cryptographically bound to a successful deployment artifact."

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.0.2
          spl-token --version

      - name: Configure canonical Devnet RPC
        shell: bash
        run: |
          set -euo pipefail
          solana config set --url "$SOLANA_RPC_URL"
          RPC_URL="$(solana config get | awk -F': ' '/RPC URL/ {print $2}')"
          test "$RPC_URL" = "$SOLANA_RPC_URL" || {
            echo "::error::Refusing reconciliation: non-canonical Solana Devnet RPC: $RPC_URL"
            exit 1
          }
          solana cluster-version

      - name: Reconcile existing Token-2022 mint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x solana/reconcile-token2022-devnet.sh
          solana config set --commitment confirmed
          ./solana/reconcile-token2022-devnet.sh "$MINT_ADDRESS"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glorifier-solana-devnet-reconciliation-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            solana/reconciliation-status.txt
            solana/reconciliation-account.txt
            solana/reconciliation-supply.txt
            solana/reconciliation-mint-state.txt
            solana/reconciliation-evidence.json
