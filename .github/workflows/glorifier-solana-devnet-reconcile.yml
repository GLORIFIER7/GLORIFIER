name: GLORIFIER Solana Devnet Reconciliation

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY_GLORIFIER_SOLANA_DEVNET to authorize read-only on-chain reconciliation"
        required: true
        type: string
      deployment_run_id:
        description: "Exact successful GLORIFIER Solana Devnet deployment workflow run ID to reconcile"
        required: true
        type: string
      mint_address:
        description: "Existing GLORIFIER Token-2022 Devnet mint address (optional; must match the exact deployment evidence)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  reconcile:
    name: Reconcile GLORIFIER GLR on Solana Devnet
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: glorifier-solana-devnet-reconcile
      cancel-in-progress: false
    env:
      SOLANA_RPC_URL: https://api.devnet.solana.com
      AGAVE_VERSION: v4.2.2
      CONFIRMATION: ${{ inputs.confirm }}
      DEPLOYMENT_RUN_ID_INPUT: ${{ inputs.deployment_run_id }}
      MINT_ADDRESS_INPUT: ${{ inputs.mint_address }}

    steps:
      - name: Validate reconciliation execution boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch" || {
            echo "::error::Refusing reconciliation: workflow_dispatch is required."
            exit 1
          }
          test "${GITHUB_REF}" = "refs/heads/main" || {
            echo "::error::Refusing reconciliation: only the main branch is authorized."
            exit 1
          }
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "::error::Refusing reconciliation: GITHUB_REF_NAME must be main."
            exit 1
          }
          [[ "${DEPLOYMENT_RUN_ID_INPUT}" =~ ^[0-9]+$ ]] || {
            echo "::error::deployment_run_id must be a numeric GitHub Actions run ID."
            exit 1
          }

      - name: Validate reconciliation authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "VERIFY_GLORIFIER_SOLANA_DEVNET" || {
            echo "::error::Refusing reconciliation: exact confirmation required."
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve exact deployment run and artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          readonly DEPLOYMENT_RUN_ID="${DEPLOYMENT_RUN_ID_INPUT}"
          readonly EXPECTED_WORKFLOW=".github/workflows/glorifier-solana-devnet.yml"
          readonly EXPECTED_REPOSITORY="${GITHUB_REPOSITORY}"
          readonly EXCLUDED_EXISTING_MINT="FrJhrVGjNRiB1eZpg5PTqLp9VSQS5rpwMp7jxNtEmV9G"

          DEPLOYMENT_RUN_JSON="$(gh api "/repos/${EXPECTED_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}")"

          jq -e --arg workflow "$EXPECTED_WORKFLOW" --argjson run_id "$DEPLOYMENT_RUN_ID" '
            .id == $run_id
            and .path == $workflow
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .status == "completed"
            and .conclusion == "success"
          ' <<<"${DEPLOYMENT_RUN_JSON}" >/dev/null || {
            echo "::error::The supplied run is not the exact successful main-branch deployment workflow run."
            exit 1
          }

          DEPLOYMENT_HEAD_SHA="$(jq -r '.head_sha' <<<"${DEPLOYMENT_RUN_JSON}")"
          DEPLOYMENT_RUN_URL="$(jq -r '.html_url' <<<"${DEPLOYMENT_RUN_JSON}")"

          RUN_ARTIFACTS_JSON="$(gh api "/repos/${EXPECTED_REPOSITORY}/actions/runs/${DEPLOYMENT_RUN_ID}/artifacts?per_page=100")"
          ARTIFACT_RECORD="$(jq -r '
            [.artifacts[]?
             | select(.expired == false)
             | select(.name == "glorifier-solana-devnet-evidence")
             | select(.workflow_run.id == '${DEPLOYMENT_RUN_ID}')
             | select(.digest != null and (.digest | startswith("sha256:")))]
            | sort_by(.created_at)
            | last
            | [(.id // ""), (.digest // ""), (.size_in_bytes // 0)]
            | @tsv
          ' <<<"${RUN_ARTIFACTS_JSON}")"

          IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_DIGEST ARTIFACT_SIZE <<<"${ARTIFACT_RECORD}"

          test -n "${ARTIFACT_ID}" || {
            echo "::error::No unexpired deployment evidence artifact belongs to the exact deployment run."
            exit 1
          }
          test -n "${ARTIFACT_DIGEST}" || {
            echo "::error::The exact deployment evidence artifact has no SHA-256 digest."
            exit 1
          }

          rm -rf /tmp/glorifier-solana-recovered-evidence
          mkdir -p /tmp/glorifier-solana-recovered-evidence

          gh api "/repos/${EXPECTED_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/glorifier-solana-devnet-evidence.zip

          ACTUAL_ARTIFACT_DIGEST="sha256:$(sha256sum /tmp/glorifier-solana-devnet-evidence.zip | awk '{print $1}')"
          test "${ACTUAL_ARTIFACT_DIGEST}" = "${ARTIFACT_DIGEST}" || {
            echo "::error::Deployment artifact digest mismatch; refusing untrusted evidence."
            echo "::error::Expected: ${ARTIFACT_DIGEST}"
            echo "::error::Actual:   ${ACTUAL_ARTIFACT_DIGEST}"
            exit 1
          }

          unzip -oq /tmp/glorifier-solana-devnet-evidence.zip -d /tmp/glorifier-solana-recovered-evidence

          EVIDENCE_FILE="$(find /tmp/glorifier-solana-recovered-evidence -type f -name deployment-evidence.json -print -quit)"
          test -n "${EVIDENCE_FILE}" || {
            echo "::error::Exact deployment artifact does not contain deployment-evidence.json."
            exit 1
          }

          jq -e --arg expected_run "${DEPLOYMENT_RUN_ID}" --arg expected_mint "${MINT_ADDRESS_INPUT}" '
            .status == "DEPLOYED"
            and .network == "solana-devnet"
            and .programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
            and .mint
            and (.mint | length >= 32 and length <= 44)
            and (.mint != "FrJhrVGjNRiB1eZpg5PTqLp9VSQS5rpwMp7jxNtEmV9G")
            and .name == "GLORIFIER"
            and .symbol == "GLR"
            and .decimals == 9
            and .totalSupply == "1000000000"
            and .mintAuthority == null
            and .freezeAuthority == null
            and (.creationTransaction | type == "string" and length >= 80 and length <= 100)
            and (.metadataTransaction | type == "string" and length >= 80 and length <= 100)
            and (.tokenAccountCreationTransaction | type == "string" and length >= 80 and length <= 100)
            and (.mintTransaction | type == "string" and length >= 80 and length <= 100)
            and (.mintAuthorityRevocationTransaction | type == "string" and length >= 80 and length <= 100)
            and (.freezeAuthorityRevocationTransaction | type == "string" and length >= 80 and length <= 100)
            and ($expected_mint == "" or .mint == $expected_mint)
          ' "${EVIDENCE_FILE}" >/dev/null || {
            echo "::error::Deployment evidence is not an exact DEPLOYED receipt for GLORIFIER Token-2022."
            exit 1
          }

          cp "${EVIDENCE_FILE}" solana/deployment-evidence.json

          jq -n \
            --arg run_id "${DEPLOYMENT_RUN_ID}" \
            --arg run_url "${DEPLOYMENT_RUN_URL}" \
            --arg head_sha "${DEPLOYMENT_HEAD_SHA}" \
            --arg artifact_id "${ARTIFACT_ID}" \
            --arg artifact_digest "${ARTIFACT_DIGEST}" \
            --arg artifact_size "${ARTIFACT_SIZE}" \
            --arg mint "$(jq -r '.mint' "${EVIDENCE_FILE}")" \
            '{
              deployment_run_id: $run_id,
              deployment_run_url: $run_url,
              deployment_head_sha: $head_sha,
              artifact_id: $artifact_id,
              artifact_digest: $artifact_digest,
              artifact_size_bytes: $artifact_size,
              mint: $mint
            }' > solana/reconciliation-provenance.json

          {
            echo "DEPLOYMENT_RUN_ID=${DEPLOYMENT_RUN_ID}"
            echo "DEPLOYMENT_RUN_URL=${DEPLOYMENT_RUN_URL}"
            echo "DEPLOYMENT_HEAD_SHA=${DEPLOYMENT_HEAD_SHA}"
            echo "DEPLOYMENT_ARTIFACT_ID=${ARTIFACT_ID}"
            echo "DEPLOYMENT_ARTIFACT_DIGEST=${ARTIFACT_DIGEST}"
            echo "MINT_ADDRESS=$(jq -r '.mint' "${EVIDENCE_FILE}")"
          } >> "${GITHUB_ENV}"

          printf 'GLR_STATUS=DEPLOYMENT_EVIDENCE_AUTHENTICATED\n' | tee solana/reconciliation-status.txt
          echo "Exact deployment run: ${DEPLOYMENT_RUN_ID}"
          echo "Exact artifact: ${ARTIFACT_ID}"
          echo "Artifact digest: ${ARTIFACT_DIGEST}"
          echo "Mint: $(jq -r '.mint' "${EVIDENCE_FILE}")"

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL "https://release.anza.xyz/${AGAVE_VERSION}/install")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install SPL Token CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.6.1
          spl-token --version

      - name: Configure canonical Devnet RPC
        shell: bash
        run: |
          set -euo pipefail
          solana config set --url "$SOLANA_RPC_URL"
          RPC_URL="$(solana config get | awk -F': ' '/RPC URL/ {print $2}')"
          test "$RPC_URL" = "$SOLANA_RPC_URL" || {
            echo "::error::Refusing reconciliation: non-canonical Solana Devnet RPC: $RPC_URL"
            exit 1
          }
          test "$SOLANA_RPC_URL" = "https://api.devnet.solana.com" || {
            echo "::error::Refusing reconciliation: canonical Devnet RPC must be https://api.devnet.solana.com"
            exit 1
          }
          solana cluster-version

      - name: Reconcile existing Token-2022 mint
        shell: bash
        env:
          GLORIFIER_DEPLOYMENT_EVIDENCE: solana/deployment-evidence.json
        run: |
          set -euo pipefail
          chmod +x solana/reconcile-token2022-devnet.sh
          solana config set --commitment confirmed
          ./solana/reconcile-token2022-devnet.sh "$MINT_ADDRESS"

          jq -e --arg mint "$MINT_ADDRESS" '
            .status == "VERIFIED_ON_CHAIN"
            and .mint == $mint
            and .programId == "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
            and .transactionSignaturesVerified == true
            and .transactionSignatureCount == 6
          ' solana/reconciliation-evidence.json >/dev/null || {
            echo "::error::Independent on-chain reconciliation did not produce the required VERIFIED_ON_CHAIN boundary."
            exit 1
          }

      - name: Publish canonical identity after VERIFIED_ON_CHAIN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          test "$(jq -r '.status' solana/reconciliation-evidence.json)" = "VERIFIED_ON_CHAIN" || {
            echo "::error::Canonical identity publication is prohibited before VERIFIED_ON_CHAIN."
            exit 1
          }

          readonly BRANCH="automation/solana-devnet-canonical-${DEPLOYMENT_RUN_ID}"
          readonly RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          jq \
            --arg mint "${MINT_ADDRESS}" \
            --arg deployment_run_id "${DEPLOYMENT_RUN_ID}" \
            --arg deployment_run_url "${DEPLOYMENT_RUN_URL}" \
            --arg deployment_head_sha "${DEPLOYMENT_HEAD_SHA}" \
            --arg artifact_id "${DEPLOYMENT_ARTIFACT_ID}" \
            --arg artifact_digest "${DEPLOYMENT_ARTIFACT_DIGEST}" \
            --arg creation "$(jq -r '.creationTransaction' solana/deployment-evidence.json)" \
            --arg metadata "$(jq -r '.metadataTransaction' solana/deployment-evidence.json)" \
            --arg account "$(jq -r '.tokenAccountCreationTransaction' solana/deployment-evidence.json)" \
            --arg mint_tx "$(jq -r '.mintTransaction' solana/deployment-evidence.json)" \
            --arg mint_auth "$(jq -r '.mintAuthorityRevocationTransaction' solana/deployment-evidence.json)" \
            --arg freeze_auth "$(jq -r '.freezeAuthorityRevocationTransaction' solana/deployment-evidence.json)" \
            --arg reconciliation_run_id "${GITHUB_RUN_ID}" \
            --arg reconciliation_run_url "${RUN_URL}" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.
            | .canonical_mint = $mint
            | .creation_transaction = $creation
            | .metadata_transaction = $metadata
            | .token_account_creation_transaction = $account
            | .mint_transaction = $mint_tx
            | .authority_revocation_transaction = $mint_auth
            | .freeze_authority_revocation_transaction = $freeze_auth
            | .deployment_run_id = $deployment_run_id
            | .deployment_run_url = $deployment_run_url
            | .deployment_head_sha = $deployment_head_sha
            | .deployment_artifact_id = $artifact_id
            | .deployment_artifact_digest = $artifact_digest
            | .verification_run_id = $reconciliation_run_id
            | .verification_run_url = $reconciliation_run_url
            | .verified_at = $verified_at
            | .status = "FULLY_VERIFIED"
            | .next_action = "Do not create another mint. Continue with read-only reconciliation of the canonical mint."
            ' solana/canonical-devnet-identity.json > solana/canonical-devnet-identity.tmp.json

          mv solana/canonical-devnet-identity.tmp.json solana/canonical-devnet-identity.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add solana/canonical-devnet-identity.json solana/deployment-evidence.json solana/reconciliation-*.json solana/reconciliation-*.txt
          git commit -m "chore: record independently reconciled Solana Devnet GLR"

          git push --set-upstream origin "$BRANCH"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: publish independently verified Solana Devnet GLR" \
            --body "Canonical identity publication is gated on VERIFIED_ON_CHAIN.

Deployment run: ${DEPLOYMENT_RUN_URL}
Deployment artifact: ${DEPLOYMENT_ARTIFACT_ID}
Deployment artifact digest: ${DEPLOYMENT_ARTIFACT_DIGEST}
Reconciliation run: ${RUN_URL}
Mint: ${MINT_ADDRESS}

The reconciliation workflow independently checked:
- exact deployment run and artifact ownership
- exact artifact SHA-256 digest
- all six deployment transaction signatures on canonical Solana Devnet
- Token-2022 owner
- GLORIFIER / GLR / 9 decimals
- supply 1,000,000,000
- mint authority = None
- freeze authority = None

Only after these checks does the branch set canonical status to FULLY_VERIFIED.
Do not create another GLORIFIER mint."
          )"

          echo "Canonical identity PR: ${PR_URL}"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glorifier-solana-devnet-reconciliation-evidence
          retention-days: 90
          if-no-files-found: warn
          path: |
            solana/deployment-evidence.json
            solana/reconciliation-status.txt
            solana/reconciliation-account.txt
            solana/reconciliation-supply.txt
            solana/reconciliation-mint-state.txt
            solana/reconciliation-signature-status.json
            solana/reconciliation-signature-evidence.json
            solana/reconciliation-provenance.json
            solana/reconciliation-evidence.json
            solana/canonical-devnet-identity.json
