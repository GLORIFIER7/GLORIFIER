name: GLORIFIER CodeQL Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Use GitHub's native PR test-merge checkout for complete base+PR analysis.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        id: codeql_analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
          # Default ref and SHA match the code GitHub actually checked out.

      # GitHub still has a pre-matrix CodeQL analysis configuration on main.
      # Publish real JavaScript SARIF under that same identity until its
      # historical baseline has been safely reconciled, without changing
      # the separately required per-language CodeQL checks.
      - name: Rebuild legacy CodeQL category from analyzed SARIF
        if: ${{ matrix.language == 'javascript-typescript' }}
        shell: bash
        env:
          SARIF_DIR: ${{ steps.codeql_analysis.outputs.sarif-output }}
        run: |
          set -euo pipefail
          if [[ ! -d "$SARIF_DIR" ]]; then
            SARIF_DIR="${GITHUB_WORKSPACE}/../results"
          fi
          mapfile -t sarif_files < <(find "$SARIF_DIR" -maxdepth 1 -type f -name '*.sarif' -print)
          if (( ${#sarif_files[@]} != 1 )); then
            echo "::error::Expected one genuine CodeQL SARIF output in $SARIF_DIR, found ${#sarif_files[@]}."
            exit 1
          fi
          source="${sarif_files[0]}"
          test -s "$source"
          mkdir -p "$RUNNER_TEMP/codeql-legacy"
          jq --arg category '.github/workflows/codeql.yml:analyze/' \
            '.runs |= map(.automationDetails = ((.automationDetails // {}) + {id: $category}))' \
            "$source" > "$RUNNER_TEMP/codeql-legacy/legacy.sarif"
          jq -e '.runs | map(select(.tool.driver.name == "CodeQL" and .automationDetails.id == ".github/workflows/codeql.yml:analyze/")) | length == 1' "$RUNNER_TEMP/codeql-legacy/legacy.sarif" > /dev/null

      - name: Upload legacy CodeQL configuration
        if: ${{ matrix.language == 'javascript-typescript' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-legacy/legacy.sarif
          category: ".github/workflows/codeql.yml:analyze/"
          matrix: '{}'
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}

      # Read-only inspection. GitHub's code-scanning gate is authoritative;
      # a successful SARIF upload does not prove a configuration was recognized.
      - name: Inspect CodeQL analysis identities (read-only)
        if: ${{ matrix.language == 'javascript-typescript' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/codeql-analysis-identities.tsv"
          printf 'analysis_key\tcategory\tref\tcommit_sha\tenvironment\tcreated_at\n' > "$report"
          for ref in "refs/heads/main" "refs/pull/${PR_NUMBER}/head" "refs/pull/${PR_NUMBER}/merge"; do
            echo "CodeQL analysis identities for ${ref} (paginated, max 1500 entries):"
            for page in $(seq 1 15); do
              url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/code-scanning/analyses?ref=${ref}&per_page=100&page=${page}"
              if response=$(curl --silent --show-error --fail --retry 1 --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                "${url}"); then
                count=$(jq 'length' <<< "${response}")
                jq -r '
                  .[] | select(.tool.name == "CodeQL") |
                  [(.analysis_key // "N/A"), (.category // "N/A"), (.ref // "N/A"),
                   (.commit_sha // "N/A"), (.environment // "N/A"), (.created_at // "N/A")] | @tsv
                ' <<< "${response}" | tee -a "$report"
                if (( count < 100 )); then
                  break
                fi
                if (( page == 15 )); then
                  echo "::warning::CodeQL inventory page cap reached; report may be incomplete. Scan enforcement is unchanged."
                fi
              else
                printf 'QUERY_FAILED\tN/A\t%s\tN/A\tN/A\tN/A\n' "$ref" >> "$report"
                echo "::warning::Unable to read CodeQL analysis metadata for ${ref}; existing scan enforcement is unchanged."
                break
              fi
            done
          done

      - name: Upload read-only CodeQL identity report
        if: ${{ matrix.language == 'javascript-typescript' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v7
        with:
          name: codeql-analysis-identities
          path: ${{ runner.temp }}/codeql-analysis-identities.tsv
          if-no-files-found: error
          retention-days: 2
