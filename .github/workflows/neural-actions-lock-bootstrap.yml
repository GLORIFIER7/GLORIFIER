name: Temporary NEURAL actions-lockfile bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/neural-actions-lock-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: neural-actions-lock-bootstrap-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out NEURAL lockfile repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GLORIFIER7/GLORIFIER-NEURAL
          ref: fix/actions-workflow-lockfile-20261115
          path: neural
          persist-credentials: false

      - name: Generate and verify the official GitHub Actions lockfile
        working-directory: neural
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh extension install github/gh-actions-lock
          gh actions-lock --no-narrow
          gh actions-lock --verify --no-narrow
          test -s .github/workflows/actions.lock
          echo "Generated workflow lockfile SHA-256:"
          sha256sum .github/workflows/actions.lock
          echo "Generated workflow files:"
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort

      - name: Upload generated NEURAL workflow files for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neural-workflows-with-actions-lock
          path: neural/.github/workflows/
          if-no-files-found: error
          retention-days: 1
