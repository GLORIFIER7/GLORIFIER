name: Temporary NEURAL Actions Lock Bootstrap

on:
  push:
    branches:
      - maintenance/neural-actions-lock-bootstrap-20261115

permissions:
  contents: read

jobs:
  generate-and-verify:
    name: Generate and verify NEURAL workflow lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the NEURAL repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GLORIFIER7/GLORIFIER-NEURAL
          ref: main
          path: neural
          persist-credentials: false

      - name: Generate and verify the official workflow dependency lockfile
        working-directory: neural
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh auth status --hostname github.com
          gh extension install github/gh-actions-lock
          gh actions-lock
          gh actions-lock --verify
          test -s .github/workflows/actions.lock
          echo "Generated lockfile SHA-256:"
          sha256sum .github/workflows/actions.lock
          echo "Tracked workflow files:"
          find .github/workflows -maxdepth 1 -type f -name '*.yml' -o -name '*.yaml' | sort

      - name: Upload the generated lockfile only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neural-actions-lock
          path: neural/.github/workflows/actions.lock
          if-no-files-found: error
          retention-days: 1
