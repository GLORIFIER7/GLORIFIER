name: Temporary NEURAL actions-lockfile bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/neural-actions-lock-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: neural-actions-lock-bootstrap-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and verify lockfile for ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: "95"
            ref: "fix/neural-pr94-publisher-env-signed-20261112"
          - pr: "96"
            ref: "fix/codeql-actions-aligned-4.39.3-signed-20261112"
          - pr: "98"
            ref: "fix/docs-nvidia-dynamo-evidence-signed-20261112"
          - pr: "100"
            ref: "fix/download-artifact-regression-signed-2026-11-12"
          - pr: "102"
            ref: "dependabot/uv/opentelemetry-api-1.45.2"
          - pr: "103"
            ref: "fix/actions-lockfile-20261115"
    steps:
      - name: Check out NEURAL PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: GLORIFIER7/GLORIFIER-NEURAL
          ref: ${{ matrix.ref }}
          path: neural
          persist-credentials: false

      - name: Generate and verify the official GitHub Actions lockfile
        working-directory: neural
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh extension install github/gh-actions-lock
          gh actions-lock --no-narrow
          gh actions-lock --verify --no-narrow
          test -s .github/workflows/actions.lock
          echo "Generated NEURAL PR #${{ matrix.pr }} lockfile SHA-256:"
          sha256sum .github/workflows/actions.lock

      - name: Upload verified lockfile for NEURAL PR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neural-actions-lock-pr-${{ matrix.pr }}
          path: neural/.github/workflows/actions.lock
          if-no-files-found: error
          retention-days: 1
