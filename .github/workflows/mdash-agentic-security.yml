name: GLORIFIER MDASH Agentic Code Security (Preview)

on:
  workflow_dispatch:
    inputs:
      authorize_source_upload:
        description: >-
          I authorize uploading this repository's source to Microsoft Defender
          MDASH and consuming any model or Azure capacity charges.
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  security-events: write

concurrency:
  group: glorifier-mdash-agentic-scan-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mdash-scan:
    name: Microsoft Defender MDASH scan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.authorize_source_upload == true
    environment: mdash-security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check protected environment configuration
        shell: bash
        env:
          DEFENDER_ASPM_TENANT_ID: ${{ secrets.DEFENDER_ASPM_TENANT_ID }}
          DEFENDER_ASPM_CLIENT_ID: ${{ secrets.DEFENDER_ASPM_CLIENT_ID }}
          DEFENDER_ASPM_CLIENT_SECRET: ${{ secrets.DEFENDER_ASPM_CLIENT_SECRET }}
          DEFENDER_CLI_SHA256: ${{ vars.DEFENDER_CLI_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$DEFENDER_ASPM_TENANT_ID" ]] || missing+=("DEFENDER_ASPM_TENANT_ID")
          [[ -n "$DEFENDER_ASPM_CLIENT_ID" ]] || missing+=("DEFENDER_ASPM_CLIENT_ID")
          [[ -n "$DEFENDER_ASPM_CLIENT_SECRET" ]] || missing+=("DEFENDER_ASPM_CLIENT_SECRET")
          if (( ${#missing[@]} > 0 )); then
            printf 'MDASH is not configured. Add the required secrets to the protected mdash-security environment: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "$DEFENDER_CLI_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "MDASH is not configured: set DEFENDER_CLI_SHA256 to a 64-character SHA-256 digest verified through a trusted Microsoft channel." >&2
            exit 1
          fi
          echo "Protected environment configuration is present; credential values were not printed."

      - name: Download and verify Defender CLI
        shell: bash
        env:
          DEFENDER_CLI_SHA256: ${{ vars.DEFENDER_CLI_SHA256 }}
        run: |
          set -euo pipefail
          defender="$RUNNER_TEMP/defender"
          curl --fail --location --silent --show-error --retry 3 \
            "https://cli.dfd.security.azure.com/public/v2/latest/Defender_linux-x64" \
            --output "$defender"
          printf '%s  %s\n' "$DEFENDER_CLI_SHA256" "$defender" | sha256sum --check --status
          chmod 700 "$defender"
          test -s "$defender"
          echo "Defender CLI SHA-256 verification passed."

      - name: Submit MDASH scan and collect SARIF
        shell: bash
        env:
          DEFENDER_ASPM_TENANT_ID: ${{ secrets.DEFENDER_ASPM_TENANT_ID }}
          DEFENDER_ASPM_CLIENT_ID: ${{ secrets.DEFENDER_ASPM_CLIENT_ID }}
          DEFENDER_ASPM_CLIENT_SECRET: ${{ secrets.DEFENDER_ASPM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          defender="$RUNNER_TEMP/defender"
          sarif_file="$RUNNER_TEMP/mdash-results.sarif"
          submission_file="$RUNNER_TEMP/mdash-submission.txt"
          job_id=""
          scan_completed=false
          cancel_attempted=false

          cancel_scan() {
            if [[ -n "$job_id" && "$scan_completed" != true && "$cancel_attempted" != true ]]; then
              cancel_attempted=true
              timeout 10s "$defender" status cancel "$job_id" >/dev/null 2>&1 || true
            fi
          }
          trap cancel_scan EXIT
          trap 'cancel_scan; exit 130' INT TERM

          # This command uploads checked-out repository source to Microsoft Defender MDASH.
          # The job is main-branch-only, environment-protected, and requires explicit dispatch approval.
          if ! "$defender" scan ai-scan submit . --model-profile standard >"$submission_file" 2>&1; then
            rm -f "$submission_file"
            echo "MDASH scan submission failed; CLI output is suppressed to avoid credential disclosure." >&2
            exit 1
          fi

          job_id="$(sed -nE 's/^Job submitted:[[:space:]]*([^[:space:]]+).*$/\1/p' "$submission_file" | tail -n 1)"
          rm -f "$submission_file"
          if [[ -z "$job_id" ]]; then
            echo "Defender CLI did not return a recognizable job ID; refusing to claim a scan ran." >&2
            exit 1
          fi
          echo "::add-mask::$job_id"

          if ! "$defender" status wait "$job_id" -o "$sarif_file" >/dev/null 2>&1; then
            echo "MDASH scan did not complete successfully; a cancellation will be attempted." >&2
            exit 1
          fi
          scan_completed=true
          test -s "$sarif_file"
          echo "MDASH job completed and returned a SARIF file."

      - name: Validate SARIF structure
        shell: bash
        run: |
          set -euo pipefail
          sarif_file="$RUNNER_TEMP/mdash-results.sarif"
          jq -e '
            .version == "2.1.0"
            and (.runs | type == "array")
            and (.runs | length > 0)
          ' "$sarif_file" >/dev/null
          echo "SARIF 2.1.0 structure validated."

      - name: Retain MDASH SARIF evidence
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-mdash-sarif
          path: ${{ runner.temp }}/mdash-results.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Publish MDASH findings to GitHub code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: ${{ runner.temp }}/mdash-results.sarif
          category: mdash-agentic-code-scan
