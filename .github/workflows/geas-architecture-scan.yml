name: GEAS Architecture Science Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/governance/geas-architecture-scientist.ts'
      - 'src/lib/governance/geas-claim-verification.ts'
      - 'src/lib/governance/geas-claim-verification.test.ts'
      - 'src/lib/governance/geas-architecture-reconciliation.ts'
      - 'src/lib/governance/geas-architecture-reconciliation.test.ts'
      - 'scripts/geas-architecture-*.ts'
      - 'scripts/geas-authority-*.ts'
      - 'scripts/geas-source-cadence-validate.ts'
      - 'scripts/geas-evidence-policy-validate.ts'
      - 'docs/architecture/geas-*'
      - '.github/workflows/geas-architecture-scan.yml'
      - 'package.json'
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: geas-architecture-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout revision under test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate GEAS architecture contracts
        run: npm run validate:geas-architecture

      - name: Validate authoritative source registry
        run: ./node_modules/.bin/tsx scripts/geas-authority-registry-validate.ts

      - name: Validate source registry and scanner cadence consistency
        run: ./node_modules/.bin/tsx scripts/geas-source-cadence-validate.ts

      - name: Validate evidence policy invariants
        run: ./node_modules/.bin/tsx scripts/geas-evidence-policy-validate.ts

      - name: Test claim-level evidence admission
        run: npm run test:geas-claim-verification

      - name: Test five-state architecture reconciliation
        run: npm run test:geas-state-reconciliation

      - name: Execute authoritative architecture scan
        run: npm run scan:geas-architecture
        env:
          GEAS_SCAN_OUTPUT_DIR: artifacts/geas-architecture
          GEAS_SCAN_PERSIST: 'false'

      - name: Validate scan safety invariant
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('artifacts/geas-architecture/latest.json','utf8')); if(x.irreversibleChangesExecuted!==false) process.exit(1); if(x.sourcePolicyVersion!=='GEAS-AUTHORITY-2') process.exit(1); console.log('GEAS scan safety invariant verified')"

      - name: Upload scan evidence
        uses: actions/upload-artifact@v7
        with:
          name: geas-architecture-scan-${{ github.run_id }}
          path: artifacts/geas-architecture/
          if-no-files-found: error
          retention-days: 30
