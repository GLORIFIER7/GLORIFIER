name: GEAS Architecture Science Scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/lib/governance/geas-architecture-scientist.ts'
      - 'scripts/geas-architecture-*.ts'
      - '.github/workflows/geas-architecture-scan.yml'
      - 'package.json'
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: geas-architecture-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout revision under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate GEAS architecture contracts
        run: npm run validate:geas-architecture

      - name: Execute authoritative architecture scan
        run: npm run scan:geas-architecture
        env:
          GEAS_SCAN_OUTPUT_DIR: artifacts/geas-architecture
          GEAS_SCAN_PERSIST: 'false'

      - name: Validate scan safety invariant
        run: |
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('artifacts/geas-architecture/latest.json','utf8')); if(x.irreversibleChangesExecuted!==false) process.exit(1); if(x.sourcePolicyVersion!=='GEAS-AUTHORITY-1') process.exit(1); console.log('GEAS scan safety invariant verified')"

      - name: Upload scan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geas-architecture-scan-${{ github.run_id }}
          path: artifacts/geas-architecture/
          if-no-files-found: error
          retention-days: 30

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683:sha1-11bd71901bbe5b1630ceea73d27597364c9af683
  - github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020:sha1-49933ea5288caeca8642d1e84afbd3f7d6820020
  - github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02:sha1-ea165f8d65b6e75b540449e92b4886f43607fa02
