name: GLORIFIER AI 24/7 System Health Guardian

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Read-only monitoring. Remediation must use a reviewed pull request.
permissions:
  contents: read
  actions: read

concurrency:
  group: glorifier-health-guardian
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Local integrity check
        id: integrity
        continue-on-error: true
        run: |
          npm run lint
          npm run build
      - name: Production Cloudflare Worker health check
        id: health
        continue-on-error: true
        env:
          GLORIFIER_HEALTH_URL: https://glorifier.glorifier.workers.dev/api/health
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt $attempt/5"
            if response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 20 "$GLORIFIER_HEALTH_URL")"; then
              printf "%s" "$response" | node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { try { const body=JSON.parse(data); if (body.ok !== true || body.status !== "worker-ready" || body.layer !== "cloudflare-worker") process.exit(1); } catch { process.exit(1); } });' && echo "GLORIFIER Cloudflare Worker health: OK" && exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 10; fi
          done
          echo "::warning::Production backend health endpoint unavailable after 5 attempts."
          exit 1
      - name: Verify unauthenticated app-state protection
        id: auth_guard
        continue-on-error: true
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl -sS -o "$body" -w "%{http_code}" --connect-timeout 8 --max-time 20 https://glorifier.glorifier.workers.dev/api/app-state)"
          echo "Protected endpoint HTTP status: $status"
          STATUS="$status" node - "$body" <<'NODE'
          const fs = require("node:fs");
          const status = Number(process.env.STATUS);
          let body;
          try { body = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); }
          catch { console.error("Protected endpoint returned non-JSON"); process.exit(1); }
          if (status !== 401 || body?.code !== "AUTHENTICATION_REQUIRED") {
            console.error("Expected HTTP 401 with AUTHENTICATION_REQUIRED; received status=" + status + ", code=" + (body?.code ?? "absent"));
            process.exit(1);
          }
          console.log("Unauthenticated app-state boundary verified");
          NODE
      - name: Verify Cloudflare Worker and Supabase runtime state
        id: runtime
        continue-on-error: true
        run: |
          set -euo pipefail
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl -sS -o "$body" -w "%{http_code}" --connect-timeout 8 --max-time 30 'https://glorifier.glorifier.workers.dev/api/runtime-verification?probeAi=false')"
          echo "Runtime verification HTTP status: $status"
          STATUS="$status" node - "$body" <<'NODE'
          const fs = require("node:fs");
          const status = Number(process.env.STATUS);
          let body;
          try { body = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); }
          catch { console.error("Runtime verification returned non-JSON"); process.exit(1); }
          if (status !== 200 || body?.ok !== true ||
              body?.status !== "verified-for-probed-dependencies" ||
              body?.checks?.database?.ok !== true) {
            console.error("Runtime verification failed its documented contract; status=" + status + ", applicationStatus=" + (body?.status ?? "absent"));
            process.exit(1);
          }
          console.log("Worker/assets and Supabase probe verified; authentication and AI remain not-probed");
          NODE
      - name: Enforce diagnostic-only remediation boundary
        if: steps.integrity.outcome == 'failure'
        run: |
          echo "::error::Integrity checks failed. Automated production repair is disabled."
          echo "Collect logs and create a reviewed pull request; do not push or deploy automatically."
          exit 1
      - name: Report health state
        if: always()
        run: |
          echo "Local integrity: ${{ steps.integrity.outcome }}"
          echo "Production backend health: ${{ steps.health.outcome }}"
          echo "Authentication guard: ${{ steps.auth_guard.outcome }}"
          echo "Neon runtime verification: ${{ steps.runtime.outcome }}"
          if [ "${{ steps.health.outcome }}" != "success" ]; then echo "::warning::Production backend health is unavailable; code integrity is tracked separately."; fi
          if [ "${{ steps.auth_guard.outcome }}" != "success" ]; then echo "::warning::Authentication boundary verification failed."; fi
          if [ "${{ steps.runtime.outcome }}" != "success" ]; then echo "::warning::Neon-backed runtime verification failed."; fi
          if [ "${{ steps.integrity.outcome }}" != "success" ] || [ "${{ steps.health.outcome }}" != "success" ] || [ "${{ steps.auth_guard.outcome }}" != "success" ] || [ "${{ steps.runtime.outcome }}" != "success" ]; then
            echo "::error::One or more required integrity, backend health, authentication, or runtime checks failed."
            exit 1
          fi
