name: GLORIFIER CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Agent harness approval tests
        run: npm run test:harness

      - name: Anthropic provider integration tests
        run: npm run test:anthropic

      - name: Architecture consolidation tests
        run: npm run test:architecture

      - name: Permanent GLORIFIER stack invariants
        run: npm run test:permanent-stack

      - name: Interoperability controls
        run: npx tsx src/lib/governance/interoperability-controls.test.ts

      - name: GEAS architecture controls
        run: npm run test:geas-controls

      - name: GLR governed commerce invariants
        run: npm run test:glr-economic-layer

      - name: Production build
        run: npm run build

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020:sha1-820762786026740c76f36085b0efc47a31fe5020
