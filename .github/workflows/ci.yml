name: GLORIFIER CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Agent harness approval tests
        run: npm run test:harness

      - name: Architecture consolidation tests
        run: npm run test:architecture

      - name: Permanent GLORIFIER stack invariants
        run: npm run test:permanent-stack

      - name: Production build
        run: npm run build
