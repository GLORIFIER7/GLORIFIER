name: GLORIFIER CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: glorifier-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Generated artifact ignore regression tests
        run: node --test scripts/gitignore-generated-artifacts.test.mjs

      - name: Audit locked npm dependencies
        run: npm audit --audit-level=low

      - name: Validate Solana deployment and reconciliation scripts
        run: |
          set -euo pipefail
          bash -n solana/deploy-token2022-devnet.sh
          bash -n solana/recover-deployment-provenance.sh
          bash -n solana/reconcile-token2022-devnet.sh
          bash -n solana/publish-verified-devnet-identity.sh
          bash -n solana/deploy-token2022-mainnet.sh
          bash -n solana/reconcile-token2022-mainnet.sh
          bash -n solana/publish-verified-mainnet-identity.sh
          jq -e '.asset=="GLORIFIER" and .symbol=="GLR" and .network=="solana-devnet" and .token_standard=="Token-2022"' solana/canonical-devnet-identity.json >/dev/null
          bash -n solana/validate-devnet-identity-contract.sh
          # Exercise both the existing exact-mint recovery state and a clean initial state.
          bash solana/validate-devnet-identity-contract.sh
          temp_identity="$(mktemp)"
          temp_recovery="${temp_identity}.recovery.json"
          temp_mismatch_recovery="${temp_identity}.mismatch-recovery.json"
          trap 'rm -f "$temp_identity" "$temp_recovery" "$temp_mismatch_recovery"' EXIT
          jq '.status = "NOT VERIFIED" | .canonical_mint = null | .creation_transaction = null | .mint_transaction = null | .authority_revocation_transaction = null' solana/canonical-devnet-identity.json > "$temp_identity"
          # Prove a clean initial identity can pass even when no recovery record exists.
          bash solana/validate-devnet-identity-contract.sh "$temp_identity" "$temp_recovery"
          # Exercise recovery with true JSON null receipts, not only the legacy string "null".
          jq '.status = "VERIFIED_ON_CHAIN"
              | .canonical_mint = "8W7eSf3hPyRMFJGKbCvwb9QMq6uok6rxSnRZqofeqnyd"
              | .creation_transaction = null
              | .mint_transaction = null
              | .authority_revocation_transaction = null
              | .transaction_semantics_verified = false
              | .verification_run_id = "ci-fixture"
              | .verification_run_url = "https://github.com/GLORIFIER7/GLORIFIER/actions"
              | .mainnet_status = "NOT VERIFIED"' solana/canonical-devnet-identity.json > "$temp_identity"
          jq '.status = "DEPLOYED"
              | .network = "solana-devnet"
              | .programId = "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"
              | .mint = "8W7eSf3hPyRMFJGKbCvwb9QMq6uok6rxSnRZqofeqnyd"' solana/devnet-partial-mint-recovery.json > "$temp_recovery"
          bash solana/validate-devnet-identity-contract.sh "$temp_identity" "$temp_recovery"
          # The validator must fail closed if the recovery record names another mint.
          jq '.mint = "11111111111111111111111111111111"' "$temp_recovery" > "$temp_mismatch_recovery"
          [ -s "$temp_mismatch_recovery" ] || { echo "ERROR: Failed to create mismatch recovery fixture." >&2; exit 1; }
          jq -e '.mint == "11111111111111111111111111111111"' "$temp_mismatch_recovery" >/dev/null || { echo "ERROR: Mismatch recovery fixture is invalid." >&2; exit 1; }
          if bash solana/validate-devnet-identity-contract.sh "$temp_identity" "$temp_mismatch_recovery"; then
            echo "ERROR: Validator accepted a mismatched recovery mint." >&2
            exit 1
          fi


          # Transaction-history verifier: offline regression tests against a finalized Devnet fixture.
          python3 solana/verify-token2022-devnet-history.test.py
          # Fully verified identity with real receipts must pass; a placeholder receipt must fail closed.
          jq '.transaction_semantics_verified = true
              | .creation_transaction = "2DcwdGwopPmTJwvSXG6ahDbNumM8FAJTbJwfYdV92t9h4wpDW7WP5SKzbAGw23rSGZHMLTEssysxK5H7ynvC7j5r"
              | .metadata_transaction = "5vi2wS9SkmFMrdzCPCc3apr9ttcrxvhjBoiWtDn1H5acsAKA92Mtc63W4qatJP46A6uB7MuNDR7d4G9chSpSyW9p"
              | .token_account_creation_transaction = "3h7nP39xGNvhSQwHn6FUdUJUGu6ANhegQtWLAR2RGvvrYKZzH3fXmNidVEkYgADeFaFZyoGCkyckiAG4u71HiyYt"
              | .mint_transaction = "2DszHKku9D3nCC7D1FAZnZfDzH6wjEaqQPzDv8kpPFYRRtUxxS91SvXQZJVyaeAReDUL63Tfy2sRz4tEEpa9U2B4"
              | .authority_revocation_transaction = "5WErARdcBz1KC5XF7xdM8r3uRSYvXvN4k3w2jR9kLp4EzEpeNjZ1iTHRzM2okURggV5xBAGAXEg6CtHXbz3ekHw3"
              | .freeze_authority_revocation_transaction = "NOT_APPLICABLE_NEVER_SET"
              | .metadata_update_authority_revocation_transaction = "5MAwjhNvP4Ex5xKzQGeJbHZ54QeaDPteAfzPVu6Kp3F4JTYytcoqBNhUFVsiNLjuU1B4Pe5uP2bmCEHi9MB6pVPn"
              | .metadata_pointer_authority_revocation_transaction = "2UTZTcuxQBfGbGTV2sfofGdyxDgXtXJEY3AsfzXpFnFm7EsafRaxVH6Lssjqy85j7aEiL6NmSV6stDZaFfg5HxCh"
              | .verification_run_id = "1"' "$temp_identity" > "${temp_identity}.full"
          bash solana/validate-devnet-identity-contract.sh "${temp_identity}.full" "$temp_recovery"
          jq '.metadata_transaction = "null"' "${temp_identity}.full" > "${temp_identity}.bad"
          if bash solana/validate-devnet-identity-contract.sh "${temp_identity}.bad" "$temp_recovery"; then
            echo "ERROR: Validator accepted transaction_semantics_verified=true with a placeholder receipt." >&2
            exit 1
          fi
          rm -f "${temp_identity}.full" "${temp_identity}.bad"

      - name: Type-check
        run: npm run lint

      - name: AI provider model-selection regression tests
        run: npm run test:provider-model-selection

      - name: AI provider discovery registry regression tests
        run: npm run test:provider-discovery

      - name: Gemini explicit model policy regression tests
        run: npm run test:gemini-model-policy

      - name: Shared authenticated AI council client tests
        run: npm run test:model-council-client

      - name: OpenAI-compatible provider abort tests
        run: npm run test:provider-abort

      - name: AI provider registry routing integration tests
        run: npm run test:provider-routing

      - name: Discovered AI provider model catalogue tests
        run: npm run test:provider-model-catalog

      - name: Canonical NFT registry seed regression tests
        run: npm run test:asset-registry-seed

      - name: Governed capability catalog regression tests
        run: npm run test:capability-authorization

      - name: Opportunity discovery commercial qualification regression tests
        run: npm run test:opportunity-discovery

      - name: Shared UUID helper regression tests
        run: npm run test:new-id

      - name: ASAP Protocol governance boundary regression tests
        run: npm run test:asap-bridge

      - name: Protected API path case-insensitivity regression tests
        run: npm run test:protected-api-paths
      - name: LlamaCloud integration tests
        run: npm run test:llama-cloud

      - name: Auth0 access-token validation regression tests
        run: npm run test:auth0-token

      - name: Internal-service authentication regression tests
        run: npm run test:backend-auth

      - name: LangSmith metadata-only tracing tests
        run: ./node_modules/.bin/tsx src/lib/observability/langsmith.test.ts

      - name: Agent harness approval tests
        run: npm run test:harness

      - name: Durable agent state store tests
        run: npm run test:agent-state-store

      - name: Agent task persistence fallback tests
        run: npm run test:agent-runtime

      - name: A2A task-list authorization regression tests
        run: npm run test:a2a-runtime

      - name: Federated A2A requester-isolation regression tests
        run: npm run test:federated-a2a-v3

      - name: Agent persistence bootstrap tests
        run: npm run test:agent-persistence-bootstrap

      - name: Atomic connection approval persistence tests
        run: npm run test:connection-approval

      - name: Governance loop failure recovery tests
        run: npm run test:governance-loop

      - name: Anthropic provider integration tests
        run: npm run test:anthropic

      - name: Architecture consolidation tests
        run: npm run test:architecture

      - name: Permanent GLORIFIER stack invariants
        run: npm run test:permanent-stack

      - name: Interoperability controls
        run: ./node_modules/.bin/tsx src/lib/governance/interoperability-controls.test.ts

      - name: Validate interoperability capability registry and OpenAPI contract
        run: node scripts/validate-interoperability-capabilities.mjs

      - name: Validate A2A task persistence SQL bindings
        run: node scripts/validate-a2a-task-persistence.mjs

      - name: A2A 1.0 JSON-RPC contract tests
        run: npm run test:a2a-v1

      - name: A2A durable runtime regression tests
        run: npm run test:a2a-runtime

      - name: A2A 1.0 Express endpoint tests
        run: npm run test:a2a-v1-express

      - name: GEAS architecture controls
        run: npm run test:geas-controls

      - name: GEAS architecture scientist evidence and cadence tests
        run: npm run test:geas-scientist

      - name: GEAS evidence-policy static guard
        run: ./node_modules/.bin/tsx scripts/geas-evidence-policy-validate.ts

      - name: GEAS state reconciliation tests
        run: npm run test:geas-reconciliation

      - name: GEAS five-state architecture timestamp regression tests
        run: npm run test:geas-state-reconciliation

      - name: GEAS trusted-source claim verification tests
        run: npm run test:geas-claim-verification

      - name: GEAS FOCUS invoice deterministic reconciliation tests
        run: npm run test:geas-focus-invoice-reconciliation

      - name: GEAS enterprise governance controls
        run: npm run test:geas-enterprise-controls

      - name: Validate GEAS architecture model
        run: npm run validate:geas-architecture

      - name: GLR governed commerce invariants
        run: npm run test:glr-economic-layer

      - name: GLR payer identity binding regression tests
        run: npm run test:payer-identity

      - name: Backend internal-service authentication regression tests
        run: npm run test:backend-auth

      - name: AI council provider authorization and routing regression tests
        run: npm run test:ai-council-routing

      - name: GLR payment-intent route authorization contract tests
        run: npm run test:glr-intent-route-contract

      - name: Currency intelligence arithmetic and fail-closed quote tests
        run: npm run test:currency-intelligence

      - name: GLR commerce quote and decimal tests
        run: npm run test:glr-commerce

      - name: Ethereum GLR settlement verifier tests
        run: npm run test:glr-ethereum-verifier

      - name: BNB Smart Chain GLR settlement verifier tests
        run: npm run test:glr-bnb-verifier

      - name: Solana Token-2022 GLR settlement verifier tests
        run: npm run test:glr-solana-verifier

      - name: Solana GLR cross-file provenance gate
        run: npm run test:solana-provenance

      - name: Token branding bridge identity and dashboard aggregation tests
        run: npm run test:token-branding-bridge

      - name: Trusted Alpaca OAuth redirect tests
        run: npm run test:alpaca-oauth-url

      - name: Outcome evidence gate regression tests
        run: npm run test:outcome-evidence-gates

      - name: Cloudflare Worker API proxy tests
        run: npm run test:cloudflare-worker

      - name: Hugging Face Space binary asset deployment contract
        run: npm run test:huggingface-space-deploy

      - name: Validate permanent orchestrator JavaScript syntax
        run: node --check scripts/permanent-orchestrator.mjs

      - name: Production frontend and server build
        run: npm run build

  agent-state-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: glorifier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glorifier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: PostgreSQL agent state store integration tests
        run: npm run test:agent-state-store-integration
        env:
          AGENT_STATE_TEST_DATABASE_URL: postgresql://localhost:5432/glorifier_test
          PGUSER: postgres


  supabase-default-privileges-integration:
    name: Supabase default privilege integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: glorifier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d glorifier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Verify Supabase default privilege migration on PostgreSQL
        run: npm run test:supabase-default-privileges
        env:
          SUPABASE_DEFAULT_PRIVILEGES_TEST_DATABASE_URL: postgresql://localhost:5432/glorifier_test
          PGUSER: postgres
