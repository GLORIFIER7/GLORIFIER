name: GLORIFIER CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Agent harness approval tests
        run: npm run test:harness

      - name: Anthropic provider integration tests
        run: npm run test:anthropic

      - name: Architecture consolidation tests
        run: npm run test:architecture

      - name: Permanent GLORIFIER stack invariants
        run: npm run test:permanent-stack

      - name: Interoperability controls
        run: npx tsx src/lib/governance/interoperability-controls.test.ts

      - name: GEAS architecture controls
        run: npm run test:geas-controls

      - name: Production build
        run: npm run build
