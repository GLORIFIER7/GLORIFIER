name: GLORIFIER Vercel Production Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: glorifier-vercel-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build:frontend

      - name: Verify Vite output
        run: test -f dist/index.html && test -s dist/index.html

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v7:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/actions/setup-node@v7:sha1-820762786026740c76f36085b0efc47a31fe5020
