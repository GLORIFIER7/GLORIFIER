name: GEAS Enterprise Architecture Controls

on:
  pull_request:
    paths:
      - 'src/lib/governance/**'
      - 'scripts/**'
      - 'docs/GEAS-ENTERPRISE-ARCHITECTURE-CONTROLS.md'
      - 'package.json'
      - '.github/workflows/geas-enterprise-controls.yml'
  push:
    branches: [main, geas-enterprise-architecture-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: GEAS enterprise control tests
        run: npm run test:geas-enterprise-controls
      - name: GEAS reconciliation tests
        run: npm run test:geas-reconciliation
      - name: Frontend build
        run: npm run build

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020:sha1-820762786026740c76f36085b0efc47a31fe5020
