name: GLORIFIER Gemini AI Collaborator

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: glorifier-gemini-collaborator
  cancel-in-progress: false

jobs:
  gemini-collaborator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gemini
        if: ${{ env.GEMINI_API_KEY != '' }}
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ env.GEMINI_API_KEY }}
          gemini_cli_version: latest
          prompt: |
            You are the Gemini engineering collaborator for the GLORIFIER project.
            Read GEMINI.md and inspect the repository.
            First check for open GitHub issues labeled ai-recovery. If one exists, treat it as the highest-priority task and investigate the reported infrastructure failure using repository code, workflow history, and configuration that is safe to inspect. Otherwise, work on ONE small, concrete, high-value improvement in reliability,
            security, testing, observability, or maintainability.
            Do not expose or modify secrets.
            Do not change deployment credentials.
            Run npm run lint and npm run build when applicable.
            Do not make speculative or cosmetic changes.
            If no safe improvement is justified, make no code changes.
            Do not deploy directly. Leave the workspace ready for a reviewable PR.

      - name: Create Gemini PR
        if: ${{ env.GEMINI_API_KEY != '' && success() }}
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "GLORIFIER Gemini Collaborator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ai/gemini/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "ai(gemini): autonomous maintenance"
          git push --set-upstream "https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}.git" "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open Gemini pull request
        if: ${{ steps.branch.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "Gemini: autonomous GLORIFIER maintenance" \
            --body "Gemini-generated maintenance change. CI must validate this PR before merge. Codex is configured to review AI-generated changes when its credential is available."

      - name: Report missing Gemini credential
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: |
          echo "::warning::GEMINI_API_KEY is not configured. Add it as a GitHub Actions repository secret to activate the Gemini collaborator."
