name: GLORIFIER SDK Conformance

on:
  pull_request:
    paths:
      - "sdk/python/**"
      - "sdk/go/**"
      - ".github/workflows/python-sdk.yml"
      - "src/worker.ts"
      - "src/worker.test.ts"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/interoperability-capabilities*"
      - "docs/architecture/interoperability-contract-fixtures.json"
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "sdk/go/**"
      - ".github/workflows/python-sdk.yml"
      - "src/worker.ts"
      - "src/worker.test.ts"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/interoperability-capabilities*"
      - "docs/architecture/interoperability-contract-fixtures.json"

permissions:
  contents: read

jobs:
  python-sdk-tests:
    name: Python SDK and shared contract fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library SDK and fixture tests
        working-directory: sdk/python
        run: |
          python -m unittest -v test_glorifier_neural_client.py
          python -m unittest -v test_interoperability_fixtures.py

  go-sdk-tests:
    name: Optional Go SDK and shared contract tests (${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect Go module
        id: go-module
        run: |
          if test -f sdk/go/go.mod; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Go
        if: steps.go-module.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: sdk/go/go.mod
      - name: Run Go contract and client tests
        if: steps.go-module.outputs.present == 'true'
        working-directory: sdk/go
        run: go test -race -count=1 ./...
      - name: Static analysis
        if: steps.go-module.outputs.present == 'true'
        working-directory: sdk/go
        run: go vet ./...
