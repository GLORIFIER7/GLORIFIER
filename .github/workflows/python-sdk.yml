name: GLORIFIER Python SDK

on:
  pull_request:
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk.yml"
      - "src/worker.ts"
      - "src/worker.test.ts"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/interoperability-capabilities*"
      - "docs/architecture/interoperability-contract-fixtures.json"
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk.yml"
      - "src/worker.ts"
      - "src/worker.test.ts"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/interoperability-capabilities*"
      - "docs/architecture/interoperability-contract-fixtures.json"

permissions:
  contents: read

jobs:
  python-sdk-tests:
    name: Python SDK and shared contract fixtures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library SDK and fixture tests
        working-directory: sdk/python
        run: |
          python -m unittest -v test_glorifier_neural_client.py
          python -m unittest -v test_interoperability_fixtures.py
