name: GLORIFIER Contracts

on:
  push:
    paths:
      - "contracts/**"
      - ".github/workflows/glorifier-contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/glorifier-contracts.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit
      - name: Build
        run: forge build
      - name: Test
        run: forge test -vv

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v7:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/foundry-rs/foundry-toolchain@v1:sha1-908c540300062bd5a7e473851cdb4282204cee09
