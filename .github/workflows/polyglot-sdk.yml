name: GLORIFIER Native SDK Conformance

on:
  pull_request:
    paths:
      - "sdk/java/**"
      - "sdk/kotlin/**"
      - "sdk/dotnet/**"
      - "sdk/rust/**"
      - "sdk/php/**"
      - "sdk/ruby/**"
      - "sdk/swift/**"
      - "sdk/dart/**"
      - "sdk/javascript/**"
      - "sdk/python/**"
      - "sdk/go/**"
      - "sdk/README.md"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/interoperability-capabilities.json"
      - "docs/architecture/interoperability-contract-fixtures.json"
      - "docs/architecture/interoperability-gap-register.md"
      - "docs/INTEROPERABILITY-VERIFICATION-MATRIX.md"
      - "scripts/validate-polyglot-sdk-inventory.mjs"
      - "scripts/validate-polyglot-sdk-inventory.test.mjs"
      - ".node-version"
      - ".github/workflows/polyglot-sdk.yml"
      - ".github/workflows/python-sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/java/**"
      - "sdk/kotlin/**"
      - "sdk/dotnet/**"
      - "sdk/rust/**"
      - "sdk/php/**"
      - "sdk/ruby/**"
      - "sdk/swift/**"
      - "sdk/dart/**"
      - "sdk/javascript/**"
      - "sdk/python/**"
      - "sdk/go/**"
      - "sdk/README.md"
      - "docs/architecture/language-neutral-interoperability.md"
      - "docs/architecture/interoperability-capabilities.json"
      - "docs/architecture/interoperability-contract-fixtures.json"
      - "docs/architecture/interoperability-gap-register.md"
      - "docs/INTEROPERABILITY-VERIFICATION-MATRIX.md"
      - "scripts/validate-polyglot-sdk-inventory.mjs"
      - "scripts/validate-polyglot-sdk-inventory.test.mjs"
      - ".node-version"
      - ".github/workflows/polyglot-sdk.yml"
      - ".github/workflows/python-sdk.yml"

permissions:
  contents: read

jobs:
  java:
    name: Java SDK (JDK 17)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test native Java SDK
        working-directory: sdk/java
        run: mvn --batch-mode --no-transfer-progress test

  kotlin:
    name: Kotlin SDK (JVM 17 / Kotlin 2.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: "8.10.2"
      - name: Test native Kotlin SDK and write dependency locks
        run: gradle --no-daemon -p sdk/kotlin --write-locks test
      - name: Upload generated Kotlin dependency lock
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-sdk-dependency-lock
          path: sdk/kotlin/gradle.lockfile
          if-no-files-found: error
          retention-days: 1

  dotnet:
    name: .NET SDK (8.0)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Test native .NET SDK
        run: dotnet test sdk/dotnet/Glorifier.Neural.Tests/Glorifier.Neural.Tests.csproj --configuration Release

  rust:
    name: Rust SDK (stable)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Test native Rust SDK
        run: cargo test --manifest-path sdk/rust/Cargo.toml --all-targets

  php:
    name: PHP SDK (8.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
          extensions: curl, mbstring
          coverage: none
      - name: Test native PHP SDK
        run: php sdk/php/tests/run.php && php sdk/php/tests/interoperability_fixtures.php

  ruby:
    name: Ruby SDK (3.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1
        with:
          ruby-version: "3.2"
      - name: Test native Ruby SDK
        run: ruby sdk/ruby/test/test_client.rb && ruby sdk/ruby/test/test_interoperability_fixtures.rb

  swift:
    name: Swift SDK (5.9+)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test native Swift SDK
        run: swift test --package-path sdk/swift

  dart:
    name: Dart SDK (3.4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: "3.4.4"
      - name: Resolve and test native Dart SDK
        working-directory: sdk/dart
        run: |
          dart pub get
          dart test
      - name: Upload generated Dart dependency lock
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dart-sdk-dependency-lock
          path: sdk/dart/pubspec.lock
          if-no-files-found: error
          retention-days: 1

  javascript:
    name: JavaScript / TypeScript SDK (Node.js 24)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Test server-side JavaScript/TypeScript SDK and shared fixtures
        run: npm --prefix sdk/javascript test

  inventory-contract:
    name: SDK inventory, documentation and evidence alignment
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Validate polyglot inventory regressions
        run: node --test scripts/validate-polyglot-sdk-inventory.test.mjs
      - name: Validate package, documentation, capability and CI inventory
        run: node scripts/validate-polyglot-sdk-inventory.mjs

  # These are supplementary probes. Their results do not widen registry support
  # until exact successful runs are added to the relevant capability records.
  python-platform-smoke:
    name: Python 3.12 platform probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Python SDK client tests
        working-directory: sdk/python
        run: python -m unittest -v test_glorifier_neural_client.py
      - name: Run Python shared fixture tests
        working-directory: sdk/python
        run: python -m unittest -v test_interoperability_fixtures.py

  go-platform-smoke:
    name: Go 1.26.x platform probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: sdk/go/go.mod
      - name: Run Go SDK tests
        working-directory: sdk/go
        run: go test -count=1 ./...
      - name: Run Go static analysis
        working-directory: sdk/go
        run: go vet ./...

  javascript-platform-smoke:
    name: Node.js 24 platform probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Run server-side JavaScript/TypeScript SDK contract tests
        run: npm --prefix sdk/javascript test
