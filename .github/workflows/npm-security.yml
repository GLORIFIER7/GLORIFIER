name: GLORIFIER npm Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glorifier-npm-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

      - name: TypeScript static check
        run: npm run lint

      - name: Production frontend build
        run: npm run build:frontend

      - name: Verify production-only dependency tree and Firestore runtime imports
        run: |
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
          npm ls rimraf glob minimatch --all --omit=dev
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdtemp, mkdir, writeFile, access } from 'node:fs/promises';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { rimraf } from 'rimraf';

          const firestore = await import('firebase-admin/firestore');
          assert.equal(typeof firestore.getFirestore, 'function');

          const root = await mkdtemp(join(tmpdir(), 'glorifier-rimraf-production-'));
          try {
            await mkdir(join(root, 'nested'), { recursive: true });
            await writeFile(join(root, 'nested', 'fixture.txt'), 'production dependency smoke test');
            assert.equal(await rimraf(root), true);
            await assert.rejects(access(root));
          } finally {
            await rimraf(root);
          }
          console.log('Production-only dependency and Firebase Admin Firestore smoke tests passed.');
          NODE
