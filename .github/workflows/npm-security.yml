name: GLORIFIER npm Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glorifier-npm-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

      - name: TypeScript static check
        run: npm run lint

      - name: Production frontend build
        run: npm run build:frontend
