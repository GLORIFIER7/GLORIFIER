name: GLORIFIER Solana Devnet Reconciliation Trigger

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY_GLORIFIER_SOLANA_DEVNET"
        required: true
        type: string
      mint_address:
        description: "Canonical recovered Devnet mint"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch-reconciliation:
    name: Dispatch authorized reconciliation
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate authorization
        env:
          CONFIRM: ${{ inputs.confirm }}
          MINT: ${{ inputs.mint_address }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "VERIFY_GLORIFIER_SOLANA_DEVNET"
          test "$MINT" = "8rXQAygKxRZ9R7fojLrXLoHdKxnEKTjmb8sfnnGvfU3S"

      - name: Dispatch full reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CONFIRM: ${{ inputs.confirm }}
          MINT: ${{ inputs.mint_address }}
        run: |
          set -euo pipefail
          gh workflow run glorifier-solana-devnet-reconcile-run.yml             --repo "$REPO"             --ref main             -f confirm="$CONFIRM"             -f mint_address="$MINT"
