name: NEURAL Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/neural/**"
      - ".github/workflows/neural-ci.yml"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "services/neural/**"
      - ".github/workflows/neural-ci.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"


permissions:
  contents: read

jobs:
  test:
    concurrency:
      group: neural-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ matrix.python-version }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: services/neural
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Validate committed dependency lock
        run: uv lock --check
      - name: Export hash-pinned development requirements
        run: uv export --locked --extra dev --extra neon --no-emit-project --format requirements-txt --output-file /tmp/requirements.txt
      - name: Install only wheel distributions at locked versions
        run: "python -m pip install --only-binary=:all: --require-hashes -r /tmp/requirements.txt"
      - run: "python -m pip install --only-binary=:all: --no-deps -e ."
      - run: ruff check .
      - run: pytest
      - name: Audit Python dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit -r /tmp/requirements.txt
      - name: Build container image (no publish)
        run: docker build --tag glorifier-neural:ci .
      - name: Verify runtime image includes the Neon PostgreSQL driver
        run: docker run --rm --entrypoint python glorifier-neural:ci -c "import psycopg; assert psycopg.__version__"
