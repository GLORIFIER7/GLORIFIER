name: Databricks API Verification

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: databricks-api-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Databricks OIDC authentication
    # Environment-based OIDC subjects do not include the Git ref. Only allow
    # this job to enter the protected environment when dispatched from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: databricks-readonly
    timeout-minutes: 5
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      # Databricks service-principal federation policy must match these claims:
      # issuer: https://token.actions.githubusercontent.com
      # subject: repo:GLORIFIER7@32674233/GLORIFIER@1377237797:environment:databricks-readonly
      # audience: 11bcb30d-f5e8-42dc-a186-dcd824e4c045 (Databricks account ID)
      # Databricks recommends using the account ID as the OIDC audience.
      DATABRICKS_TOKEN_AUDIENCE: 11bcb30d-f5e8-42dc-a186-dcd824e4c045

    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DATABRICKS_HOST" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::DATABRICKS_HOST must be an HTTPS workspace URL without a path."
            exit 1
          fi
          if [[ ! "$DATABRICKS_CLIENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::DATABRICKS_CLIENT_ID must be a UUID service-principal application ID."
            exit 1
          fi
          if [[ ! "$DATABRICKS_TOKEN_AUDIENCE" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::DATABRICKS_TOKEN_AUDIENCE must be the Databricks account ID UUID."
            exit 1
          fi
          echo "Required non-secret configuration is present."

      - name: Install pinned Databricks CLI
        uses: databricks/setup-cli@4f41a4c5291b531c1bb1e5760d677999cd484f89
        with:
          version: 1.22.1

      - name: Verify authenticated Databricks identity
        run: databricks current-user me
