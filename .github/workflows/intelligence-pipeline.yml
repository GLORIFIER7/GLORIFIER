name: GLORIFIER Intelligence Pipeline

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glorifier-intelligence-pipeline
  cancel-in-progress: false

jobs:
  refresh-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test intelligence endpoint validation
        run: node --test scripts/validate-intelligence-endpoint.test.mjs

      - name: Validate configured intelligence endpoint
        env:
          GLORIFIER_INTELLIGENCE_URL: ${{ vars.GLORIFIER_INTELLIGENCE_URL }}
        run: node scripts/validate-intelligence-endpoint.mjs

      - name: Refresh configured intelligence report
        env:
          GLORIFIER_INTELLIGENCE_URL: ${{ vars.GLORIFIER_INTELLIGENCE_URL }}
          INTELLIGENCE_KEY: ${{ secrets.INTELLIGENCE_INGEST_KEY }}
        shell: bash
        run: |
          if [ -n "${INTELLIGENCE_KEY}" ]; then
            curl --proto '=https' --fail-with-body --retry 2 --retry-delay 5 -X POST \
              -H "Content-Type: application/json" \
              -H "x-glorifier-intelligence-key: ${INTELLIGENCE_KEY}" \
              "${GLORIFIER_INTELLIGENCE_URL}"
          else
            curl --proto '=https' --fail-with-body --retry 2 --retry-delay 5 \
              "${GLORIFIER_INTELLIGENCE_URL}"
          fi
