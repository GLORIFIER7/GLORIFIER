name: GLORIFIER Intelligence Pipeline

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/intelligence-pipeline.yml"
      - "scripts/validate-intelligence-endpoint.mjs"
      - "scripts/validate-intelligence-endpoint.test.mjs"
      - "scripts/intelligence-pipeline-workflow.test.mjs"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('glorifier-intelligence-pipeline-pr-{0}', github.event.pull_request.number) || 'glorifier-intelligence-pipeline' }}
  cancel-in-progress: false

jobs:
  test-endpoint-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test intelligence endpoint validation
        run: node --test scripts/validate-intelligence-endpoint.test.mjs

      - name: Test intelligence pipeline workflow policy
        run: node scripts/intelligence-pipeline-workflow.test.mjs

  refresh-report:
    if: github.event_name != 'pull_request'
    needs: test-endpoint-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check intelligence endpoint configuration
        id: endpoint-config
        env:
          GLORIFIER_INTELLIGENCE_URL: ${{ vars.GLORIFIER_INTELLIGENCE_URL }}
        shell: bash
        run: |
          if [ -n "${GLORIFIER_INTELLIGENCE_URL}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
              echo "::warning::GLORIFIER_INTELLIGENCE_URL is not configured; scheduled intelligence refresh is NOT RUN. This is not evidence of a successful refresh."
              {
                echo "### Intelligence refresh: NOT RUN"
                echo ""
                echo "Repository variable \`GLORIFIER_INTELLIGENCE_URL\` is not configured, so no refresh request was sent."
                echo "This scheduled run is a configuration skip, not a successful refresh."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Validate configured intelligence endpoint
        if: steps.endpoint-config.outputs.configured == 'true' || github.event_name != 'schedule'
        env:
          GLORIFIER_INTELLIGENCE_URL: ${{ vars.GLORIFIER_INTELLIGENCE_URL }}
        run: node scripts/validate-intelligence-endpoint.mjs

      - name: Refresh configured intelligence report
        if: steps.endpoint-config.outputs.configured == 'true'
        env:
          GLORIFIER_INTELLIGENCE_URL: ${{ vars.GLORIFIER_INTELLIGENCE_URL }}
          INTELLIGENCE_KEY: ${{ secrets.INTELLIGENCE_INGEST_KEY }}
        shell: bash
        run: |
          if [ -n "${INTELLIGENCE_KEY}" ]; then
            curl --proto '=https' --fail-with-body --retry 2 --retry-delay 5 -X POST \
              -H "Content-Type: application/json" \
              -H "x-glorifier-intelligence-key: ${INTELLIGENCE_KEY}" \
              "${GLORIFIER_INTELLIGENCE_URL}"
          else
            curl --proto '=https' --fail-with-body --retry 2 --retry-delay 5 \
              "${GLORIFIER_INTELLIGENCE_URL}"
          fi
