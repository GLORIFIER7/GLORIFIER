name: MCP reference and registry validation

on:
  pull_request:
    paths:
      - "docs/architecture/interoperability-capabilities.json"
      - "docs/architecture/mcp-reference-conformance.md"
      - "scripts/validate-interoperability-registry.mjs"
      - "scripts/validate-interoperability-registry.test.mjs"
      - ".github/workflows/mcp-reference-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/architecture/interoperability-capabilities.json"
      - "docs/architecture/mcp-reference-conformance.md"
      - "scripts/validate-interoperability-registry.mjs"
      - "scripts/validate-interoperability-registry.test.mjs"
      - ".github/workflows/mcp-reference-validation.yml"

permissions:
  contents: read

jobs:
  registry-policy:
    name: Registry policy tests (Node.js)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up project Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test registry policy
        run: node --test scripts/validate-interoperability-registry.test.mjs
      - name: Validate current evidence registry
        run: node scripts/validate-interoperability-registry.mjs
