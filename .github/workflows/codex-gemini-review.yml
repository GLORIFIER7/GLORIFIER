name: GLORIFIER Codex Review of Gemini

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  codex-review:
    if: startsWith(github.event.pull_request.head.ref, 'ai/gemini/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout Gemini branch
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Codex review/fix
        if: ${{ env.OPENAI_API_KEY != '' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          effort: high
          prompt: |
            Review the Gemini-generated pull request for GLORIFIER.
            Read AGENTS.md and GEMINI.md first.
            Inspect the PR branch and identify concrete reliability, security,
            type-safety, testing, build, or maintainability problems.
            Do not modify files, secrets, credentials, deployment configuration,
            branches, or pull requests. Produce review findings only.
            Do not make cosmetic or speculative changes.
            Run npm run lint and npm run build when applicable if needed for analysis.
            If the Gemini change is already sound, report that no issues were found.

      - name: Report missing Codex credential
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: |
          echo "::warning::OPENAI_API_KEY is not configured. Gemini PRs will still receive normal CI validation."

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v7:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/openai/codex-action@v1:sha1-bdf19a4a223ec2549a3e2274a0cf61556bc07675
