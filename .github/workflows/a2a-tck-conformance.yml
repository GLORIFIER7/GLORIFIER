name: A2A TCK — authorized staging conformance

on:
  workflow_dispatch:
    inputs:
      sut_host:
        description: "HTTPS staging origin; hostname must match GLORIFIER_A2A_TCK_STAGING_HOST"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: a2a-tck-staging-conformance
  cancel-in-progress: false

jobs:
  conformance:
    if: ${{ github.ref == 'refs/heads/main' && github.actor_id == '32674233' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: a2a-tck-staging
    steps:
      - name: Checkout GLORIFIER for the pinned TCK lockfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate staging origin, bearer credential, and A2A Agent Card
        id: target
        env:
          SUT_HOST: ${{ inputs.sut_host }}
          ALLOWED_HOST: ${{ vars.GLORIFIER_A2A_TCK_STAGING_HOST }}
          A2A_TCK_TOKEN: ${{ secrets.GLORIFIER_A2A_TCK_STAGING_BEARER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class RejectRedirects(HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None

          sut_host = os.environ.get("SUT_HOST", "").strip()
          allowed_host = os.environ.get("ALLOWED_HOST", "").strip()
          token = os.environ.get("A2A_TCK_TOKEN", "")
          if not allowed_host:
              raise SystemExit(
                  "Missing environment variable GLORIFIER_A2A_TCK_STAGING_HOST "
                  "in the a2a-tck-staging environment."
              )
          if not token:
              raise SystemExit(
                  "Missing environment secret GLORIFIER_A2A_TCK_STAGING_BEARER_TOKEN "
                  "in the a2a-tck-staging environment."
              )
          if "://" in allowed_host or "/" in allowed_host:
              raise SystemExit(
                  "GLORIFIER_A2A_TCK_STAGING_HOST must be configured as a hostname only "
                  "(no scheme, path, port, or trailing slash)."
              )
          label = r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?"
          if len(allowed_host) > 253 or not re.fullmatch(rf"{label}(?:\.{label})*", allowed_host):
              raise SystemExit("GLORIFIER_A2A_TCK_STAGING_HOST must be one exact DNS hostname.")
          allowed_host = allowed_host.lower()
          reserved_suffixes = (
              ".example", ".example.com", ".example.net", ".example.org",
              ".invalid", ".test", ".localhost",
          )
          if (
              allowed_host in {"example", "example.com", "example.net", "example.org", "localhost"}
              or allowed_host.endswith(reserved_suffixes)
          ):
              raise SystemExit(
                  "A2A staging target is a reserved placeholder hostname; configure a real "
                  "HTTPS staging hostname controlled by GLORIFIER."
              )
          parsed = urlsplit(sut_host)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.hostname.lower() != allowed_host.lower()
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port not in (None, 443)
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("SUT host must be an HTTPS origin on the exact allowlisted staging hostname.")
          origin = f"https://{parsed.hostname.lower()}"
          request = Request(
              origin + "/.well-known/agent-card.json",
              headers={"Accept": "application/json"},
              method="GET",
          )
          try:
              with build_opener(RejectRedirects()).open(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"A2A Agent Card returned HTTP {response.status}.")
                  max_card_bytes = 256 * 1024
                  payload = response.read(max_card_bytes + 1)
                  if len(payload) > max_card_bytes:
                      raise SystemExit("A2A Agent Card exceeds 256 KiB.")
                  card = json.loads(payload.decode("utf-8"))
          except (HTTPError, URLError, TimeoutError, ValueError) as error:
              raise SystemExit(f"Staging A2A Agent Card preflight failed: {type(error).__name__}.") from None

          if not isinstance(card, dict):
              raise SystemExit("A2A Agent Card must be a JSON object.")
          interfaces = card.get("supportedInterfaces")
          if not isinstance(interfaces, list):
              raise SystemExit("A2A Agent Card supportedInterfaces must be an array.")
          jsonrpc = [
              item for item in interfaces
              if isinstance(item, dict)
              and item.get("protocolBinding") == "JSONRPC"
              and item.get("protocolVersion") == "1.0"
          ]
          if not jsonrpc:
              raise SystemExit("Agent Card does not advertise the A2A 1.0 JSONRPC interface.")
          for interface in jsonrpc:
              url = interface.get("url")
              if not isinstance(url, str):
                  raise SystemExit("A2A JSONRPC interface URL must be a string.")
              try:
                  endpoint = urlsplit(url)
                  invalid_endpoint = (
                      endpoint.scheme != "https"
                      or not endpoint.hostname
                      or endpoint.hostname.lower() != parsed.hostname.lower()
                      or endpoint.username is not None
                      or endpoint.password is not None
                      or endpoint.port not in (None, 443)
                      or endpoint.query
                      or endpoint.fragment
                  )
              except ValueError:
                  invalid_endpoint = True
              if invalid_endpoint:
                  raise SystemExit("A2A JSONRPC interface must remain on the exact allowlisted HTTPS staging host.")
          security_schemes = card.get("securitySchemes")
          if not isinstance(security_schemes, dict) or "bearer" not in security_schemes:
              raise SystemExit("A2A Agent Card does not declare the expected bearer security scheme.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("sut_host=" + origin + "\n")
          print("A2A staging origin and public Agent Card contract verified; bearer credential was not displayed.")
          PY

      - name: Checkout official A2A TCK at pinned upstream revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: a2aproject/a2a-tck
          ref: 104a7b4ae0d83f65c075e3793e322953a830eaba
          path: .a2a-tck
          persist-credentials: false

      - name: Verify pinned upstream TCK injects configured bearer auth
        working-directory: .a2a-tck
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helpers = Path("tck/transport/_helpers.py").read_text(encoding="utf-8")
          client = Path("tck/transport/jsonrpc_client.py").read_text(encoding="utf-8")
          required = (
              "def get_auth_headers",
              "A2A_AUTH_TOKEN",
              "def build_default_headers",
          )
          if any(marker not in helpers for marker in required):
              raise SystemExit(
                  "Pinned upstream A2A TCK cannot inject bearer credentials. "
                  "Upstream issue #163 remains open and PR #200 is unmerged; refusing to claim authenticated conformance."
              )
          if "build_default_headers" not in client or "self._headers = build_default_headers()" not in client:
              raise SystemExit(
                  "Pinned upstream JSON-RPC client does not inject A2A_AUTH_* headers; refusing to run authenticated conformance."
              )
          if "merge_headers(self._headers" not in client:
              raise SystemExit(
                  "Pinned upstream JSON-RPC requests do not carry configured authorization headers; refusing to run authenticated conformance."
              )
          print("Pinned upstream TCK authenticated JSON-RPC support verified.")
          PY

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.15"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      - name: Install official A2A TCK
        working-directory: .a2a-tck
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/scripts/lockfiles/a2a-tck-uv.lock" uv.lock
          uv venv
          uv sync --locked --no-dev --no-install-project --no-build

      - name: Run full declared JSON-RPC transport conformance
        working-directory: .a2a-tck
        env:
          SUT_HOST: ${{ steps.target.outputs.sut_host }}
          A2A_AUTH_TYPE: bearer
          A2A_AUTH_TOKEN: ${{ secrets.GLORIFIER_A2A_TCK_STAGING_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          source .venv/bin/activate
          ./run_tck.py --sut-host "$SUT_HOST" --transport jsonrpc

      - name: Upload A2A TCK reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a2a-tck-jsonrpc-reports
          path: .a2a-tck/reports/
          if-no-files-found: warn
          retention-days: 14
