name: GLORIFIER Digital Me — ruleset credential preflight
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: glorifier-digital-me-ruleset-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.repository == 'GLORIFIER7/GLORIFIER' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' &&
      github.actor_id == '32674233' && github.triggering_actor == 'GLORIFIER7'
    environment: digital-me-ruleset-attest
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify isolated ruleset credential and protected signed main
        env:
          RULESET_ATTEST_TOKEN: ${{ secrets.DIGITAL_ME_RULESET_ATTEST_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {makeRulesetAttestation,createAttestedReadApi} from './digital-me/src/dispatcher-ruleset-attestation.mjs';
          import {githubReadApi,createGithubEvidence} from './digital-me/src/dispatcher-github-evidence.mjs';
          let stage='PREFLIGHT_INITIALIZATION';
          try {
            const token=process.env.RULESET_ATTEST_TOKEN;
            const readToken=process.env.GITHUB_TOKEN;
            delete process.env.RULESET_ATTEST_TOKEN;
            delete process.env.GITHUB_TOKEN;
            stage='ATTEST_TOKEN_INVALID';
            if(typeof token!=='string'||!token)throw Error('TOKEN_INVALID');
            stage='READ_TOKEN_INVALID';
            if(typeof readToken!=='string'||!readToken)throw Error('TOKEN_INVALID');
            const sourceSha=process.env.GITHUB_SHA,runId=process.env.GITHUB_RUN_ID;
            // Only fixed stage names and allowlisted HTTP codes enter logs.
            const observe=(prefix)=>async(url,options)=>{
              stage=prefix+'_REQUEST_FAILED';
              const response=await fetch(url,options);
              if(!response.ok)stage=prefix+'_HTTP_'+([401,403,404,429,500,502,503,504].includes(response.status)?response.status:'OTHER');
              return response;
            };
            stage='ATTEST_REQUEST_FAILED';
            const ruleset=await githubReadApi(token,observe('ATTEST'))('/repos/GLORIFIER7/GLORIFIER/rulesets/28293483');
            stage='BYPASS_ACTORS_UNAVAILABLE';
            if(!Array.isArray(ruleset?.bypass_actors))throw Error('BYPASS_ACTORS_UNAVAILABLE');
            stage='BYPASS_ACTORS_PRESENT';
            if(ruleset.bypass_actors.length!==0)throw Error('BYPASS_ACTORS_PRESENT');
            stage='ATTESTATION_INVALID';
            const attestation=makeRulesetAttestation({ruleset,sourceSha,runId});
            const ordinary=githubReadApi(readToken,observe('READ'));
            const rulesetPath='/repos/GLORIFIER7/GLORIFIER/rulesets/28293483';
            // Only this owner-only read-only job can reread full privileged policy.
            // A static proof is NOT a substitute for the dispatcher's drift fence.
            const verifyStatic=async()=>{
              const trusted=githubReadApi(token,observe('STATIC'));
              const fullRead=async path=>{
                if(path!==rulesetPath)return ordinary(path);
                const full=await trusted(path);
                makeRulesetAttestation({ruleset:full,sourceSha,runId});
                return full;
              };
              const freshApi=createAttestedReadApi({api:fullRead,attestation,sourceSha,runId});
              const proof=createGithubEvidence({api:freshApi,resolveManifest:()=>{throw Error('PREFLIGHT_ONLY');}});
              const signedMain=await proof.readMain();
              await freshApi(rulesetPath);
              if(signedMain.sha!==sourceSha||signedMain.verified!==true||signedMain.reason!=='valid')throw Error('STATIC_MAIN_MISMATCH');
              console.log(JSON.stringify({status:'RULESET_STATIC_GOVERNANCE_VERIFIED_READ_ONLY',sourceSha,runId,zeroBypass:true,signedMain:true,protectedMain:true,runtimeCompatibilityVerified:false,executionAuthorized:false,publicationAuthorized:false,driftMarkerSemanticsVerified:false}));
            };
            const api=createAttestedReadApi({api:async path=>{
              const result=await ordinary(path);
              if(path===rulesetPath){
                let issue;
                if(result?.id!==ruleset.id)issue='RULESET_RUNTIME_ID_MISMATCH';
                else if(typeof result.updated_at!=='string'||!Number.isFinite(Date.parse(result.updated_at)))issue='RULESET_RUNTIME_MARKER_UNAVAILABLE';
                else if(result.updated_at!==ruleset.updated_at)issue='RULESET_RUNTIME_MARKER_DIFFERENT';
                if(issue){
                  console.error(issue);
                  try{await verifyStatic();}catch{console.error('RULESET_STATIC_GOVERNANCE_DENIED');}
                }
              }
              stage='GOVERNANCE_OR_SIGNATURE_DENIED';
              return result;
            },attestation,sourceSha,runId});
            const evidence=createGithubEvidence({api,resolveManifest:()=>{throw Error('PREFLIGHT_ONLY');}});
            stage='GOVERNANCE_OR_SIGNATURE_DENIED';
            const main=await evidence.readMain();
            stage='MAIN_MISMATCH';
            if(main.sha!==sourceSha||main.verified!==true||main.reason!=='valid')throw Error('MAIN_MISMATCH');
            console.log(JSON.stringify({status:'RULESET_PREFLIGHT_VERIFIED_READ_ONLY',sourceSha,runId,zeroBypass:true,signedMain:true,protectedMain:true,executionAuthorized:false,publicationAuthorized:false,driftMarkerSemanticsVerified:false}));
          }catch(failure){
            // Emit only fixed codes; never echo API payloads, error messages or credentials.
            const safeCodes=new Set([
              'RULESET_MISSING','RULESET_IDENTITY_OR_ENFORCEMENT','RULESET_SCOPE',
              'DEFAULT_BRANCH_MISMATCH','RULE_TYPE_REQUIRED_SIGNATURES','RULE_TYPE_NON_FAST_FORWARD',
              'RULE_TYPE_DELETION','RULE_TYPE_PULL_REQUEST','RULE_TYPE_REQUIRED_STATUS_CHECKS',
              'RULE_TYPE_CODE_SCANNING','RULE_TYPE_CODE_QUALITY','REQUIRED_APPROVAL',
              'STALE_APPROVAL_DISMISSAL','CODEOWNER_REVIEW','REVIEW_THREAD_RESOLUTION',
              'STRICT_STATUS_CHECKS','REQUIRED_CHECK_BINDING','CODE_SCANNING_POLICY',
              'CODE_QUALITY_POLICY','MAIN_SIGNATURE_INVALID','ATTESTATION_EXPIRED',
              'RULESET_MARKER_MISMATCH','LIVE_BYPASS_DENIED','RULESET_VISIBLE_FIELDS_MISMATCH'
            ]);
            const reason=safeCodes.has(failure?.code)?failure.code:stage;
            console.error('RULESET_PREFLIGHT_DENIED '+reason);process.exitCode=1;
          }
          NODE
