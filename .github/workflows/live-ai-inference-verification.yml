name: Live AI Inference Verification

on:
  pull_request:
    paths:
      - '.github/workflows/live-ai-inference-verification.yml'
      - 'scripts/live-ai-inference-verification.mjs'
      - 'scripts/live-ai-inference-verification.test.mjs'
      - 'src/lib/ai/repository-contributor-policy.mjs'
  workflow_dispatch:
    inputs:
      provider:
        description: "Select one registered GLORIFIER AI provider to verify"
        required: true
        type: choice
        options:
          - openai
          - gemini
          - anthropic
          - meta
          - qwen
          - xai
          - mistral
          - deepseek
          - groq
          - together
          - fireworks
          - openrouter
          - huggingface
          - llmsrelay
          - nvidia
          - ollama
      model:
        description: "Optional exact model override; it must match the current owner attestation"
        required: false
        type: string
      allow_free_inference:
        description: "Explicitly authorize one bounded inference request only after free entitlement and zero-spend attestation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: live-ai-inference-verification-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test provider coverage, owner attestation, and no-fallback controls
        run: node --test scripts/live-ai-inference-verification.test.mjs

  preflight:
    # Manual owner-only dispatch on main, explicit opt-in, and an existing protected
    # environment are required before any provider secret is exposed to a runner.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '32674233' && github.run_attempt == 1 && vars.LIVE_AI_PROBE_ENABLED == 'true' && inputs.allow_free_inference == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout exact dispatched commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify independent reviewer and main-only environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: node scripts/verify-live-ai-probe-environment.mjs

  inference:
    needs: preflight
    if: needs.preflight.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor_id == '32674233' && github.run_attempt == 1 && vars.LIVE_AI_PROBE_ENABLED == 'true' && inputs.allow_free_inference == true
    runs-on: ${{ (inputs.provider == 'meta' || inputs.provider == 'ollama') && fromJSON('["self-hosted","linux","x64","glorifier-local-ai"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    environment: live-ai-probe
    permissions:
      contents: read
    env:
      LIVE_AI_PROVIDER: ${{ inputs.provider }}
      LIVE_AI_PROBE_ENABLED: ${{ vars.LIVE_AI_PROBE_ENABLED }}
      ALLOW_FREE_INFERENCE: ${{ inputs.allow_free_inference && 'true' || 'false' }}
      GLORIFIER_REPOSITORY_AI_FREE_ATTESTATIONS_JSON: ${{ vars.GLORIFIER_REPOSITORY_AI_FREE_ATTESTATIONS_JSON }}
      OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
      GEMINI_API_KEY: ${{ inputs.provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
      META_API_KEY: ${{ inputs.provider == 'meta' && secrets.META_API_KEY || '' }}
      QWEN_API_KEY: ${{ inputs.provider == 'qwen' && secrets.QWEN_API_KEY || '' }}
      XAI_API_KEY: ${{ inputs.provider == 'xai' && secrets.XAI_API_KEY || '' }}
      MISTRAL_API_KEY: ${{ inputs.provider == 'mistral' && secrets.MISTRAL_API_KEY || '' }}
      DEEPSEEK_API_KEY: ${{ inputs.provider == 'deepseek' && secrets.DEEPSEEK_API_KEY || '' }}
      GROQ_API_KEY: ${{ inputs.provider == 'groq' && secrets.GROQ_API_KEY || '' }}
      TOGETHER_API_KEY: ${{ inputs.provider == 'together' && secrets.TOGETHER_API_KEY || '' }}
      FIREWORKS_API_KEY: ${{ inputs.provider == 'fireworks' && secrets.FIREWORKS_API_KEY || '' }}
      OPENROUTER_API_KEY: ${{ inputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
      HF_TOKEN: ${{ inputs.provider == 'huggingface' && secrets.HF_TOKEN || '' }}
      LLMSRELAY_API_KEY: ${{ inputs.provider == 'llmsrelay' && secrets.LLMSRELAY_API_KEY || '' }}
      NVIDIA_API_KEY: ${{ inputs.provider == 'nvidia' && secrets.NVIDIA_API_KEY || '' }}
      OLLAMA_AUTH_TOKEN: ${{ inputs.provider == 'ollama' && secrets.OLLAMA_AUTH_TOKEN || '' }}
      OPENAI_MODEL: ${{ inputs.provider == 'openai' && inputs.model || vars.OPENAI_MODEL }}
      GEMINI_MODEL: ${{ inputs.provider == 'gemini' && inputs.model || vars.GEMINI_MODEL }}
      ANTHROPIC_MODEL: ${{ inputs.provider == 'anthropic' && inputs.model || vars.ANTHROPIC_MODEL }}
      META_MODEL: ${{ inputs.provider == 'meta' && inputs.model || vars.META_MODEL }}
      QWEN_MODEL: ${{ inputs.provider == 'qwen' && inputs.model || vars.QWEN_MODEL }}
      XAI_MODEL: ${{ inputs.provider == 'xai' && inputs.model || vars.XAI_MODEL }}
      MISTRAL_MODEL: ${{ inputs.provider == 'mistral' && inputs.model || vars.MISTRAL_MODEL }}
      DEEPSEEK_MODEL: ${{ inputs.provider == 'deepseek' && inputs.model || vars.DEEPSEEK_MODEL }}
      GROQ_MODEL: ${{ inputs.provider == 'groq' && inputs.model || vars.GROQ_MODEL }}
      TOGETHER_MODEL: ${{ inputs.provider == 'together' && inputs.model || vars.TOGETHER_MODEL }}
      FIREWORKS_MODEL: ${{ inputs.provider == 'fireworks' && inputs.model || vars.FIREWORKS_MODEL }}
      OPENROUTER_MODEL: ${{ inputs.provider == 'openrouter' && inputs.model || vars.OPENROUTER_MODEL }}
      HF_MODEL: ${{ inputs.provider == 'huggingface' && inputs.model || vars.HF_MODEL }}
      LLMSRELAY_MODEL: ${{ inputs.provider == 'llmsrelay' && inputs.model || vars.LLMSRELAY_MODEL }}
      NVIDIA_MODEL: ${{ inputs.provider == 'nvidia' && inputs.model || vars.NVIDIA_MODEL }}
      OLLAMA_MODEL: ${{ inputs.provider == 'ollama' && inputs.model || vars.OLLAMA_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      META_BASE_URL: ${{ vars.META_BASE_URL }}
      QWEN_BASE_URL: ${{ vars.QWEN_BASE_URL }}
      XAI_BASE_URL: ${{ vars.XAI_BASE_URL }}
      MISTRAL_BASE_URL: ${{ vars.MISTRAL_BASE_URL }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      GROQ_BASE_URL: ${{ vars.GROQ_BASE_URL }}
      TOGETHER_BASE_URL: ${{ vars.TOGETHER_BASE_URL }}
      FIREWORKS_BASE_URL: ${{ vars.FIREWORKS_BASE_URL }}
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}
      HF_BASE_URL: ${{ vars.HF_BASE_URL }}
      LLMSRELAY_BASE_URL: ${{ vars.LLMSRELAY_BASE_URL }}
      NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
      OLLAMA_BASE_URL: ${{ vars.OLLAMA_BASE_URL }}
    steps:
      - name: Checkout exact dispatched commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Run one-provider, zero-paid-budget inference verification
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/live-ai-inference-verification.mjs | tee "$GITHUB_STEP_SUMMARY"
