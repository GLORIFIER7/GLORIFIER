name: GLORIFIER Mainnet Release Gate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_GLORIFIER_MAINNET to authorize the release workflow'
        required: true
        type: string
      initial_holder:
        description: 'GLR initial holder address (defaults to deployer)'
        required: false
        default: ''
        type: string
      sepolia_contract:
        description: 'Verified GLR Sepolia contract address required before mainnet release'
        required: true
        type: string
      sepolia_transaction:
        description: 'Successful GLR Sepolia deployment transaction hash required before mainnet release'
        required: true
        type: string

concurrency:
  group: glorifier-mainnet-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: mainnet
    permissions:
      contents: read
    env:
      ETHERSCAN_API_KEY: ${{ secrets.GLORIFIER_ETHERSCAN_API_KEY }}
      MAINNET_RPC_URL: ${{ secrets.GLORIFIER_MAINNET_RPC_URL }}
      SEPOLIA_RPC_URL: ${{ secrets.GLORIFIER_CHAINSTACK_SEPOLIA_RPC_URL }}
      SEPOLIA_RPC_ALCHEMY: ${{ secrets.GLORIFIER_ALCHEMY_SEPOLIA_RPC_URL }}
      SEPOLIA_RPC_INFURA: ${{ secrets.GLORIFIER_TESTNET_RPC_URL }}
      SEPOLIA_PUBLIC_RPC: https://ethereum-sepolia-rpc.publicnode.com
      MAINNET_PRIVATE_KEY: ${{ secrets.GLORIFIER_MAINNET_PRIVATE_KEY }}
    steps:
      - name: Require explicit release authorization
        run: |
          set -euo pipefail
          test '${{ inputs.confirm }}' = 'DEPLOY_GLORIFIER_MAINNET' || { echo 'ERROR: explicit mainnet confirmation required.'; exit 1; }
          test -n "$MAINNET_RPC_URL" || { echo 'ERROR: GLORIFIER_MAINNET_RPC_URL is missing.'; exit 1; }
          test -n "$ETHERSCAN_API_KEY" || { echo 'ERROR: GLORIFIER_ETHERSCAN_API_KEY is missing.'; exit 1; }
          test -n "$MAINNET_PRIVATE_KEY" || { echo 'ERROR: GLORIFIER_MAINNET_PRIVATE_KEY is missing from the protected mainnet environment.'; exit 1; }

      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Require verified Sepolia release prerequisite
        working-directory: contracts
        env:
          SEPOLIA_CONTRACT: ${{ inputs.sepolia_contract }}
          SEPOLIA_TX: ${{ inputs.sepolia_transaction }}
        run: |
          set -euo pipefail
          [[ "$SEPOLIA_CONTRACT" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "ERROR: sepolia_contract must be a valid Ethereum address."; exit 1; }
          [[ "$SEPOLIA_TX" =~ ^0x[0-9a-fA-F]{64}$ ]] || { echo "ERROR: sepolia_transaction must be a valid transaction hash."; exit 1; }
          select_sepolia_rpc() {
            local provider url chain_id entry
            for entry in \
              "Chainstack|$SEPOLIA_RPC_URL" \
              "Alchemy|$SEPOLIA_RPC_ALCHEMY" \
              "Infura|$SEPOLIA_RPC_INFURA" \
              "PublicNode|$SEPOLIA_PUBLIC_RPC"
            do
              provider="${entry%%|*}"
              url="${entry#*|}"
              [[ -n "$url" ]] || continue
              if chain_id="$(cast chain-id --rpc-url "$url" 2>/dev/null)" && [[ "$chain_id" == "11155111" ]]; then
                SEPOLIA_RPC_URL="$url"
                echo "Sepolia prerequisite RPC: $provider"
                return 0
              fi
            done
            echo "ERROR: no healthy Ethereum Sepolia RPC provider is available."
            exit 1
          }
          select_sepolia_rpc
          echo "::add-mask::$SEPOLIA_RPC_URL"
          test "$(cast chain-id --rpc-url "$SEPOLIA_RPC_URL")" = "11155111"
          test "$(cast code "$SEPOLIA_CONTRACT" --rpc-url "$SEPOLIA_RPC_URL")" != "0x"
          if ! RECEIPT="$(timeout 20s cast receipt "$SEPOLIA_TX" --rpc-url "$SEPOLIA_RPC_URL" --json)"; then
            echo "ERROR: could not retrieve the Sepolia deployment receipt."
            exit 1
          fi
          RECEIPT_STATUS="$(echo "$RECEIPT" | jq -r '.status // empty')"
          case "$RECEIPT_STATUS" in
            0x1|0X1|1) ;;
            *) echo "ERROR: Sepolia deployment transaction receipt is not successful (status=$RECEIPT_STATUS)."; exit 1 ;;
          esac
          RECEIPT_CONTRACT="$(echo "$RECEIPT" | jq -r '.contractAddress // empty')"
          if [[ -n "$RECEIPT_CONTRACT" ]]; then
            [[ "$(printf '%s' "$RECEIPT_CONTRACT" | tr '[:upper:]' '[:lower:]')" == "$(printf '%s' "$SEPOLIA_CONTRACT" | tr '[:upper:]' '[:lower:]')" ]] || {
              echo "ERROR: Sepolia receipt contractAddress does not match the supplied contract."
              exit 1
            }
          fi
          NAME="$(cast call "$SEPOLIA_CONTRACT" 'name()(string)' --rpc-url "$SEPOLIA_RPC_URL" | sed -E 's/^"//; s/"$//; s/[[:space:]]+$//')"
          SYMBOL="$(cast call "$SEPOLIA_CONTRACT" 'symbol()(string)' --rpc-url "$SEPOLIA_RPC_URL" | sed -E 's/^"//; s/"$//; s/[[:space:]]+$//')"
          DECIMALS="$(cast call "$SEPOLIA_CONTRACT" 'decimals()(uint8)' --rpc-url "$SEPOLIA_RPC_URL" | awk '{print $1}' | tr -d "\r\n")"
          TOTAL_SUPPLY="$(cast call "$SEPOLIA_CONTRACT" 'totalSupply()(uint256)' --rpc-url "$SEPOLIA_RPC_URL" | awk '{print $1}' | tr -d "\r\n")"
          test "$NAME" = "GLORIFIER"
          test "$SYMBOL" = "GLR"
          test "$DECIMALS" = "18"
          test "$TOTAL_SUPPLY" = "1000000000000000000000000000"
          echo "Sepolia prerequisite: ON-CHAIN VERIFIED"

      - name: Install dependencies
        working-directory: contracts
        run: |
          set -euo pipefail
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit

      - name: Test
        working-directory: contracts
        run: forge test -vv

      - name: Validate mainnet RPC
        working-directory: contracts
        env:
          PRIVATE_KEY: ${{ secrets.GLORIFIER_MAINNET_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Probe JSON-RPC directly so authentication/HTTP failures are distinguishable
          # from a wrong-chain response, without ever printing the secret URL.
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          HTTP_STATUS="$(curl -sS --max-time 20 --connect-timeout 10 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
            "$MAINNET_RPC_URL" || true)"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            case "$HTTP_STATUS" in
              401|403) echo "ERROR: GLORIFIER_MAINNET_RPC_URL rejected the request with HTTP $HTTP_STATUS (authentication/authorization failure). Replace the protected secret with a valid Ethereum Mainnet RPC URL."; ;;
              000|'') echo "ERROR: GLORIFIER_MAINNET_RPC_URL could not be reached within the timeout."; ;;
              *) echo "ERROR: GLORIFIER_MAINNET_RPC_URL returned HTTP $HTTP_STATUS instead of 200."; ;;
            esac
            exit 1
          fi
          MAINNET_CHAIN_ID_HEX="$(jq -r '.result // empty' "$RESPONSE_FILE")"
          case "${MAINNET_CHAIN_ID_HEX,,}" in
            0x1|0x01|1) ;;
            *) echo "ERROR: GLORIFIER_MAINNET_RPC_URL responded successfully but did not report Ethereum mainnet chain ID 1."; exit 1 ;;
          esac
          DEPLOYER="$(cast wallet address --private-key "$PRIVATE_KEY")"
          BALANCE="$(timeout 20s cast balance "$DEPLOYER" --rpc-url "$MAINNET_RPC_URL" 2>/dev/null || true)"
          [[ "$BALANCE" =~ ^[0-9]+ ]] || { echo "ERROR: could not read mainnet deployer balance from GLORIFIER_MAINNET_RPC_URL."; exit 1; }
          echo "Mainnet RPC: authenticated and chain ID 1"
          echo "Mainnet deployer: $DEPLOYER"
          echo "Mainnet balance: $BALANCE wei"
          test "$BALANCE" != "0" || { echo 'ERROR: deployer has zero mainnet ETH.'; exit 1; }

      - name: Deploy GLR to Ethereum mainnet
        working-directory: contracts
        env:
          PRIVATE_KEY: ${{ secrets.GLORIFIER_MAINNET_PRIVATE_KEY }}
          INITIAL_HOLDER_INPUT: ${{ inputs.initial_holder }}
        run: |
          set -euo pipefail
          INITIAL_HOLDER="$(printf '%s' "$INITIAL_HOLDER_INPUT" | tr -d '[:space:]')"
          if [[ -z "$INITIAL_HOLDER" ]]; then INITIAL_HOLDER="$(cast wallet address --private-key "$PRIVATE_KEY")"; fi
          [[ "$INITIAL_HOLDER" =~ ^0x[0-9a-fA-F]{40}$ ]]
          [[ "$(printf '%s' "$INITIAL_HOLDER" | tr '[:upper:]' '[:lower:]')" != "0x0000000000000000000000000000000000000000" ]]
          echo "GLORIFIER_INITIAL_HOLDER=$INITIAL_HOLDER" >> "$GITHUB_ENV"
          rm -rf broadcast
          forge script script/DeployGLORIFIER.s.sol:DeployGLORIFIER --rpc-url "$MAINNET_RPC_URL" --broadcast --slow

      - name: Verify deployment and source
        working-directory: contracts
        run: |
          set -euo pipefail
          RUN_FILE="broadcast/DeployGLORIFIER.s.sol/1/run-latest.json"
          test -s "$RUN_FILE"
          CONTRACT_ADDRESS="$(jq -r '.transactions[] | select(.contractAddress != null and .contractAddress != "") | .contractAddress' "$RUN_FILE" | head -n1)"
          TX_HASH="$(jq -r '.transactions[] | select(.hash != null and .hash != "") | .hash' "$RUN_FILE" | head -n1)"
          test -n "$CONTRACT_ADDRESS" && test "$CONTRACT_ADDRESS" != null
          test -n "$TX_HASH" && test "$TX_HASH" != null
          test "$(cast code "$CONTRACT_ADDRESS" --rpc-url "$MAINNET_RPC_URL")" != 0x
          NAME="$(cast call "$CONTRACT_ADDRESS" 'name()(string)' --rpc-url "$MAINNET_RPC_URL" | sed -E 's/^"//; s/"$//; s/[[:space:]]+$//')"
          SYMBOL="$(cast call "$CONTRACT_ADDRESS" 'symbol()(string)' --rpc-url "$MAINNET_RPC_URL" | sed -E 's/^"//; s/"$//; s/[[:space:]]+$//')"
          DECIMALS="$(cast call "$CONTRACT_ADDRESS" 'decimals()(uint8)' --rpc-url "$MAINNET_RPC_URL" | awk '{print $1}' | tr -d "\r\n")"
          TOTAL_SUPPLY="$(cast call "$CONTRACT_ADDRESS" 'totalSupply()(uint256)' --rpc-url "$MAINNET_RPC_URL" | awk '{print $1}' | tr -d "\r\n")"
          test "$NAME" = "GLORIFIER"
          test "$SYMBOL" = "GLR"
          test "$DECIMALS" = "18"
          test "$TOTAL_SUPPLY" = "1000000000000000000000000000"
          test "$(cast receipt "$TX_HASH" --rpc-url "$MAINNET_RPC_URL" --json | jq -r '.status')" = 1
          CONSTRUCTOR_ARGS="$(cast abi-encode 'constructor(address)' "$GLORIFIER_INITIAL_HOLDER")"
          forge verify-contract "$CONTRACT_ADDRESS" src/GLORIFIER.sol:GLORIFIER --chain mainnet --constructor-args "$CONSTRUCTOR_ARGS" --etherscan-api-key "$ETHERSCAN_API_KEY" --watch
          echo "Mainnet contract: $CONTRACT_ADDRESS"
          echo "Mainnet transaction: $TX_HASH"
          echo "Etherscan: https://etherscan.io/address/$CONTRACT_ADDRESS"
          echo "Transaction: https://etherscan.io/tx/$TX_HASH"
          {
            echo "GLR_STATUS=FULLY_VERIFIED"
            echo "CHAIN=ethereum-mainnet"
            echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS"
            echo "DEPLOYMENT_TX=$TX_HASH"
            echo "ETHERSCAN_VERIFIED=true"
          } > mainnet-release-evidence.env

      - name: Publish mainnet release evidence
        uses: actions/upload-artifact@v5
        with:
          name: glorifier-mainnet-release-evidence
          path: contracts/mainnet-release-evidence.env
          if-no-files-found: error
