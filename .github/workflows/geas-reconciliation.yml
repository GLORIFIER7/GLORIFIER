name: GEAS Architecture Reconciliation CI

on:
  pull_request:
    paths:
      - 'src/lib/governance/geas-reconciliation.ts'
      - 'src/lib/governance/geas-reconciliation.test.ts'
      - 'src/lib/governance/index.ts'
      - 'server.ts'
      - 'package.json'
      - 'docs/GEAS-ARCHITECTURE-RECONCILIATION.md'
  push:
    branches:
      - geas-architecture-reconciliation-v1
  workflow_dispatch:

jobs:
  geas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test:geas-reconciliation
      - run: npm run build
