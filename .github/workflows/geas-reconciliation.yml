name: GEAS Architecture Reconciliation CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/governance/geas-reconciliation.ts'
      - 'src/lib/governance/geas-reconciliation.test.ts'
      - 'src/lib/governance/geas-architecture-scientist.ts'
      - 'src/lib/governance/index.ts'
      - 'server.ts'
      - 'package.json'
      - 'docs/GEAS-ARCHITECTURE-RECONCILIATION.md'
      - '.github/workflows/geas-reconciliation.yml'
  push:
    branches: [main, geas-architecture-reconciliation-v1]

permissions:
  contents: read

jobs:
  geas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: GEAS reconciliation tests
        run: npm run test:geas-reconciliation

      - name: Production build
        run: npm run build

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683:sha1-11bd71901bbe5b1630ceea73d27597364c9af683
  - github.com/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020:sha1-49933ea5288caeca8642d1e84afbd3f7d6820020
