name: GLORIFIER Architecture Contract Validation

on:
  push:
    paths:
      - 'agent-network/**'
      - 'docs/**'
      - '.github/workflows/architecture-contract-validation.yml'
  pull_request:
    paths:
      - 'agent-network/**'
      - 'docs/**'
      - '.github/workflows/architecture-contract-validation.yml'

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path("agent-network/agent-card.glorifier.json"),
              Path("agent-network/task-envelope.schema.json"),
          ]:
              with p.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"valid JSON: {p}")
          PY

      - name: Validate interoperability registry and pinned protocol boundaries
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/validate-interoperability-registry.test.mjs scripts/interoperability-protocol-boundaries.test.mjs
          node scripts/validate-interoperability-registry.mjs

      - name: Reject obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          # Require a token boundary before sk- so URL/text fragments such as
          # "risk-management-framework" cannot match the API-key heuristic.
          # Keep private-key and explicit deployer-key checks unchanged.
          pattern='(^|[^A-Za-z0-9_])sk-[A-Za-z0-9_-]{20,}'
          if printf '%s\n' 'risk-management-framework' | grep -qE "$pattern"; then
            echo "Secret scanner false-positive regression: ordinary hyphenated text matched."
            exit 1
          fi
          sample_prefix='sk-'
          sample_suffix='01234567890123456789'
          if ! printf '%s\n' "token ${sample_prefix}${sample_suffix}" | grep -qE "$pattern"; then
            echo "Secret scanner regression: token-like material was not detected."
            exit 1
          fi
          if ! printf '%s\n' 'prefix-sk-01234567890123456789' | grep -qE "$pattern"; then
            echo "Secret scanner regression: token-like material after a hyphen was not detected."
            exit 1
          fi
          if grep -RniE "((^|[^A-Za-z0-9_])sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|GLORIFIER_DEPLOYER_PRIVATE_KEY=)" agent-network docs; then
            echo "Potential credential material found in architecture contracts."
            exit 1
          fi

      - name: Check truthful verification language
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NOT_VERIFIED' agent-network/agent-card.glorifier.json
          grep -q 'verification_status' agent-network/task-envelope.schema.json
          echo "Truthful verification markers present."
