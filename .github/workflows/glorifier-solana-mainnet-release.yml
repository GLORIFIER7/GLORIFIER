name: GLORIFIER Solana Mainnet Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RELEASE_GLORIFIER_SOLANA_MAINNET to authorize the production release"
        required: true
        type: string
      release_reason:
        description: "Human release reason / approval reference"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: glorifier-solana-mainnet-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Mainnet release preflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ inputs.confirm }}" = "RELEASE_GLORIFIER_SOLANA_MAINNET"
          test -n "${{ inputs.release_reason }}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require verified Devnet gate
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status=="VERIFIED_ON_CHAIN" and .network=="solana-devnet" and .token_standard=="Token-2022" and (.canonical_mint|type=="string" and length>=32 and length<=44)' solana/canonical-devnet-identity.json >/dev/null
      - name: Validate mainnet contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.name=="GLORIFIER" and .symbol=="GLR" and .decimals==9 and .totalSupply=="1000000000" and .transferFeeBasisPoints==0 and .permanentDelegate==null and .finalMintAuthority==null and .finalFreezeAuthority==null and .mainnetRequiresHumanApproval==true' solana/token-config.json >/dev/null
      - name: Mainnet replay lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/glorifier-solana-mainnet-release.yml/runs?event=workflow_dispatch&branch=main&per_page=100")"
          while IFS= read -r ID; do
            [ -n "$ID" ] || continue
            [ "$ID" != "$GITHUB_RUN_ID" ] || continue
            ARTS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ID/artifacts?per_page=100")"
            while IFS=$'\t' read -r AID DIGEST; do
              [ -n "$AID" ] || continue
              rm -rf /tmp/glr-replay; mkdir -p /tmp/glr-replay
              gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > /tmp/glr-replay.zip
              unzip -oq /tmp/glr-replay.zip -d /tmp/glr-replay
              E="$(find /tmp/glr-replay -type f -name deployment-mainnet-evidence.json -print -quit || true)"
              if [ -n "$E" ] && jq -e '.network=="solana-mainnet" and (.mint|type=="string") and (.status=="DEPLOYED" or .status=="READY_FOR_VERIFICATION")' "$E" >/dev/null; then
                echo "::error::A prior mainnet run produced a real GLR mint. Reconcile it; never mint a second canonical GLR."
                exit 1
              fi
            done < <(jq -r '[.artifacts[]? | select(.expired==false) | select(.name=="glorifier-solana-mainnet-evidence")] | .[] | [(.id|tostring),(.digest//"")] | @tsv' <<<"$ARTS")
          done < <(jq -r '[.workflow_runs[]? | select(.event=="workflow_dispatch") | select(.head_branch=="main") | select(.path==".github/workflows/glorifier-solana-mainnet-release.yml")] | .[].id' <<<"$RUNS")
          echo "Mainnet replay lock passed."

  deploy:
    name: Deploy GLR Token-2022 to Solana Mainnet
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: glorifier-solana-mainnet
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
      GLORIFIER_SOLANA_KEYPAIR_JSON: ${{ secrets.GLORIFIER_SOLANA_MAINNET_KEYPAIR_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Solana CLI
        run: |
          set -euo pipefail
          sh -c "curl -sSfL https://release.anza.xyz/v4.2.2/install | sh"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          test -x "$SOLANA_BIN/solana" || { echo "::error::Solana CLI installer completed but the expected binary was not found."; exit 1; }
          export PATH="$SOLANA_BIN:$PATH"
          hash -r
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          solana --version
      - name: Install SPL Token CLI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.0.2
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/spl-token" --version
          test "$("$HOME/.cargo/bin/spl-token" --version | awk '{print $2}')" = "5.0.2"
      - name: Validate mainnet environment secrets
        run: |
          set -euo pipefail
          test -n "$SOLANA_RPC_URL"
          test -n "$GLORIFIER_SOLANA_KEYPAIR_JSON"
          case "$SOLANA_RPC_URL" in https://api.mainnet.solana.com|https://api.mainnet.solana.com/*) echo "::error::Dedicated/private mainnet RPC required."; exit 1;; esac

          python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ["GLORIFIER_SOLANA_KEYPAIR_JSON"].strip()

          def valid_array(value):
              return (
                  isinstance(value, list)
                  and len(value) == 64
                  and all(isinstance(x, int) and not isinstance(x, bool) and 0 <= x <= 255 for x in value)
              )

          try:
              parsed = json.loads(raw)
          except json.JSONDecodeError:
              parsed = None

          if valid_array(parsed):
              normalized = parsed
          elif isinstance(parsed, str):
              try:
                  nested = json.loads(parsed)
              except json.JSONDecodeError:
                  nested = None
              if not valid_array(nested):
                  print("::error::GLORIFIER_SOLANA_KEYPAIR_JSON must be a 64-byte Solana keypair JSON array or a JSON string containing one.", file=sys.stderr)
                  sys.exit(1)
              normalized = nested
          else:
              alphabet = b"123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz"
              try:
                  value = 0
                  for char in raw.encode("ascii"):
                      value = value * 58 + alphabet.index(bytes([char]))
                  decoded = value.to_bytes((value.bit_length() + 7) // 8, "big")
                  leading = len(raw) - len(raw.lstrip("1"))
                  decoded = b"\x00" * leading + decoded
              except (ValueError, UnicodeEncodeError):
                  decoded = b""
              if len(decoded) != 64:
                  print("::error::GLORIFIER_SOLANA_KEYPAIR_JSON is not a valid 64-byte Solana secret key.", file=sys.stderr)
                  sys.exit(1)
              normalized = list(decoded)

          with open("/tmp/glorifier-mainnet-keypair.json", "w", encoding="utf-8") as handle:
              json.dump(normalized, handle, separators=(",", ":"))
          PY

          chmod 600 /tmp/glorifier-mainnet-keypair.json
          mkdir -p "$HOME/.config/solana"
          cp /tmp/glorifier-mainnet-keypair.json "$HOME/.config/solana/glorifier-mainnet-keypair.json"
          chmod 600 "$HOME/.config/solana/glorifier-mainnet-keypair.json"
          solana config set --url "$SOLANA_RPC_URL" --keypair "$HOME/.config/solana/glorifier-mainnet-keypair.json"
          solana address
          solana cluster-version
          test "$(solana balance --lamports | awk '{print $1}')" -ge 50000000
      - name: Execute real mainnet deployment
        env:
          GLORIFIER_AUTHORIZED_MAINNET_WORKFLOW: "true"
        run: |
          set -euo pipefail
          chmod +x solana/deploy-token2022-mainnet.sh
          ./solana/deploy-token2022-mainnet.sh
      - name: Validate deployment evidence
        run: |
          set -euo pipefail
          jq -e '.network=="solana-mainnet" and .status=="READY_FOR_VERIFICATION" and .programId=="TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb" and (.mint|type=="string" and length>=32 and length<=44) and (.creationTransaction|type=="string" and length>0) and (.metadataTransaction|type=="string" and length>0) and (.tokenAccountCreationTransaction|type=="string" and length>0) and (.mintTransaction|type=="string" and length>0) and (.mintAuthorityRevocationTransaction|type=="string" and length>0) and (.freezeAuthorityRevocationTransaction|type=="string" and length>0) and (.metadataUpdateAuthorityRevocationTransaction|type=="string" and length>0)' solana/deployment-mainnet-evidence.json >/dev/null
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glorifier-solana-mainnet-evidence
          retention-days: 3650
          path: solana/deployment-mainnet-evidence.json

  reconcile:
    name: Independent read-only mainnet reconciliation
    needs: deploy
    runs-on: ubuntu-latest
    environment: glorifier-solana-mainnet
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Solana CLI
        run: |
          set -euo pipefail
          sh -c "curl -sSfL https://release.anza.xyz/v4.2.2/install | sh"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          test -x "$SOLANA_BIN/solana" || { echo "::error::Solana CLI installer completed but the expected binary was not found."; exit 1; }
          export PATH="$SOLANA_BIN:$PATH"
          hash -r
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          solana --version
      - name: Install SPL Token CLI
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          cargo install spl-token-cli --locked --version 5.0.2
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/spl-token" --version
          test "$("$HOME/.cargo/bin/spl-token" --version | awk '{print $2}')" = "5.0.2"
      - name: Configure mainnet RPC
        run: |
          set -euo pipefail
          case "$SOLANA_RPC_URL" in https://api.mainnet.solana.com|https://api.mainnet.solana.com/*) exit 1;; esac
          solana config set --url "$SOLANA_RPC_URL"
      - name: Download deployment evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: glorifier-solana-mainnet-evidence
          path: /tmp/glr-mainnet
      - name: Reconcile without mutation
        run: |
          set -euo pipefail
          MINT="$(jq -r '.mint' /tmp/glr-mainnet/deployment-mainnet-evidence.json)"
          chmod +x solana/reconcile-token2022-mainnet.sh
          ./solana/reconcile-token2022-mainnet.sh "$MINT" /tmp/glr-mainnet/deployment-mainnet-evidence.json
      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: glorifier-solana-mainnet-reconciliation
          retention-days: 3650
          path: |
            solana/reconciliation-mainnet-status.txt
            solana/reconciliation-mainnet-account.txt
            solana/reconciliation-mainnet-supply.txt
            solana/reconciliation-mainnet-mint-state.txt
            solana/reconciliation-mainnet-evidence.json
            solana/reconciliation-mainnet-metadata.json
            solana/reconciliation-mainnet-tx-*.json

  publish:
    name: Publish verified mainnet identity
    needs: reconcile
    runs-on: ubuntu-latest
    environment: glorifier-solana-mainnet
    permissions:
      contents: write
      actions: read
      pull-requests: write
    env:
      SOLANA_RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Solana CLI
        run: |
          set -euo pipefail
          sh -c "curl -sSfL https://release.anza.xyz/v4.2.2/install | sh"
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          test -x "$SOLANA_BIN/solana" || { echo "::error::Solana CLI installer completed but the expected binary was not found."; exit 1; }
          export PATH="$SOLANA_BIN:$PATH"
          hash -r
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          solana --version
          case "$SOLANA_RPC_URL" in https://api.mainnet.solana.com|https://api.mainnet.solana.com/*) echo "::error::Dedicated/private mainnet RPC required."; exit 1;; esac
          solana config set --url "$SOLANA_RPC_URL"
      - name: Download reconciliation evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: glorifier-solana-mainnet-reconciliation
          path: solana
      - name: Publish after provenance and transaction confirmation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x solana/publish-verified-mainnet-identity.sh
          ./solana/publish-verified-mainnet-identity.sh
