name: GLORIFIER Digital Me — consolidated signed repair promotion
on:
  workflow_dispatch:
    inputs:
      expected_main:
        description: Exact current signed main SHA
        required: true
        type: string
      source_sha:
        description: Exact reviewed signed candidate commit SHA
        required: true
        type: string
      allowed_paths:
        description: Exact comma-separated source/test paths (max 20)
        required: true
        type: string
      confirm_reviewed:
        description: I reviewed this exact base, source and path set
        required: true
        type: boolean
        default: false
      publish:
        description: Publish a signed draft (false is read-only validation)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: glorifier-digital-me-reviewed-publication
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'GLORIFIER7/GLORIFIER' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor_id == '32674233' && github.triggering_actor == 'GLORIFIER7' && inputs.confirm_reviewed == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: digital-me-publish
    env:
      EXPECTED_MAIN: ${{ inputs.expected_main }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PATHS: ${{ inputs.allowed_paths }}
      CONFIRM: ${{ inputs.confirm_reviewed }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install trusted embedded publisher and test without credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/glorifier-signed-promotion"
          cd "$RUNNER_TEMP/glorifier-signed-promotion"
          cat > promote.mjs <<'PROMOTION_JS'
          import {createHash,createSign} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const REPO='GLORIFIER7/GLORIFIER', R='/repos/'+REPO, APP=5876036, BOT='glorifier-digital-me[bot]';
          const PERMS={contents:'write',pull_requests:'write'};
          const sha=s=>typeof s==='string'&&/^[a-f0-9]{40}$/.test(s);
          const hash=s=>createHash('sha256').update(s).digest('hex');
          export const gitBlob=b=>createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${b.length}\0`),b])).digest('hex');
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const verified=(c,oid)=>c?.sha===oid&&c.commit?.verification?.verified===true&&c.commit?.verification?.reason==='valid';
          const requireThat=(condition,message)=>{if(!condition)throw Error(message);};
          function safePath(p){return p.length<=180&&p.split('/').every(x=>/^[A-Za-z0-9_-][A-Za-z0-9_.-]*$/.test(x))&&/^(?:src|tests|digital-me\/(?:src|test))\//.test(p)&&/\.(?:mjs|js|jsx|ts|tsx|py)$/.test(p);}
          export function validate(e){
           const expected={GITHUB_REPOSITORY:REPO,GITHUB_REF:'refs/heads/main',GITHUB_EVENT_NAME:'workflow_dispatch',GITHUB_ACTOR_ID:'32674233',GITHUB_TRIGGERING_ACTOR:'GLORIFIER7',GITHUB_RUN_ATTEMPT:'1',CONFIRM:'true'};
           requireThat(Object.entries(expected).every(([k,v])=>e[k]===v),'Only the owner on trusted main may authorize promotion');
           const base=e.EXPECTED_MAIN,source=e.SOURCE_SHA;requireThat(sha(base)&&sha(source)&&base===e.GITHUB_SHA&&base!==source,'Exact base and source revisions required');
           const paths=(e.PATHS??'').split(',').map(x=>x.trim()).sort();requireThat(paths.length<=20&&new Set(paths).size===paths.length&&paths.every(safePath),'Explicit unique source/test paths required');
           const scope={base,source,paths};return {...scope,branch:'digital-me/approved-'+hash(JSON.stringify(scope))};
          }
          async function mainCheck(cfg,api){requireThat(verified(await api(R+'/commits/main'),cfg.base),'Main has changed or is unsigned');}
          async function entry(api,commit,path){
           const c=await api(R+'/git/commits/'+commit);requireThat(c?.sha===commit&&sha(c.tree?.sha),'Invalid commit tree');let tree=c.tree.sha;const parts=path.split('/');
           for(let i=0;i<parts.length;i++){
            const t=await api(R+'/git/trees/'+tree);requireThat(t?.sha===tree&&t.truncated===false&&Array.isArray(t.tree),'Incomplete tree evidence');
            const matches=t.tree.filter(e=>e.path===parts[i]);if(!matches.length)return null;requireThat(matches.length===1,'Ambiguous path');const e=matches[0];
            if(i===parts.length-1){requireThat(e.mode==='100644'&&e.type==='blob'&&sha(e.sha),'Only regular non-executable source files allowed');return e.sha;}
            requireThat(e.mode==='040000'&&e.type==='tree'&&sha(e.sha),'Unsafe directory entry');tree=e.sha;
           }
          }
          async function contents(api,commit,path,expected){
           const f=await api(R+'/contents/'+path+'?ref='+commit);requireThat(f?.path===path&&f.type==='file'&&f.encoding==='base64'&&f.sha===expected&&typeof f.content==='string'&&f.content.length<=700000,'Invalid file response');
           const b=Buffer.from(f.content,'base64');requireThat(b.length<=500000&&!b.includes(0)&&Buffer.from(b.toString('utf8')).equals(b)&&gitBlob(b)===expected,'File hash or UTF-8 validation failed');return b.toString('base64');
          }
          export async function inspect(cfg,api){
           await mainCheck(cfg,api);
           const c=await api(R+'/compare/'+cfg.base+'...'+cfg.source+'?per_page=100');
           requireThat(c?.status==='ahead'&&c.behind_by===0&&c.merge_base_commit?.sha===cfg.base&&c.base_commit?.sha===cfg.base&&Number.isSafeInteger(c.total_commits)&&c.total_commits>=1&&c.total_commits<=30&&c.ahead_by===c.total_commits&&c.commits?.length===c.total_commits&&c.commits.at(-1)?.sha===cfg.source&&c.commits.every(x=>sha(x.sha)&&verified(x,x.sha)),'Source must descend from exact signed main; all source commits must be verified');
           requireThat(Array.isArray(c.files)&&c.files.length===cfg.paths.length&&same(c.files.map(f=>f.filename).sort(),cfg.paths)&&c.files.every(f=>['added','modified'].includes(f.status)&&sha(f.sha)),'Unexpected changes, deletion or rename');
           const files=[];for(const p of cfg.paths){const f=c.files.find(x=>x.filename===p),before=await entry(api,cfg.base,p),after=await entry(api,cfg.source,p);requireThat(after===f.sha&&before!==after&&((f.status==='added'&&before===null)||(f.status==='modified'&&sha(before))),'Source tree does not match declared changes');files.push({path:p,before,sha:after,status:f.status,contents:await contents(api,cfg.source,p,after)});}
           await mainCheck(cfg,api);return {cfg,files};
          }
          function exactDraft(pr,cfg,head){return Number.isSafeInteger(pr?.number)&&pr.number>0&&pr.state==='open'&&pr.draft===true&&pr.user?.login===BOT&&pr.head?.sha===head&&pr.head?.ref===cfg.branch&&pr.head?.repo?.full_name===REPO&&pr.base?.sha===cfg.base&&pr.base?.ref==='main'&&pr.base?.repo?.full_name===REPO;}
          export async function publish(cfg,manifest,api){
           // Repeat the immutable source checks with the installation token. Never execute the candidate.
           requireThat(same(manifest,await inspect(cfg,api)),'Prepared manifest no longer matches source');
           const history=await api(R+'/pulls?state=all&head='+encodeURIComponent('GLORIFIER7:'+cfg.branch)+'&per_page=1');requireThat(Array.isArray(history)&&history.length===0,'Publication already exists; inspect existing PR instead of repeating');
           const refs=await api(R+'/git/matching-refs/heads/'+cfg.branch);requireThat(Array.isArray(refs)&&!refs.some(r=>r.ref==='refs/heads/'+cfg.branch),'Incomplete prior publication; reconcile branch before retry');
           await mainCheck(cfg,api);
           const ref='refs/heads/'+cfg.branch;const r=await api(R+'/git/refs','POST',{ref,sha:cfg.base});requireThat(r?.ref===ref&&r.object?.sha===cfg.base,'Branch creation not verified');
           const result=await api('/graphql','POST',{query:'mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}',variables:{input:{branch:{repositoryNameWithOwner:REPO,branchName:cfg.branch},expectedHeadOid:cfg.base,message:{headline:'fix: publish owner-reviewed repair under Digital Me'},fileChanges:{additions:manifest.files.map(({path,contents})=>({path,contents}))}}}});
           const head=result?.data?.createCommitOnBranch?.commit?.oid;requireThat(sha(head),'Commit not returned; reconcile branch');
           const c=await api(R+'/commits/'+head);requireThat(verified(c,head)&&c.author?.login===BOT&&c.parents?.length===1&&c.parents[0].sha===cfg.base&&c.files?.length===manifest.files.length&&manifest.files.every(f=>c.files.some(x=>x.filename===f.path&&x.status===f.status&&x.sha===f.sha)),'Signed bot identity or exact commit content not verified');
           for(const f of manifest.files)requireThat(await entry(api,head,f.path)===f.sha&&await contents(api,head,f.path,f.sha)===f.contents,'Published file readback mismatch');
           await mainCheck(cfg,api);
           const pr=await api(R+'/pulls','POST',{title:'fix: Digital Me — reviewed repair',head:cfg.branch,base:'main',draft:true,body:`Owner-confirmed immutable source: ${cfg.source}\nBase: ${cfg.base}\nPaths: ${cfg.paths.join(', ')}\nSigned App publication only. Independent review and protected CI required. No auto-merge.`});
           requireThat(exactDraft(pr,cfg,head),'Draft creation uncertain or stale; reconcile exact branch before retry');
           requireThat(exactDraft(await api(R+'/pulls/'+pr.number),cfg,head),'Draft readback mismatch; reconcile before retry');
           await mainCheck(cfg,api);return {status:'SIGNED_DRAFT_CREATED',pr:pr.number,head,merged:false};
          }
          function github(token){return async(path,method='GET',body)=>{const r=await fetch('https://api.github.com'+path,{method,redirect:'error',signal:AbortSignal.timeout(30000),headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},...(body===undefined?{}:{body:JSON.stringify(body)})});requireThat(r.ok,`GitHub HTTP ${r.status}; reconcile before retry`);if(r.status===204)return null;const j=await r.json();requireThat(!j?.errors?.length,'GitHub rejected request');return j;};}
          function jwt(pem){const enc=x=>Buffer.from(JSON.stringify(x)).toString('base64url'),now=Math.floor(Date.now()/1000),m=enc({alg:'RS256',typ:'JWT'})+'.'+enc({iss:String(APP),iat:now-30,exp:now+540});return m+'.'+createSign('RSA-SHA256').update(m).sign(pem).toString('base64url');}
          async function withApp(pem,fn){const api=github(jwt(pem)),i=await api(R+'/installation');requireThat(i?.app_id===APP&&i.account?.login==='GLORIFIER7'&&i.repository_selection==='selected'&&Number.isSafeInteger(i.id)&&Object.entries(PERMS).every(([k,v])=>i.permissions?.[k]===v),'App installation scope mismatch');const t=await api('/app/installations/'+i.id+'/access_tokens','POST',{repositories:['GLORIFIER'],permissions:PERMS});requireThat(typeof t?.token==='string'&&t.token.length>0,'Installation token unavailable');const scoped=github(t.token);try{requireThat(t.repository_selection==='selected'&&t.repositories?.length===1&&t.repositories[0].full_name===REPO&&Object.entries(PERMS).every(([k,v])=>t.permissions?.[k]===v)&&Object.entries(t.permissions).every(([k,v])=>k in PERMS||(k==='metadata'&&v==='read')),'Token scope mismatch');return await fn(scoped);}finally{await scoped('/installation/token','DELETE');}}
          async function run(){const cfg=validate(process.env),mode=process.argv[2],manifest=process.argv[3];requireThat(typeof manifest==='string','Manifest path required');if(mode==='prepare'){requireThat(!!process.env.GITHUB_TOKEN,'Read token unavailable');const result=await inspect(cfg,github(process.env.GITHUB_TOKEN));writeFileSync(manifest,JSON.stringify(result),{mode:0o600,flag:'wx'});console.log('Read-only preflight passed for '+cfg.paths.length+' exact files');}else if(mode==='publish'){const pem=process.env.DIGITAL_ME_APP_PRIVATE_KEY;delete process.env.DIGITAL_ME_APP_PRIVATE_KEY;requireThat(!!pem,'App secret unavailable');const result=await withApp(pem,api=>publish(cfg,JSON.parse(readFileSync(manifest,'utf8')),api));console.log(JSON.stringify(result));}else throw Error('Unknown mode');}
          if(process.argv[1]&&import.meta.url===pathToFileURL(process.argv[1]).href){try{await run();}catch(e){console.error('Promotion stopped; inspect the exact branch and Actions run. '+(e.message.startsWith('error:')?'Signing failed':e.message));process.exitCode=1;}}
          PROMOTION_JS
          cat > promote.test.mjs <<'PROMOTION_TEST'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {validate, inspect, publish, gitBlob} from './promote.mjs';
          const base='a'.repeat(40),head='b'.repeat(40),signed='c'.repeat(40), tree='d'.repeat(40), sub='e'.repeat(40), src='f'.repeat(40), path='digital-me/src/ledger-publication-preflight.mjs';
          const old=Buffer.from('old\n'), next=Buffer.from('new\n');
          const cfgEnv={GITHUB_REPOSITORY:'GLORIFIER7/GLORIFIER',GITHUB_REF:'refs/heads/main',GITHUB_EVENT_NAME:'workflow_dispatch',GITHUB_ACTOR_ID:'32674233',GITHUB_TRIGGERING_ACTOR:'GLORIFIER7',GITHUB_RUN_ATTEMPT:'1',GITHUB_SHA:base,EXPECTED_MAIN:base,SOURCE_SHA:head,PATHS:path,CONFIRM:'true'};
          const commit=(sha)=>({sha,commit:{verification:{verified:true,reason:'valid'}}});
          function fake(o={}){
           const calls=[];const cfg=validate(cfgEnv);const pr={number:17,state:'open',draft:true,user:{login:'glorifier-digital-me[bot]'},head:{sha:signed,ref:cfg.branch,repo:{full_name:'GLORIFIER7/GLORIFIER'}},base:{sha:base,ref:'main',repo:{full_name:'GLORIFIER7/GLORIFIER'}}};
           const api=async(p,method='GET',body)=>{calls.push({p,method,body});
           if(p.endsWith('/commits/main')) return commit(o.stale?head:base);
           if(p.includes('/compare/')) return {status:'ahead',ahead_by:1,behind_by:0,total_commits:1,base_commit:{sha:base},merge_base_commit:{sha:base},commits:[o.unsigned?{sha:head,commit:{verification:{verified:false}}}:commit(head)],files:[{filename:o.extra?'src/extra.ts':path,status:o.added?'added':'modified',sha:gitBlob(next)}]};
           if(p.endsWith('/git/commits/'+base)||p.endsWith('/git/commits/'+head)||p.endsWith('/git/commits/'+signed)){let sha=p.split('/').at(-1);return {sha,tree:{sha:sha===base?tree:sub}};}
           if(p.endsWith('/git/trees/'+tree)||p.endsWith('/git/trees/'+sub)){let sha=p.split('/').at(-1);return {sha,truncated:false,tree:[{path:'digital-me',type:'tree',mode:'040000',sha:sha===tree?'1'.repeat(40):'2'.repeat(40)}]};}
           if(p.endsWith('/git/trees/'+'1'.repeat(40))||p.endsWith('/git/trees/'+'2'.repeat(40))){let sha=p.split('/').at(-1);return {sha,truncated:false,tree:[{path:'src',type:'tree',mode:'040000',sha:sha==='1'.repeat(40)?src:'3'.repeat(40)}]};}
           if(p.endsWith('/git/trees/'+src)||p.endsWith('/git/trees/'+'3'.repeat(40))){let sha=p.split('/').at(-1);if(o.added&&sha===src)return {sha,truncated:false,tree:[]};return {sha,truncated:false,tree:[{path:'ledger-publication-preflight.mjs',type:'blob',mode:o.executable?'100755':'100644',sha:gitBlob(sha===src?old:next)}]};}
           if(p.includes('/contents/'+path+'?ref=')){let b=p.endsWith(base)?old:next;return {path,type:'file',encoding:'base64',content:b.toString('base64'),sha:gitBlob(b)};}
           if(p.includes('/pulls?'))return o.duplicate?[pr]:[];
           if(p.includes('/git/matching-refs/'))return o.orphan?[{ref:'refs/heads/'+cfg.branch}]:[];
           if(p.endsWith('/git/refs'))return {ref:body.ref,object:{sha:base}};
           if(p==='/graphql')return {data:{createCommitOnBranch:{commit:{oid:signed}}}};
           if(p.endsWith('/commits/'+signed))return {...commit(signed),author:{login:o.wrongAuthor?'wrong':'glorifier-digital-me[bot]'},parents:[{sha:base}],files:[{filename:path,status:o.added?'added':'modified',sha:gitBlob(next)}]};
           if(p.endsWith('/pulls')&&method==='POST')return pr;
           if(p.endsWith('/pulls/17'))return pr;
           throw Error('unexpected endpoint '+p);};return {api,calls};}
          test('allows an exact owner-confirmed Digital Me source target',()=>assert.deepEqual(validate(cfgEnv).paths,[path]));
          test('rejects branch, actor, rerun, stale SHA, scheduled execution, workflows and traversal',()=>{for(const v of [{GITHUB_REF:'refs/heads/other'},{GITHUB_ACTOR_ID:'1'},{GITHUB_RUN_ATTEMPT:'2'},{EXPECTED_MAIN:head},{GITHUB_EVENT_NAME:'schedule'},{PATHS:'.github/workflows/x.yml'},{PATHS:'digital-me/src/../x.mjs'},{PATHS:path+','+path},{CONFIRM:'false'}])assert.throws(()=>validate({...cfgEnv,...v}));});
          test('source preflight is read-only and exact',async()=>{let f=fake();let m=await inspect(validate(cfgEnv),f.api);assert.equal(m.files[0].sha,gitBlob(next));assert.ok(f.calls.every(c=>c.method==='GET'));});
          test('unsigned, stale, unexpected and executable source is refused',async()=>{for(const o of [{unsigned:true},{stale:true},{extra:true},{executable:true}])await assert.rejects(inspect(validate(cfgEnv),fake(o).api));});
          test('creates a signed bot-authored draft and never approves or merges',async()=>{let f=fake(),cfg=validate(cfgEnv);let result=await publish(cfg,await inspect(cfg,f.api),f.api);assert.equal(result.status,'SIGNED_DRAFT_CREATED');assert.equal(result.pr,17);assert.ok(!f.calls.some(c=>/reviews|merge$/.test(c.p)));});
          test('duplicate history and incomplete branch prevent new writes',async()=>{for(const o of [{duplicate:true},{orphan:true}]){let f=fake(o),cfg=validate(cfgEnv);await assert.rejects(publish(cfg,await inspect(cfg,f.api),f.api));assert.ok(f.calls.every(c=>c.method==='GET'));}});
          test('altered manifest fails before writes',async()=>{let f=fake(),cfg=validate(cfgEnv),m=await inspect(cfg,f.api);m.files[0].contents='bad';await assert.rejects(publish(cfg,m,f.api));assert.ok(f.calls.every(c=>c.method==='GET'));});
          test('wrong signing identity never opens a PR',async()=>{let f=fake({wrongAuthor:true}),cfg=validate(cfgEnv);await assert.rejects(publish(cfg,await inspect(cfg,f.api),f.api));assert.ok(!f.calls.some(c=>c.method==='POST'&&c.p.endsWith('/pulls')));});
          
          test('added source files are allowed only when absent from the base tree',async()=>{let f=fake({added:true}),cfg=validate(cfgEnv),m=await inspect(cfg,f.api);assert.equal(m.files[0].before,null);assert.equal(m.files[0].status,'added');assert.equal((await publish(cfg,m,f.api)).pr,17);});
          PROMOTION_TEST
          node --test promote.test.mjs
      - name: Read-only exact-source validation
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node "$RUNNER_TEMP/glorifier-signed-promotion/promote.mjs" prepare "$RUNNER_TEMP/glorifier-signed-promotion/manifest.json"
      - name: Publish verified App-signed draft only
        if: inputs.publish == true
        shell: bash
        env:
          DIGITAL_ME_APP_PRIVATE_KEY: ${{ secrets.DIGITAL_ME_APP_PRIVATE_KEY }}
        run: |
          node "$RUNNER_TEMP/glorifier-signed-promotion/promote.mjs" publish "$RUNNER_TEMP/glorifier-signed-promotion/manifest.json"
