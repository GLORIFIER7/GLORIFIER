name: Live AI Connectivity Matrix

on:
  pull_request:
    paths:
      - 'scripts/live-ai-connectivity-matrix.mjs'
      - 'scripts/live-ai-connectivity-matrix.test.mjs'
      - '.github/workflows/live-ai-connectivity.yml'
  workflow_dispatch:
    inputs:
      allow_metered_probes:
        description: 'Authorize one short inference request per configured provider and one two-provider AI Council canary. May incur charges.'
        required: true
        default: false
        type: boolean
      public_base_url:
        description: 'GLORIFIER HTTPS origin to probe; defaults to production Workers.dev.'
        required: false
        default: 'https://glorifier.glorifier.workers.dev'
        type: string

permissions:
  contents: read

concurrency:
  group: live-ai-connectivity-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test connectivity evidence and safety contracts
        run: node --test scripts/live-ai-connectivity-matrix.test.mjs

  live-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GLORIFIER_PUBLIC_BASE_URL: ${{ inputs.public_base_url || 'https://glorifier.glorifier.workers.dev' }}
      ALLOW_METERED_PROBES: ${{ inputs.allow_metered_probes }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL }}
      NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
      NVIDIA_AUTHORIZED: ${{ vars.NVIDIA_AUTHORIZED }}
      GLORIFIER_LIVE_PROBE_BEARER_TOKEN: ${{ secrets.GLORIFIER_LIVE_PROBE_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run live connectivity matrix
        run: node scripts/live-ai-connectivity-matrix.mjs
      - name: Upload redacted evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-live-ai-connectivity-${{ github.run_id }}
          path: live-ai-connectivity-matrix.json
          if-no-files-found: warn
          retention-days: 14
