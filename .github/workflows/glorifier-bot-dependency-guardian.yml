name: GLORIFIER Bot — Locked Dependency Guardian

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/glorifier-bot-dependency-guardian.yml
      - .github/dependabot.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: glorifier-bot-dependency-guardian
  cancel-in-progress: false

jobs:
  validate-locked-dependencies:
    name: Validate committed dependency lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci fails if package.json and package-lock.json are out of sync.
      # Version updates are proposed separately by native Dependabot PRs.
      - name: Install exactly the committed lockfile
        run: npm ci --ignore-scripts

      - name: Audit committed dependencies
        run: npm audit --audit-level=low

      - name: Type-check
        run: npm run lint

      - name: Build frontend and backend
        run: npm run build
