name: GLORIFIER Bot — Dependency Guardian

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: glorifier-bot-dependency-guardian
  cancel-in-progress: false

jobs:
  prepare-and-test:
    name: Prepare and test safe dependency refresh
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Refresh versions within declared semver ranges
        run: npm update --package-lock-only --ignore-scripts

      - name: Reinstall exact refreshed lockfile
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build

      # Keep the private key scoped to this one detection step and the token action.
      # Store the App ID as a repository variable and the PEM as a repository secret.
      - name: Detect optional GLORIFIER GitHub App credentials
        id: app-config
        env:
          GLORIFIER_APP_ID: ${{ vars.GLORIFIER_APP_ID }}
          GLORIFIER_APP_PRIVATE_KEY: ${{ secrets.GLORIFIER_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -n "$GLORIFIER_APP_ID" && -n "$GLORIFIER_APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "GLORIFIER GitHub App credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GLORIFIER GitHub App credentials are not configured; PR creation will use the restricted GITHUB_TOKEN fallback."
          fi

      - name: Mint GLORIFIER GitHub App installation token
        id: app-token
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.GLORIFIER_APP_ID }}
          private-key: ${{ secrets.GLORIFIER_APP_PRIVATE_KEY }}
          owner: GLORIFIER7
          repositories: GLORIFIER

      - name: Create GLORIFIER Bot pull request
        if: success()
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: bot/glorifier-dependency-refresh
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
          commit-message: "chore(deps): refresh versions within declared ranges"
          title: "chore(deps): GLORIFIER Bot dependency refresh"
          body: |
            ## GLORIFIER Bot — dependency refresh

            This pull request updates npm dependencies only within the version ranges already declared by the project.

            - Generated by the scheduled/manual GLORIFIER Bot workflow.
            - CI and repository security checks must pass before merge.
            - This bot does not merge pull requests, deploy production, change credentials, or modify financial/blockchain state.
            - When the GLORIFIER GitHub App credentials and repository installation are configured, this PR is created with the app identity. Otherwise, GitHub attributes it to the GitHub Actions bot.
          labels: |
            dependencies
            automated
          draft: true
