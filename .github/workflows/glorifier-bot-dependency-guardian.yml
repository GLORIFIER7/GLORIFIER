name: GLORIFIER Bot — Dependency Guardian

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/glorifier-bot-dependency-guardian.yml
      - .github/dependabot.yml
      - package.json
      - package-lock.json
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  # Give each PR its own group; schedule/manual runs get unique run IDs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-locked-dependencies:
    # Keep the historical check label for branch-rule compatibility.
    # This job validates only; it no longer refreshes dependency versions.
    name: Prepare and test safe dependency refresh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci fails if package.json and package-lock.json are out of sync.
      # Disable its implicit audit because the explicit audit step is the gate.
      - name: Install exactly the committed lockfile
        run: npm ci --ignore-scripts --no-audit

      - name: Audit committed dependencies
        run: npm audit --audit-level=low

      - name: Type-check
        run: npm run lint

      - name: Build frontend and backend
        run: npm run build
