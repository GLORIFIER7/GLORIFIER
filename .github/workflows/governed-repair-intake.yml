name: GLORIFIER Governed Repair Intake

on:
  schedule:
    # Periodic read-only repair evidence; no model inference and no repository writes.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: glorifier-governed-repair-intake
  cancel-in-progress: false

jobs:
  evidence-intake:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for dependency-free triage
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Verify the fail-closed repair intake contract
        run: node --test scripts/governed-repair-intake.test.mjs

      - name: Collect bounded GitHub read-only evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$GITHUB_REPOSITORY" != 'GLORIFIER7/GLORIFIER' ]]; then
            echo '::error::Repair intake is restricted to GLORIFIER7/GLORIFIER.'
            exit 1
          fi
          # Collect only run/PR metadata. No logs, issue bodies, secrets or source code are exported.
          gh run list --repo "$GITHUB_REPOSITORY" --branch main --limit 50 \
            --json databaseId,workflowName,headBranch,status,conclusion,event,createdAt \
            > "$RUNNER_TEMP/glorifier-repair-runs.json"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,isDraft,mergeStateStatus,headRefOid,statusCheckRollup \
            > "$RUNNER_TEMP/glorifier-repair-pulls.json"

      - name: Generate evidence-based repair queue
        env:
          RUNS_JSON: ${{ runner.temp }}/glorifier-repair-runs.json
          PULLS_JSON: ${{ runner.temp }}/glorifier-repair-pulls.json
          REPORT_JSON: ${{ runner.temp }}/glorifier-repair-intake.json
          REPORT_MD: ${{ runner.temp }}/glorifier-repair-intake.md
        shell: bash
        run: |
          set -euo pipefail
          node scripts/governed-repair-intake.mjs \
            "$RUNS_JSON" "$PULLS_JSON" "$REPORT_JSON" "$REPORT_MD"
          cat "$REPORT_MD" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve bounded read-only evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: governed-repair-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/glorifier-repair-intake.json
            ${{ runner.temp }}/glorifier-repair-intake.md
          if-no-files-found: error
          retention-days: 7
