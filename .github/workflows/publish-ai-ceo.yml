name: Publish GLORIFIER AI CEO

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deployment-disabled:
    if: ${{ github.ref != 'refs/heads/main' || vars.PAGES_AI_CEO_APPROVAL_GATE_CONFIGURED != 'true' || vars.PAGES_AI_CEO_DEPLOY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain why deployment was skipped
        shell: bash
        run: |
          echo "::notice::AI CEO Pages publishing is disabled unless dispatched from main with PAGES_AI_CEO_APPROVAL_GATE_CONFIGURED=true and PAGES_AI_CEO_DEPLOY_ENABLED=true. Configure required reviewers on the github-pages-ai-ceo environment first; set the approval-gate flag only after verifying that protection in repository settings."

  build:
    if: ${{ github.ref == 'refs/heads/main' && vars.PAGES_AI_CEO_APPROVAL_GATE_CONFIGURED == 'true' && vars.PAGES_AI_CEO_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build:frontend
        env:
          GITHUB_PAGES_BUILD: "true"
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: ${{ github.ref == 'refs/heads/main' && vars.PAGES_AI_CEO_APPROVAL_GATE_CONFIGURED == 'true' && vars.PAGES_AI_CEO_DEPLOY_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    # Set PAGES_AI_CEO_APPROVAL_GATE_CONFIGURED=true only after required reviewers are verified.
    environment:
      name: github-pages-ai-ceo
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
