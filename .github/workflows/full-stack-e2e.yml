name: GLORIFIER Full-Stack E2E
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GLORIFIER Full-Stack Verification"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTEND_URL: ${{ vars.GLORIFIER_FRONTEND_URL || 'https://glorifier.glorifier.workers.dev' }}
      CI: true
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run production E2E
        run: npx playwright test tests/e2e/production.spec.ts
