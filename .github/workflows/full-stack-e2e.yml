name: GLORIFIER Production E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["GLORIFIER Full-Stack Verification"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: glorifier-production-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTEND_URL: https://glorifier-glorifier.vercel.app
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Authenticated production E2E
        run: npm exec playwright test
      - name: Publish E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glorifier-production-e2e
          path: test-results/
          if-no-files-found: ignore
