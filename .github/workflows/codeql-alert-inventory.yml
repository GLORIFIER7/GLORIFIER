name: GLORIFIER CodeQL Alert Inventory

on:
  workflow_run:
    workflows: ["GLORIFIER CodeQL Security"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  inventory:
    name: Report current CodeQL alert and analysis inventory
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Inventory CodeQL alerts and analysis categories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          report="codeql-open-alerts.jsonl"
          analyses="codeql-analyses.jsonl"
          : > "$report"
          : > "$analyses"
          main_sha="$(git rev-parse HEAD)"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?tool_name=CodeQL&state=open&per_page=100" \
            --jq '.[] | {
              number: .number,
              severity: .rule.severity,
              rule: .rule.id,
              description: .rule.description,
              html_url: .html_url,
              path: .most_recent_instance.location.path,
              start_line: .most_recent_instance.location.start_line,
              message: .most_recent_instance.message.text,
              analysis_key: .most_recent_instance.analysis_key,
              category: .most_recent_instance.category,
              ref: .most_recent_instance.ref,
              commit_sha: .most_recent_instance.commit_sha,
              environment: .most_recent_instance.environment
            }' > "$report"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/code-scanning/analyses?tool_name=CodeQL&per_page=100" \
            --jq '.[] | {
              analysis_id: .id,
              analysis_key: .analysis_key,
              category: .category,
              ref: .ref,
              commit_sha: .commit_sha,
              created_at: .created_at,
              results_count: .results_count,
              rules_count: .rules_count,
              deletable: .deletable,
              warning: .warning,
              environment: .environment,
              tool_name: .tool.name
            }' > "$analyses"

          alert_count="$(awk 'END { print NR+0 }' "$report")"
          analysis_count="$(awk 'END { print NR+0 }' "$analyses")"

          {
            echo "## CodeQL alert inventory"
            echo ""
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Main commit: ${main_sha}"
            echo "- Open CodeQL alerts: **${alert_count}**"
            echo "- CodeQL analysis records: **${analysis_count}**"
            echo ""
            echo "### Open alerts"
            echo ""
            if [[ "$alert_count" -eq 0 ]]; then
              echo "No open CodeQL alerts were returned by GitHub."
            else
              echo "| Alert | Severity | Rule | Location | Category | Ref |"
              echo "|---:|---|---|---|---|---|"
              jq -r '"| \(.number) | \(.severity // "unknown") | `\(.rule // "unknown")` | `\(.path // "?"):\(.start_line // 0)` | `\(.category // "?")` | `\(.ref // "?")` |"' "$report"
            fi
            echo ""
            echo "### Analysis categories on main"
            echo ""
            echo "| Category | Analyses | Latest analysis |"
            echo "|---|---:|---|"
            jq -s -r '
              map(select(.ref == "refs/heads/main"))
              | group_by(.category)
              | .[]
              | "| `\(.[0].category // "unknown")` | \(length) | \((map(.created_at) | max) // "?") |"
            ' "$analyses"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Open CodeQL alerts: $alert_count"
          cat "$report"

      - name: Upload CodeQL inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-open-alert-inventory
          path: |
            codeql-open-alerts.jsonl
            codeql-analyses.jsonl
          if-no-files-found: error
          retention-days: 14
