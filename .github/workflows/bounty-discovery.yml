name: GLORIFIER Bounty Opportunity Discovery

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Record discovery policy
        run: |
          echo "DISCOVER -> VERIFY FUNDING -> VERIFY ELIGIBILITY -> CLAIM -> SOLVE -> PR/REPORT -> ACCEPTANCE -> VERIFY PAYOUT -> SETTLE"
          echo "No advertised bounty is revenue until canonical payment evidence exists."
          echo "No automatic claim, submission, payment acceptance, or settlement is performed."
      - name: Run governed opportunity discovery
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/run-opportunity-discovery.ts
