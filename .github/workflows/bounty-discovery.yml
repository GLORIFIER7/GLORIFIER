name: GLORIFIER Bounty Opportunity Discovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bounty-discovery.yml"
      - "scripts/run-bounty-discovery-no-db.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: bounty-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Record discovery policy
        run: |
          echo "DATABASE-FREE READ-ONLY DISCOVERY"
          echo "DISCOVER -> REVIEW SOURCE -> VERIFY FUNDING -> VERIFY ELIGIBILITY -> CLAIM ONLY WITH HUMAN AUTHORIZATION -> SOLVE -> SUBMIT -> VERIFY ACCEPTANCE -> VERIFY PAYOUT"
          echo "No advertised bounty is revenue until canonical payment evidence exists."
          echo "No automatic claim, submission, payment acceptance, target testing, or settlement is performed."
          echo "Findings are persisted as a workflow artifact only; no database is required."

      - name: Run database-free opportunity discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-bounty-discovery-no-db.mjs

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-bounty-discovery-report-${{ github.run_id }}
          path: artifacts/bounty-discovery.json
          if-no-files-found: warn
          retention-days: 14
