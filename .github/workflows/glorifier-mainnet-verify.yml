name: GLORIFIER Mainnet Source Verification

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_GLORIFIER_MAINNET to authorize verification of the existing deployment'
        required: true
        type: string
      contract_address:
        description: 'Existing deployed GLR mainnet contract address'
        required: true
        type: string
      initial_holder:
        description: 'GLR constructor initial holder address'
        required: true
        type: string
      deployment_transaction:
        description: 'Optional deployment transaction hash for receipt validation'
        required: false
        default: ''
        type: string

concurrency:
  group: glorifier-mainnet-source-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: mainnet
    permissions:
      contents: read
    env:
      ETHERSCAN_API_KEY: ${{ secrets.GLORIFIER_ETHERSCAN_API_KEY }}
      MAINNET_RPC_URL: ${{ secrets.GLORIFIER_MAINNET_RPC_URL }}

    steps:
      - name: Require explicit verification authorization
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "VERIFY_GLORIFIER_MAINNET" || {
            echo "ERROR: explicit mainnet verification confirmation required."
            exit 1
          }
          test -n "$MAINNET_RPC_URL" || {
            echo "ERROR: GLORIFIER_MAINNET_RPC_URL is missing."
            exit 1
          }
          test -n "$ETHERSCAN_API_KEY" || {
            echo "ERROR: GLORIFIER_ETHERSCAN_API_KEY is missing."
            exit 1
          }

      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Validate existing deployment
        working-directory: contracts
        env:
          CONTRACT_ADDRESS: ${{ inputs.contract_address }}
          INITIAL_HOLDER: ${{ inputs.initial_holder }}
          DEPLOYMENT_TX: ${{ inputs.deployment_transaction }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || {
            echo "ERROR: contract_address must be a valid Ethereum address."
            exit 1
          }
          [[ "$INITIAL_HOLDER" =~ ^0x[0-9a-fA-F]{40}$ ]] || {
            echo "ERROR: initial_holder must be a valid Ethereum address."
            exit 1
          }
          [[ "$INITIAL_HOLDER" != "0x0000000000000000000000000000000000000000" ]] || {
            echo "ERROR: initial_holder cannot be the zero address."
            exit 1
          }
          if [[ -n "$DEPLOYMENT_TX" ]]; then
            [[ "$DEPLOYMENT_TX" =~ ^0x[0-9a-fA-F]{64}$ ]] || {
              echo "ERROR: deployment_transaction must be a valid transaction hash."
              exit 1
            }
          fi

          test "$(cast chain-id --rpc-url "$MAINNET_RPC_URL")" = "1"
          CODE="$(cast code "$CONTRACT_ADDRESS" --rpc-url "$MAINNET_RPC_URL")"
          [[ "$CODE" != "0x" ]] || {
            echo "ERROR: no contract bytecode found at $CONTRACT_ADDRESS."
            exit 1
          }

          NAME="$(cast call "$CONTRACT_ADDRESS" 'name()(string)' --rpc-url "$MAINNET_RPC_URL" | sed -E 's/^"//; s/"$//; s/[[:space:]]+$//')"
          SYMBOL="$(cast call "$CONTRACT_ADDRESS" 'symbol()(string)' --rpc-url "$MAINNET_RPC_URL" | sed -E 's/^"//; s/"$//; s/[[:space:]]+$//')"
          DECIMALS="$(cast call "$CONTRACT_ADDRESS" 'decimals()(uint8)' --rpc-url "$MAINNET_RPC_URL" | awk '{print $1}' | tr -d "\r\n")"
          TOTAL_SUPPLY="$(cast call "$CONTRACT_ADDRESS" 'totalSupply()(uint256)' --rpc-url "$MAINNET_RPC_URL" | awk '{print $1}' | tr -d "\r\n")"

          test "$NAME" = "GLORIFIER"
          test "$SYMBOL" = "GLR"
          test "$DECIMALS" = "18"
          test "$TOTAL_SUPPLY" = "1000000000000000000000000000"

          if [[ -n "$DEPLOYMENT_TX" ]]; then
            RECEIPT="$(cast receipt "$DEPLOYMENT_TX" --rpc-url "$MAINNET_RPC_URL" --json)"
            test "$(echo "$RECEIPT" | jq -r '.status')" = "1"
          fi

          forge build
          CONSTRUCTOR_ARGS="$(cast abi-encode 'constructor(address)' "$INITIAL_HOLDER")"
          printf '%s\n' "$CONSTRUCTOR_ARGS" > verification-constructor-args.txt
          printf '%s\n' "$CONTRACT_ADDRESS" > verification-contract-address.txt

      - name: Preflight Etherscan V2 API
        env:
          CONTRACT_ADDRESS: ${{ inputs.contract_address }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          HTTP_STATUS="$(curl -sS --max-time 20 --connect-timeout 10 \
            -o "$RESPONSE_FILE" -w '%{http_code}' \
            "https://api.etherscan.io/v2/api?chainid=1&module=contract&action=getsourcecode&address=$CONTRACT_ADDRESS&apikey=$ETHERSCAN_API_KEY" || true)"

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "ERROR: Etherscan V2 API preflight returned HTTP $HTTP_STATUS."
            sed -n '1,80p' "$RESPONSE_FILE"
            exit 1
          fi

          API_STATUS="$(jq -r '.status // empty' "$RESPONSE_FILE")"
          API_MESSAGE="$(jq -r '.message // empty' "$RESPONSE_FILE")"
          API_RESULT="$(jq -r '.result // empty' "$RESPONSE_FILE")"

          if [[ "$API_STATUS" != "1" ]]; then
            echo "ERROR: Etherscan V2 API rejected the request."
            echo "Etherscan message: $API_MESSAGE"
            echo "Etherscan result: $API_RESULT"
            exit 1
          fi

          echo "Etherscan V2 API: reachable and API key accepted."

      - name: Verify source on Etherscan
        working-directory: contracts
        env:
          CONTRACT_ADDRESS: ${{ inputs.contract_address }}
        run: |
          set -euo pipefail
          CONSTRUCTOR_ARGS="$(cat verification-constructor-args.txt)"
          VERIFY_LOG="$(mktemp)"
          POSTCHECK_FILE="$(mktemp)"
          trap 'rm -f "$VERIFY_LOG" "$POSTCHECK_FILE"' EXIT

          set +e
          forge verify-contract "$CONTRACT_ADDRESS" src/GLORIFIER.sol:GLORIFIER \
            --chain 1 \
            --verifier etherscan \
            --etherscan-api-key "$ETHERSCAN_API_KEY" \
            --etherscan-api-version v2 \
            --compiler-version 0.8.24 \
            --num-of-optimizations 200 \
            --constructor-args "$CONSTRUCTOR_ARGS" \
            --retries 10 \
            --delay 10 \
            --watch 2>&1 | tee "$VERIFY_LOG"
          VERIFY_EXIT="${PIPESTATUS[0]}"
          set -e

          if [[ "$VERIFY_EXIT" != "0" ]]; then
            echo "ERROR: Etherscan source verification failed (forge exit=$VERIFY_EXIT)."
            echo "Verification diagnostics:"
            sed -n '1,240p' "$VERIFY_LOG"
            exit 1
          fi

          HTTP_STATUS="$(curl -sS --max-time 20 --connect-timeout 10 \
            -o "$POSTCHECK_FILE" -w '%{http_code}' \
            "https://api.etherscan.io/v2/api?chainid=1&module=contract&action=getsourcecode&address=$CONTRACT_ADDRESS&apikey=$ETHERSCAN_API_KEY" || true)"
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "ERROR: Etherscan post-verification check returned HTTP $HTTP_STATUS."
            sed -n '1,80p' "$POSTCHECK_FILE"
            exit 1
          fi

          POST_STATUS="$(jq -r '.status // empty' "$POSTCHECK_FILE")"
          POST_SOURCE="$(jq -r '(.result[0].SourceCode // "")' "$POSTCHECK_FILE")"
          if [[ "$POST_STATUS" != "1" || -z "$POST_SOURCE" ]]; then
            echo "ERROR: Etherscan did not report verified source code after submission."
            echo "Etherscan status: $POST_STATUS"
            echo "Etherscan message: $(jq -r '.message // empty' "$POSTCHECK_FILE")"
            echo "Etherscan result: $(jq -c '.result // empty' "$POSTCHECK_FILE")"
            echo "Verification diagnostics:"
            sed -n '1,240p' "$VERIFY_LOG"
            exit 1
          fi

          echo "Etherscan source verification: CONFIRMED"

          echo "GLR_STATUS=FULLY_VERIFIED" > mainnet-verification-evidence.env
          echo "CHAIN=ethereum-mainnet" >> mainnet-verification-evidence.env
          echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> mainnet-verification-evidence.env
          echo "ETHERSCAN_VERIFIED=true" >> mainnet-verification-evidence.env

      - name: Publish verification evidence
        uses: actions/upload-artifact@v5
        with:
          name: glorifier-mainnet-verification-evidence
          path: contracts/mainnet-verification-evidence.env
          if-no-files-found: error
