name: GLORIFIER AI Code Guardian

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glorifier-code-guardian
  cancel-in-progress: true

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run governed guardian analysis
        id: guardian
        continue-on-error: true
        env:
          GUARDIAN_PROVIDER: ${{ vars.GUARDIAN_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/code-guardian.mjs

      - name: Report guardian result
        if: always()
        run: |
          if [ "${{ steps.guardian.outcome }}" = "success" ]; then
            echo "Guardian completed. Any proposed repair remains subject to normal review/CI."
          else
            echo "Guardian analysis failed or was unavailable; no repository mutation was attempted."
          fi
