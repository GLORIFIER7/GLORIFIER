name: GLORIFIER AI Code Guardian

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glorifier-code-guardian
  cancel-in-progress: true

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - id: guardian
        continue-on-error: true
        env:
          GUARDIAN_PROVIDER: ${{ vars.GUARDIAN_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/code-guardian.mjs
      - name: Report guardian result
        if: always()
        run: |
          if [ "${{ steps.guardian.outcome }}" = "success" ]; then
            echo "Guardian completed. Proposed repairs remain subject to normal review and CI."
          else
            echo "Guardian analysis failed or provider was unavailable; no repository mutation was attempted."
          fi

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v7:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/actions/setup-node@v7:sha1-820762786026740c76f36085b0efc47a31fe5020
