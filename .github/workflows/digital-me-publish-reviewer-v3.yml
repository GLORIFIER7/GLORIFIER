name: GLORIFIER Digital Me — one-time reviewer publication
on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: 'Publish only the seven reviewed v3 files as a signed draft PR'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: digital-me-reviewer-v3-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.repository == 'GLORIFIER7/GLORIFIER' && github.ref == 'refs/heads/main' && github.actor_id == '32674233' && github.actor == 'GLORIFIER7' && github.triggering_actor == 'GLORIFIER7' && github.run_attempt == 1 && inputs.confirm_publication == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Test fixed publisher without credentials
        run: node --test digital-me/test/publish-reviewer-v3.test.mjs
      - name: Publish fixed signed draft using existing App secret
        env:
          DIGITAL_ME_CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
          DIGITAL_ME_APP_PRIVATE_KEY: ${{ secrets.DIGITAL_ME_APP_PRIVATE_KEY }}
        run: node digital-me/src/publish-reviewer-v3.mjs
