name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'android-v*'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle for Android
        env:
          CAPACITOR_BUILD: 'true'
          VITE_API_BASE_URL: https://glorifier-artificial-intelligence-production.up.railway.app
        run: npm run build:android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/glorifier-release.jks
            chmod 600 android/app/glorifier-release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android signing credentials detected; release will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android signing credentials are not configured; building an unsigned release AAB."
          fi

      - name: Build Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/glorifier-release.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew bundleRelease
          fi
      - name: Verify release AAB exists
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "Android App Bundle created successfully."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-ai-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
