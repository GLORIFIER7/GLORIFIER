name: Build Android App Bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-release.yml'
  push:
    branches:
      - main
    tags:
      - 'android-v*'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle for Android
        env:
          CAPACITOR_BUILD: 'true'
          VITE_API_BASE_URL: https://glorifier-artificial-intelligence-production.up.railway.app
        run: npm run build:android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # Capacitor generates Gradle 8.14.3 with the larger -all archive.
      # The official service redirected to a GitHub Release that returned HTTP 504 twice.
      # Use a pinned mirror and verify its bytes against Gradle's independently published SHA-256.
      - name: Pin Android Gradle distribution and checksum
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.is_file():
              raise SystemExit(f"Generated Gradle wrapper is missing: {wrapper}")

          content = wrapper.read_text(encoding="utf-8")
          old_url = "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip"
          new_url = "distributionUrl=https\\://mirror.spaceport.work/gradle/gradle-8.14.3-bin.zip"
          if content.count(old_url) != 1:
              raise SystemExit(
                  "Unexpected generated Gradle distribution URL; refusing an unreviewed version change."
              )
          if "distributionSha256Sum=" in content:
              raise SystemExit("A Gradle distribution checksum is already configured; review before replacing it.")

          # Reject redirects so the mirror host that is pinned is the one serving the ZIP.
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError

          class RejectRedirects(HTTPRedirectHandler):
              def redirect_request(self, request, file_pointer, code, message, headers, new_url):
                  return None

          download_url = "https://mirror.spaceport.work/gradle/gradle-8.14.3-bin.zip"
          request = Request(download_url, method="HEAD")
          try:
              with build_opener(RejectRedirects).open(request, timeout=30) as response:
                  if response.status != 200 or response.geturl() != download_url:
                      raise SystemExit("Gradle mirror must return HTTP 200 directly without redirects.")
          except HTTPError as error:
              raise SystemExit(f"Gradle mirror preflight failed without following redirects: HTTP {error.code}") from error

          content = content.replace(old_url, new_url, 1)
          properties = content.rstrip().splitlines()
          properties.append("distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531")
          properties = [line for line in properties if not line.startswith("networkTimeout=")]
          properties.append("networkTimeout=120000")
          wrapper.write_text("\n".join(properties) + "\n", encoding="utf-8")

          verified = wrapper.read_text(encoding="utf-8")
          if new_url not in verified or "distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531" not in verified:
              raise SystemExit("Gradle wrapper URL/checksum configuration did not persist.")
          print("Pinned Gradle 8.14.3 binary distribution with the official SHA-256 checksum.")
          PY

      - name: Prepare Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/glorifier-release.jks
            chmod 600 android/app/glorifier-release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android signing credentials detected; release will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android signing credentials are not configured; building an unsigned release AAB."
          fi

      - name: Build Android App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/glorifier-release.jks" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew bundleRelease
          fi

      - name: Verify release AAB exists
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "Android App Bundle created successfully."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: glorifier-ai-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
