name: Build Android App Bundle

on:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify Android API origin and native CORS contract
        run: node --test scripts/public-probe-origin.test.mjs scripts/cloudflare-pages-proxy.test.mjs

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle for Android
        env:
          CAPACITOR_BUILD: 'true'
          VITE_API_BASE_URL: https://glorifier.pages.dev
        run: npm run build:android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # Download from Gradle's official distribution service with bounded retry.
      # Verify against Gradle's independently published SHA-256 before the wrapper uses it.
      - name: Restore Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gradle-8.14.3-bin.zip
          key: gradle-8.14.3-bin-${{ runner.os }}-v1

      - name: Download and verify Gradle distribution
        env:
          GRADLE_DISTRIBUTION_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          partial="$archive.part"
          urls=(
            "https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip"
            "https://mirror.math.princeton.edu/pub/macports/distfiles/gradle/gradle-8.14.3-bin.zip"
            "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip"
          )

          if [[ -f "$archive" ]] && printf '%s  %s\n' "$GRADLE_DISTRIBUTION_SHA256" "$archive" | sha256sum --check --status; then
            echo "Using the cached Gradle archive after SHA-256 verification."
          else
            rm -f "$archive" "$partial"
            downloaded=false
            for url in "${urls[@]}"; do
              echo "Attempting checksum-pinned Gradle source: $url"
              rm -f "$partial"
              if [[ "$url" == *"services.gradle.org"* ]]; then
                download_ok=false
                if curl --fail --show-error --location --retry 8 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 30 --max-time 1200 --output "$partial" "$url"; then
                  download_ok=true
                fi
              else
                download_ok=false
                if curl --fail --show-error --retry 3 --retry-all-errors --retry-delay 5 --retry-max-time 120 --connect-timeout 30 --max-time 1200 --output "$partial" "$url"; then
                  download_ok=true
                fi
              fi

              if [[ "$download_ok" == true ]] && printf '%s  %s\n' "$GRADLE_DISTRIBUTION_SHA256" "$partial" | sha256sum --check --status; then
                mv "$partial" "$archive"
                downloaded=true
                echo "Gradle distribution downloaded and SHA-256 verified."
                break
              fi
              echo "Source failed or returned bytes with an unexpected SHA-256; rejecting it."
            done

            if [[ "$downloaded" != true ]]; then
              echo "No Gradle source returned the exact checksum-pinned archive." >&2
              exit 1
            fi
          fi

          echo "GRADLE_DISTRIBUTION_FILE=$archive" >> "$GITHUB_ENV"
      - name: Pin Android Gradle distribution and checksum
        env:
          GRADLE_DISTRIBUTION_SHA256: bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.is_file():
              raise SystemExit(f"Generated Gradle wrapper is missing: {wrapper}")

          content = wrapper.read_text(encoding="utf-8")
          old_url = "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip"
          if content.count(old_url) != 1:
              raise SystemExit(
                  "Unexpected generated Gradle distribution URL; refusing an unreviewed version change."
              )
          if "distributionSha256Sum=" in content:
              raise SystemExit("A Gradle distribution checksum is already configured; review before replacing it.")

          archive = Path(os.environ["GRADLE_DISTRIBUTION_FILE"]).resolve()
          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit("The checksum-verified Gradle archive is missing or empty.")

          new_url = f"distributionUrl={archive.as_uri()}"
          content = content.replace(old_url, new_url, 1)
          properties = content.rstrip().splitlines()
          properties.append(f"distributionSha256Sum={os.environ['GRADLE_DISTRIBUTION_SHA256']}")
          properties = [line for line in properties if not line.startswith("networkTimeout=")]
          properties.append("networkTimeout=120000")
          wrapper.write_text("\n".join(properties) + "\n", encoding="utf-8")

          verified = wrapper.read_text(encoding="utf-8")
          if new_url not in verified or f"distributionSha256Sum={os.environ['GRADLE_DISTRIBUTION_SHA256']}" not in verified:
              raise SystemExit("Gradle wrapper URL/checksum configuration did not persist.")
          print("Pinned Gradle 8.14.3 to the locally verified binary archive.")
          PY

      - name: Prepare Android release signing
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/glorifier-release.jks
            chmod 600 android/app/glorifier-release.jks
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Android signing credentials detected; release will be signed."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Android signing credentials are not configured; building an unsigned release AAB."
          fi

      - name: Build signed Android App Bundle
        if: steps.signing.outputs.available == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: android
        env:
          'ORG_GRADLE_PROJECT_android.injected.signing.store.file': ${{ github.workspace }}/android/app/glorifier-release.jks
          'ORG_GRADLE_PROJECT_android.injected.signing.store.password': ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          'ORG_GRADLE_PROJECT_android.injected.signing.key.alias': ${{ secrets.ANDROID_KEY_ALIAS }}
          'ORG_GRADLE_PROJECT_android.injected.signing.key.password': ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Remove Android release keystore
        if: always()
        run: rm -f android/app/glorifier-release.jks

      - name: Build unsigned Android App Bundle
        if: steps.signing.outputs.available != 'true'
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify release AAB exists
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "Android App Bundle created successfully."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.signing.outputs.available == 'true' && 'glorifier-ai-android-aab' || 'glorifier-ai-android-aab-unsigned' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
