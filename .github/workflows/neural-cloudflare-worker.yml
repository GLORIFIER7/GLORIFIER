name: NEURAL Cloudflare Worker

on:
  push:
    paths:
      - "services/neural/app/**"
      - "services/neural/cloudflare/**"
      - "services/neural/pyproject.toml"
      - "services/neural/uv.lock"
      - ".github/workflows/neural-cloudflare-worker.yml"
  pull_request:
    paths:
      - "services/neural/app/**"
      - "services/neural/cloudflare/**"
      - "services/neural/pyproject.toml"
      - "services/neural/uv.lock"
      - ".github/workflows/neural-cloudflare-worker.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the Neural Worker to Cloudflare production"
        required: true
        default: false
        type: boolean

concurrency:
  group: cloudflare-neural-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    defaults:
      run:
        working-directory: services/neural
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Prepare Neural application source as local Worker dependency
        working-directory: services/neural/cloudflare
        run: python prepare_worker.py
      - name: Resolve Cloudflare-only dependency lock
        working-directory: services/neural/cloudflare
        run: uv lock
      - name: Install Cloudflare Worker dependencies
        working-directory: services/neural/cloudflare
        run: uv sync --locked --group dev --no-install-project
      - name: Verify Cloudflare Python Worker runtime startup including asyncpg
        working-directory: services/neural/cloudflare
        env:
          # Local-only Hyperdrive stand-in; the health smoke test does not open a DB connection.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_NEON_READONLY: postgresql://local:local@127.0.0.1:5432/local
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("psycopg") is None
          assert importlib.util.find_spec("pg8000") is not None
          assert importlib.util.find_spec("asyncpg") is not None
          assert importlib.util.find_spec("torch") is None
          PY

          uv run --locked pywrangler dev --ip 127.0.0.1 --port 8787 > /tmp/glorifier-neural-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; wait "$worker_pid" 2>/dev/null || true' EXIT

          for ((attempt = 1; attempt <= 60; attempt += 1)); do
            if response="$(curl --silent --show-error --fail http://127.0.0.1:8787/health)"; then
              printf '%s\\n' "$response"
              test -f python_modules/app/api.py
              test -f python_modules/app/database/neon.py
              test -f python_modules/app/neural/torch_status.py
              exit 0
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/glorifier-neural-worker.log
              exit 1
            fi
            if (( attempt == 60 )); then
              cat /tmp/glorifier-neural-worker.log
              echo "Cloudflare Python Worker did not become healthy within 120 seconds"
              exit 1
            fi
            sleep 2
          done
      - name: Prepare isolated Worker bundle and validate without deployment
        working-directory: services/neural/cloudflare
        run: |
          bash ./worker-build.sh --prepare-only
          npx wrangler deploy --dry-run
      - name: Upload validated Cloudflare dependency lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-neural-uv-lock
          path: services/neural/cloudflare/uv.lock
          if-no-files-found: error
          retention-days: 7

  deploy:
    defaults:
      run:
        working-directory: services/neural
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: glorifier-neural-cloudflare-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # immutable commit pin
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
      - name: Download the exact dependency lock validated by the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-neural-uv-lock
          path: services/neural/cloudflare
      - name: Prepare Neural application source as local Worker dependency
        working-directory: services/neural/cloudflare
        run: python prepare_worker.py
      - name: Install locked Cloudflare Worker dependencies
        working-directory: services/neural/cloudflare
        run: uv sync --locked --group dev --no-install-project
      - name: Prepare isolated Worker bundle and validate without deployment
        working-directory: services/neural/cloudflare
        run: |
          bash ./worker-build.sh --prepare-only
          npx wrangler deploy --dry-run
      - name: Verify Neural application package was vendored by Pywrangler
        working-directory: services/neural/cloudflare
        run: |
          set -euo pipefail
          test -f python_modules/app/api.py
          test -f python_modules/app/database/neon.py
          test -f python_modules/app/neural/torch_status.py
      - name: Verify Cloudflare deployment credentials and account selection
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Missing CLOUDFLARE_API_TOKEN in the glorifier-neural-cloudflare-production environment"
            exit 1
          }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID in the glorifier-neural-cloudflare-production environment variables"
            exit 1
          }
      - name: Verify required Neural API token is provisioned before publishing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          request = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts/glorifier-neural/secrets",
              headers={"Authorization": f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  payload = json.load(response)
          except (OSError, urllib.error.URLError, json.JSONDecodeError):
              print("::error::Could not verify Cloudflare Worker secret bindings; deployment blocked.")
              raise SystemExit(1) from None

          if payload.get("success") is not True:
              print("::error::Cloudflare did not confirm Worker secret bindings; deployment blocked.")
              raise SystemExit(1)

          names = [
              item.get("name")
              for item in payload.get("result", [])
              if isinstance(item, dict) and isinstance(item.get("name"), str)
          ]
          if "GLORIFIER_API_TOKEN" not in names:
              print("::error::Missing Cloudflare Worker secret GLORIFIER_API_TOKEN; provision it in the Cloudflare Worker secret manager before deployment.")
              raise SystemExit(1)

          print("Required Neural API token secret is present; its value was not read.")
          PY
      - name: Deploy Neural Worker to Cloudflare
        working-directory: services/neural/cloudflare
        run: bash ./worker-build.sh deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    defaults:
      run:
        working-directory: services/neural
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy == true &&
      needs.validate.result == 'success' &&
      needs.deploy.result == 'success'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify deployed health endpoint
        env:
          NEURAL_URL: https://glorifier-neural.glorifier.workers.dev
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --max-time 20 "${NEURAL_URL}/health" > /tmp/neural-health.json
      - name: Verify live readiness or explicitly configured provider-disabled safe mode
        env:
          NEURAL_URL: https://glorifier-neural.glorifier.workers.dev
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 30 --output /tmp/neural-ready.json --write-out '%{http_code}' "${NEURAL_URL}/ready")"
          cat /tmp/neural-ready.json
          python cloudflare/deployment_smoke.py \
            --health-file /tmp/neural-health.json \
            --readiness-file /tmp/neural-ready.json \
            --readiness-status "${status}"
