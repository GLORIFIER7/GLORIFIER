name: GLORIFIER AI 24/7 Governed Improvement

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: glorifier-autonomous-improvement
  cancel-in-progress: true

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: AI improvement analysis
        id: improve
        continue-on-error: true
        env:
          GUARDIAN_PROVIDER: ${{ vars.GUARDIAN_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          META_MODEL: ${{ vars.META_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/continuous-improvement-agent.mjs
      - name: Governed result
        if: always()
        run: |
          if [ "${{ steps.improve.outcome }}" = "success" ]; then
            echo "Improvement analysis completed. No direct push to main is permitted."
          else
            echo "Improvement analysis failed or provider was unavailable; no repository mutation was attempted."
          fi

# Automatically generated and managed by gh-actions-pin
dependencies:
  - github.com/actions/checkout@v7:sha1-3d3c42e5aac5ba805825da76410c181273ba90b1
  - github.com/actions/setup-node@v7:sha1-820762786026740c76f36085b0efc47a31fe5020
