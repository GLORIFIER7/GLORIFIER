name: GLORIFIER AI 24/7 Governed Improvement

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      allow_paid_inference:
        description: "Authorize one paid inference only after verified sponsor/monetization funding or confirmed provider acceptance of GLR, with owner approval"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: glorifier-autonomous-improvement
  cancel-in-progress: true

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve paid inference authorization
        id: authorization
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PAID_INFERENCE_AUTHORIZATION: ${{ inputs.allow_paid_inference }}
          OWNER_ACTOR_ID: ${{ github.actor_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          source scripts/ai-fleet-authorization.sh
          if glorifier_ai_maintenance_authorized "$EVENT_NAME" "$MANUAL_PAID_INFERENCE_AUTHORIZATION" "$OWNER_ACTOR_ID" "$RUN_ATTEMPT"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.authorization.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts --no-audit --no-fund
        if: steps.authorization.outputs.enabled == 'true'
      - name: AI improvement analysis
        id: improve
        if: steps.authorization.outputs.enabled == 'true'
        continue-on-error: true
        env:
          ALLOW_PAID_INFERENCE: ${{ steps.authorization.outputs.enabled }}
          GUARDIAN_PROVIDER: ${{ vars.GUARDIAN_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
          META_BASE_URL: ${{ vars.META_BASE_URL }}
          META_MODEL: ${{ vars.META_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/continuous-improvement-agent.mjs
      - name: Governed result
        if: always()
        run: |
          if [ "${{ steps.authorization.outputs.enabled }}" != "true" ]; then
            echo "Paid inference was not owner-authorized for this first manual attempt; no provider request was made."
          elif [ "${{ steps.improve.outcome }}" = "success" ]; then
            echo "Improvement analysis completed. No direct push to main is permitted."
          else
            echo "Improvement analysis failed or provider was unavailable; no repository mutation was attempted."
          fi
