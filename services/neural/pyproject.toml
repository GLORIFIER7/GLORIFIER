[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glorifier-neural"
version = "0.2.0"
description = "Governed, provider-neutral AI orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic>=2.8,<3.0"]

[project.optional-dependencies]
neural = ["torch>=2.4"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
neon = ["psycopg[binary]>=3.2,<4.0"]

[tool.uv]
required-version = ">=0.13.4,<0.14"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["I001"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "db*"]
