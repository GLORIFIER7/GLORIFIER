apiVersion: v1
kind: Namespace
metadata:
  name: glorifier-ai
  labels:
    app.kubernetes.io/part-of: glorifier
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glorifier-vllm-model-cache
  namespace: glorifier-ai
  labels:
    app.kubernetes.io/name: glorifier-vllm
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glorifier-vllm
  namespace: glorifier-ai
  labels:
    app.kubernetes.io/name: glorifier-vllm
    app.kubernetes.io/part-of: glorifier
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glorifier-vllm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glorifier-vllm
        app.kubernetes.io/part-of: glorifier
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: glorifier-vllm-model-cache
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.33.0
          imagePullPolicy: IfNotPresent
          command:
            - vllm
          args:
            - serve
            - Qwen/Qwen3-0.6B
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --served-model-name
            - Qwen/Qwen3-0.6B
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: glorifier-vllm-api
                  key: api-key
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "10"
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: shared-memory
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: glorifier-vllm
  namespace: glorifier-ai
  labels:
    app.kubernetes.io/name: glorifier-vllm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: glorifier-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glorifier-vllm-ingress
  namespace: glorifier-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: glorifier-vllm
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glorifier-vllm
  namespace: glorifier-ai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vllm.example.com
      secretName: glorifier-vllm-tls
  rules:
    - host: vllm.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: glorifier-vllm
                port:
                  number: 8000
