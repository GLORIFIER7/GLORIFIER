[package]
name = "glorifier-neural"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native Rust client for the GLORIFIER Neural HTTP API"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tiny_http = "0.12"