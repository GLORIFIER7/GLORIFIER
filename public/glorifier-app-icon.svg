<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GLORIFIER SERVICES — Official Logo #001</title>
  <desc id="desc">The original Ethereum Mainnet ERC-721 Official Logo #001 artwork, token ID 1, preserved as a local byte-identical PNG.</desc>
  <defs>
    <clipPath id="profile-circle">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>
  <g clip-path="url(#profile-circle)">
    <image
      href="./glorifier-services-official-logo-001.png"
      x="0" y="0" width="512" height="512"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>
</svg>
