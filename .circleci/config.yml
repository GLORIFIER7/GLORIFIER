version: 2.1

jobs:
  validate-cloudflare-worker:
    docker:
      - image: cimg/node:24.16.0
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Install locked dependencies
          command: npm ci --no-audit --no-fund
      - run:
          name: Test MCP interoperability registry policy
          command: npm run test:interoperability-registry
      - run:
          name: Validate MCP interoperability registry
          command: npm run validate:interoperability-registry
      - run:
          name: Type-check
          command: npm run lint
      - run:
          name: AI council routing tests
          command: npm run test:ai-council-routing
      - run:
          name: Shared authenticated council client tests
          command: npm run test:model-council-client
      - run:
          name: Provider abort forwarding tests
          command: npm run test:provider-abort
      - run:
          name: Gemini explicit model policy tests
          command: npm run test:gemini-model-policy
      - run:
          name: Anthropic provider tests
          command: npm run test:anthropic
      - run:
          name: Test Cloudflare Worker
          command: npm run test:cloudflare-worker
      - run:
          name: Build frontend
          command: npm run build:frontend
      - run:
          name: Verify static output
          command: test -s dist/index.html

workflows:
  validate:
    jobs:
      - validate-cloudflare-worker
