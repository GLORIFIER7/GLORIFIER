<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLORIFIER</title>
    <meta name="description" content="GLORIFIER is developing provider-neutral AI orchestration and governed workflows. The deployed application exposes a limited set of live Worker and Neon read-only checks; other capabilities are not assumed verified." />
    <meta name="theme-color" content="#020617" />
    <meta name="brand-asset" content="Owner-designated Gravatar artwork; original-file checksum and IPFS publication remain unverified" />

    <!-- One owner-designated Gravatar identity across browser, installed PWA, and social previews.
         Keep the d=initials fallback consistent; do not redraw or claim byte-level verification. -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://1.gravatar.com/avatar/2debdba15d0c08ab78691048092e465dc74c530e3447e3f584a23e7165272c33?size=32&amp;d=initials" />
    <link rel="icon" type="image/png" sizes="192x192" href="https://1.gravatar.com/avatar/2debdba15d0c08ab78691048092e465dc74c530e3447e3f584a23e7165272c33?size=192&amp;d=initials" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://1.gravatar.com/avatar/2debdba15d0c08ab78691048092e465dc74c530e3447e3f584a23e7165272c33?size=180&amp;d=initials" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <meta property="og:title" content="GLORIFIER" />
    <meta property="og:description" content="A provider-neutral AI orchestration project. Live production checks are scope-limited; other capabilities are not assumed verified." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://1.gravatar.com/avatar/2debdba15d0c08ab78691048092e465dc74c530e3447e3f584a23e7165272c33?size=512&amp;d=initials" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://1.gravatar.com/avatar/2debdba15d0c08ab78691048092e465dc74c530e3447e3f584a23e7165272c33?size=512&amp;d=initials" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-200">
    <div id="root">
      <main id="boot-status" role="status" aria-live="polite" style="max-width:42rem;margin:12vh auto;padding:2rem;font-family:system-ui,sans-serif;color:#e2e8f0;background:#020617">
        <h1 style="font-size:1.5rem;font-weight:700">GLORIFIER</h1>
        <p id="boot-message" style="margin-top:1rem">Starting the application…</p>
        <p style="margin-top:.75rem;color:#94a3b8">Live services are not verified by this loading screen.</p>
      </main>
    </div>
    <script>
      window.setTimeout(function () {
        var status = document.getElementById('boot-status');
        var message = document.getElementById('boot-message');
        if (status && message) {
          message.textContent = 'The application did not start. Check your connection, then reload. Backend and account status have not been verified.';
        }
      }, 12000);
    </script>
    <script>
      // Surface startup failures instead of leaving a permanent loading screen.
      function showStartupFailure(message) {
        var status = document.getElementById('boot-status');
        var bootMessage = document.getElementById('boot-message');
        if (!status || !bootMessage) return;
        bootMessage.textContent = message;
        status.setAttribute('data-startup-state', 'failed');
      }
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (target && target.tagName === 'SCRIPT' && target.type === 'module') {
          showStartupFailure('The frontend entry module failed to load. Check the deployed asset path and Worker build. Live services remain unverified.');
          return;
        }
        if (event instanceof ErrorEvent && event.message) {
          showStartupFailure('Frontend startup encountered a JavaScript error. Reload once; if it persists, inspect browser console and deployment logs. Live services remain unverified.');
        }
      }, true);
      window.addEventListener('unhandledrejection', function () {
        showStartupFailure('Frontend startup encountered an unhandled asynchronous error. Inspect browser console and deployment logs. Live services remain unverified.');
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
